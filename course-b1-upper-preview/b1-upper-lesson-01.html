<main id="main" tabindex="-1"></main><div id="status" class="sr-only" aria-live="polite"></div><script>(function(root){'use strict';
function normalize(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\b(is|are|was|were|do|does|did|have|has|had|would|will|should|could|can|must)n['’]t\b/g,(_,v)=>v+' not').replace(/\bwon't\b/g,'will not').replace(/[.,?!;:]/g,'').replace(/\s+/g,' ').trim();}
function correct(q,answer){if(q.type==='sequence')return Array.isArray(answer)&&answer.join('|')===q.answer.join('|');return q.answer.split('|').some(x=>normalize(x)===normalize(answer));}
function shuffle(a,seed){const out=a.slice();let s=seed||17;for(let i=out.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[out[i],out[j]]=[out[j],out[i]];}return out;}
function scramble(items,random=Math.random){const out=items.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}if(out.every((item,i)=>item===items[i])){const other=out.findIndex(item=>item!==out[0]);if(other>0)[out[0],out[other]]=[out[other],out[0]];}return out;}
const tokenOrders=new Map();
function tokens(q){const key=q.id+'|'+q.answer;if(!tokenOrders.has(key))tokenOrders.set(key,scramble(q.answer.split('|')[0].split(' ')));return tokenOrders.get(key);}
function record(state,q,answer,now=Date.now()){const prev=state.answers[q.id]||{attempts:0};const ok=correct(q,answer);state.answers[q.id]={answer,correct:ok,attempts:prev.attempts+1,firstCorrect:prev.firstCorrect??(prev.attempts===0?ok:false),updatedAt:now};if(!ok)state.review[q.id]={due:now,streak:0};else if(state.review[q.id]){const streak=state.review[q.id].streak+1;state.review[q.id]={streak,due:now+[1,3,7,14][Math.min(streak-1,3)]*86400000};}return ok;}
function initial(){return {version:1,current:1,phase:'theory',answers:{},drafts:{},spoken:{},self:{},review:{},completed:[],moduleAttempts:{}};}
function due(state,questions,now=Date.now()){return questions.filter(q=>state.review[q.id]&&state.review[q.id].due<=now);}
const engine={normalize,correct,shuffle,scramble,tokens,record,initial,due};root.B1_ENGINE=engine;if(typeof module==='object'&&module.exports)module.exports=engine;
})(globalThis);

globalThis.B1_BANK={"version":1,"level":"B1 Upper-intermediate","courseTotal":36,"pilot":true,"modules":[{"title":"Asking for information","first":1,"last":1}],"lessons":[{"n":1,"module":0,"title":"Question Types — ask clearly, travel confidently","goal":"Ask direct, subject, choice and polite indirect questions with accurate word order.","theory":"# Lesson 1: Question Types — word order, forms & polite options\n\n### What kinds of questions do we make?\n\n- **Yes/No** → *Do you like sushi?*\n- **Wh-questions** (who/what/where/when/why/how, which, whose) → *Where do you live?*\n- **Choice** (A *or* B) → *Tea or coffee?*\n- **Subject questions** → *Who called?*\n- **Negative questions** → *Haven’t you finished?*\n- **Indirect / embedded** → *Could you tell me where the station is?*\n\n### Core word order\n\n| **Type** | **Pattern** | **Example** |\n| --- | --- | --- |\n| With be / have (aux) / modal | **Q-word** (if needed) + **aux/modal** + **subject** + **main verb** | *Where are they going?* • *Can you swim?* |\n| Present/Past simple (no aux) | **Q-word** + **do/does/did** + **subject** + **base verb** | *What time does the shop open?* • *Did you enjoy it?* |\n| Be as the main verb | **Q-word** + **be** + **subject** | *Are you ready?* • *Where is the museum?* |\n\nYes/No questions usually have rising intonation; *wh-* questions usually fall.\n\n### Questions & prepositions\n\n**Everyday English** keep the preposition at the end (preposition “stranding”):\n\n- *What are you looking **for**?*\n- *Who did you go **with**?*\n\n**More formal** place the preposition before the question word (and use *whom* for people):\n\n- ***To whom** did you speak?*\n- ***With which** company did she sign?*\n\n### Subject questions (who/what/which/how many … = the subject)\n\nWhen the question word itself is the subject, there is **no do/does/did** and no inversion in the present/past simple.\n\n- *Who called you?* (NOT Who did call you?)\n- *Which team won?*\n- *How many students came?*\n\nIn other tenses, keep the auxiliary: *Who is waiting?* • *Who has finished?*\n\n### Negative questions\n\nUse them to check information you expect to be true, or to show surprise/criticism.\n\n- Check: *Don’t you live nearby?*\n- Surprise: *Didn’t you like the film?*\n\nFull form places *not* after the subject: *Did you not enjoy it?*\n\n### Indirect (embedded) questions\n\nUse a polite “frame” + a clause in **statement order** (**subject + verb**), not question order.\n\n| **Frame** | **Pattern** | **Example** |\n| --- | --- | --- |\n| *Could you tell me…*<br>*Do you know…*<br>*I’d like to know…* | **Q-word + subject + verb** | *Do you know where the nearest ATM is?* |\n| Yes/No content | **if / whether + subject + verb** | *Can you tell me whether it’s open?* |\n\nIf the frame itself is a question (*Could you…?*), end with a question mark. If it’s a statement (*I wonder…*), use a full stop.\n\n### Choice questions\n\nOffer alternatives with **or**. Grammar = normal Yes/No form + options:\n\n- *Would you like tea or coffee?*\n- *Is your meeting at 3 or at 4?*\n\n#### How much / How many + noun\n\n- *How many books did you buy?*\n- *How much time do we have?*\n\n### Helping verbs you need to remember\n\n| **Case** | **What to use** | **Example** |\n| --- | --- | --- |\n| No auxiliary in the statement (present/past simple) | **do / does / did** | *Do* you work here? • When *did* it start? |\n| *Be* as a main verb | **no “do”** — invert *be* | *Are* they at home? |\n| Modal verbs | invert the modal | *Should* we book? |\n| *Have got* (possession, BrE) | invert *have* | *Have* you got a minute? |\n\n### Common pitfalls to avoid\n\n- ❌ *Do you know where is the bank?*  \n  ✔ *Do you know where the bank is?*\n- ❌ *Where you are going?*  \n  ✔ *Where are you going?*\n- ❌ *Who did call you?* (subject question)  \n  ✔ *Who called you?*\n- ❌ Using *who* after a preposition in formal style  \n  ✔ *To whom did you speak?*\n\n","theoryCards":[{"title":"Ask the right question.","text":"A useful question has a clear purpose: check a fact, find a detail, choose an option or ask politely.\n\nAre we on time? → check\nWhere does the bus stop? → detail\nWould you like tea or coffee? → choice","tip":"At a station, start with the information you actually need."},{"title":"Put the helper before the subject.","text":"With be, an auxiliary or a modal: question word + helper + subject + main verb.\n\nWhere are you going?\nHave you booked a seat?\nWhere can I charge my phone?","tip":"The first helper moves. The other verb forms stay together."},{"title":"No helper? Add do, does or did.","text":"In present/past simple questions, use do/does/did + subject + BASE verb.\n\nWhere does this train stop?\nWhen did your train leave?\n\nDoes/did carries the tense: stop, not stops; leave, not left.","tip":"With be, do not add do: Is the platform open?"},{"title":"Who did it? Who did you meet?","text":"Ask about the doer: Who found the ticket? No do/did in an ordinary affirmative subject question.\n\nAsk about the object: Who did Daniel call? Daniel is still the subject.\n\nWho is waiting? keeps is because it builds the continuous tense.","tip":"Emphatic Who DID call? is possible, but it is a special contrast, not the neutral pattern."},{"title":"Make the question more polite.","text":"Use Could you tell me…? or Do you know…? Then use STATEMENT order inside.\n\nWhere is the platform?\n→ Could you tell me where the platform is?\n\nRemove do/does/did: when does it leave → when it leaves.","tip":"The opening is a question. The clause inside it is not inverted."},{"title":"Yes/no information needs if or whether.","text":"Is the replacement bus free?\n→ Do you know if the replacement bus is free?\n→ Do you know whether the replacement bus is free?\n\nCould you tell me…? ends with ?.\nI wonder… is a statement and ends with a full stop.","tip":"Keep the original tense when a polite frame does not change the time."},{"title":"Keep the preposition.","text":"Everyday: Who did you travel WITH?\nWhat are you looking FOR?\n\nFormal: To WHOM should I send this?\n\nHow many + plural countable: How many stops…?\nHow much + uncountable: How much time…?","tip":"Choose the register for the situation. Formal wording is not automatically more useful."},{"title":"Check expectations and offer choices.","text":"Didn’t you book a seat? usually suggests I thought you had, or surprise that you did not. It can sound critical.\n\nDo you want a single or a return? offers alternatives.\n\nNow practise questions you could use on a real journey.","tip":"Negative questions often carry an attitude; use a neutral question when you simply need information."}],"grammarTrackingSlug":"grammar_b1_upper_001_question_types","listeningTrackingSlug":"listening_b1_upper_001_phone_saved_trip","audioNumber":1,"audioTitle":"The Day My Phone Saved My Trip","speaker":"Daniel","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a26f3bbb006a5f1b5ca8574_ElevenLabs_2026-06-08T16_43_15_Jarnathan%20-%20warm%2C%20confident%2C%20versatile_pvc_sp92_s50_sb75_v3.mp3","localAudio":"audio/lesson01-phone-saved-trip.mp3","transcript":["Hi, I’m Daniel. Last spring, I was travelling alone from Prague to a small town in Austria for a friend’s wedding. I had planned everything carefully: the train times, the hotel address, even the short walk from the station. I felt organised, maybe too organised.","The first part of the journey was easy. I found my seat, bought a coffee, and watched the countryside through the window. Then, about forty minutes before my connection, my phone showed a tiny red notification: “Your next train has been cancelled.” At first, I thought it was a mistake. I refreshed the app twice, but the message stayed there.","I looked around the carriage. Some people were sleeping, and others were listening to music. Nobody seemed worried, which made me feel even more confused. The announcement on the train was in German, and I only understood a few words. I opened my translation app and typed the sentence I had heard: “replacement bus from Platform 14.” Suddenly, the situation made more sense.","The problem was my phone battery. It was already at twelve percent, and I still needed it for tickets, maps, and messages. I turned off everything except the train app and lowered the screen brightness. When we arrived, I followed a small group of passengers who also looked uncertain. They led me to the bus stop near Platform 14.","On the bus, I checked the route again. The new arrival time was only twenty-five minutes later than my original plan. I sent my friend a quick message and finally felt relieved. Without my phone, I probably would have missed the connection completely, or at least panicked at the station.","That day taught me something simple: technology is useful, but only if you stay calm enough to use it well. My phone did not magically solve everything. It gave me information. The real difference was making one calm decision after another. Since then, I always carry a small power bank, and I try not to trust the first plan too much."],"mappingNote":"Daniel’s travel problem gives you a reason to ask for information. Listen for meaning first; practise your own questions afterwards.","tasks":[{"type":"gap","prompt":"___ the replacement bus stop here? Use the present simple.","answer":"Does","why":"The subject is the replacement bus (it). Use does before the subject and leave stop in its base form.","id":"ug1-1"},{"type":"choice","prompt":"Ask about the departure time yesterday.","answer":"When did the train leave?","options":["When did the train leave?","When did the train left?","When the train left?"],"why":"Yesterday requires past simple. Did carries the past tense, so leave stays in the base form.","id":"ug1-2"},{"type":"order","prompt":"Build a question about an action happening now.","answer":"Where are the passengers waiting?","why":"Where asks for a place. In a present continuous question, are goes before the subject; waiting stays after it.","id":"ug1-3"},{"type":"edit","prompt":"Correct the word order: Why you are looking at the map?","answer":"Why are you looking at the map?","why":"A direct question needs Why + are + you + looking. The prepositional phrase at the map remains at the end.","id":"ug1-4"},{"type":"choice","prompt":"You do not know which person showed Daniel the bus stop. Ask about the doer in a neutral question.","answer":"Who showed Daniel the bus stop?","options":["Who showed Daniel the bus stop?","Who did Daniel show the bus stop?","Who Daniel showed the bus stop?"],"why":"Who replaces the unknown subject. In this neutral affirmative subject question, showed stays past simple without did.","id":"ug1-5"},{"type":"rewrite","prompt":"A passenger found my ticket. Ask about the person. Begin with Who.","answer":"Who found my ticket?","why":"A passenger is the subject. Who replaces it directly; found remains the past simple verb.","id":"ug1-6"},{"type":"rewrite","prompt":"Daniel called Emma. Ask who Daniel called. Begin with Who.","answer":"Who did Daniel call?|Whom did Daniel call?","why":"Daniel remains the subject; Emma is the object you are asking about. Use did + Daniel + call after Who.","id":"ug1-7"},{"type":"gap","prompt":"Where ___ I charge my phone? Add a modal meaning “is it possible”.","answer":"can|could","why":"Can I…? asks about possibility or permission. Could I…? is also possible and more tentative. A modal comes before the subject.","id":"ug1-8"},{"type":"edit","prompt":"Correct one verb form: Have you saw the notification?","answer":"Have you seen the notification?","why":"Present perfect is have + past participle. The participle of see is seen; saw is past simple.","id":"ug1-9"},{"type":"order","prompt":"Build a polite question about the platform.","answer":"Could you tell me where the platform is?","why":"Could you tell me is the question frame. Inside, use where + the platform + is, with statement order.","id":"ug1-10"},{"type":"choice","prompt":"Make “Is the replacement bus free?” indirect.","answer":"Do you know whether the replacement bus is free?","options":["Do you know whether the replacement bus is free?","Do you know whether is the replacement bus free?","Do you know the replacement bus free?"],"why":"A yes/no embedded question needs if or whether. After it, keep the subject before is.","id":"ug1-11"},{"type":"rewrite","prompt":"Where does the bus leave from? Begin: Could you tell me…","answer":"Could you tell me where the bus leaves from?","why":"After the polite frame, remove does and give the present simple verb its -s: the bus leaves. Keep from.","id":"ug1-12"},{"type":"edit","prompt":"Add the missing preposition: Who did you travel?","answer":"Who did you travel with?|With whom did you travel?","why":"Travel with someone is the intended meaning. Everyday questions commonly leave with at the end; With whom…? is formal.","id":"ug1-13"},{"type":"gap","prompt":"Formal email: To ___ should I send the report?","answer":"whom","why":"In formal wording, use whom for a person after a preposition placed at the start.","id":"ug1-14"},{"type":"choice","prompt":"A friend says, “Didn’t you book a seat?” What are they most likely suggesting?","answer":"They expected you to book one and are checking.","options":["They expected you to book one and are checking.","They want to know where the seat is.","They are offering you a choice of seats."],"why":"The negative question checks an expectation and can show surprise. It does not ask for a place or offer alternatives.","id":"ug1-15"},{"type":"order","prompt":"Build a question offering two ticket options.","answer":"Would you like a single or a return?","why":"Would you like…? is a polite offer. Or joins the two alternatives, a single and a return.","id":"ug1-16"},{"type":"gap","prompt":"How ___ time do we have before the connection?","answer":"much","why":"Time here is uncountable, so use how much. Use how many with countable plural nouns such as minutes.","id":"ug1-17"},{"type":"rewrite","prompt":"Turn this into an ordinary direct question: I wonder why the train was cancelled.","answer":"Why was the train cancelled?","why":"Remove the statement frame I wonder. In the direct passive question, was goes before the subject the train.","id":"ug1-18"}],"listening":[{"type":"choice","prompt":"What is Daniel’s main message?","answer":"Information helps when you use it calmly.","options":["Information helps when you use it calmly.","A detailed plan prevents every travel problem.","A phone always solves problems automatically."],"why":"His final point is that the phone supplied information, but calm decisions made the difference.","evidence":"It gave me information. The real difference was making one calm decision after another.","id":"ua1-1"},{"type":"choice","prompt":"Why was Daniel travelling to Austria?","answer":"To attend a friend’s wedding.","options":["To attend a friend’s wedding.","To start a new job.","To visit his family."],"why":"The purpose appears in his opening explanation of the journey.","evidence":"I was travelling alone from Prague to a small town in Austria for a friend’s wedding.","id":"ua1-2"},{"type":"gap","prompt":"Which platform was mentioned for the replacement bus? Write the number.","answer":"14|fourteen|platform 14","why":"The announcement pointed passengers towards a replacement bus from Platform 14.","evidence":"replacement bus from Platform 14.","id":"ua1-3"},{"type":"choice","prompt":"Why did the other passengers make Daniel feel more confused?","answer":"They appeared unconcerned.","options":["They appeared unconcerned.","They told him the app was wrong.","They all left the carriage immediately."],"why":"Some were sleeping or listening to music. Their calm behaviour did not match his worry; nobody told him the app was wrong.","evidence":"Nobody seemed worried, which made me feel even more confused.","id":"ua1-4"},{"type":"choice","prompt":"Which two things did he do to save battery?","answer":"Closed other apps and dimmed the screen.","options":["Closed other apps and dimmed the screen.","Switched off the phone and borrowed a ticket.","Kept the translation app open and increased brightness."],"why":"He kept only the train app running and lowered screen brightness. The transcript does not say he charged the phone.","evidence":"I turned off everything except the train app and lowered the screen brightness.","id":"ua1-5"},{"type":"gap","prompt":"How many minutes later was the new arrival time? Write the number.","answer":"25|twenty-five|twenty five|25 minutes|twenty-five minutes|twenty five minutes","why":"Twenty-five minutes describes the delay. Forty minutes was how long remained before the connection when he saw the notification.","evidence":"The new arrival time was only twenty-five minutes later than my original plan.","id":"ua1-6"},{"type":"sequence","prompt":"Put these events in the order you hear them.","answer":["He saw the cancellation notice.","He translated the bus announcement.","He followed passengers to the bus.","He messaged his friend."],"why":"The cancellation came first. Translation explained the bus; passengers then led him there. He sent his friend a message on the bus.","evidence":"I sent my friend a quick message and finally felt relieved.","id":"ua1-7"},{"type":"choice","prompt":"What can we reasonably conclude from the story?","answer":"He now prepares for problems but stays flexible.","options":["He now prepares for problems but stays flexible.","He has stopped planning journeys.","He now always travels with a friend."],"why":"He carries a power bank but also trusts the first plan less. He does not say he has stopped planning or travelling alone.","evidence":"Since then, I always carry a small power bank, and I try not to trust the first plan too much.","id":"ua1-8"}],"vocab":[{"id":"vupper1-1","word":"connection","definition":"the next train or service you need to catch"},{"id":"vupper1-2","word":"replacement bus","definition":"a bus used instead of a cancelled train"},{"id":"vupper1-3","word":"carriage","definition":"one passenger section of a train"},{"id":"vupper1-4","word":"relieved","definition":"less worried after a problem becomes manageable"},{"id":"vupper1-5","word":"uncertain","definition":"not sure about what is happening or what to do"},{"id":"vupper1-6","word":"power bank","definition":"a portable battery for charging a device"}],"writing":"Your train has been cancelled. Write an 80–120-word message to the travel company. Briefly explain your situation, then ask four useful questions: one direct wh-question, one yes/no question, and two polite indirect questions. Ask about a replacement service, departure time, tickets or help at the station. Use a friendly, clear tone. Do not retell Daniel’s story.","speaking":"Role-play a conversation at a station information desk for 60–90 seconds. Say where you need to go and explain one travel problem. Ask at least four questions: a direct wh-question, a yes/no or choice question, and two polite indirect questions. Add possible replies from the staff member if you are practising alone. Use your own details."}],"audioLibrary":[{"n":1,"title":"The Day My Phone Saved My Trip","speaker":"Daniel","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a26f3bbb006a5f1b5ca8574_ElevenLabs_2026-06-08T16_43_15_Jarnathan%20-%20warm%2C%20confident%2C%20versatile_pvc_sp92_s50_sb75_v3.mp3","transcript":["Hi, I’m Daniel. Last spring, I was travelling alone from Prague to a small town in Austria for a friend’s wedding. I had planned everything carefully: the train times, the hotel address, even the short walk from the station. I felt organised, maybe too organised.","The first part of the journey was easy. I found my seat, bought a coffee, and watched the countryside through the window. Then, about forty minutes before my connection, my phone showed a tiny red notification: “Your next train has been cancelled.” At first, I thought it was a mistake. I refreshed the app twice, but the message stayed there.","I looked around the carriage. Some people were sleeping, and others were listening to music. Nobody seemed worried, which made me feel even more confused. The announcement on the train was in German, and I only understood a few words. I opened my translation app and typed the sentence I had heard: “replacement bus from Platform 14.” Suddenly, the situation made more sense.","The problem was my phone battery. It was already at twelve percent, and I still needed it for tickets, maps, and messages. I turned off everything except the train app and lowered the screen brightness. When we arrived, I followed a small group of passengers who also looked uncertain. They led me to the bus stop near Platform 14.","On the bus, I checked the route again. The new arrival time was only twenty-five minutes later than my original plan. I sent my friend a quick message and finally felt relieved. Without my phone, I probably would have missed the connection completely, or at least panicked at the station.","That day taught me something simple: technology is useful, but only if you stay calm enough to use it well. My phone did not magically solve everything. It gave me information. The real difference was making one calm decision after another. Since then, I always carry a small power bank, and I try not to trust the first plan too much."],"tasks":[{"type":"choice","prompt":"What is Daniel’s main message?","answer":"Information helps when you use it calmly.","options":["Information helps when you use it calmly.","A detailed plan prevents every travel problem.","A phone always solves problems automatically."],"why":"His final point is that the phone supplied information, but calm decisions made the difference.","evidence":"It gave me information. The real difference was making one calm decision after another.","id":"ua1-1"},{"type":"choice","prompt":"Why was Daniel travelling to Austria?","answer":"To attend a friend’s wedding.","options":["To attend a friend’s wedding.","To start a new job.","To visit his family."],"why":"The purpose appears in his opening explanation of the journey.","evidence":"I was travelling alone from Prague to a small town in Austria for a friend’s wedding.","id":"ua1-2"},{"type":"gap","prompt":"Which platform was mentioned for the replacement bus? Write the number.","answer":"14|fourteen|platform 14","why":"The announcement pointed passengers towards a replacement bus from Platform 14.","evidence":"replacement bus from Platform 14.","id":"ua1-3"},{"type":"choice","prompt":"Why did the other passengers make Daniel feel more confused?","answer":"They appeared unconcerned.","options":["They appeared unconcerned.","They told him the app was wrong.","They all left the carriage immediately."],"why":"Some were sleeping or listening to music. Their calm behaviour did not match his worry; nobody told him the app was wrong.","evidence":"Nobody seemed worried, which made me feel even more confused.","id":"ua1-4"},{"type":"choice","prompt":"Which two things did he do to save battery?","answer":"Closed other apps and dimmed the screen.","options":["Closed other apps and dimmed the screen.","Switched off the phone and borrowed a ticket.","Kept the translation app open and increased brightness."],"why":"He kept only the train app running and lowered screen brightness. The transcript does not say he charged the phone.","evidence":"I turned off everything except the train app and lowered the screen brightness.","id":"ua1-5"},{"type":"gap","prompt":"How many minutes later was the new arrival time? Write the number.","answer":"25|twenty-five|twenty five|25 minutes|twenty-five minutes|twenty five minutes","why":"Twenty-five minutes describes the delay. Forty minutes was how long remained before the connection when he saw the notification.","evidence":"The new arrival time was only twenty-five minutes later than my original plan.","id":"ua1-6"},{"type":"sequence","prompt":"Put these events in the order you hear them.","answer":["He saw the cancellation notice.","He translated the bus announcement.","He followed passengers to the bus.","He messaged his friend."],"why":"The cancellation came first. Translation explained the bus; passengers then led him there. He sent his friend a message on the bus.","evidence":"I sent my friend a quick message and finally felt relieved.","id":"ua1-7"},{"type":"choice","prompt":"What can we reasonably conclude from the story?","answer":"He now prepares for problems but stays flexible.","options":["He now prepares for problems but stays flexible.","He has stopped planning journeys.","He now always travels with a friend."],"why":"He carries a power bank but also trusts the first plan less. He does not say he has stopped planning or travelling alone.","evidence":"Since then, I always carry a small power bank, and I try not to trust the first plan too much.","id":"ua1-8"}],"vocab":[["connection","the next train or service you need to catch"],["replacement bus","a bus used instead of a cancelled train"],["carriage","one passenger section of a train"],["relieved","less worried after a problem becomes manageable"],["uncertain","not sure about what is happening or what to do"],["power bank","a portable battery for charging a device"]]}],"hints":{"ug1-1":"Find the subject: the replacement bus = it. This is a present simple question with an ordinary verb, so choose the third-person question helper.","ug1-2":"The question asks for a time, so begin with When. Yesterday needs a past question helper; the main verb must not carry the past tense again.","ug1-3":"Keep the passengers together as the subject. The continuous tense has two parts; move only its first part before the subject.","ug1-4":"You already have the correct tense and vocabulary. The problem is the order of the subject you and the helper are.","ug1-5":"Imagine the answer: A passenger showed Daniel the bus stop. Replace A passenger, not Daniel. Is there a separate subject left after Who?","ug1-6":"Cross out only A passenger. The rest of the original sentence already follows the unknown doer in the correct order.","ug1-7":"This time you are replacing Emma, not Daniel. Because Daniel is still the subject, the question needs a past simple helper.","ug1-8":"The phone needs power. You want to ask what is possible, not what someone already did. Put a possibility modal directly before I.","ug1-9":"Have already builds the present perfect. Check which form of see belongs after have: the past simple form or the past participle?","ug1-10":"Start with the four-word polite frame. Inside the remaining clause, the platform must come before its verb.","ug1-11":"There is no question word in the original. Add a connector meaning whether or not, then use normal statement order.","ug1-12":"The embedded part should read like a statement: the bus + verb. Removing does means the main verb must now agree with the bus.","ug1-13":"The answer would be I travelled with a friend. Which small word links travelled to the companion? Keep it in the question.","ug1-14":"To is already at the front, so this is the formal pattern. Choose the object form of the question word for a person.","ug1-15":"Compare Did you book? with Didn’t you book? The negative version often carries an assumption about what the listener was expected to do.","ug1-16":"Use the polite offer frame first. The options are two noun phrases joined by or; they are not part of a yes/no answer.","ug1-17":"Look at the noun immediately after the gap: time, not minutes. Decide whether that noun is countable in this meaning.","ug1-18":"You are moving in the opposite direction now: from an embedded clause back to a direct question. Move the first helper before the subject.","ua1-1":"Listen to the final paragraph. Separate what the phone supplied from what Daniel himself had to do.","ua1-2":"Listen near the beginning for for + an event. The destination and the reason for the trip are different details.","ua1-3":"Find the phrase Daniel types into the translation app. The number belongs to the platform, not his battery level.","ua1-4":"Listen for the contrast between Daniel’s feelings and the behaviour around him. Do not assume passengers spoke to him.","ua1-5":"Listen after twelve percent. Identify two actions he actually took; ignore sensible travel advice that the story never mentions.","ua1-6":"The story contains several numbers. This question asks about lateness at the destination, not time before a connection or remaining battery.","ua1-7":"Use the changing locations as anchors: on the train, at the station, then on the bus. The message to his friend comes after he checks the new route.","ua1-8":"Look for two changes in the last sentence: one practical preparation and one change in attitude. Choose a conclusion supported by both.","vupper1-1":"Daniel is changing transport during one journey. Here this word refers to the service he needs next, not an internet signal.","vupper1-2":"Break the phrase into its parts: replacement means something takes the place of something else. Which transport is no longer running?","vupper1-3":"Daniel looks around this place and sees people sleeping. It is a part of the train, not the station building.","vupper1-4":"Notice the emotional change after Daniel checks the delay and messages his friend. The original worry has become smaller.","vupper1-5":"The passengers Daniel follows seem to share his doubts. This describes confidence or knowledge, not how fast they walk.","vupper1-6":"At twelve percent Daniel worries about losing his phone. The item he carries on later trips helps prevent that same problem."},"audioTranscriptMatchVerified":false};

let hintOpen=false;
const localDay=()=>new Date().toLocaleDateString('en-CA');
function streak(){const days=new Set(Object.values(state.answers).filter(x=>x.correct&&x.updatedAt).map(x=>new Date(x.updatedAt).toLocaleDateString('en-CA')));let d=new Date(),n=0;if(!days.has(d.toLocaleDateString('en-CA')))d.setDate(d.getDate()-1);while(days.has(d.toLocaleDateString('en-CA'))){n++;d.setDate(d.getDate()-1);}return n;}
function wordsToday(){return Object.entries(state.answers).filter(([id,a])=>id.startsWith('v')&&a.correct&&new Date(a.updatedAt).toLocaleDateString('en-CA')===localDay()).length;}
function hintText(q){return q.hint||B.hints[q.originalId||q.id]||'Find the subject first, then check what this question asks you to do.';}
function splitText(s,max=420){const chunks=[];const sentences=s.replace(/<br>/g,' · ').split(/(?<=[.!?])\s+(?=[A-Z*“])/);let chunk='';for(const sentence of sentences){if(sentence.length>max){if(chunk){chunks.push(chunk);chunk='';}let words=sentence.split(' '),part='';for(const w of words){if(part.length+w.length>max&&part){chunks.push(part);part='';}part+=(part?' ':'')+w;}if(part)chunks.push(part);}else if(chunk.length+sentence.length>max){chunks.push(chunk);chunk=sentence;}else chunk+=(chunk?' ':'')+sentence;}if(chunk)chunks.push(chunk);return chunks;}
function paginateTheory(text){const parts=[];let heading='Key idea',headers=null;for(const raw of text.replace(/\r/g,'').split('\n')){const line=raw.trim();if(!line)continue;if(/^#{1,4} /.test(line)){heading=line.replace(/^#+ /,'').replace(/\*/g,'');headers=null;continue;}if(line.startsWith('|')){const cells=line.slice(1,-1).split('|').map(x=>x.trim());if(cells.every(x=>/^[-: ]+$/.test(x)))continue;if(!headers){headers=cells;continue;}const row=cells.map((x,i)=>x?`**${headers[i].replace(/\*/g,'')}:** ${x}`:'').filter(Boolean).join('  ·  ');for(const chunk of splitText(row))parts.push({title:heading,text:chunk});continue;}headers=null;for(const chunk of splitText(line))parts.push({title:heading,text:chunk});}
const pages=[];for(const p of parts){const prev=pages[pages.length-1];if(prev&&prev.title===p.title&&prev.text.length+p.text.length<450)prev.text+='\n\n'+p.text;else pages.push({...p});}return pages;}
const theoryPages=new Map(B.lessons.map(x=>[x.n,state.savedTheoryPages[x.n]?.source===x.theory?state.savedTheoryPages[x.n].pages:x.theoryCards?.map(c=>({...c}))||paginateTheory(x.theory)]));
function currentTasks(){if(view==='review')return reviewDeck;if(view==='exam')return examQuestions();if(state.phase==='grammar')return l().tasks;if(state.phase==='listening')return l().listening;return [];}
function qNow(){return currentTasks()[view==='review'?reviewIndex:view==='exam'?step:state.phase==='listening'?step-1:step];}
function vocabQuestion(v){return {id:v.id,type:'choice',prompt:`What does “${v.word}” mean?`,answer:v.definition,options:[v.definition,...E.shuffle(l().vocab.filter(x=>x.id!==v.id).map(x=>x.definition),v.word.length).slice(0,2)],why:`${v.word}: ${v.definition}`,hint:B.hints[v.id]};}
function getCurrentQuestion(){return state.phase==='vocabulary'&&view==='lesson'?vocabQuestion(l().vocab[step]):qNow();}
function examQuestions(){return E.shuffle(B.lessons.filter(x=>x.module===examModule).flatMap(x=>x.tasks),55+examModule).slice(0,12).map(q=>({...q,originalId:q.id,id:`exam${examModule}-${q.id}`}));}
function footer(left,right){return `<div class="flow-actions">${left}${right}</div>`;}
const btn=(text,action,cls='primary',attrs='')=>`<button type="button" class="${cls}" data-action="${action}" ${attrs}>${text}</button>`;
function frame(label,at,total,body,actions,extra=''){return `<div class="lesson-flow"><div class="flow-top">${btn('← Course map','map','quiet')}<span class="pill">${esc(label)}</span><div class="progress" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${Math.min(at,total)}"><span style="width:${Math.min(at/Math.max(1,total),1)*100}%"></span></div><span class="small">${at} / ${total}</span></div><section class="flow-card ${extra}"><div class="flow-content">${body}</div>${actions}</section></div>`;}
function phaseFooter(nextText='Continue'){return footer(btn(step?'Back':'Course map',step?'back':'map','quiet'),btn(nextText,'next'));}
function map(){const due=E.due(state,allQuestions).length,words=wordsToday(),xp=Object.values(state.answers).filter(a=>a.correct).length*10;return `<div class="dashboard"><section><section class="map-head"><span class="pill">B1 UPPER · LESSON 01</span><h1>B1 Upper-intermediate</h1><p class="muted">Lesson 1 preview · Ask clearly, travel confidently</p><div class="stats"><div class="stat"><strong>${xp} XP</strong><small>Evo-English</small></div><div class="stat"><strong>🔥 ${streak()}</strong><small>Study streak</small></div><div class="stat"><strong>${state.completed.length}/${B.lessons.length}</strong><small>Preview lessons complete</small></div></div>${btn('Continue','resume')}<div class="daily-goal"><div><strong>Today’s goal</strong><p>Complete one lesson or recall five words.</p><small>Words today: ${Math.min(5,words)}/5</small></div>${btn('Review words','words')}</div>${!saveOK?'<p class="notice">Storage is unavailable. Export a backup before closing.</p>':''}</section><div class="journey">${B.modules.map((m,i)=>`<div class="module-label">MODULE ${i+1} · ${esc(m.title.toUpperCase())}</div>${B.lessons.filter(x=>x.module===i).map(x=>`<div class="node ${state.completed.includes(x.n)?'done':x.n===state.current?'current':''}"><div class="orb">${state.completed.includes(x.n)?'✓':x.n}</div><article class="node-card"><h2>${esc(x.title)}</h2><p>${esc(x.goal)}</p>${btn(state.completed.includes(x.n)?'Practise again':'Start lesson','lesson','primary',`data-n="${x.n}"`)}<div class="stage-links" aria-label="Lesson sections">${phases.map(p=>btn(({theory:'Learn',grammar:'18 grammar tasks',listening:'Listen',vocabulary:'6 words',writing:'Write',speaking:'Speak'})[p],'stage','quiet',`data-phase="${p}"`)).join('')}</div></article></div>`).join('')}`).join('')}</div></section><aside><section class="aside-card"><div class="goal-icon" aria-hidden="true">✦</div><h2>Today’s goal</h2><div class="welcome-illustration"><div class="avatar">A</div><div class="bubble">Hi!</div><div class="avatar warm">D</div></div><p class="muted">Complete one lesson or recall five words.</p></section><section class="aside-card"><span class="pill">A1 → C1</span><div class="levels">${['A1','A2','B1','B2','C1'].map(level=>`<span class="${level==='B1'?'active':''}">${level}</span>`).join('')}</div><p class="small">36-lesson course · Lesson 1 preview · Grammar, listening, vocabulary, writing and speaking.</p></section><section class="aside-card course-tools">${btn(`Review mistakes${due?` · ${due} due`:''}`,'review','secondary')}${btn('Audio library','library','secondary')}${btn('Export progress','export','quiet')}<p class="small">Progress and drafts are saved on this device.</p></section></aside></div>`;}
function choiceControls(q){const selected=view==='exam'?examDraft[q.id]:state.taskDrafts[q.id]??state.answers[q.id]?.answer;return `<div class="choices">${E.shuffle(q.options,q.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0)).map((x,i)=>`<label class="option"><input type="radio" name="${q.id}" value="${esc(x)}" ${selected===x?'checked':''}><span class="option-num">${i+1}</span><span>${esc(x)}</span></label>`).join('')}</div>`;}
function controls(q){if(q.options)return choiceControls(q);if(q.type==='order'){const tokens=E.tokens(q),picked=arrangements[q.id]||[];return `<div class="assembled" aria-label="Your sentence">${picked.map(i=>btn(esc(tokens[i])+' ×','remove-token','token',`data-i="${i}"`)).join('')}</div><div class="token-bank">${tokens.map((w,i)=>btn(esc(w),'token','token',`data-i="${i}" ${picked.includes(i)?'disabled':''}`)).join('')}</div>`;}if(q.type==='sequence'){const rows=arrangements[q.id]||E.scramble(q.answer);arrangements[q.id]=rows;return rows.map((s,i)=>`<div class="sequence-row"><span>${i+1}. ${esc(s)}</span>${btn('↑','move','secondary',`data-i="${i}" data-dir="-1" aria-label="Move event ${i+1} up" ${i===0?'disabled':''}`)}${btn('↓','move','secondary',`data-i="${i}" data-dir="1" aria-label="Move event ${i+1} down" ${i===rows.length-1?'disabled':''}`)}</div>`).join('');}return `<label class="small" for="answer">${q.type==='gap'?'Write only the missing word(s).':'Write the complete sentence using the wording in the task.'}</label><input id="answer" class="answer-input" autocomplete="off" spellcheck="false" value="${esc(view==='exam'?examDraft[q.id]||'':state.taskDrafts[q.id]??state.answers[q.id]?.answer??'')}" aria-label="Your answer">`;}
function inputAnswer(q){if(q.options)return document.querySelector(`input[name="${q.id}"]:checked`)?.value||'';if(q.type==='order'){const tokens=E.tokens(q);return (arrangements[q.id]||[]).map(i=>tokens[i]).join(' ');}if(q.type==='sequence')return arrangements[q.id]||[];return document.getElementById('answer')?.value||'';}
function syncReady(){const check=main.querySelector('[data-action="check"], [data-action="exam-next"]');if(check){const q=getCurrentQuestion();if(q){const answer=inputAnswer(q);check.disabled=!answer||Array.isArray(answer)&&!answer.length||q.type==='order'&&(arrangements[q.id]||[]).length!==E.tokens(q).length;}}const cachedButton=main.querySelector('[data-action="show-ai"]');if(cachedButton&&!validReview(state.phase)){cachedButton.dataset.action='analyse';cachedButton.textContent='Analyse with AI';cachedButton.onclick=()=>act('analyse',{});}const analyse=main.querySelector('[data-action="analyse"]');if(analyse)analyse.disabled=!!aiBusy||count(answerStore(state.phase)[l().n]||'')<(state.phase==='writing'?80:20);const next=main.querySelector('[data-action="next"]');if(next&&view==='lesson'&&['writing','speaking'].includes(state.phase))next.disabled=!!aiBusy||!!recorder||(step===2&&!validReview(state.phase));}
function audio(src,title){return `<audio class="lesson-audio" controls preload="none" src="${esc(src)}" aria-label="${esc(title)}"></audio>`;}
function question(q,label,n,total,listen=false){if(!q)return resultScreen();if(hintOpen)return frame(label,n,total,`<span class="pill">HINT</span><h1>Think it through.</h1><div class="hint">${esc(hintText(q))}</div><p class="small">Return to the question and try the rule yourself.</p>`,footer(btn('Back to question','hint','quiet'),btn('Try it','hint')));if(feedback?.pages){const p=feedback.pages[feedback.page];return frame(label,n,total,`<span class="pill">${feedback.correct?'✓ CORRECT':'↻ REVIEW THIS POINT'}</span><h1>${esc(p.title)}</h1><div class="feedback-panel ${feedback.correct?'':'bad'}"><p>${esc(p.text)}</p></div><p class="small">Explanation · ${feedback.page+1}/${feedback.pages.length}</p>`,footer(btn('Try again','retry','quiet'),btn('Continue','next')));}if(feedback){const ok=feedback.correct;return frame(label,n,total,`<span class="pill">${ok?'✓ CORRECT':'↻ REVIEW THIS POINT'}</span><h1 class="question-text">${esc(q.prompt)}</h1><div class="feedback-panel ${ok?'':'bad'}"><h2>${ok?'✓ Correct':'↻ Try again'}</h2>${true?`<div class="model">${esc(q.answer instanceof Array?q.answer.join(' → '):q.answer.split('|')[0])}</div>`:''}<p>${esc(q.why||'Check the precise detail in the recording.')}</p></div>${q.evidence?`<blockquote class="evidence">“${esc(q.evidence)}”</blockquote>`:''}<p class="small">First attempt: ${state.answers[q.id]?.firstCorrect?'correct':'needs review'}. Incorrect points enter your review queue.</p>`,footer(btn('Try again','retry','quiet'),btn('Continue','next')));}

async function analyseAnswer(){if(aiBusy)return;if(validReview(state.phase)){step=2;aiTab='summary';render();return;}const kind=state.phase,n=l().n,text=(answerStore(kind)[n]||'').trim();if(count(text)<(kind==='writing'?80:20)){announce(kind==='writing'?'Write at least 80 words.':'Add at least 20 words from your spoken answer.');return;}const lesson=l();aiBusy=reviewKey(kind,n);aiError='';render(false);try{const result=await B1_AI.review(lesson,kind,text);if((answerStore(kind)[n]||'').trim()===text){state.aiReviews[reviewKey(kind,n)]={text,feedback:result,at:Date.now()};if(view==='lesson'&&state.current===n&&state.phase===kind){step=2;aiTab='summary';}}}catch(e){if(state.current===n&&state.phase===kind)aiError=e.message||'AI feedback is unavailable. Please try again.';}finally{aiBusy=null;save();if(view==='lesson'&&state.current===n&&state.phase===kind)render(false);}}

function missing(){const x=l(),m=[];if(!x.tasks.every(q=>state.answers[q.id]?.correct))m.push('Grammar practice');if(!x.listening.every(q=>state.answers[q.id]?.correct))m.push('Listening tasks');if(!x.vocab.every(v=>state.answers[v.id]?.correct))m.push('Vocabulary');if(!validReview('writing'))m.push('Writing AI review');if(!validReview('speaking'))m.push('Speaking AI review');return m;}

function reviewScreen(){if(reviewIndex>=reviewDeck.length)return frame('REVIEW',reviewDeck.length,Math.max(1,reviewDeck.length),`<span class="result-symbol">✓</span><h1>Review session complete.</h1><p class="muted">Correctly recalled points return after 1, 3, 7 and 14 days. Difficult points remain due.</p>`,footer(btn('Course map','map','quiet'),btn('Continue course','resume')));return question(reviewDeck[reviewIndex],'REVIEW',reviewIndex+1,reviewDeck.length);}

function examScreen(){if(step<12)return question(examQuestions()[step],'CHECKPOINT',step+1,12);const qs=examQuestions(),wrong=qs.filter(q=>!E.correct(q,examDraft[q.id]||'')),score=12-wrong.length;state.moduleAttempts[examModule]={score,at:Date.now()};save();return frame('CHECKPOINT RESULT',12,12,`<span class="result-symbol">${score>=10?'★':'↻'}</span><h1>${score}/12</h1><p class="muted">${esc(B.modules[examModule].title)}</p><p>${score>=10?'Well done. Continue retrieving these forms without notes.':'Review the points you missed before trying again.'}</p><p class="small">This is a practice score, not a proficiency certification.</p>`,footer(btn('Course map','map','quiet'),btn(wrong.length?'Review answers':'Continue course',wrong.length?'exam-review':'resume')));}

async function record(){if(recorder){stopRecording();return;}const n=l().n;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){document.getElementById('record-status').textContent='Recording is unavailable. Speak aloud, then type what you said for AI feedback.';return;}try{const media=await navigator.mediaDevices.getUserMedia({audio:true});if(view!=='lesson'||state.phase!=='speaking'||step!==0||l().n!==n){media.getTracks().forEach(t=>t.stop());return;}stream=media;const r=new MediaRecorder(media),chunks=[];recorder=r;r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};r.onstop=()=>{media.getTracks().forEach(t=>t.stop());if(recordUrl)URL.revokeObjectURL(recordUrl);recordBlob=new Blob(chunks,{type:r.mimeType});recordUrl=URL.createObjectURL(recordBlob);recordLesson=n;if(view==='lesson'&&state.phase==='speaking'&&step===0&&l().n===n)render(false);};r.start();recordTimer=setTimeout(stopRecording,90000);syncReady();main.querySelector('[data-action="record"]').textContent='Stop recording';document.getElementById('record-status').textContent='Recording locally… Stop after 60–90 seconds. Nothing is uploaded.';}catch(_){const status=document.getElementById('record-status');if(status)status.textContent='Microphone permission was not granted. Practise aloud without recording.';}}

iptReturn='library';navigate('transcript');break;case'review':reviewDeck=E.due(state,allQuestions);reviewIndex=0;navigate('review');break;case'record':record();break;case'exam':examModule=+d.n;step=0;examDraft=state.examDrafts[examModule]||{};navigate('exam');break;case'exam-next':{const q=qNow(),a=inputAnswer(q);if(!a||Array.isArray(a)&&!a.length){announce('Answer before continuing.');return;}examDraft[q.id]=a;state.examDrafts[examModule]=examDraft;step++;if(step===12)examQuestions().filter(x=>!E.correct(x,examDraft[x.id]||'')).forEach(x=>{state.review[x.originalId]={due:Date.now(),streak:0};});arrangements={};render();break;}case'exam-review':reviewDeck=examQuestions().filter(q=>!E.correct(q,examDraft[q.id]||'')).map(q=>({...q,id:q.originalId}));reviewDeck.forEach(q=>{state.review[q.id]={due:Date.now(),streak:0};});reviewIndex=0;navigate('review');break;case'export':{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='evo-b1-upper-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}}}

(()=>{
  // Forward a real learner selection to the host page's existing translator.
  // The host retains its translation, authentication, quota and card-saving logic.
  if(window.parent===window)return;
  let timer,lastText="",lastTime=0;
  function forward(){
    const selection=window.getSelection();
    const text=(selection?.toString()||"").trim();
    if(!text||text.length>240)return;
    const node=selection.anchorNode;
    const element=node?.nodeType===1?node:node?.parentElement;
    if(element?.closest("input,textarea,select,[contenteditable=true]"))return;
    const now=Date.now();
    if(text===lastText&&now-lastTime<700)return;
    let host,hostSelection;
    try{host=window.parent.document;hostSelection=window.parent.getSelection();}catch(_){return;}
    if(!window.parent.__translatorInit||!hostSelection||host.getElementById("cards-app"))return;
    const previous=[];
    for(let i=0;i<hostSelection.rangeCount;i++)previous.push(hostSelection.getRangeAt(i).cloneRange());
    const proxy=host.createElement("span");
    proxy.textContent=text;
    proxy.setAttribute("aria-hidden","true");
    proxy.style.cssText="position:fixed;left:-10000px;top:0;opacity:0;pointer-events:none;user-select:text;";
    host.body.appendChild(proxy);
    try{
      const range=host.createRange();range.selectNodeContents(proxy);
      hostSelection.removeAllRanges();hostSelection.addRange(range);
      proxy.dispatchEvent(new window.parent.MouseEvent("mouseup",{bubbles:true,view:window.parent}));
      lastText=text;lastTime=now;
    }finally{
      hostSelection.removeAllRanges();
      for(const range of previous)try{hostSelection.addRange(range);}catch(_){}
      proxy.remove();
    }
  }
  function schedule(){clearTimeout(timer);timer=setTimeout(forward,300);}
  document.addEventListener("mouseup",schedule);
  document.addEventListener("touchend",schedule,{passive:true});
  document.addEventListener("selectionchange",schedule);
})();</script></body></html>
