/* Evo-English game-path visual layer */
:root{--mint:#27b47e;--yellow:#f3b63f}
body{background:radial-gradient(circle at 8% 0%,#fff 0,#eef3fc 34%,#e9effa 100%)}
header{background:rgba(223,232,251,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
button{border-radius:14px;transition:transform .12s,background .12s,box-shadow .12s}
button:hover:not(:disabled){transform:translateY(-1px)}
.pill{border-radius:999px}
.map-head{background:linear-gradient(135deg,#fff 0%,#f5f8ff 72%,#e9efff 100%);box-shadow:0 14px 34px rgba(42,68,125,.08)}
.stat{background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(42,68,125,.04);border-radius:18px}
.journey:before{width:5px;background:linear-gradient(#b7caff,#dbe4f7);border-radius:99px}
.orb{border:5px solid #eef3fc;box-shadow:0 3px 0 #d3def1}
.node.current .orb{box-shadow:0 7px 0 #b8c8f5;transform:translateY(-2px)}
.node.done .orb{background:#d8f7e8;box-shadow:0 5px 0 #b6e9d1}
.node-card{background:rgba(255,255,255,.94);border-radius:20px;box-shadow:0 5px 16px rgba(42,68,125,.035)}
.node.current .node-card{box-shadow:0 12px 28px rgba(49,89,239,.12);transform:translateX(2px)}
.result,.lesson-card{box-shadow:0 14px 34px rgba(42,68,125,.08)}
.primary{box-shadow:0 4px 0 #2443b8}
.primary:hover:not(:disabled){box-shadow:0 5px 0 #2443b8}
.audio-stage{margin:24px 0;padding:22px;background:linear-gradient(135deg,#eef4ff,#f8fbff);border:1px solid #d7e2fa;border-radius:20px;text-align:left}.audio-kicker{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#3159ef}.audio-stage h2{margin:7px 0;font-size:22px}.audio-stage audio{width:100%;margin:12px 0 4px}.audio-stage details{margin-top:12px}.audio-stage summary{cursor:pointer;color:#3159ef;font-weight:700;font-size:13px}.transcript{padding:12px 0 0 0;margin:0;list-style:none;max-height:260px;overflow:auto}.transcript li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #e1e9f7;font-size:14px}.transcript-num{font-size:11px;color:#8b9ab4;min-width:22px}.vocab-stage{margin-top:26px;padding-top:22px;border-top:1px solid #e5ebf5;text-align:left}.vocab-stage h2{margin:8px 0 3px;font-size:21px}.vocab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.vocab-chip{display:flex;align-items:center;gap:7px;text-align:left;padding:10px 11px;border-radius:13px;background:#fff}.vocab-chip span{font-weight:800}.vocab-chip small{font-size:11px;color:#71819c;flex:1}.vocab-chip b{font-size:19px;color:#3159ef}.vocab-chip.saved{border-color:#67c79e;background:#effaf5;color:#19815c}.speaking-preview{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:25px;padding:20px;text-align:left;background:#fff7e7;border:1px solid #f2d9a0;border-radius:18px}.speaking-preview h2{font-size:20px;margin:8px 0 3px}.speaking-preview p{margin:0;color:#6f684f;font-size:13px}.speaking-preview .primary{white-space:nowrap;text-decoration:none;padding:10px 13px}

ru:{module:'Основы A1',l4:'Что мы делаем сейчас?',g4:'Опишите действия, которые происходят сейчас.',l5:'Планы на выходные',g5:'Расскажите о планах, которые уже решили осуществить.',l6:'Свободное время и увлечения',g6:'Расскажите о занятиях, которые вам нравятся.',pilot:'Прототип · 6 уроков A1 · остальная часть курса в разработке.',presentContinuous:'Present Continuous: am/is/are + глагол с окончанием -ing. Выбирайте am, is или are по подлежащему.',continuousNow:'Present Continuous описывает действия сейчас и временные ситуации. Present Simple — привычки.',goingTo:'Be going to: am/is/are + going to + начальная форма глагола.',goingToPlans:'Be going to используйте для заранее принятых планов и прогнозов на основе видимых признаков.',likeIng:'В этом уроке тренируем like + глагол с -ing. После like также возможно to + глагол.',enjoyIng:'После enjoy и don’t mind используйте глагол с окончанием -ing.'},
hy:{module:'A1-ի հիմունքներ',l4:'Ի՞նչ ենք անում հիմա։',g4:'Նկարագրեք այն գործողությունները, որոնք կատարվում են հիմա։',l5:'Հանգստյան օրերի ծրագրեր',g5:'Խոսեք ծրագրերի մասին, որոնք արդեն որոշել եք իրականացնել։',l6:'Ազատ ժամանակ և նախասիրություններ',g6:'Խոսեք այն զբաղմունքների մասին, որոնք ձեզ դուր են գալիս։',pilot:'Նախատիպ · A1-ի 6 դաս · դասընթացի մնացած մասը մշակվում է։',presentContinuous:'Present Continuous-ը կազմվում է am/is/are + բայի -ing ձևով։ Ընտրեք am, is կամ are՝ ըստ ենթակայի։',continuousNow:'Present Continuous-ն օգտագործվում է այս պահին կատարվող գործողությունների և ժամանակավոր իրավիճակների համար։ Սովորությունների համար օգտագործեք Present Simple։',goingTo:'Be going to-ն կազմվում է am/is/are + going to + բայի հիմնական ձևով։',goingToPlans:'Be going to-ն օգտագործեք նախապես որոշված ծրագրերի և տեսանելի փաստերի վրա հիմնված կանխատեսումների համար։',likeIng:'Այս դասում վարժվում ենք like + -ing ձևով։ Like-ից հետո հնարավոր է նաև to + բայ։',enjoyIng:'Enjoy և don’t mind բայերից հետո օգտագործեք -ing-ով ավարտվող բայ։'},
'zh-Hans':{module:'A1基础课程',l4:'我们现在在做什么？',g4:'描述正在发生的动作。',l5:'周末计划',g5:'谈谈你已经决定要做的计划。',l6:'空闲时间与爱好',g6:'谈谈你喜欢做的活动。',pilot:'试用版 · 6节A1课程 · 其余课程正在开发中。',presentContinuous:'现在进行时的结构是 am/is/are + 动词-ing。根据主语选择 am、is 或 are。',continuousNow:'现在进行时用于正在发生的动作或暂时的情况。习惯用一般现在时。',goingTo:'be going to 的结构是 am/is/are + going to + 动词原形。',goingToPlans:'be going to 用于说话前已决定的计划，以及根据眼前迹象作出的预测。',likeIng:'本课练习 like + 动词-ing。Like 后面也可以接 to + 动词。',enjoyIng:'Enjoy 和 don’t mind 后面接动词-ing。'},
ja:{module:'A1の基礎',l4:'今、何をしていますか？',g4:'今起きている動作を説明しましょう。',l5:'週末の予定',g5:'すでに決めている予定について話しましょう。',l6:'自由時間と趣味',g6:'好きな活動について話しましょう。',pilot:'試作版 · A1の6レッスン · コースの続きは開発中です。',presentContinuous:'現在進行形は am/is/are + 動詞-ing で作ります。主語に合わせて am、is、are を選びます。',continuousNow:'現在進行形は今行っている動作や一時的な状況に使います。習慣には現在形を使います。',goingTo:'be going to は am/is/are + going to + 動詞の原形で作ります。',goingToPlans:'be going to は事前に決めた予定や、目に見える状況に基づく予測に使います。',likeIng:'このレッスンでは like + 動詞-ing を練習します。Like の後に to + 動詞を使うこともできます。',enjoyIng:'enjoy と don’t mind の後には動詞-ing を使います。'},
ko:{module:'A1 기초',l4:'지금 무엇을 하고 있나요?',g4:'지금 일어나고 있는 동작을 설명해 보세요.',l5:'주말 계획',g5:'이미 하기로 정한 계획을 이야기해 보세요.',l6:'여가 시간과 취미',g6:'좋아하는 활동을 이야기해 보세요.',pilot:'시범 과정 · A1 레슨 6개 · 나머지 과정은 개발 중입니다.',presentContinuous:'현재진행형은 am/is/are + 동사-ing로 만듭니다. 주어에 맞게 am, is, are를 고르세요.',continuousNow:'현재진행형은 지금 진행 중인 동작이나 일시적인 상황에 씁니다. 습관에는 현재형을 씁니다.',goingTo:'be going to는 am/is/are + going to + 동사 원형으로 만듭니다.',goingToPlans:'be going to는 말하기 전에 정한 계획과 눈에 보이는 근거에 따른 예측에 씁니다.',likeIng:'이 레슨에서는 like + 동사-ing를 연습합니다. Like 뒤에는 to + 동사도 올 수 있습니다.',enjoyIng:'enjoy와 don’t mind 뒤에는 동사-ing를 씁니다.'},
hi:{module:'A1 की बुनियाद',l4:'हम अभी क्या कर रहे हैं?',g4:'अभी हो रही गतिविधियों का वर्णन करें।',l5:'सप्ताहांत की योजनाएँ',g5:'उन योजनाओं के बारे में बताएँ जिन्हें आपने पहले ही तय किया है।',l6:'खाली समय और शौक',g6:'उन गतिविधियों के बारे में बताएँ जिन्हें करना आपको पसंद है।',pilot:'प्रोटोटाइप · A1 के 6 पाठ · बाकी पाठ्यक्रम विकसित किया जा रहा है।',presentContinuous:'Present Continuous बनाने के लिए am/is/are + क्रिया-ing का प्रयोग करें। कर्ता के अनुसार am, is या are चुनें।',continuousNow:'अभी चल रही गतिविधियों या अस्थायी स्थितियों के लिए Present Continuous और आदतों के लिए Present Simple का प्रयोग करें।',goingTo:'Be going to का रूप am/is/are + going to + क्रिया का मूल रूप है।',goingToPlans:'पहले से तय योजनाओं और दिखाई देने वाले संकेतों पर आधारित अनुमान के लिए be going to का प्रयोग करें।',likeIng:'इस पाठ में like + क्रिया-ing का अभ्यास है। Like के बाद to + क्रिया भी आ सकता है।',enjoyIng:'Enjoy और don’t mind के बाद क्रिया-ing का प्रयोग करें।'},
bn:{module:'A1-এর ভিত্তি',l4:'আমরা এখন কী করছি?',g4:'এখন ঘটছে এমন কাজের বর্ণনা দিন।',l5:'সপ্তাহান্তের পরিকল্পনা',g5:'আগেই ঠিক করা পরিকল্পনা সম্পর্কে বলুন।',l6:'অবসর ও শখ',g6:'যে কাজগুলো করতে ভালো লাগে সেগুলো বলুন।',pilot:'প্রোটোটাইপ · ৬টি A1 পাঠ · বাকি কোর্স তৈরি হচ্ছে।',presentContinuous:'Present Continuous গঠন করতে am/is/are + verb-ing ব্যবহার করুন। কর্তার সঙ্গে মিলিয়ে am, is বা are বেছে নিন।',continuousNow:'এখন চলমান কাজ বা সাময়িক অবস্থার জন্য Present Continuous এবং অভ্যাসের জন্য Present Simple ব্যবহার করুন।',goingTo:'Be going to গঠন: am/is/are + going to + verb-এর মূল রূপ।',goingToPlans:'আগে থেকে ঠিক করা পরিকল্পনা এবং দৃশ্যমান লক্ষণের ভিত্তিতে অনুমানের জন্য be going to ব্যবহার করুন।',likeIng:'এই পাঠে like + verb-ing অনুশীলন করা হয়েছে। Like-এর পরে to + verb-ও হতে পারে।',enjoyIng:'Enjoy এবং don’t mind-এর পরে verb-ing ব্যবহার করুন।'},
ur:{module:'A1 کی بنیاد',l4:'ہم ابھی کیا کر رہے ہیں؟',g4:'اس وقت جاری کاموں کی وضاحت کریں۔',l5:'ہفتے کے آخر کے منصوبے',g5:'ان منصوبوں کے بارے میں بتائیں جن کا فیصلہ آپ پہلے ہی کر چکے ہیں۔',l6:'فارغ وقت اور مشاغل',g6:'ان سرگرمیوں کے بارے میں بتائیں جو آپ کو پسند ہیں۔',pilot:'نمونہ کورس · A1 کے 6 اسباق · باقی کورس تیار ہو رہا ہے۔',presentContinuous:'Present Continuous بنانے کے لیے am/is/are + فعل-ing استعمال کریں۔ فاعل کے مطابق am، is یا are چنیں۔',continuousNow:'ابھی جاری کاموں یا عارضی حالات کے لیے Present Continuous اور عادتوں کے لیے Present Simple استعمال کریں۔',goingTo:'Be going to کی ساخت am/is/are + going to + فعل کی بنیادی شکل ہے۔',goingToPlans:'پہلے سے طے شدہ منصوبوں اور نظر آنے والے شواہد پر مبنی پیش گوئی کے لیے be going to استعمال کریں۔',likeIng:'اس سبق میں like + فعل-ing کی مشق ہے۔ Like کے بعد to + فعل بھی آ سکتا ہے۔',enjoyIng:'Enjoy اور don’t mind کے بعد فعل-ing استعمال کریں۔'},
ar:{module:'أساسيات A1',l4:'ماذا نفعل الآن؟',g4:'صف الأفعال التي تحدث الآن.',l5:'خطط عطلة نهاية الأسبوع',g5:'تحدث عن خطط قررت تنفيذها مسبقًا.',l6:'وقت الفراغ والهوايات',g6:'تحدث عن الأنشطة التي تستمتع بها.',pilot:'نسخة تجريبية · 6 دروس A1 · بقية الدورة قيد الإعداد.',presentContinuous:'كوّن المضارع المستمر باستخدام am/is/are + فعل ينتهي بـ -ing. اختر am أو is أو are بحسب الفاعل.',continuousNow:'استخدم المضارع المستمر للأفعال الجارية الآن أو الحالات المؤقتة، والمضارع البسيط للعادات.',goingTo:'تُكوَّن be going to باستخدام am/is/are + going to + الفعل بصيغته الأساسية.',goingToPlans:'استخدم be going to للخطط التي قررتها مسبقًا والتوقعات المبنية على دلائل واضحة.',likeIng:'نتدرّب في هذا الدرس على like + فعل ينتهي بـ -ing. ويمكن أيضًا أن يأتي بعد like مصدر مع to.',enjoyIng:'استخدم فعلًا ينتهي بـ -ing بعد enjoy و don’t mind.'},

  'Մասնագիտություններ և հոդեր','Պատմեք աշխատանքի մասին՝ օգտագործելով a/an և հոգնակի գոյականներ։','Իմ ընտանիքը','Նկարագրեք ընտանիքը՝ օգտագործելով my, his, her և our։','Իմ սենյակը','Ասեք, թե ինչ կա սենյակում և որտեղ են իրերը։',
  'Բաղաձայն հնչյունից առաջ գործածեք a, ձայնավորից առաջ՝ an. a barista, an assistant։','Մեկից ավելի իրերի համար գործածեք -s/-es հոգնակին՝ առանց a/an. tables, sandwiches։','I-ի հետ գործածեք my, he-ի հետ՝ his, she-ի հետ՝ her, we-ի հետ՝ our։ Դրեք գոյականից առաջ։','Մեկ իրի համար գործածեք there is, մի քանիսի համար՝ there are։ Հարցեր՝ Is there…? / Are there…?','Next to նշանակում է կողքին, in the corner՝ սենյակի անկյունում, on՝ մակերեսի վրա։',
  'Նախատիպ · A1-ի 9 դաս · դասընթացի մնացած մասը մշակվում է։','Արտասանեք այս նախադասությունը','Լսել օրինակը','Միացնել խոսափողը','Լսում եմ…','Ճանաչված է՝','Բառերը ճանաչվեցին։','Որոշ բառեր չճանաչվեցին։ Լսեք և կրկին փորձեք։','Խոսքի ճանաչումն անհասանելի է կամ խոսափողի թույլտվությունը մերժվել է։ Կարող եք շարունակել։','Ստուգվում են ճանաչված բառերը, ոչ թե առանձին հնչյունները։ Դիտարկիչը կարող է ձայնը ուղարկել առցանց ծառայության։','Շարունակել առանց խոսափողի'],
 'zh-Hans':[
  '职业与冠词','用 a/an 和复数名词谈论职业。','我的家人','用 my、his、her 和 our 描述家人。','我的房间','说出房间里有什么，以及物品的位置。',
  '辅音音素前用 a，元音音素前用 an：a barista, an assistant。','多个物品用复数 -s/-es，不加 a/an：tables, sandwiches。','I 对应 my，he 对应 his，she 对应 her，we 对应 our；放在名词前。','一件物品用 there is，两件及以上用 there are。提问：Is there…? / Are there…?','next to 表示旁边，in the corner 表示房间角落，on 表示在表面上。',
  '预览版 · 9 节 A1 课程 · 其余课程正在制作中。','读出这个句子','听示范','开启麦克风','正在聆听…','识别结果：','句子中的词已识别。','部分词未识别。请听示范并重试。','语音识别不可用或麦克风权限被拒绝。你可以继续。','这里只核对识别出的词，不评估单个发音。浏览器可能将音频发送至在线语音服务。','不用麦克风继续'],
 ja:[
  '職業と冠詞','a/an と複数形を使って仕事について話します。','私の家族','my、his、her、our を使って家族を紹介します。','私の部屋','部屋にある物とその場所を説明します。',
  '子音の音の前は a、母音の音の前は an：a barista, an assistant。','複数には a/an を付けず、-s/-es を使います：tables, sandwiches。','I には my、he には his、she には her、we には our。名詞の前に置きます。','1つなら there is、2つ以上なら there are。質問は Is there…? / Are there…?','next to は隣、in the corner は部屋の隅、on は表面の上です。',
  '試作版 · A1 全9レッスン · 続きは制作中です。','この文を声に出しましょう','お手本を聞く','マイクを使う','聞き取り中…','認識結果：','単語を認識しました。','認識できない単語があります。お手本を聞いて再挑戦してください。','音声認識が使えないか、マイクの許可がありません。先に進めます。','認識した単語を照合します。個々の発音は評価しません。ブラウザーが音声をオンラインサービスに送る場合があります。','マイクなしで続ける'],
 ko:[
  '직업과 관사','a/an과 복수 명사를 사용해 직업을 말하세요.','우리 가족','my, his, her, our로 가족을 설명하세요.','내 방','방에 있는 물건과 위치를 설명하세요.',
  '자음 소리 앞에는 a, 모음 소리 앞에는 an을 씁니다: a barista, an assistant.','둘 이상이면 a/an 없이 복수형 -s/-es를 씁니다: tables, sandwiches.','I에는 my, he에는 his, she에는 her, we에는 our를 쓰고 명사 앞에 놓습니다.','하나에는 there is, 둘 이상에는 there are를 씁니다. 질문: Is there…? / Are there…?','next to는 옆, in the corner는 방의 구석, on은 표면 위를 뜻합니다.',
  '미리보기 · A1 9개 수업 · 나머지 과정은 제작 중입니다.','이 문장을 말해 보세요','예시 듣기','마이크 켜기','듣는 중…','인식 결과:','단어가 인식되었습니다.','일부 단어를 인식하지 못했습니다. 예시를 듣고 다시 시도하세요.','음성 인식을 사용할 수 없거나 마이크 접근이 거부되었습니다. 계속할 수 있습니다.','인식된 단어만 확인하며 개별 발음은 평가하지 않습니다. 브라우저가 오디오를 온라인 서비스에 보낼 수 있습니다.','마이크 없이 계속'],
 hi:[
  'पेशे और आर्टिकल','a/an और बहुवचन संज्ञाओं से नौकरी के बारे में बताएं।','मेरा परिवार','my, his, her और our से परिवार का वर्णन करें।','मेरा कमरा','कमरे में क्या है और चीज़ें कहाँ हैं, बताएं।',
  'व्यंजन ध्वनि से पहले a और स्वर ध्वनि से पहले an लगाएं: a barista, an assistant।','एक से अधिक चीज़ों के लिए a/an के बिना -s/-es बहुवचन लगाएं: tables, sandwiches।','I के साथ my, he के साथ his, she के साथ her और we के साथ our लगाएं। इन्हें संज्ञा से पहले रखें।','एक चीज़ के लिए there is और दो या अधिक के लिए there are लगाएं। प्रश्न: Is there…? / Are there…?','next to का अर्थ बगल में, in the corner कमरे के कोने में और on सतह पर है।',
  'प्रोटोटाइप · A1 के 9 पाठ · बाकी पाठ तैयार किए जा रहे हैं।','यह वाक्य बोलें','नमूना सुनें','माइक्रोफ़ोन चालू करें','सुन रहा है…','पहचाने गए शब्द:','शब्द पहचान लिए गए।','कुछ शब्द नहीं पहचाने गए। नमूना सुनकर फिर कोशिश करें।','वाणी पहचान उपलब्ध नहीं है या माइक्रोफ़ोन की अनुमति नहीं मिली। आप आगे बढ़ सकते हैं।','यह पहचाने गए शब्दों की जाँच है, अलग-अलग ध्वनियों की नहीं। ब्राउज़र ऑडियो ऑनलाइन सेवा को भेज सकता है।','माइक्रोफ़ोन के बिना आगे बढ़ें'],
 bn:[
  'পেশা ও আর্টিকেল','a/an ও বহুবচন বিশেষ্য ব্যবহার করে কাজের কথা বলুন।','আমার পরিবার','my, his, her ও our দিয়ে পরিবার বর্ণনা করুন।','আমার ঘর','ঘরে কী আছে এবং কোথায় আছে তা বলুন।',
  'ব্যঞ্জনধ্বনির আগে a, স্বরধ্বনির আগে an ব্যবহার করুন: a barista, an assistant।','একাধিক জিনিসে a/an ছাড়া -s/-es বহুবচন ব্যবহার করুন: tables, sandwiches।','I-এর সঙ্গে my, he-এর সঙ্গে his, she-এর সঙ্গে her, we-এর সঙ্গে our বসে; বিশেষ্যের আগে লিখুন।','একটির জন্য there is, একাধিকের জন্য there are। প্রশ্ন: Is there…? / Are there…?','next to মানে পাশে, in the corner মানে ঘরের কোণে, on মানে কোনো পৃষ্ঠের ওপর।',
  'প্রোটোটাইপ · A1-এর ৯টি পাঠ · বাকি কোর্স তৈরি হচ্ছে।','এই বাক্যটি বলুন','নমুনা শুনুন','মাইক্রোফোন চালু করুন','শুনছি…','শনাক্ত হয়েছে:','শব্দগুলো শনাক্ত হয়েছে।','কিছু শব্দ শনাক্ত হয়নি। নমুনা শুনে আবার চেষ্টা করুন।','কথা শনাক্তকরণ উপলব্ধ নয় বা মাইক্রোফোনের অনুমতি মেলেনি। আপনি এগোতে পারেন।','এখানে শনাক্ত শব্দ মিলিয়ে দেখা হয়, আলাদা উচ্চারণ নয়। ব্রাউজার অডিও অনলাইন সেবায় পাঠাতে পারে।','মাইক্রোফোন ছাড়া এগিয়ে যান'],
 ur:[
  'پیشے اور آرٹیکل','a/an اور جمع اسموں سے ملازمت کے بارے میں بات کریں۔','میرا خاندان','my، his، her اور our سے خاندان بیان کریں۔','میرا کمرہ','بتائیں کمرے میں کیا ہے اور چیزیں کہاں ہیں۔',
  'حرفِ صحیح کی آواز سے پہلے a اور حرفِ علت کی آواز سے پہلے an استعمال کریں: a barista, an assistant۔','ایک سے زیادہ چیزوں کے لیے a/an کے بغیر جمع -s/-es لگائیں: tables, sandwiches۔','I کے ساتھ my، he کے ساتھ his، she کے ساتھ her اور we کے ساتھ our لگائیں؛ انہیں اسم سے پہلے رکھیں۔','ایک چیز کے لیے there is اور دو یا زیادہ کے لیے there are؛ سوال: Is there…? / Are there…?','next to کا مطلب پاس، in the corner کمرے کے کونے میں اور on کسی سطح پر ہے۔',
  'ابتدائی نمونہ · A1 کے 9 اسباق · باقی کورس تیار ہو رہا ہے۔','یہ جملہ بولیں','نمونہ سنیں','مائیکروفون آن کریں','سن رہا ہے…','پہچانے گئے الفاظ:','الفاظ پہچان لیے گئے۔','کچھ الفاظ نہیں پہچانے گئے۔ نمونہ سن کر دوبارہ کوشش کریں۔','آواز کی شناخت دستیاب نہیں یا مائیکروفون کی اجازت نہیں ملی۔ آپ آگے بڑھ سکتے ہیں۔','یہ پہچانے گئے الفاظ ملاتا ہے، ہر آواز کی ادائیگی نہیں جانچتا۔ براؤزر آڈیو آن لائن سروس کو بھیج سکتا ہے۔','مائیکروفون کے بغیر آگے بڑھیں'],
 ar:[
  'المهن وأدوات التنكير','تحدث عن وظيفة باستخدام a/an والأسماء في الجمع.','عائلتي','صِف عائلتك باستخدام my وhis وher وour.','غرفتي','قل ما الموجود في الغرفة وأين توجد الأشياء.',
  'استخدم a قبل الصوت الساكن وan قبل الصوت المتحرك: a barista, an assistant.','لأكثر من شيء، استخدم صيغة الجمع -s/-es دون a/an: tables, sandwiches.','استخدم my مع I، وhis مع he، وher مع she، وour مع we. ضعها قبل الاسم.','استخدم there is لشيء واحد وthere are لشيئين أو أكثر. السؤال: Is there…? / Are there…?','تعني next to بجانب، وin the corner في زاوية الغرفة، وon على سطح.',
  'نسخة تجريبية · 9 دروس A1 · بقية الدورة قيد الإعداد.','انطق هذه الجملة','استمع إلى النموذج','شغّل الميكروفون','جارٍ الاستماع…','ما تم التعرف عليه:','تم التعرف على الكلمات.','لم يتم التعرف على بعض الكلمات. استمع وحاول مجددًا.','التعرف على الكلام غير متاح أو رُفض إذن الميكروفون. يمكنك المتابعة.','يُقارن هذا الكلمات المتعرّف عليها، ولا يقيّم كل صوت. قد يرسل المتصفح الصوت إلى خدمة عبر الإنترنت.','المتابعة دون ميكروفون'],
 id:[
  'Pekerjaan dan artikel','Bicarakan pekerjaan memakai a/an dan kata benda jamak.','Keluarga saya','Jelaskan keluarga dengan my, his, her, dan our.','Kamar saya','Katakan apa yang ada di kamar dan letak benda-bendanya.',
  'Gunakan a sebelum bunyi konsonan dan an sebelum bunyi vokal: a barista, an assistant.','Untuk lebih dari satu benda, gunakan bentuk jamak -s/-es tanpa a/an: tables, sandwiches.','Gunakan my untuk I, his untuk he, her untuk she, dan our untuk we. Letakkan sebelum kata benda.','Gunakan there is untuk satu benda dan there are untuk dua atau lebih. Tanya: Is there…? / Are there…?','next to berarti di samping, in the corner di sudut ruangan, dan on di atas permukaan.',
  'Prototipe · 9 pelajaran A1 · sisanya sedang dibuat.','Ucapkan kalimat ini','Dengarkan contoh','Nyalakan mikrofon','Mendengarkan…','Terdengar:','Kata-kata berhasil dikenali.','Beberapa kata tidak dikenali. Dengarkan dan coba lagi.','Pengenalan suara tidak tersedia atau izin mikrofon ditolak. Anda dapat melanjutkan.','Yang diperiksa adalah kata yang dikenali, bukan setiap bunyi. Browser dapat mengirim audio ke layanan daring.','Lanjut tanpa mikrofon'],
 tr:[
  'Meslekler ve artikeller','a/an ve çoğul isimlerle bir işten söz et.','Ailem','Aileni my, his, her ve our ile anlat.','Odam','Odada neler olduğunu ve eşyaların yerini söyle.',
  'Ünsüz sesten önce a, ünlü sesten önce an kullan: a barista, an assistant.','Birden fazla şey için a/an kullanmadan -s/-es çoğulunu kur: tables, sandwiches.','I ile my, he ile his, she ile her, we ile our kullan. Bunları isimden önce koy.','Bir şey için there is, iki veya daha fazlası için there are kullan. Soru: Is there…? / Are there…?','next to yanında, in the corner odanın köşesinde, on ise bir yüzeyin üzerinde demektir.',
  'Prototip · 9 A1 dersi · kursun kalanı hazırlanıyor.','Bu cümleyi söyle','Örneği dinle','Mikrofonu aç','Dinleniyor…','Algılanan:','Kelimeler algılandı.','Bazı kelimeler algılanmadı. Dinleyip tekrar dene.','Konuşma tanıma kullanılamıyor veya mikrofon izni reddedildi. Devam edebilirsin.','Bu, algılanan kelimeleri karşılaştırır; tek tek sesleri değerlendirmez. Tarayıcı sesi çevrimiçi bir hizmete gönderebilir.','Mikrofonsuz devam et'],
 vi:[
  'Nghề nghiệp và mạo từ','Nói về một công việc bằng a/an và danh từ số nhiều.','Gia đình tôi','Miêu tả gia đình bằng my, his, her và our.','Phòng của tôi','Nói trong phòng có gì và các đồ vật ở đâu.',
  'Dùng a trước âm phụ âm, an trước âm nguyên âm: a barista, an assistant.','Với nhiều đồ vật, dùng số nhiều -s/-es và không dùng a/an: tables, sandwiches.','Dùng my với I, his với he, her với she, our với we. Đặt trước danh từ.','Dùng there is cho một vật, there are cho từ hai vật. Hỏi: Is there…? / Are there…?','next to là bên cạnh, in the corner là trong góc phòng, on là trên bề mặt.',
  'Bản thử · 9 bài A1 · phần còn lại đang được xây dựng.','Đọc câu này','Nghe mẫu','Bật micrô','Đang nghe…','Đã nhận dạng:','Các từ đã được nhận dạng.','Một số từ chưa được nhận dạng. Nghe mẫu và thử lại.','Nhận dạng giọng nói không khả dụng hoặc quyền micrô bị từ chối. Bạn vẫn có thể tiếp tục.','Bài này đối chiếu từ được nhận dạng, không chấm từng âm. Trình duyệt có thể gửi âm thanh tới dịch vụ trực tuyến.','Tiếp tục không dùng micrô'],
 kk:[

<script>(function(root){

const words={
 en:['Around the city','Use at, in and on to talk about places and transport.','My daily schedule','Talk about clock times, days and parts of the day.','Countries and languages','Ask where someone is from and which languages they speak.','Use at for a specific point, such as at the bus stop, and in for an area, such as in the city.','Use on for buses and the metro, but in for a taxi or car.','Use at for clock times (at 7:00), in for parts of the day (in the evening), and on for days (on Monday).','Do not add at, in or on before every, next, last or this: every weekday, next Monday.','With be, put am, is or are before the subject: Where is Emma from?','For other Present Simple verbs, use do or does + subject + base verb: What language does she speak?','Prototype · 12 A1 lessons · the rest of the course is in development.'],
 ru:['По городу','Используйте at, in и on для мест и транспорта.','Мой распорядок дня','Говорите о времени, днях и частях суток.','Страны и языки','Спросите, откуда человек и на каких языках он говорит.','Для конкретного места используйте at: at the bus stop. Для территории — in: in the city.','В автобусе и метро используйте on, а в такси и машине — in.','Для точного времени используйте at (at 7:00), для частей суток — in (in the evening), для дней — on (on Monday).','Перед every, next, last и this не ставьте at, in или on: every weekday, next Monday.','В вопросе с be ставьте am, is или are перед подлежащим: Where is Emma from?','С другими глаголами в Present Simple используйте do или does + подлежащее + начальную форму глагола: What language does she speak?','Прототип · 12 уроков A1 · остальная часть курса в разработке.'],
 es:['Por la ciudad','Usa at, in y on para hablar de lugares y transportes.','Mi rutina diaria','Habla de horas, días y momentos del día.','Países e idiomas','Pregunta de dónde es alguien y qué idiomas habla.','Usa at para un punto concreto, como at the bus stop, e in para una zona, como in the city.','Usa on para el autobús y el metro, pero in para un taxi o coche.','Usa at para las horas (at 7:00), in para los momentos del día (in the evening) y on para los días (on Monday).','No añadas at, in ni on antes de every, next, last o this: every weekday, next Monday.','Con be, coloca am, is o are antes del sujeto: Where is Emma from?','Con otros verbos en Present Simple, usa do o does + sujeto + verbo base: What language does she speak?','Prototipo · 12 lecciones A1 · el resto del curso está en desarrollo.'],
 pt:['Pela cidade','Use at, in e on para falar de lugares e transportes.','Minha rotina diária','Fale sobre horas, dias e partes do dia.','Países e idiomas','Pergunte de onde alguém é e que idiomas fala.','Use at para um ponto específico, como at the bus stop, e in para uma área, como in the city.','Use on para ônibus e metrô, mas in para táxi ou carro.','Use at para horas (at 7:00), in para partes do dia (in the evening) e on para dias (on Monday).','Não use at, in ou on antes de every, next, last ou this: every weekday, next Monday.','Com be, coloque am, is ou are antes do sujeito: Where is Emma from?','Com outros verbos no Present Simple, use do ou does + sujeito + verbo base: What language does she speak?','Protótipo · 12 aulas A1 · o restante do curso está em desenvolvimento.'],
 de:['Unterwegs in der Stadt','Verwende at, in und on für Orte und Verkehrsmittel.','Mein Tagesablauf','Sprich über Uhrzeiten, Tage und Tageszeiten.','Länder und Sprachen','Frage, woher jemand kommt und welche Sprachen er spricht.','Verwende at für einen bestimmten Punkt wie at the bus stop und in für ein Gebiet wie in the city.','Verwende on für Bus und Metro, aber in für Taxi und Auto.','Verwende at für Uhrzeiten (at 7:00), in für Tageszeiten (in the evening) und on für Tage (on Monday).','Setze vor every, next, last oder this kein at, in oder on: every weekday, next Monday.','Bei be steht am, is oder are vor dem Subjekt: Where is Emma from?','Bei anderen Verben im Present Simple verwende do oder does + Subjekt + Grundform: What language does she speak?','Prototyp · 12 A1-Lektionen · der Rest des Kurses wird entwickelt.'],
 fr:['En ville','Utilise at, in et on pour parler des lieux et des transports.','Ma routine quotidienne','Parle des heures, des jours et des moments de la journée.','Pays et langues','Demande d’où vient une personne et quelles langues elle parle.','Utilise at pour un point précis, comme at the bus stop, et in pour une zone, comme in the city.','Utilise on pour le bus et le métro, mais in pour un taxi ou une voiture.','Utilise at pour les heures (at 7:00), in pour les moments de la journée (in the evening) et on pour les jours (on Monday).','Ne mets pas at, in ou on avant every, next, last ou this : every weekday, next Monday.','Avec be, place am, is ou are avant le sujet : Where is Emma from?','Avec les autres verbes au Present Simple, utilise do ou does + sujet + base verbale : What language does she speak?','Prototype · 12 leçons A1 · la suite du cours est en préparation.'],
 it:['In giro per la città','Usa at, in e on per parlare di luoghi e trasporti.','La mia routine quotidiana','Parla di orari, giorni e momenti della giornata.','Paesi e lingue','Chiedi da dove viene una persona e quali lingue parla.','Usa at per un punto preciso, come at the bus stop, e in per un’area, come in the city.','Usa on per autobus e metro, ma in per taxi e auto.','Usa at per gli orari (at 7:00), in per le parti del giorno (in the evening) e on per i giorni (on Monday).','Non aggiungere at, in o on prima di every, next, last o this: every weekday, next Monday.','Con be, metti am, is o are prima del soggetto: Where is Emma from?','Con gli altri verbi al Present Simple, usa do o does + soggetto + forma base: What language does she speak?','Prototipo · 12 lezioni A1 · il resto del corso è in preparazione.'],
 hy:['Քաղաքում','Վայրերի և փոխադրամիջոցների մասին խոսելիս օգտագործեք at, in և on։','Իմ օրվա ռեժիմը','Խոսեք ժամերի, օրերի և օրվա հատվածների մասին։','Երկրներ և լեզուներ','Հարցրեք՝ որտեղից է մարդը և ինչ լեզուներով է խոսում։','Կոնկրետ կետի համար օգտագործեք at, օրինակ՝ at the bus stop, իսկ տարածքի համար՝ in, օրինակ՝ in the city։','Ավտոբուսի և մետրոյի համար օգտագործեք on, իսկ տաքսու և մեքենայի համար՝ in։','Ժամերի համար օգտագործեք at (at 7:00), օրվա հատվածների համար՝ in (in the evening), օրերի համար՝ on (on Monday)։','every, next, last և this բառերից առաջ մի դրեք at, in կամ on՝ every weekday, next Monday։','be բայով հարցում am, is կամ are ձևը դրեք ենթակայից առաջ՝ Where is Emma from?','Present Simple-ի մյուս բայերի հետ օգտագործեք do կամ does + ենթակա + բայի հիմնական ձև՝ What language does she speak?','Նախատիպ · A1-ի 12 դաս · դասընթացի մնացած մասը մշակվում է։'],
 'zh-Hans':['城市出行','用 at、in 和 on 表达地点与交通方式。','我的日常安排','谈论钟点、日期和一天中的时段。','国家与语言','询问别人来自哪里、会说哪些语言。','表示具体地点用 at，如 at the bus stop；表示区域用 in，如 in the city。','乘坐公交车或地铁用 on；乘坐出租车或汽车用 in。','钟点用 at（at 7:00），一天中的时段用 in（in the evening），星期几用 on（on Monday）。','every、next、last 或 this 前不要加 at、in、on：every weekday、next Monday。','使用 be 提问时，把 am、is 或 are 放在主语前：Where is Emma from?','其他一般现在时动词提问时，用 do 或 does + 主语 + 动词原形：What language does she speak?','预览版 · 12 节 A1 课程 · 其余课程正在制作中。'],
 ja:['街の移動','場所や交通手段には at、in、on を使い分けます。','毎日の予定','時刻、曜日、時間帯について話します。','国と言語','出身地や話す言語を尋ねます。','特定の地点には at（at the bus stop）、地域には in（in the city）を使います。','バスや地下鉄には on、タクシーや車には in を使います。','時刻には at（at 7:00）、時間帯には in（in the evening）、曜日には on（on Monday）を使います。','every、next、last、this の前に at、in、on は付けません：every weekday、next Monday。','be の疑問文では am、is、are を主語の前に置きます：Where is Emma from?','一般動詞の現在形の疑問文では do または does + 主語 + 動詞の原形を使います：What language does she speak?','試作版 · A1 全12レッスン · 続きは制作中です。'],
 ko:['도시에서 이동하기','장소와 교통수단을 말할 때 at, in, on을 사용합니다.','나의 하루 일정','시각, 요일, 하루 중 시간을 말합니다.','나라와 언어','상대의 출신과 사용하는 언어를 묻습니다.','특정 지점에는 at(at the bus stop), 지역에는 in(in the city)을 씁니다.','버스와 지하철에는 on, 택시와 자동차에는 in을 씁니다.','시각에는 at(at 7:00), 하루 중 시간에는 in(in the evening), 요일에는 on(on Monday)을 씁니다.','every, next, last, this 앞에는 at, in, on을 쓰지 않습니다: every weekday, next Monday.','be 동사 의문문에서는 am, is, are를 주어 앞에 놓습니다: Where is Emma from?','다른 현재형 동사에는 do 또는 does + 주어 + 동사원형을 씁니다: What language does she speak?','미리보기 · A1 12개 수업 · 나머지 과정은 제작 중입니다.'],
 hi:['शहर में आना-जाना','स्थान और यातायात के लिए at, in और on का प्रयोग करें।','मेरी दिनचर्या','समय, दिन और दिन के हिस्सों के बारे में बोलें।','देश और भाषाएँ','पूछें कि कोई कहाँ से है और कौन-सी भाषाएँ बोलता है।','किसी निश्चित स्थान के लिए at, जैसे at the bus stop; क्षेत्र के लिए in, जैसे in the city, प्रयोग करें।','बस और मेट्रो के लिए on, लेकिन टैक्सी और कार के लिए in प्रयोग करें।','घड़ी के समय के लिए at (at 7:00), दिन के हिस्से के लिए in (in the evening), और दिनों के लिए on (on Monday) प्रयोग करें।','every, next, last या this से पहले at, in या on न लगाएँ: every weekday, next Monday।','be वाले प्रश्न में am, is या are को कर्ता से पहले रखें: Where is Emma from?','Present Simple के अन्य क्रियापदों के साथ do या does + कर्ता + क्रिया का मूल रूप प्रयोग करें: What language does she speak?','प्रोटोटाइप · A1 के 12 पाठ · बाकी पाठ तैयार किए जा रहे हैं।'],
 bn:['শহরে চলাচল','স্থান ও যানবাহন বোঝাতে at, in এবং on ব্যবহার করুন।','আমার দৈনন্দিন সময়সূচি','সময়, দিন ও দিনের বিভিন্ন ভাগ নিয়ে বলুন।','দেশ ও ভাষা','কেউ কোথা থেকে এসেছেন এবং কোন ভাষায় কথা বলেন তা জিজ্ঞেস করুন।','নির্দিষ্ট জায়গার জন্য at, যেমন at the bus stop; এলাকার জন্য in, যেমন in the city ব্যবহার করুন।','বাস ও মেট্রোর জন্য on, কিন্তু ট্যাক্সি ও গাড়ির জন্য in ব্যবহার করুন।','ঘড়ির সময়ের জন্য at (at 7:00), দিনের ভাগের জন্য in (in the evening), আর দিনের জন্য on (on Monday) ব্যবহার করুন।','every, next, last বা this-এর আগে at, in বা on বসাবেন না: every weekday, next Monday।','be দিয়ে প্রশ্নে am, is বা are কর্তার আগে বসে: Where is Emma from?','Present Simple-এর অন্য ক্রিয়ার প্রশ্নে do বা does + কর্তা + মূল ক্রিয়া ব্যবহার করুন: What language does she speak?','নমুনা · A1-এর ১২টি পাঠ · বাকি কোর্স তৈরি হচ্ছে।'],
 ur:['شہر میں آمد و رفت','جگہوں اور سواریوں کے لیے at، in اور on استعمال کریں۔','میرا روزانہ کا معمول','وقت، دنوں اور دن کے حصوں کے بارے میں بات کریں۔','ممالک اور زبانیں','پوچھیں کہ کوئی کہاں سے ہے اور کون سی زبانیں بولتا ہے۔','کسی خاص مقام کے لیے at، جیسے at the bus stop، اور علاقے کے لیے in، جیسے in the city استعمال کریں۔','بس اور میٹرو کے لیے on، لیکن ٹیکسی یا کار کے لیے in استعمال کریں۔','گھڑی کے وقت کے لیے at (at 7:00)، دن کے حصوں کے لیے in (in the evening)، اور دنوں کے لیے on (on Monday) استعمال کریں۔','every، next، last یا this سے پہلے at، in یا on نہ لگائیں: every weekday، next Monday۔','be کے سوال میں am، is یا are کو فاعل سے پہلے رکھیں: Where is Emma from?','Present Simple کے دوسرے افعال کے لیے do یا does + فاعل + فعل کی بنیادی شکل استعمال کریں: What language does she speak?','ابتدائی نمونہ · A1 کے 12 اسباق · باقی کورس تیار ہو رہا ہے۔'],
 ar:['التنقل في المدينة','استخدم at وin وon للتحدث عن الأماكن ووسائل النقل.','روتيني اليومي','تحدث عن الساعة والأيام وأوقات اليوم.','البلدان واللغات','اسأل عن بلد الشخص واللغات التي يتحدث بها.','استخدم at لمكان محدد، مثل at the bus stop، وin لمنطقة، مثل in the city.','استخدم on للحافلة والمترو، وin لسيارة الأجرة أو السيارة.','استخدم at للساعة (at 7:00)، وin لأوقات اليوم (in the evening)، وon للأيام (on Monday).','لا تضف at أو in أو on قبل every أو next أو last أو this: every weekday، next Monday.','في السؤال مع be، ضع am أو is أو are قبل الفاعل: Where is Emma from?','مع الأفعال الأخرى في Present Simple، استخدم do أو does + الفاعل + الفعل في صورته الأساسية: What language does she speak?','نسخة تجريبية · 12 درسًا A1 · بقية الدورة قيد الإعداد.'],
 id:['Keliling kota','Gunakan at, in, dan on untuk tempat dan transportasi.','Rutinitas harian saya','Bicarakan jam, hari, dan waktu dalam sehari.','Negara dan bahasa','Tanyakan asal seseorang dan bahasa yang mereka gunakan.','Gunakan at untuk titik tertentu, seperti at the bus stop, dan in untuk wilayah, seperti in the city.','Gunakan on untuk bus dan metro, tetapi in untuk taksi atau mobil.','Gunakan at untuk jam (at 7:00), in untuk bagian hari (in the evening), dan on untuk hari (on Monday).','Jangan tambahkan at, in, atau on sebelum every, next, last, atau this: every weekday, next Monday.','Dalam pertanyaan dengan be, letakkan am, is, atau are sebelum subjek: Where is Emma from?','Dengan kata kerja lain dalam Present Simple, gunakan do atau does + subjek + bentuk dasar kata kerja: What language does she speak?','Prototipe · 12 pelajaran A1 · sisanya sedang dibuat.'],
 tr:['Şehirde ulaşım','Yerleri ve ulaşımı anlatırken at, in ve on kullan.','Günlük programım','Saatler, günler ve günün bölümleri hakkında konuş.','Ülkeler ve diller','Birinin nereli olduğunu ve hangi dilleri konuştuğunu sor.','Belirli bir nokta için at (at the bus stop), bir alan için in (in the city) kullan.','Otobüs ve metro için on, taksi ve araba için in kullan.','Saatler için at (at 7:00), günün bölümleri için in (in the evening), günler için on (on Monday) kullan.','every, next, last veya this önüne at, in ya da on ekleme: every weekday, next Monday.','be ile soruda am, is veya are öznenin önüne gelir: Where is Emma from?','Present Simple içindeki diğer fiillerle do veya does + özne + fiilin yalın hâlini kullan: What language does she speak?','Prototip · 12 A1 dersi · kursun kalanı hazırlanıyor.'],

 kk:['Қаладағы көлік','Орындар мен көлік туралы айтқанда at, in және on қолданыңыз.','Менің күн тәртібім','Сағат, күндер және тәулік мезгілдері туралы айтыңыз.','Елдер мен тілдер','Адамның қайдан екенін және қандай тілде сөйлейтінін сұраңыз.','Нақты нүкте үшін at (at the bus stop), аумақ үшін in (in the city) қолданыңыз.','Автобус пен метрода on, такси мен көлікте in қолданыңыз.','Сағатпен at (at 7:00), тәулік мезгілімен in (in the evening), күнмен on (on Monday) қолданыңыз.','every, next, last немесе this сөздерінің алдына at, in не on қоймаңыз: every weekday, next Monday.','be етістігімен сұрақта am, is немесе are бастауыштың алдында тұрады: Where is Emma from?','Present Simple шағындағы басқа етістіктермен do немесе does + бастауыш + етістіктің негізгі түрін қолданыңыз: What language does she speak?','Прототип · A1 деңгейінің 12 сабағы · қалған курс әзірленуде.'],

 de:['Menschen beschreiben','Beschreibe Menschen und Gefühle mit Adjektiven.','Meine Wohnung und Artikel','Wähle a/an, the oder keinen Artikel.','Leben im Dorf','Führe etwas mit there ein und beschreibe es mit it.','Das Adjektiv steht vor dem Substantiv: a kind person.','Nach be und feel steht ein Adjektiv: Alex is kind; Anna feels happy.','Adjektive ändern sich im Plural nicht: kind people.','Verwende a/an bei der ersten Erwähnung eines zählbaren Nomens im Singular: a balcony, an apartment.','Verwende the für etwas Bestimmtes oder bereits Erwähntes: the balcony.','Bei allgemeinen Pluralformen und nicht zählbaren Nomen kein Artikel: rooms, coffee.','Mit there is/are sagst du, dass etwas vorhanden ist: There is a shop.','Mit it beziehst du dich auf eine erwähnte Sache, mit they auf mehrere: It is small; They are small.','Für Wetter und Uhrzeit verwende it: It is sunny; It is seven o’clock.','Prototyp · 15 A1-Lektionen · der restliche Kurs wird entwickelt.'],
 fr:['Décrire les personnes','Utilisez des adjectifs pour décrire les personnes et les sentiments.','Mon appartement et les articles','Choisissez a/an, the ou aucun article.','La vie dans un village','Utilisez there pour présenter une chose, puis it pour la décrire.','Placez l’adjectif avant le nom : a kind person.','Après be et feel, employez un adjectif : Alex is kind; Anna feels happy.','Les adjectifs ne changent pas au pluriel : kind people.','Employez a/an à la première mention d’un nom dénombrable singulier : a balcony, an apartment.','Employez the pour une chose précise ou déjà mentionnée : the balcony.','Pas d’article pour les pluriels et les indénombrables en général : rooms, coffee.','There is/are indique qu’une chose existe : There is a shop.','Reprenez une chose déjà mentionnée avec it et plusieurs avec they : It is small; They are small.','Employez it pour la météo et l’heure : It is sunny; It is seven o’clock.','Prototype · 15 leçons A1 · la suite du cours est en préparation.'],
 it:['Descrivere le persone','Usa gli aggettivi per descrivere persone e sentimenti.','Il mio appartamento e gli articoli','Scegli a/an, the o nessun articolo.','Vivere in un villaggio','Usa there per introdurre qualcosa e it per descriverlo.','Metti l’aggettivo prima del nome: a kind person.','Usa un aggettivo dopo be e feel: Alex is kind; Anna feels happy.','Gli aggettivi non cambiano al plurale: kind people.','Usa a/an alla prima menzione di un nome numerabile singolare: a balcony, an apartment.','Usa the per qualcosa di specifico o già menzionato: the balcony.','Nessun articolo per plurali e non numerabili in generale: rooms, coffee.','Usa there is/are per dire che qualcosa esiste: There is a shop.','Usa it per una cosa già citata e they per più cose: It is small; They are small.','Usa it per il meteo e l’ora: It is sunny; It is seven o’clock.','Prototipo · 15 lezioni A1 · il resto del corso è in preparazione.'],
 hy:['Նկարագրել մարդկանց','Ածականներով նկարագրեք մարդկանց և զգացմունքները։','Իմ բնակարանը և հոդերը','Ընտրեք a/an, the կամ առանց հոդի տարբերակը։','Կյանքը գյուղում','Նոր առարկան նշեք there-ով, ապա նկարագրեք it-ով։','Ածականը դրեք գոյականից առաջ՝ a kind person.','be և feel բայերից հետո դրեք ածական՝ Alex is kind; Anna feels happy.','Հոգնակիի դեպքում ածականը չի փոխվում՝ kind people.','Եզակի հաշվելի գոյականի առաջին հիշատակման դեպքում օգտագործեք a/an՝ a balcony, an apartment.','Հայտնի կամ արդեն հիշատակված առարկայի համար օգտագործեք the՝ the balcony.','Ընդհանուր հոգնակի և անհաշվելի բառերի հետ հոդ պետք չէ՝ rooms, coffee.','Գոյությունը նշելու համար օգտագործեք there is/are՝ There is a shop.','Արդեն հիշատակված մեկ առարկայի համար օգտագործեք it, մի քանիսի համար՝ they՝ It is small; They are small.','Եղանակի և ժամի համար օգտագործեք it՝ It is sunny; It is seven o’clock.','Նախատիպ · A1-ի 15 դաս · մնացած դասերը մշակվում են։'],
 'zh-Hans':['描述人物','用形容词描述人物和感受。','我的公寓与冠词','选择 a/an、the 或不用冠词。','乡村生活','先用 there 引出事物，再用 it 描述它。','形容词放在名词前：a kind person。','be 和 feel 后使用形容词：Alex is kind; Anna feels happy。','复数形式不改变形容词：kind people。','首次提到单数可数名词时使用 a/an：a balcony, an apartment。','特指或再次提及时使用 the：the balcony。','泛指复数或不可数名词时不用冠词：rooms, coffee。','用 there is/are 表示某物存在：There is a shop。','已提到的一个事物用 it，多个用 they：It is small; They are small。','天气和时间用 it：It is sunny; It is seven o’clock。','体验版 · 15 节 A1 课程 · 其余课程正在制作中。'],
 ja:['人を描写する','形容詞で人柄や気持ちを表します。','私のアパートと冠詞','a/an、the、冠詞なしを選びます。','村での暮らし','there で存在を紹介し、it でそれを説明します。','形容詞は名詞の前に置きます：a kind person。','be と feel の後には形容詞を使います：Alex is kind; Anna feels happy。','複数でも形容詞の形は変わりません：kind people。','単数の数えられる名詞を初めて述べるときは a/an：a balcony, an apartment。','特定のものや既出のものには the：the balcony。','一般的な複数名詞や数えられない名詞には冠詞を付けません：rooms, coffee。','存在を表すには there is/are：There is a shop。','既出の一つのものには it、複数には they：It is small; They are small。','天気や時刻には it：It is sunny; It is seven o’clock。','試作版 · A1 の15レッスン · 続きは制作中です。'],
 ko:['사람 묘사하기','형용사로 사람과 감정을 묘사합니다.','우리 집과 관사','a/an, the 또는 관사 없음을 고릅니다.','마을 생활','there로 대상을 소개하고 it으로 설명합니다.','형용사는 명사 앞에 옵니다: a kind person.','be와 feel 뒤에는 형용사를 씁니다: Alex is kind; Anna feels happy.','복수여도 형용사는 변하지 않습니다: kind people.','셀 수 있는 단수 명사를 처음 말할 때 a/an을 씁니다: a balcony, an apartment.','특정하거나 앞서 말한 대상에는 the를 씁니다: the balcony.','일반적인 복수나 셀 수 없는 명사에는 관사가 없습니다: rooms, coffee.','존재를 말할 때 there is/are를 씁니다: There is a shop.','앞서 말한 하나는 it, 여러 개는 they로 받습니다: It is small; They are small.','날씨와 시간에는 it을 씁니다: It is sunny; It is seven o’clock.','프로토타입 · A1 15강 · 나머지 과정은 준비 중입니다.'],
 hi:['लोगों का वर्णन','लोगों और भावनाओं का वर्णन विशेषण से करें।','मेरा अपार्टमेंट और आर्टिकल','a/an, the या बिना आर्टिकल के सही रूप चुनें।','गाँव में जीवन','पहली बार बताने के लिए there, फिर वर्णन के लिए it इस्तेमाल करें।','विशेषण संज्ञा से पहले आता है: a kind person.','be और feel के बाद विशेषण आता है: Alex is kind; Anna feels happy.','बहुवचन में विशेषण नहीं बदलता: kind people.','एकवचन गिनने योग्य संज्ञा का पहली बार ज़िक्र हो तो a/an लगाएँ: a balcony, an apartment.','विशिष्ट या पहले बताई चीज़ के लिए the लगाएँ: the balcony.','सामान्य बहुवचन और अगणनीय शब्दों के साथ आर्टिकल नहीं: rooms, coffee.','किसी चीज़ के होने के लिए there is/are: There is a shop.','पहले बताई एक चीज़ के लिए it, कई के लिए they: It is small; They are small.','मौसम और समय के लिए it: It is sunny; It is seven o’clock.','प्रोटोटाइप · A1 के 15 पाठ · बाकी पाठ तैयार किए जा रहे हैं।'],
 bn:['মানুষের বর্ণনা','বিশেষণ দিয়ে মানুষ ও অনুভূতি বর্ণনা করুন।','আমার অ্যাপার্টমেন্ট ও আর্টিকেল','a/an, the অথবা আর্টিকেল ছাড়াই সঠিক রূপ বাছুন।','গ্রামের জীবন','প্রথমে there দিয়ে কিছু পরিচয় করান, পরে it দিয়ে বর্ণনা করুন।','বিশেষণ বিশেষ্যের আগে বসে: a kind person.','be ও feel-এর পরে বিশেষণ বসে: Alex is kind; Anna feels happy.','বহুবচনে বিশেষণ বদলায় না: kind people.','গণনাযোগ্য একবচন বিশেষ্য প্রথমবার উল্লেখে a/an ব্যবহার করুন: a balcony, an apartment.','নির্দিষ্ট বা আগে উল্লেখ করা কিছুর জন্য the ব্যবহার করুন: the balcony.','সাধারণ বহুবচন বা অগণনীয় বিশেষ্যে আর্টিকেল লাগে না: rooms, coffee.','কিছুর অস্তিত্ব বোঝাতে there is/are: There is a shop.','আগে বলা একটি জিনিসে it, একাধিক হলে they: It is small; They are small.','আবহাওয়া ও সময় বলতে it ব্যবহার করুন: It is sunny; It is seven o’clock.','প্রোটোটাইপ · A1-এর ১৫টি পাঠ · বাকি পাঠ তৈরি হচ্ছে।'],
 ur:['لوگوں کی وضاحت','لوگوں اور احساسات کی وضاحت صفت سے کریں۔','میرا اپارٹمنٹ اور آرٹیکل','a/an، the یا بغیر آرٹیکل کے درست شکل چنیں۔','گاؤں کی زندگی','کسی چیز کو متعارف کرانے کے لیے there اور پھر بیان کے لیے it استعمال کریں۔','صفت اسم سے پہلے آتی ہے: a kind person.','be اور feel کے بعد صفت آتی ہے: Alex is kind; Anna feels happy.','جمع میں صفت کی شکل نہیں بدلتی: kind people.','قابلِ شمار واحد اسم کا پہلی بار ذکر ہو تو a/an لگائیں: a balcony, an apartment.','مخصوص یا پہلے مذکور چیز کے لیے the لگائیں: the balcony.','عام جمع یا ناقابلِ شمار اسم کے ساتھ آرٹیکل نہیں آتا: rooms, coffee.','کسی چیز کے موجود ہونے کے لیے there is/are: There is a shop.','پہلے مذکور ایک چیز کے لیے it، کئی چیزوں کے لیے they: It is small; They are small.','موسم اور وقت کے لیے it استعمال کریں: It is sunny; It is seven o’clock.','نمونہ · A1 کے ۱۵ اسباق · باقی کورس تیار ہو رہا ہے۔'],
 ar:['وصف الأشخاص','استخدم الصفات لوصف الأشخاص والمشاعر.','شقتي وأدوات التعريف','اختر a/an أو the أو بلا أداة.','الحياة في قرية','استخدم there لتقديم شيء ثم it لوصفه.','تأتي الصفة قبل الاسم: a kind person.','تأتي الصفة بعد be وfeel: Alex is kind; Anna feels happy.','لا تتغير الصفة في الجمع: kind people.','استخدم a/an عند ذكر اسم مفرد معدود لأول مرة: a balcony, an apartment.','استخدم the لشيء محدد أو ذُكر من قبل: the balcony.','لا تستخدم أداة مع الجمع العام أو الاسم غير المعدود: rooms, coffee.','استخدم there is/are لبيان وجود شيء: There is a shop.','استخدم it لشيء واحد سبق ذكره وthey لأشياء متعددة: It is small; They are small.','استخدم it للطقس والوقت: It is sunny; It is seven o’clock.','نسخة تجريبية · 15 درسًا في A1 · بقية الدورة قيد الإعداد.'],
 id:['Mendeskripsikan orang','Gunakan kata sifat untuk orang dan perasaan.','Apartemen saya dan artikel','Pilih a/an, the, atau tanpa artikel.','Hidup di desa','Gunakan there untuk mengenalkan sesuatu, lalu it untuk menjelaskannya.','Letakkan kata sifat sebelum kata benda: a kind person.','Gunakan kata sifat sesudah be dan feel: Alex is kind; Anna feels happy.','Kata sifat tidak berubah dalam bentuk jamak: kind people.','Gunakan a/an saat pertama menyebut kata benda tunggal yang dapat dihitung: a balcony, an apartment.','Gunakan the untuk sesuatu yang khusus atau sudah disebut: the balcony.','Tanpa artikel untuk bentuk jamak atau tak terhitung secara umum: rooms, coffee.','Gunakan there is/are untuk menyatakan keberadaan: There is a shop.','Gunakan it untuk satu hal yang sudah disebut, they untuk beberapa: It is small; They are small.','Gunakan it untuk cuaca dan waktu: It is sunny; It is seven o’clock.','Prototipe · 15 pelajaran A1 · sisa kursus sedang disiapkan.'],
 tr:['İnsanları betimleme','İnsanları ve duyguları sıfatlarla anlatın.','Dairem ve artikeller','a/an, the veya artikelsiz biçimi seçin.','Köy yaşamı','Bir şeyi tanıtmak için there, anlatmak için it kullanın.','Sıfat isimden önce gelir: a kind person.','be ve feel fiillerinden sonra sıfat kullanın: Alex is kind; Anna feels happy.','Sıfat çoğulda değişmez: kind people.','Tekil sayılabilir bir adı ilk kez söylerken a/an kullanın: a balcony, an apartment.','Belirli veya daha önce söylenmiş bir şey için the kullanın: the balcony.','Genel çoğul ve sayılamayan isimlerde artikel kullanmayın: rooms, coffee.','Bir şeyin varlığını belirtmek için there is/are: There is a shop.','Daha önce söylenen bir şey için it, birden fazlası için they: It is small; They are small.','Hava ve saat için it kullanın: It is sunny; It is seven o’clock.','Prototip · 15 A1 dersi · kursun kalanı hazırlanıyor.'],
 vi:['Miêu tả con người','Dùng tính từ để miêu tả con người và cảm xúc.','Căn hộ của tôi và mạo từ','Chọn a/an, the hoặc không dùng mạo từ.','Cuộc sống ở làng','Dùng there để giới thiệu sự vật, rồi it để miêu tả.','Đặt tính từ trước danh từ: a kind person.','Dùng tính từ sau be và feel: Alex is kind; Anna feels happy.','Tính từ không đổi ở số nhiều: kind people.','Dùng a/an khi lần đầu nhắc đến danh từ đếm được số ít: a balcony, an apartment.','Dùng the cho vật cụ thể hoặc đã nhắc đến: the balcony.','Không dùng mạo từ với số nhiều hay danh từ không đếm được nói chung: rooms, coffee.','Dùng there is/are để nói một vật tồn tại: There is a shop.','Dùng it cho một vật đã nhắc đến, they cho nhiều vật: It is small; They are small.','Dùng it khi nói thời tiết và thời gian: It is sunny; It is seven o’clock.','Bản thử nghiệm · 15 bài A1 · phần còn lại đang được phát triển.'],
 kk:['Адамдарды сипаттау','Адамдар мен сезімдерді сын есіммен сипаттаңыз.','Менің пәтерім және артикльдер','a/an, the немесе артикльсіз нұсқаны таңдаңыз.','Ауыл өмірі','Бір нәрсені алғаш айтуға there, сипаттауға it қолданыңыз.','Сын есім зат есімнің алдында тұрады: a kind person.','be және feel сөздерінен кейін сын есім қолданыңыз: Alex is kind; Anna feels happy.','Көпше түрде сын есім өзгермейді: kind people.','Жекеше саналатын зат есімді алғаш атағанда a/an қолданыңыз: a balcony, an apartment.','Нақты немесе бұрын аталған нәрсе үшін the қолданыңыз: the balcony.','Жалпы көпше және саналмайтын зат есімдермен артикль қоймаңыз: rooms, coffee.','Бар екенін айту үшін there is/are қолданыңыз: There is a shop.','Бұрын айтылған бір нәрсеге it, бірнешеуіне they қолданыңыз: It is small; They are small.','Ауа райы мен уақытқа it қолданыңыз: It is sunny; It is seven o’clock.','Прототип · A1 деңгейінің 15 сабағы · қалған курс әзірленуде.'],
 uz:['Odamlarni tasvirlash','Odamlar va hislarni sifatlar bilan tasvirlang.','Mening kvartiram va artikllar','a/an, the yoki artiklsiz shaklni tanlang.','Qishloq hayoti','Biror narsani tanishtirish uchun there, keyin tasvirlash uchun it ishlating.','Sifat ot oldida keladi: a kind person.','be va feel dan keyin sifat ishlating: Alex is kind; Anna feels happy.','Ko‘plikda sifat o‘zgarmaydi: kind people.','Sanasa bo‘ladigan birlik ot birinchi marta aytilganda a/an ishlating: a balcony, an apartment.','Aniq yoki oldin aytilgan narsa uchun the ishlating: the balcony.','Umumiy ko‘plik va sanalmaydigan otlarda artikl ishlatmang: rooms, coffee.','Biror narsa borligini aytish uchun there is/are: There is a shop.','Oldin aytilgan bitta narsa uchun it, ko‘plari uchun they: It is small; They are small.','Ob-havo va vaqt uchun it ishlating: It is sunny; It is seven o’clock.','Prototip · A1 uchun 15 dars · qolgan kurs tayyorlanmoqda.']

 en:['What are they wearing?','Describe clothes and actions happening now.','At the restaurant','Use like for general preferences and would like for offers and requests.','Shopping habits','Ask and answer how often someone shops.','Use like for a general preference: I like soup. Use Do you like…? to ask for an opinion.','Use I’d like… to ask for something now. Use Would you like…? to offer it.','Put always and sometimes before the main verb: I always compare prices.','How often…? asks about frequency. Answer with once a month, every day, or a similar phrase.'],
 ru:['Во что они одеты?','Опишите одежду и действия, происходящие сейчас.','В ресторане','Различайте like для общих предпочтений и would like для предложений и просьб.','Покупки','Спрашивайте и отвечайте, как часто человек ходит за покупками.','Like выражает общее предпочтение: I like soup. Do you like…? спрашивает мнение.','I’d like… — просьба о чём-то сейчас. Would you like…? — предложение.','Ставьте always и sometimes перед основным глаголом: I always compare prices.','How often…? спрашивает о частоте. Ответьте: once a month, every day и т. п.'],
 es:['¿Qué llevan puesto?','Describe ropa y acciones que ocurren ahora.','En el restaurante','Usa like para preferencias generales y would like para ofrecer o pedir algo.','Hábitos de compra','Pregunta y responde con qué frecuencia compra alguien.','Like expresa una preferencia general: I like soup. Do you like…? pregunta por una opinión.','I’d like… sirve para pedir algo ahora. Would you like…? sirve para ofrecerlo.','Coloca always y sometimes antes del verbo principal: I always compare prices.','How often…? pregunta por la frecuencia. Responde con once a month, every day, etc.'],
 pt:['O que estão vestindo?','Descreva roupas e ações que acontecem agora.','No restaurante','Use like para preferências gerais e would like para ofertas e pedidos.','Hábitos de compras','Pergunte e responda com que frequência alguém faz compras.','Like expressa uma preferência geral: I like soup. Do you like…? pergunta uma opinião.','I’d like… pede algo agora. Would you like…? oferece algo.','Coloque always e sometimes antes do verbo principal: I always compare prices.','How often…? pergunta a frequência. Responda com once a month, every day etc.'],
 de:['Was tragen sie?','Beschreibe Kleidung und Handlungen, die jetzt stattfinden.','Im Restaurant','Verwende like für allgemeine Vorlieben und would like für Angebote und Bitten.','Einkaufsgewohnheiten','Frage und antworte, wie oft jemand einkauft.','Like beschreibt eine allgemeine Vorliebe: I like soup. Do you like…? fragt nach einer Meinung.','I’d like… ist eine Bitte um etwas jetzt. Would you like…? ist ein Angebot.','Setze always und sometimes vor das Hauptverb: I always compare prices.','How often…? fragt nach der Häufigkeit. Antworte mit once a month, every day usw.'],
 fr:['Que portent-ils ?','Décris les vêtements et les actions en cours.','Au restaurant','Utilise like pour les goûts généraux et would like pour les offres et les demandes.','Habitudes d’achat','Demande et indique à quelle fréquence une personne fait des achats.','Like exprime un goût général : I like soup. Do you like…? demande un avis.','I’d like… sert à demander quelque chose maintenant. Would you like…? sert à l’offrir.','Place always et sometimes avant le verbe principal : I always compare prices.','How often…? demande la fréquence. Réponds avec once a month, every day, etc.'],
 it:['Che cosa indossano?','Descrivi abiti e azioni che avvengono ora.','Al ristorante','Usa like per i gusti generali e would like per offerte e richieste.','Abitudini di acquisto','Chiedi e spiega quanto spesso una persona fa acquisti.','Like indica una preferenza generale: I like soup. Do you like…? chiede un’opinione.','I’d like… serve a chiedere qualcosa ora. Would you like…? serve a offrirla.','Metti always e sometimes prima del verbo principale: I always compare prices.','How often…? chiede la frequenza. Rispondi con once a month, every day, ecc.'],
 hy:['Ի՞նչ են նրանք հագել','Նկարագրեք հագուստն ու հիմա կատարվող գործողությունները։','Ռեստորանում','Ընդհանուր նախընտրության համար օգտագործեք like, առաջարկի կամ խնդրանքի համար՝ would like։','Գնումների սովորություններ','Հարցրեք և պատասխանեք, թե մարդը որքան հաճախ է գնումներ անում։','Like-ը ցույց է տալիս ընդհանուր նախընտրություն՝ I like soup. Do you like…? հարցնում է կարծիք։','I’d like… ձևով հիմա ինչ-որ բան եք խնդրում։ Would you like…? ձևով առաջարկում եք։','always և sometimes բառերը դրեք հիմնական բայից առաջ՝ I always compare prices.','How often…? հարցնում է հաճախականությունը։ Պատասխանեք once a month, every day և նման ձևերով։'],

 ar:['ماذا يرتدون؟','صِف الملابس والأفعال التي تحدث الآن.','في المطعم','استخدم like للتفضيل العام وwould like للعرض أو الطلب المهذب.','عادات التسوق','اسأل وأجب عن عدد مرات التسوق.','تعبّر like عن تفضيل عام: I like soup. وتسأل Do you like…? عن الرأي.','تستخدم I’d like… لطلب شيء الآن، وWould you like…? لعرضه.','ضع always وsometimes قبل الفعل الرئيسي: I always compare prices.','تسأل How often…? عن التكرار. أجب بعبارات مثل once a month أو every day.'],
 id:['Apa yang mereka kenakan?','Jelaskan pakaian dan kegiatan yang sedang berlangsung.','Di restoran','Gunakan like untuk kesukaan umum dan would like untuk tawaran atau permintaan.','Kebiasaan berbelanja','Tanyakan dan jawab seberapa sering seseorang berbelanja.','Like menyatakan kesukaan umum: I like soup. Do you like…? menanyakan pendapat.','I’d like… meminta sesuatu sekarang. Would you like…? menawarkannya.','Letakkan always dan sometimes sebelum kata kerja utama: I always compare prices.','How often…? menanyakan frekuensi. Jawab dengan once a month, every day, dan sebagainya.'],

onger part of time.','Определите, что обозначает выражение: время на часах, день или более длинный период.'],timeNoPreposition:['Every, next and last normally attach to the time word without another preposition.','Every, next и last обычно стоят перед словом времени без дополнительного предлога.'],questionsWithBe:['Move the form of be before the person in a direct question; do is not needed.','В прямом вопросе форма be ставится перед обозначением человека; do не нужен.'],questionsWithDo:['There is an ordinary action verb. Use do/does before the subject and a base verb after it.','Здесь обычный глагол действия. Перед подлежащим нужен do/does, после него — начальная форма глагола.'],adjectiveBefore:['Find the noun being described. An adjective normally goes before that noun.','Найдите описываемое существительное. Прилагательное обычно стоит перед ним.'],adjectiveAfter:['After be or feel, describe the person with an adjective rather than an adverb.','После be или feel состояние человека описывается прилагательным, а не наречием.'],adjectiveNoPlural:['Only the noun changes to a plural. The describing adjective stays unchanged.','Во множественное число изменяется существительное; описывающее его прилагательное не меняется.'],articleFirst:['This is the first mention of one countable thing. Its first sound helps choose the article.','Один исчисляемый предмет упоминается впервые. Выбрать артикль поможет первый звук слова.'],articleSpecific:['The reader can identify this exact thing: it was mentioned already or is specified.','Читатель может определить конкретный предмет: он уже упоминался или уточнён.'],articleZero:['A general plural or uncountable noun does not refer to one particular item.','Общее значение множественного или неисчисляемого существительного не обозначает один конкретный предмет.'],thereExists:['Introduce the existence of something before describing it with a pronoun.','Сначала сообщите о существовании предмета; описывать его местоимением можно после этого.  if(hintOpen){const focus=globalThis.EvoCourseSupport?.hint(q,locale)||q.prompt;app.innerHTML=`<div class="lesson-flow"><div class="flow-top">${btn('map','map','quiet')}<span class="pill">${esc(t('help'))}</span><span class="small">${number}/${total}</span></div><section class="lesson-card flow-card hint-card"><h1>${esc(t('help'))}</h1><div class="study-scroll"><p class="hint-focus" lang="${locale==='ru'?'ru':'en'}" dir="auto">${esc(focus)}</p>${q.rule==='listen'?'':`<div class="hint">${explain(q.rule)}</div>`}</div><div class="flow-actions">${btn('theory','view-theory','quiet',`data-lesson="${a.lesson}"`)}${btn('continue','hint','primary')}</div></section></div>`;return;}
 const feedbackRule=a.lesson>=21&&I.ui[locale][q.rule+'Short']?q.rule+'Short':q.rule;
 let body='';if(q.type==='choice')body=`<div class="options">${options.map((option,i)=>`<button class="option ${a.draft===option?'selected':''}" data-action="choice" data-index="${i}" aria-pressed="${a.draft===option}" lang="en" dir="ltr" data-english ${locked?'disabled':''}><span class="key" aria-hidden="true">${i+1}</span><span>${esc(option)}</span></button>`).join('')}</div>`;
 if(q.type==='input')body=`<label class="field-label" lang="en" dir="ltr" data-english>Your answer<input id="answer" class="answer-input" autocomplete="off" autocapitalize="sentences" spellcheck="false" value="${esc(a.draft||'')}" ${locked?'disabled':''}></label>`;
 if(q.type==='writing')body=`<label class="field-label writing-label" lang="en" dir="ltr" data-english>Your sentence<textarea id="answer" class="writing-input" rows="2" maxlength="160" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="Write one sentence…" ${locked?'disabled':''}>${esc(a.draft||'')}</textarea></label>`;
 if(q.type==='fields')body=q.fields.map((f,i)=>{const value=String(a.draft?.[i]||''),valid=value.trim().length>=2&&/[a-z]/i.test(value);return `<label class="field-label" lang="en" dir="ltr" data-english>${esc(f.label)}<input data-field="${i}" autocomplete="off" spellcheck="false" value="${esc(value)}" class="${locked?(valid?'valid':'invalid'):''}" ${locked?'disabled':''} ${locked&&!valid?'aria-invalid="true"':''}></label>`;}).join('');
 if(q.type==='order'){const selected=E.orderIndexes(q,a.draft||[]),hint=orderHint[locale]||orderHint.en;body=`<div class="sentence" lang="en" dir="ltr" data-english aria-live="polite">${selected.length?selected.map((tokenIndex,position)=>`<button type="button" class="answer-tile" data-action="remove-tile" data-index="${position}" aria-label="${esc(hint)} ${esc(q.tokens[tokenIndex])}" title="${esc(hint)}" ${locked?'disabled':''}>${esc(q.tokens[tokenIndex])}</button>`).join(''):'<span aria-hidden="true">…</span>'}</div><p class="order-hint" lang="${esc(locale)}" dir="auto">${esc(hint)}</p><div class="tiles">${E.orderBank(q,a.seed).map(i=>`<button lang="en" dir="ltr" data-english data-action="tile" data-index="${i}" ${locked||selected.includes(i)?'disabled':''}>${esc(q.tokens[i])}</button>`).join('')}</div>`;}
 if(q.type==='match')body=`<p class="small">${esc(t('match'))}</p>${q.pairs.map((p,i)=>`<div class="match-row" dir="ltr"><label for="match-${i}" lang="en" data-english>${esc(p[0])}</label><select id="match-${i}" data-match="${i}" lang="en" dir="ltr" data-english ${locked?'disabled':''}><option value=""></option>${[...q.pairs].reverse().map(pair=>`<option ${a.draft?.[i]===pair[1]?'selected':''}>${esc(pair[1])}</option>`).join('')}</select></div>`).join('')}`;
 if(locked){const submitted=q.type==='order'?E.orderIndexes(q,a.draft||[]).map(index=>q.tokens[index]).join(' '):String(a.draft||'');body=a.feedback==='wrong'?`<p class="submitted-answer">${esc(t('yourAnswer'))}: <span lang="en" dir="ltr" data-english>${esc(submitted)}</span></p>`:'';}
 app.innerHTML=`<div class="lesson-flow"><div class="flow-top">${btn('map','map','quiet')}<span class="pill">${esc(label)}${review?' · '+esc(t('review')):''}</span><div class="progress" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${a.position}"><i style="width:${100*a.position/total}%"></i></div><span class="small">${number}/${total}</span></div><section class="lesson-card flow-card question-card${locked?' answer-reviewed':''}"><h1 lang="en" dir="ltr" data-english>${esc(q.prompt)}</h1>${listening?`<audio class="question-audio" controls preload="metadata" src="${esc(l.audio)}" aria-label="${esc(u('replayAudio'))}"></audio>`:''}${!locked&&q.role?en(q.role,'div','role'):''}${locked?'':body}${hintOpen?`<div class="hint">${explain(q.rule)}</div>`:''}${locked?`<section class="feedback ${a.feedback}" role="status"><h2>${a.feedback==='correct'?'✓':'↻'} ${esc(t(a.feedback))}</h2>${listening?'':`<p>${explain(feedbackRule)}</p>`}${body}${a.feedback==='wrong'?model(q):''}</section><div class="flow-actions">${btn('theory','view-theory','quiet',`data-lesson="${a.lesson}"`)}${btn('continue','next','primary')}</div>`:`<div class="flow-actions"><div class="question-help">${btn('help','hint','quiet')}${btn('theory','view-theory','quiet',`data-lesson="${a.lesson}"`)}</div>${btn('check','check','primary',E.ready(q,a.draft)?'':'disabled')}</div>`}</section></div>`;}
function result(){const r=state.lastResult;if(!r){view='map';map();return;}const done=completedCount()===B.lessons.length;app.innerHTML=`<section class="result"><div class="trophy" aria-hidden="true">${done?'✦':'✓'}</div><span class="pill">A1 · ${esc(t('module'))}</span><h1>${esc(t(done?'moduleDone':'lessonDone'))}</h1><p class="muted">${esc(t(B.lessons[r.lesson].goal))}</p><p class="completion-badge">✓ ${r.mastered||r.total}/${r.total} ${esc(t('correct'))}</p><div class="result-stats"><div class="result-stat"><strong>+${r.xp} XP</strong>${esc(t('lessonDone'))}</div><div class="result-stat"><strong>${r.firstCorrect}/${r.total}</strong>${esc(t('independent'))}</div><div class="result-stat"><strong>${r.reviewed}</strong>${esc(t('reviewed'))}</div></div>${r.unresolved?`<p class="notice">${esc(t('unresolved'))}: ${r.unresolved}</p>`:''}<div class="actions">${!done?btn('nextLesson','intro','primary',`data-lesson="${Math.min(r.lesson+1,B.lessons.length-1)}"`):btn('map','map')}${btn('retry','intro','',`data-lesson="${r.lesson}"`)}${!done?btn('map','map','quiet'):''}</div><p class="small" style="margin-top:25px">${esc(t('pilot'))}</p></section>`;}
function render(focus=true){settings();const learning=view==='intro'||view==='cards'||(view!=='map'&&!!state.active);document.body.classList.toggle('is-learning',learning);if(view==='map'){map();decorateMap();}else if(view==='cards')cardScreen();else if(view==='intro')intro();else if(view==='result')result();else if(state.active){const phase=state.active.phase;if(phase==='listening-intro')listeningScreen();else if(phase==='vocabulary'){vocabularyScreen();decorateVocabulary();}else if(phase==='speaking-practice')speechScreen();else if(phase==='speaking')speakingScreen();else{exercise();if(state.active.feedback)decorateFeedback(E.current(state));}}else{view='map';map();decorateMap();}storageNotice();if(focus){const h=app.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'instant'});}}
function updateDraft(value){state=E.draft(state,value);persist();const button=app.querySelector('[data-action=check]');if(button)button.disabled=!E.ready(E.current(state),state.active.draft);}
app.addEventListener('input',event=>{const el=event.target;if(el.id==='card-input'){cardInput=el.value;const button=app.querySelector('[data-action=card-check]');if(button)button.disabled=!cardInput.trim();return;}if(!state.active)return;if(el.id==='answer')updateDraft(el.value);if(el.hasAttribute('data-field')){const d=[...(state.active.draft||[])];d[Number(el.dataset.field)]=el.value;updateDraft(d);}});
app.addEventListener('keydown',event=>{if(event.target.id==='card-input'&&event.key==='Enter'&&!cardFeedback){event.preventDefault();if(cardInput.trim()){rateCard(R.answer(cardCurrent(),cardInput));render(false);}}});
app.addEventListener('change',event=>{const el=event.target;if(el.hasAttribute('data-match')){const d=[...(state.active.draft||[])];d[Number(el.dataset.match)]=el.value;updateDraft(d);}});
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;event.preventDefault();const action=el.dataset.action;
  if(action==='open-cards'){openCards();return;}
  if(action==='lesson-cards'&&state.active?.phase==='vocabulary'){openCards('lesson');return;}
  if(action==='cards-exit'){view=cardReturn==='vocabulary'&&state.active?.phase==='vocabulary'?'exercise':'map';render();return;}
  if(view==='cards'){
   if(action==='card-mode'){if(cardFeedback)return;cardMode=el.dataset.mode;cardRevealed=false;cardFeedback=null;cardInput='';cardNotice='';render(false);return;}
   if(action==='card-flip'){cardRevealed=true;render(false);return;}
   if(action==='card-audio'){speakWord();return;}
   if(action==='card-again'||action==='card-know'){rateCard(action==='card-know');nextCard();return;}
   if(action==='card-check'){if(cardInput.trim()&&!cardFeedback){rateCard(R.answer(cardCurrent(),cardInput));render(false);}return;}
   if(action==='card-reveal'){if(!cardFeedback){rateCard(false);render(false);}return;}
   if(action==='card-next'){nextCard();return;}
  }
  if(action==='view-theory'){resetSpeech();const index=Number(el.dataset.lesson);if(!E.unlocked(state,index))return;theoryReturn=state.active?'exercise':'map';introLesson=index;introRule=0;view='intro';hintOpen=false;render();return;}
 if(action==='export-progress'){const blob=new Blob([JSON.stringify({format:'evo-a1-progress',course:state,review},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='evo-a1-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}
 if(action==='import-progress'){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files?.[0];if(!file||file.size>3000000)throw Error('size');const data=JSON.parse(await file.text());const restored=E.restore(data.format==='evo-a1-progress'?data.course:data);resetSpeech();state=restored;if(data.format==='evo-a1-progress'&&data.review){review=R.restore(data.review);persistReview();}view='map';persist();render();}catch(_){alert(t('importError'));}};input.click();return;}
 if(action==='retry-save'){persist();return;}
 if(action==='map'){
resetSpeech();view='map';render();return;}
 if(action==='play-model'&&state.active?.phase==='speaking-practice'){const sentence=B.lessons[state.active.lesson].speakingSentences[state.active.speakingIndex];if(micState==='listening'){stopRecognition();micState='idle';}if('speechSynthesis' in window){window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(sentence);utterance.lang='en-US';utterance.rate=.85;window.speechSynthesis.speak(utterance);}render(false);return;}
 if(action==='start-mic'&&state.active?.phase==='speaking-practice'){startRecognition();return;}
 if((action==='skip-speech'||action==='next-speech')&&state.active?.phase==='speaking-practice'){if(action==='next-speech'&&!speechFeedback?.pass)return;resetSpeech();state=E.nextSpeaking(state);persist();render();return;}
 if(action==='save-word'){const word=el.dataset.word;try{const cards=JSON.parse(localStorage.getItem('evo.course.cards')||'[]');if(!cards.includes(word)){cards.push(word);localStorage.setItem('evo.course.cards',JSON.stringify(cards));}el.classList.add('saved');el.querySelector('b').textContent='✓';el.setAttribute('aria-label',word+' saved');}catch(_){el.classList.add('saved');}return;}
 if(action==='preview'){play(el.dataset.cue,true);return;}
 if(action==='theory-next'&&view==='intro'){introRule=Math.min(introRule+1,B.lessons[introLesson].rules.length-1);render();return;}
 if(action==='theory-back'&&view==='intro'){introRule=Math.max(introRule-1,0);render();return;}
 if(action==='intro'){theoryReturn='map';introRule=0;introLesson=Number(el.dataset.lesson);if(!E.unlocked(state,introLesson)||state.active)return;view='intro';render();return;}
 if(action==='start'){if(state.active)return;state=E.start(state,Number(el.dataset.lesson));view='exercise';hintOpen=false;persist();render();return;}
 if(action==='resume'){if(!state.active)return;view='exercise';hintOpen=false;render();return;}
 if(action==='start-listening'){state=E.startListening(state);view='exercise';persist();render();return;}
 if(action==='vocabulary-next'){prepareSpeechSuccess();state=E.enterSpeaking(state);persist();render();return;}
 if(action==='finish-lesson'){const out=E.finish(state,E.localDay());state=out.state;view=state.active?'exercise':'result';persist();render();if(out.event&&out.event!=='incomplete')play(out.event);return;}
 if(!state.active)return;const q=E.current(state);
 if(action==='choice'){updateDraft(shuffledOptions(q.options,state.active.seed,q.id)[Number(el.dataset.index)]);render(false);return;}
 if(action==='tile'){updateDraft(E.selectOrderToken(q,state.active.draft,Number(el.dataset.index)));render(false);return;}
 if(action==='remove-tile'){updateDraft(E.removeOrderToken(q,state.active.draft,Number(el.dataset.index)));render(false);return;}
 if(action==='undo'){updateDraft((state.active.draft||[]).slice(0,-1));render(false);return;}

 if(action==='check'){const out=E.submit(state);state=out.state;persist();render(false);if(out.event)play(out.event);return;}
 if(action==='next'){const out=E.next(state,E.localDay());state=out.state;hintOpen=false;view=state.active?'exercise':'result';persist();render();if(out.event)play(out.event);}
});

</script><script>(()=>{const labels={"en": ["Personal account", "Log in"], "ru": ["Личный кабинет", "Войти"], "es": ["Mi cuenta", "Iniciar sesión"], "pt": ["Minha conta", "Entrar"], "de": ["Mein Konto", "Anmelden"], "fr": ["Mon compte", "Connexion"], "it": ["Il mio account", "Accedi"], "hy": ["Անձնական հաշիվ", "Մուտք"], "zh-Hans": ["个人中心", "登录"], "ja": ["マイアカウント", "ログイン"], "ko": ["내 계정", "로그인"], "hi": ["मेरा खाता", "लॉग इन"], "bn": ["আমার অ্যাকাউন্ট", "লগ ইন"], "ur": ["میرا اکاؤنٹ", "لاگ ان"], "ar": ["حسابي", "تسجيل الدخول"], "id": ["Akun saya", "Masuk"], "tr": ["Hesabım", "Giriş yap"], "vi": ["Tài khoản", "Đăng nhập"], "kk": ["Жеке кабинет", "Кіру"], "uz": ["Shaxsiy kabinet", "Kirish"]};const select=document.getElementById("language-select");function update(){const text=labels[select.value]||labels.en;["course-account","course-login"].forEach((id,i)=>{const a=document.getElementById(id);a.querySelector("span").textContent=text[i];a.setAttribute("aria-label",text[i]);a.title=text[i];});}select.addEventListener("change",update);update();})();</script><script>(()=>{
  // Forward a real learner selection to the host page's existing translator.
  // The host retains its translation, authentication, quota and card-saving logic.
  if(window.parent===window)return;
  let timer,lastText="",lastTime=0;
  function forward(){
    const selection=window.getSelection();
    const text=(selection?.toString()||"").trim();
    if(!text||text.length>240)return;
    const node=selection.anchorNode;
    const element=node?.nodeType===1?node:node?.parentElement;
    if(element?.closest("input,textarea,select,[contenteditable=true]"))return;
    const now=Date.now();
    if(text===lastText&&now-lastTime<700)return;
    let host,hostSelection;
    try{host=window.parent.document;hostSelection=window.parent.getSelection();}catch(_){return;}
    if(!window.parent.__translatorInit||!hostSelection||host.getElementById("cards-app"))return;
    const previous=[];
    for(let i=0;i<hostSelection.rangeCount;i++)previous.push(hostSelection.getRangeAt(i).cloneRange());
    const proxy=host.createElement("span");
    proxy.textContent=text;
    proxy.setAttribute("aria-hidden","true");
    proxy.style.cssText="position:fixed;left:-10000px;top:0;opacity:0;pointer-events:none;user-select:text;";
    host.body.appendChild(proxy);
    try{
      const range=host.createRange();range.selectNodeContents(proxy);
      hostSelection.removeAllRanges();hostSelection.addRange(range);
      proxy.dispatchEvent(new window.parent.MouseEvent("mouseup",{bubbles:true,view:window.parent}));
      lastText=text;lastTime=now;
    }finally{
      hostSelection.removeAllRanges();
      for(const range of previous)try{hostSelection.addRange(range);}catch(_){}
      proxy.remove();
    }
  }
  function schedule(){clearTimeout(timer);timer=setTimeout(forward,300);}
  document.addEventListener("mouseup",schedule);
  document.addEventListener("touchend",schedule,{passive:true});
  document.addEventListener("selectionchange",schedule);
})();</script><script>(()=>{
  if(window.parent===window)return;
  let host;
  try{host=window.parent.document;}catch(_){return;}
  if(window.frameElement?.id!=="evo-a1-course-preview-frame")return;
  const sync=()=>host.body.classList.toggle("evo-a1-learning",document.body.classList.contains("is-learning"));
  const observer=new MutationObserver(sync);
  observer.observe(document.body,{attributes:true,attributeFilter:["class"]});
  sync();
  window.addEventListener("pagehide",()=>host.body.classList.remove("evo-a1-learning"));
  window.addEventListener("pageshow",sync);
})();</script></body></html>
