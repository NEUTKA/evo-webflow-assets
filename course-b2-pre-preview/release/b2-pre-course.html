d/feel/smell/taste + ADJECTIVE**               | Linking verb (= “seem”). Describes quality.        | *Your skin feels smooth.* / *He sounded nervous.*           |\n| **… + like + NOUN**                                       | Comparison with a noun.                            | *You sound like your mother.* / *This tastes like chicken.* |\n| **… + as if/as though + CLAUSE**                          | Comparison with a whole situation; formal/neutral. | *You look as if you’ve seen a ghost.*                       |\n| **… + like + CLAUSE**                                     | Informal alternative to *as if/as though*.         | *You sound like you didn’t sleep.*                          |\n| **smell/taste of + NOUN**                                 | The real ingredient/odour is present.              | *The soup smells of garlic.*                                |\n| **see/hear/feel/notice/watch + OBJECT + -ing**            | Action in progress / incomplete / repeated.        | *I saw them kissing in the park.*                           |\n| **see/hear/feel/notice/watch + OBJECT + bare infinitive** | Complete, usually short, single action.            | *We watched the runner fall.*                               |\n\n**Listen (to)** behaves like the verbs above when followed by an object: *We listened to her sing / singing.*\n\n### 4) *Seem*, *appear* & *look*\n\n- **seem/appear + ADJ** → *He seems upset.*\n- **seem like + NOUN** → *It seems like a mistake.*\n- **It seems/appears that + CLAUSE**\n- **seem/appear + to + INF** (present) / **to have + PP** (past)\\\n  *She appears to be fine.* / *He seems to have lost the file.*\n\n**Look vs seem:** *You look tired* (visual evidence). *You seem tired* (overall impression from behaviour/voice).\n\n### 5) Adjective, not adverb\n\nWhen perception verbs are linking (stative) verbs, they take an **adjective**, not an adverb—just like *be*.\n\n- ✔ *You look terrible.* ✘ *look terribly* (meaning “seem”).\n- ✔ *She felt bad after that.* ✘ *felt badly*.\n\nUse adverbs only when the verb is truly an *action* verb: *He tasted the soup carefully.*\n","audioNumber":8,"audioTitle":"The Hidden Skill Behind Good Presentations","speaker":"Sofia","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a3175411677cc3e930a79dd_ElevenLabs_2026-06-16T16_07_26_Abigail%20-%20Educational%20and%20Friendly_pvc_sp93_s30_sb46_v3.mp3","localAudio":"audio/lesson08-good-presentations.mp3","transcript":["Hi, I’m Sofia. I used to think that a good presentation depended mainly on confidence, attractive slides, and a strong voice. If someone looked relaxed and spoke without hesitation, I assumed they were a natural presenter. Then I had to give a short presentation at a professional training event, and I discovered that the most important skill was something much quieter.","The presentation was only ten minutes long, but I prepared for it as if I were giving a lecture at a conference. I designed beautiful slides, added examples, included statistics, and practised every sentence until I could almost say it from memory. I wanted to sound intelligent and well prepared. On the day itself, I was nervous, but I also felt proud of the work I had done.","The problem appeared after the first three minutes. People were looking at my slides, but not really following my argument. I could see polite faces, but very little connection. One person was reading ahead. Another was checking the printed handout. A few people looked as if they were trying to decide which detail mattered most. I kept speaking because I had practised my timing, but I realised I was delivering information instead of guiding attention.","Afterwards, a trainer gave me feedback that changed the way I understood presentations. She said, “You know your topic, but you are making the audience do too much work.” At first, I felt disappointed. I had worked hard, and the slides looked professional. But then she explained that a presenter’s job is not to prove how much they know. It is to help the audience understand what to notice, what to remember, and why it matters.","That was the hidden skill: managing attention. Good presenters are not simply confident speakers. They are careful editors. They choose what to leave out. They slow down before an important idea. They repeat a key point without sounding repetitive. They notice when the room becomes confused and adjust before people are completely lost.","A few weeks later, I watched another speaker give a presentation on a much more complicated topic. His slides were simple, almost plain. He did not use dramatic gestures or impressive language. But every few minutes, he paused and said something like, “Here is the part that matters,” or “You do not need to remember every number, but remember this comparison.” The audience relaxed because he was making the path clear.","Since then, I have changed how I prepare. I still care about facts, structure, and design, but I now ask different questions. What might confuse people? Which example will make the idea feel real? Where do they need a pause? What can I remove so the main message becomes stronger?","I have also learned that too much information can feel generous to the speaker but exhausting to the listener. When we include everything, we often protect ourselves from criticism. We think, “If someone asks, I can show that I covered it.” But a presentation is not a storage space for everything we know. It is a guided experience.","So now, when I see a great presenter, I do not only notice their confidence. I notice how carefully they protect the audience’s attention. They make difficult ideas feel possible to follow. They do not simply speak well. They help people think well. And that, in my opinion, is the real skill behind good presentations."],"mappingNote":"Source recording 08 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Sound, Impression & Attention","goal":"Describe sensory evidence accurately and distinguish a complete observed event from an action in progress.","topic":"Audience attention, sound and evidence-based feedback","languageFocus":"Linking perception verbs + adjective, like + noun, as if + clause; stative versus deliberate action; see/hear/watch + object + bare infinitive or -ing.","conversationTitle":"Discuss a presentation with Alex.","readingLabel":"SCENE + FEEDBACK","readingIntro":"Read the scene and the two comments. Recommend a change using observations and practical constraints, rather than guessing a speaker’s personality.","readingLinkLabel":"Read the scene and feedback","wordBankTitle":"Hear the sound; check its meaning.","writingGuidance":"Aim for about 120–170 words. Separate what you noticed from what you inferred; explain one practical change.","writingMaxWords":170,"theoryCards":[{"title":"Describe an impression with an adjective","text":"Linking verbs describe how something seems: “Her voice **sounds calm**.” “The room **feels crowded**.” “You **look tired**.”\n\nUse an adjective, not an adverb, for this impression: “The explanation sounded **clear**.”","tip":"An action is different: “She explained it clearly.”"},{"title":"Compare with a noun or a situation","text":"**Like + noun**: “It sounds **like a useful plan**.”\n\n**As if / as though + clause**: “You look **as if you need a break**.”\n\nIn conversation, like + clause is also common: “You sound like you’ve had a long day.”","tip":"An impression is evidence to consider; it is not proof of someone’s feelings."},{"title":"Smell and taste","text":"“The soup **tastes spicy**.” “It **smells of garlic**.” “It **tastes like chicken**.”\n\nOf can identify an actual flavour or smell. Like makes a comparison, which need not identify an ingredient.","tip":"Choose the meaning you intend; a comparison does not establish what something contains."},{"title":"Receiving an impression — or checking?","text":"Stative impression: “The sauce **tastes good**.”\n\nDeliberate action: “The cook **is tasting** the sauce.” “She **is smelling** the milk to check it.”\n\nFeel can describe a state in either form: “I feel tired” / “I’m feeling tired.”","tip":"Continuous forms depend on the meaning, not simply on the verb’s spelling."},{"title":"Can see and can hear","text":"For a present sensory experience, can is natural: “I **can hear** a strange noise.” “I **can’t see** the screen.”\n\nOther meanings allow continuous forms: “I’m **seeing** Alex tomorrow” (= meeting); “I’ve been **hearing** different accounts” (= receiving information).","tip":"Seeing someone socially is a different use from seeing a screen."},{"title":"A complete observed event","text":"**See/hear/watch + object + bare infinitive** can present an event as a whole: “I saw her **close** the laptop.”\n\nThe infinitive has no to in this pattern.\n\n“I heard him **say** the final sentence” presents the whole utterance.","tip":"This pattern does not mean every observed event must be short."},{"title":"An action in progress","text":"**See/hear/watch + object + -ing** highlights an action in progress: “I saw her **checking** the handout when I entered.”\n\nCompare: “I watched him **cross** the room” (the event as a whole) / “I noticed him **crossing** the room” (activity in progress).","tip":"The difference is viewpoint, not a rule that one form is always more certain."},{"title":"Turn impressions into useful feedback","text":"“I heard two people **whispering**, and several listeners looked **puzzled**” describes evidence.\n\n“They were bored” is an interpretation. Ask what else could explain it, then propose a change: “Could we pause after the main instruction?”","tip":"Notice the sound, consider the context and avoid turning it into a personality label."}],"tasks":[{"id":"b2g5-1","type":"choice","prompt":"Which sentence describes an impression naturally?","answer":"The explanation sounded clear.","options":["The explanation sounded clear.","The explanation sounded clearly.","The explanation sounded a clearly."],"why":"Sound is a linking verb here and takes the adjective clear.","hint":"Ask whether the verb describes an impression or an action performed in a particular way."},{"id":"b2g5-2","type":"choice","prompt":"Complete: “Her suggestion sounds ___ a practical solution.”","answer":"like","options":["like","as if","of"],"why":"Like is followed here by the noun phrase a practical solution.","hint":"Look at the form after the gap: it is a noun phrase, not a complete clause."},{"id":"b2g5-3","type":"choice","prompt":"Complete: “He looks as if he ___ a break.”","answer":"needs","options":["needs","a need","needing"],"why":"As if introduces a clause with a subject and verb.","hint":"The clause already has the subject he."},{"id":"b2g5-4","type":"choice","prompt":"The chef is deliberately checking the flavour right now. Choose the appropriate form.","answer":"The chef is tasting the sauce.","options":["The chef is tasting the sauce.","The sauce is tasting delicious.","The chef tastes like the sauce."],"why":"Tasting is an intentional action in the first sentence. An impression such as tastes delicious is normally stative.","hint":"Separate the person checking something from the food’s flavour."},{"id":"b2g5-5","type":"gap","prompt":"Use the natural present sensory expression: “I ___ hear you over the music.” (negative can)","answer":"can’t|cannot|can not","why":"Can’t hear describes an inability to receive the sound in this situation.","hint":"You are describing what your hearing allows now, not a deliberate listening action."},{"id":"b2g5-6","type":"choice","prompt":"You watched the whole action, from closing the laptop to its being shut. Which pattern presents it as a complete event?","answer":"I watched her close the laptop.","options":["I watched her close the laptop.","I watched her to close the laptop.","I watched her closed the laptop."],"why":"Watch + object + bare infinitive can present the event as a whole.","hint":"Do not add to after the object in this active perception pattern."},{"id":"b2g5-7","type":"choice","prompt":"You entered midway through a conversation. Which form highlights the activity already in progress?","answer":"I heard them discussing the result.","options":["I heard them discussing the result.","I heard them to discuss the result.","I heard they discussing the result."],"why":"Object + -ing highlights ongoing activity; them is the object form.","hint":"The question asks for the in-progress viewpoint."},{"id":"b2g5-8","type":"order","prompt":"Build a sentence describing an impression, not a confirmed cause.","answer":"You sound as if you need a pause.","why":"Sound as if introduces a clause giving an impression.","hint":"Start with the person, then sound + as if + clause."},{"id":"b2g5-9","type":"edit","prompt":"Correct the adjective after the linking verb: “The room felt comfortably.”","answer":"The room felt comfortable.","why":"The room’s impression is described with comfortable, not the action adverb comfortably.","hint":"There is no deliberate action being performed comfortably here."},{"id":"b2g5-10","type":"choice","prompt":"What does “I’m seeing Alex after lunch” most naturally mean?","answer":"I have arranged to meet Alex.","options":["I have arranged to meet Alex.","My eyesight becomes temporarily continuous.","Alex must be visible from this room now."],"why":"See has a dynamic social meaning in this arrangement.","hint":"Check whether see means perceive visually or meet someone."},{"id":"b2g5-11","type":"choice","prompt":"Which statement distinguishes observation from interpretation?","answer":"I heard a sigh after the instructions, but I don’t yet know whether it meant relief or frustration.","options":["I heard a sigh after the instructions, but I don’t yet know whether it meant relief or frustration.","A sigh always proves that someone is bored.","A loud voice always proves that the speaker is angry."],"why":"The first statement identifies the sound and leaves its meaning open to context.","hint":"One sound may have more than one plausible explanation."},{"id":"b2g5-12","type":"choice","prompt":"Which feedback combines evidence with an actionable change?","answer":"Several people were checking different pages while you spoke. Could you identify the relevant page before the example?","options":["Several people were checking different pages while you spoke. Could you identify the relevant page before the example?","You sounded like a bad presenter, so be a different person.","Everyone must have understood because your slides looked attractive."],"why":"It links observed attention to a specific change in guidance.","hint":"Look for an observed difficulty and a practical adjustment."}],"listening":[{"id":"b2l5-1","type":"choice","prompt":"What does Sofia now see as the central skill behind a good presentation?","answer":"Helping the audience manage its attention.","options":["Helping the audience manage its attention.","Showing every fact the presenter has collected.","Speaking continuously without pausing."],"why":"She shifts from the presenter’s performance to the audience’s path through the ideas.","hint":"Compare her initial assumptions with the skill named after the feedback.","evidence":"That was the hidden skill: managing attention."},{"id":"b2l5-2","type":"choice","prompt":"What was the weakness in Sofia’s preparation?","answer":"She packed and rehearsed information without making the audience’s route through it clear.","options":["She packed and rehearsed information without making the audience’s route through it clear.","She had no examples or statistics.","She intended to speak without preparing anything."],"why":"She prepared extensively, but preparation focused on delivery and coverage.","hint":"Separate how much she prepared from what that preparation achieved.","evidence":"I realised I was delivering information instead of guiding attention."},{"id":"b2l5-3","type":"choice","prompt":"Which behaviour suggested that listeners were not following one shared path?","answer":"Some read ahead or checked the handout while others seemed unsure which detail mattered.","options":["Some read ahead or checked the handout while others seemed unsure which detail mattered.","Everyone immediately asked the same precise question.","The audience refused to look at any of her material."],"why":"Different attention patterns suggested that the structure was not guiding listeners consistently.","hint":"Notice what listeners were doing, not an invented judgement of their motives.","evidence":"One person was reading ahead. Another was checking the printed handout."},{"id":"b2l5-4","type":"choice","prompt":"What did the trainer mean by making the audience do too much work?","answer":"Listeners had to work out what to notice, remember and consider important.","options":["Listeners had to work out what to notice, remember and consider important.","Listeners had been asked to design new slides during the talk.","The subject was necessarily too difficult for any audience."],"why":"The feedback concerns the guidance supplied by the presenter, not an impossible subject.","hint":"Listen to the explanation after Sofia’s first disappointment.","evidence":"It is to help the audience understand what to notice, what to remember, and why it matters."},{"id":"b2l5-5","type":"choice","prompt":"How did the later speaker help the audience?","answer":"He paused and made the important comparison explicit.","options":["He paused and made the important comparison explicit.","He used more dramatic gestures than Sofia.","He tried to make everyone remember every number."],"why":"Simple slides and selective verbal guidance made a complicated topic easier to follow.","hint":"Focus on the instructions he gave about what mattered.","evidence":"You do not need to remember every number, but remember this comparison."},{"id":"b2l5-6","type":"choice","prompt":"What can including every detail sometimes protect the speaker from?","answer":"The fear of being criticised for leaving something out.","options":["The fear of being criticised for leaving something out.","Any need to know the subject.","All possible questions about the talk."],"why":"Sofia describes comprehensive coverage as sometimes serving the speaker’s comfort rather than the audience.","hint":"Listen for the reason a speaker may feel safer when everything is included.","evidence":"When we include everything, we often protect ourselves from criticism."},{"id":"b2l5-7","type":"sequence","prompt":"Put the developments in Sofia’s account in order.","answer":["Sofia notices weak audience connection during her prepared talk.","A trainer explains the audience’s need for guidance.","Sofia observes a later speaker making a complex topic easier to follow."],"why":"The difficulty in her own presentation comes before the feedback and the later example.","hint":"Distinguish her first event, its feedback and the example a few weeks later.","evidence":"A few weeks later, I watched another speaker give a presentation on a much more complicated topic."},{"id":"b2l5-8","type":"choice","prompt":"Which new preparation question best reflects Sofia’s revised approach?","answer":"What can I remove so the main message becomes stronger?","options":["What can I remove so the main message becomes stronger?","How can I prove that I know every possible detail?","How can I avoid noticing whether the audience is confused?"],"why":"Her new questions centre on confusion, useful examples, pauses and selective editing.","hint":"Look for a question that serves the listener’s understanding.","evidence":"What can I remove so the main message becomes stronger?"}],"readingTitle":"What did the room actually need?","readingTexts":[{"title":"Scene · A community training session","text":"At the start of the session, the microphone worked only at the front of the room. Priya spoke clearly, but people at the back could not hear the first instruction. She noticed two participants whispering while she was explaining the task. One was pointing at the printed handout. A man near the door sighed, then moved to a seat closer to the front.\nThe slides looked attractive, although the example referred to page six while several listeners had page three open. When Priya closed her laptop to ask a question, the room became quiet. A participant explained that the printed pages and slides used different headings. Priya repeated the relevant heading, waited for people to find it and continued more slowly. After that, more participants joined the discussion."},{"title":"Two comments after the session","text":"Alex: I heard people whispering and thought they were being disrespectful. The speaker also sounded nervous at the start. Perhaps we need a more confident presenter next time.\nDana: I was sitting at the back. The people beside me were checking which page we needed because they had missed the instruction. The man who sighed told me he was relieved to find a seat where he could hear. We should be careful about assigning a motive to a sound.\nI heard Priya explain the final example from beginning to end, and the explanation was clear. The improvement came after she named the heading and paused. We have only fifteen minutes to prepare the next session, so redesigning the entire deck is unrealistic. I suggest testing the microphone from the back and matching the slide headings to the handout before people arrive."}],"reading":[{"id":"b2r5-1","type":"choice","prompt":"Which explanation of the whispering has the strongest support?","answer":"Participants were trying to match the instruction to the handout after missing part of it.","options":["Participants were trying to match the instruction to the handout after missing part of it.","They had decided the presenter was not worth listening to.","They were discussing a completely unrelated film."],"why":"The scene shows pointing at pages; Dana supplies the missing practical reason.","hint":"Combine the observed action with the later explanation."},{"id":"b2r5-2","type":"choice","prompt":"Why is Alex’s recommendation to replace the presenter premature?","answer":"Technical and navigation problems offer other explanations, and Priya’s adjusted explanation was clear.","options":["Technical and navigation problems offer other explanations, and Priya’s adjusted explanation was clear.","The slides prove that every listener understood from the start.","A presenter can never affect audience attention."],"why":"The evidence supports practical improvements before a sweeping personality judgement.","hint":"Use both the room conditions and what changed after the pause."},{"id":"b2r5-3","type":"choice","prompt":"Which preparation best fits the time available?","answer":"Test sound from the back and align the slide and handout headings.","options":["Test sound from the back and align the slide and handout headings.","Rewrite every slide and replace the whole printed pack.","Ask the next presenter to speak without using any examples."],"why":"Dana’s two adjustments address observed problems and fit a fifteen-minute preparation window.","hint":"Check the constraint as well as the proposed benefit."},{"id":"b2r5-4","type":"choice","prompt":"What does the man’s sigh illustrate?","answer":"A sound can be misinterpreted if the listener does not know its context.","options":["A sound can be misinterpreted if the listener does not know its context.","Sighing always means boredom.","Moving seats proves disagreement with the topic."],"why":"His explanation connected the sound to relief at finding a better place to hear.","hint":"Compare the possible interpretation with the explanation supplied later."},{"id":"b2r5-5","type":"choice","prompt":"How do the two perception patterns differ in the comments?","answer":"Whispering is presented as activity in progress; explain presents the final example as a complete observed event.","options":["Whispering is presented as activity in progress; explain presents the final example as a complete observed event.","Both forms mean that neither event was heard.","The bare infinitive proves that Priya has a permanently confident personality."],"why":"The grammar changes viewpoint, not the right to infer a whole personality.","hint":"Compare the span of activity each observer describes."},{"id":"b2r5-6","type":"choice","prompt":"Which feedback would be most useful to Priya?","answer":"Naming the heading and pausing helped people join in; next time, check sound at the back too.","options":["Naming the heading and pausing helped people join in; next time, check sound at the back too.","You need to become outgoing because one participant sighed.","The room was silent after the laptop closed, so nothing needs changing."],"why":"The feedback identifies what worked and one specific unresolved barrier.","hint":"Look for a supported positive observation and a feasible improvement."}],"vocab":[{"id":"vb2pre5-1","word":"whisper","definition":"Speak very softly so only someone nearby can hear.","example":"She whispered a question to the person beside her.","hint":"A whisper is quiet; its emotional meaning depends on context.","sourceLesson":16},{"id":"vb2pre5-2","word":"mumble","definition":"Speak too quietly or unclearly to be easily understood.","example":"He mumbled the final instruction, so I asked him to repeat it.","hint":"The central problem is unclear speech, not necessarily a quiet personality.","sourceLesson":16},{"id":"vb2pre5-3","word":"murmur","definition":"Speak in a very soft, low voice.","example":"She murmured a brief thank-you before leaving.","hint":"This describes a soft voice and can sound more literary than say.","sourceLesson":16},{"id":"vb2pre5-4","word":"chuckle","definition":"Laugh softly, often to yourself.","example":"Several listeners chuckled at the speaker’s example.","hint":"A small laugh does not by itself tell you whether someone agrees.","sourceLesson":16},{"id":"vb2pre5-5","word":"sigh","definition":"Breathe out audibly, often showing relief, tiredness or disappointment.","example":"He sighed after the technical problem was finally solved.","hint":"Use the surrounding events to interpret the sound.","sourceLesson":16},{"id":"vb2pre5-6","word":"groan","definition":"Make a deep sound expressing pain, frustration or disappointment.","example":"The audience groaned when the screen stopped working again.","hint":"A groan is a sound; the precise reason still needs evidence.","sourceLesson":16},{"id":"vb2pre5-7","word":"yell","definition":"Shout very loudly, often to get attention or express anger.","example":"She yelled across the hall because the microphone had failed.","hint":"Loudness can respond to distance or noise, not only anger.","sourceLesson":16},{"id":"vb2pre5-8","word":"sob","definition":"Cry with audible, interrupted breaths.","example":"He was sobbing and needed a moment before he could speak.","hint":"This describes audible crying, not merely speaking quietly.","sourceLesson":16}],"vocabularyQuestions":[{"id":"vb2pre5-1","type":"choice","prompt":"Two people speak extremely softly so only each other can hear. They…","answer":"whisper","options":["whisper","yell","sob"],"why":"Whisper describes very quiet speech.","hint":"A whisper is quiet; its emotional meaning depends on context."},{"id":"vb2pre5-2","type":"choice","prompt":"The words are quiet and unclear, so listeners cannot make them out. The speaker…","answer":"mumbles","options":["mumbles","chuckles","yells clearly"],"why":"Mumble highlights unclear speech, not simply a low volume.","hint":"The central problem is unclear speech, not necessarily a quiet personality."},{"id":"vb2pre5-3","type":"choice","prompt":"Choose the description meaning “said in a very soft, low voice”.","answer":"She murmured a thank-you.","options":["She murmured a thank-you.","She yelled a thank-you across the hall.","She sobbed without forming words."],"why":"Murmur can describe a softly spoken remark.","hint":"This describes a soft voice and can sound more literary than say."},{"id":"vb2pre5-4","type":"choice","prompt":"A listener gives a small, soft laugh at a friendly example. They…","answer":"chuckle","options":["chuckle","groan in pain","sob"],"why":"Chuckle describes a soft laugh; its tone comes from context.","hint":"A small laugh does not by itself tell you whether someone agrees."},{"id":"vb2pre5-5","type":"choice","prompt":"Someone breathes out audibly after a problem is solved. They…","answer":"sigh","options":["sigh","whisper a sentence","yell"],"why":"Sigh describes the breath; the context here suggests relief.","hint":"Use the surrounding events to interpret the sound."},{"id":"vb2pre5-6","type":"choice","prompt":"The screen fails again and a listener makes a deep sound of frustration. They…","answer":"groan","options":["groan","chuckle with amusement","whisper an instruction"],"why":"Groan can express frustration or disappointment.","hint":"A groan is a sound; the precise reason still needs evidence."},{"id":"vb2pre5-7","type":"choice","prompt":"The microphone fails, so someone shouts loudly to reach people across the room. They…","answer":"yell","options":["yell","murmur","sob"],"why":"Yell describes a loud shout, which need not always express anger.","hint":"Loudness can respond to distance or noise, not only anger."},{"id":"vb2pre5-8","type":"choice","prompt":"Someone cries noisily with interrupted breaths. They…","answer":"sob","options":["sob","sigh once","hum a tune"],"why":"Sob describes audible crying with disrupted breathing.","hint":"This describes audible crying, not merely speaking quietly."}],"writing":"Describe a short talk or scene in a message to Alex. Include two things you observed or heard, distinguish one impression from a confirmed explanation, and recommend a feasible change. Use a linking perception verb + adjective and a perception verb + object + bare infinitive or -ing where natural. You may invent the scene. Aim for about 120–170 words.","writingModel":"Hi Alex,\nThe training session sounded clear once everyone could hear the microphone. At first, I noticed two people whispering and saw several listeners checking different pages. I thought they might be distracted, but later I learned that the handout and slides used different headings.\nI also heard Priya explain the last example from beginning to end. She paused after naming the right heading, and more people joined the discussion. The pause seemed useful; it did not mean she lacked confidence.\nFor the next session, I suggest testing the microphone from the back and matching the headings before people arrive. We only have fifteen minutes, so those small checks seem more realistic than a full redesign. We could also ask one participant whether the instruction is easy to follow before moving on.","speaking":"Discuss conflicting presentation feedback with Alex. Describe sensory evidence, respond to an alternative explanation, recommend a feasible change and explain how you would check whether it helped. Avoid treating a sound or first impression as proof of personality.","conversation":[{"partner":"I’m reviewing a presentation. Some listeners looked confused and I heard whispering. What would you want to observe before deciding what was wrong?","goal":"Describe two useful observations and separate evidence from an assumed motive.","hint":"Think about sound, sightlines, handouts and what the speaker was doing at that moment."},{"partner":"A colleague says the presenter simply sounded nervous. Someone else says the microphone was weak. How would you respond to those different explanations?","goal":"Acknowledge both possibilities and identify evidence that could distinguish them.","hint":"Use sounds/seems as an impression, not a diagnosis of someone’s ability."},{"partner":"We have only fifteen minutes before the next session. What change would you prioritise, and why?","goal":"Recommend one feasible adjustment linked to the observed difficulty.","hint":"A small sound or navigation check can be more practical than rebuilding the entire presentation."},{"partner":"How will we know whether your change helped the audience follow the talk?","goal":"Suggest a concrete observation or question to check the effect.","hint":"Look for signs of understanding, not just silence or a confident-looking presenter."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a3175411677cc3e930a79dd_ElevenLabs_2026-06-16T16_07_26_Abigail%20-%20Educational%20and%20Friendly_pvc_sp93_s30_sb46_v3.mp3"},{"n":6,"module":0,"type":"checkpoint","title":"Checkpoint 1 · People & Communication","goal":"Check how independently you can connect ideas, describe people fairly, clarify meaning, tell a past story and interpret sensory evidence.","theory":"","theoryCards":[],"tasks":[],"listening":[],"reading":[],"vocab":[],"vocabularyQuestions":[],"conversation":[],"variants":[{"id":"A","title":"A welcome session","objective":[{"id":"b2cp6-A-g1","type":"choice","prompt":"“The room is close to the station. ___, it has step-free access.” Add another advantage.","answer":"What’s more","options":["What’s more","Otherwise","In other words"],"why":"What’s more adds a separate advantage; it is not a condition or reformulation."},{"id":"b2cp6-A-g2","type":"choice","prompt":"“We both enjoy urban photography and volunteer at a film club.” What can you reasonably say?","answer":"We have a lot in common.","options":["We have a lot in common.","We have known each other since childhood.","We always agree about everything."],"why":"The details establish shared interests, not a shared history or universal agreement."},{"id":"b2cp6-A-g3","type":"choice","prompt":"Only some volunteers have tested the route. Identify that subgroup.","answer":"The volunteers who tested the route will check the signs.","options":["The volunteers who tested the route will check the signs.","The volunteers, who tested the route, will check the signs.","The volunteers, that tested the route, will check the signs."],"why":"A defining clause selects a subgroup without commas."},{"id":"b2cp6-A-g4","type":"choice","prompt":"Complete: “The volunteer ___ notes we borrowed is here.”","answer":"whose","options":["whose","who’s","which"],"why":"Whose expresses the relationship between the volunteer and their notes."},{"id":"b2cp6-A-g5","type":"choice","prompt":"Which defining clause allows the relative pronoun to be omitted?","answer":"The guide who we interviewed sent a map.","options":["The guide who we interviewed sent a map.","The guide who interviewed us sent a map.","Rosa, who we interviewed yesterday, sent a map."],"why":"The relative pronoun is an object in the first defining clause; subject pronouns and non-defining pronouns must stay."},{"id":"b2cp6-A-g6","type":"choice","prompt":"“I wasn’t ready for the first question.” Express the same experience.","answer":"Neither was I.","options":["Neither was I.","So do I.","Neither did I."],"why":"Negative agreement repeats the past form of be."},{"id":"b2cp6-A-g7","type":"choice","prompt":"“Would you like to introduce the visitors?” Choose the usual concise positive reply.","answer":"I’d be happy to.","options":["I’d be happy to.","I’d be happy doing to.","I’d be happy to doing."],"why":"To can replace the understood infinitive introduce the visitors."},{"id":"b2cp6-A-g8","type":"choice","prompt":"The host is tired and wants to finish. You leave promptly because you do not want to…","answer":"outstay your welcome","options":["outstay your welcome","make up after an argument","hit it off immediately"],"why":"Outstay your welcome means remain longer than the host wants or considers polite."},{"id":"b2cp6-A-g9","type":"choice","prompt":"Choose the form that clearly puts the route change before the past arrival.","answer":"When we arrived, the organiser had changed the route.","options":["When we arrived, the organiser had changed the route.","When we arrived, the organiser has changed the route.","When we arrived, the organiser will have changed the route."],"why":"Past perfect places the change earlier than the past arrival."},{"id":"b2cp6-A-g10","type":"choice","prompt":"“I ___ the introduction when the microphone failed.” Show the action in progress.","answer":"was giving","options":["was giving","have given","am giving"],"why":"Past continuous gives the ongoing background to the past interruption."},{"id":"b2cp6-A-g11","type":"choice","prompt":"Choose the natural linking-verb complement.","answer":"The instructions sounded clear.","options":["The instructions sounded clear.","The instructions sounded clearly.","The instructions sounded a clearly."],"why":"An adjective describes the impression after linking sounded."},{"id":"b2cp6-A-g12","type":"choice","prompt":"Someone gives a small, soft laugh at a friendly example. They…","answer":"chuckle","options":["chuckle","sob","groan in pain"],"why":"Chuckle describes a soft laugh."},{"id":"b2cp6-A-r1","type":"choice","prompt":"Which allocation best fits the two roles and the information given?","answer":"Nora prepares the welcome notes; Dylan delivers the live introduction.","options":["Nora prepares the welcome notes; Dylan delivers the live introduction.","Dylan prepares the notes and Nora must deliver the introduction alone.","Neither person can contribute because neither is available all week."],"why":"Nora has the relevant information and can prepare remotely; Dylan is available on Saturday and has live-guiding experience."},{"id":"b2cp6-A-r2","type":"choice","prompt":"Why would excluding Nora because she left early be an unfair response to the new evidence?","answer":"She had a prior equipment commitment and has already supplied useful corrections.","options":["She had a prior equipment commitment and has already supplied useful corrections.","Leaving early always proves indifference.","Her calm writing proves that she must enjoy speaking to large groups."],"why":"The later explanation and her actual contribution challenge the assumed motive without inventing a different personality."},{"id":"b2cp6-A-r3","type":"choice","prompt":"Which final preparation deals with the documented problem and respects the plan?","answer":"Test audibility at the back and use the updated room number in the notes and introduction.","options":["Test audibility at the back and use the updated room number in the notes and introduction.","Use the old room number because it appeared on the first poster.","Ask Dylan to speak faster so visitors cannot interrupt."],"why":"The update identifies a changed room and an audibility problem; the final preparation must cover both."},{"id":"b2cp6-A-r4","type":"choice","prompt":"Which reply resolves the outstanding handover most clearly?","answer":"Nora will send the corrected notes on Friday, and Dylan will confirm receipt before Saturday’s introduction.","options":["Nora will send the corrected notes on Friday, and Dylan will confirm receipt before Saturday’s introduction.","We all know what to do, so nobody needs to confirm the notes.","Nora’s departure means that Dylan should invent the missing details."],"why":"The reply assigns the preparation and acknowledgement rather than assuming that the handover has happened."},{"id":"b2cp6-A-l1","type":"choice","prompt":"Which later action would best test an initially positive impression in the way Natalie recommends?","answer":"Notice whether the person follows through on small commitments over time.","options":["Notice whether the person follows through on small commitments over time.","Treat a warm greeting as a final decision about trust.","Avoid all further contact so the first impression cannot change."],"why":"Natalie distinguishes an immediate signal from repeated evidence.","evidence":"It grows when people do small things consistently, especially when there is no obvious reward for doing them."},{"id":"b2cp6-A-l2","type":"choice","prompt":"What does “coherent” behaviour contribute to Natalie’s judgement?","answer":"Words, attention and body language seem to fit together.","options":["Words, attention and body language seem to fit together.","The person agrees with every opinion she expresses.","The person tells the most impressive career story."],"why":"The account links coherence to matching signals, not agreement or self-promotion.","evidence":"His words, body language, and level of attention seemed to match."},{"id":"b2cp6-A-l3","type":"choice","prompt":"Which moment helped distinguish Adrian’s calm manner from a social performance?","answer":"He engaged with a disagreement and adjusted part of his view.","options":["He engaged with a disagreement and adjusted part of his view.","He avoided all discussion once somebody challenged him.","He immediately changed the topic to his contacts."],"why":"His response to challenge supplied evidence beyond a pleasant first appearance.","evidence":"He paused, asked them to explain, and changed part of his answer."},{"id":"b2cp6-A-l4","type":"choice","prompt":"Someone concludes that an impressive introduction proves reliability. Which part of Natalie’s argument challenges that conclusion?","answer":"A person can appear reliable before doing anything that demonstrates reliability.","options":["A person can appear reliable before doing anything that demonstrates reliability.","Only outgoing people can be trustworthy.","First impressions contain all the information people need."],"why":"The appearance of confidence can precede actual evidence.","evidence":"A confident person can seem reliable before they have actually done anything reliable."}],"readingTitle":"The welcome-session handover","readingTexts":[{"title":"Roles for Saturday","text":"We need corrected visitor notes by Friday afternoon and a short live introduction on Saturday at ten. Nora knows the building layout and has checked the visitor questions. She cannot attend on Saturday, but she can prepare remotely on Friday. Dylan has led several visitor groups and is free on Saturday. He has not yet seen the corrected route.\nAt the planning meeting, Nora left before the last discussion. One volunteer described her as uninterested. Dylan stayed, although he gave only a brief answer when asked to suggest an introduction."},{"title":"Update from the organiser","text":"Nora had agreed to return borrowed equipment before the other building closed. Before leaving, she sent corrections to the room numbers and offered to prepare the welcome notes. The first poster still says Room 12, but the session is now in Room 18. We must use the updated number in both the written notes and the live introduction.\nDylan later explained that he did not want to recommend a script until he knew which route was current. He is happy to introduce visitors once he receives the notes. During a trial, people at the back could not hear the first instruction, so we also need a quick audibility check.\nPlease propose who will prepare the notes, who will give the introduction and how they will confirm the handover. A complete plan should use the available evidence instead of relying on how confident or quiet somebody looked."}],"writing":"Write a message to the welcome-session team proposing the role allocation and handover. Explain the room-number update, respond fairly to the judgement about Nora and include one practical check for the audience. Use at least two useful structures from lessons 1–5 naturally, such as a relative clause, a linker, a past-time explanation or a perception pattern. Aim for about 120–170 words; the exact count is not a gate.","speaking":"Discuss a welcome session with Alex. Clarify an observation, respond to a different interpretation, explain a relevant earlier cause and agree a concrete improvement. Use lesson language naturally and respond to all four turns.","conversation":[{"partner":"A visitor said the last welcome talk was difficult to follow. What would you observe before deciding what went wrong?","goal":"Describe evidence you would check, rather than assuming a motive."},{"partner":"Another volunteer thinks the speaker was simply too reserved. Could there be a different explanation?","goal":"Respond to the alternative interpretation and explain what context matters."},{"partner":"Tell me about a time an earlier preparation mistake affected a talk or meeting. What had happened before the problem appeared?","goal":"Give a clear short timeline with an earlier cause; an invented example is acceptable."},{"partner":"We only have a short preparation window. What should we change first, and how will you confirm that it helped?","goal":"Agree a feasible action and a way to check its effect."}],"audioNumber":5,"audioTitle":"Why We Trust Some People Immediately","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a3163e30bd85049b5d31a7d_ElevenLabs_2026-06-16T14_52_29_Christina%20-%20Energetic%20Commercial%20American%20Female%20Voice.mp3","localAudio":"audio/lesson05-trust-people.mp3","trackingSlug":"listening_b2_pre_005_trust_people","transcript":["Hi, I’m Natalie. I used to think that trusting someone quickly was either a sign of good instinct or a sign of being too naive. But a few years ago, after a small professional workshop, I started to see it differently.","It was my first week in a new city, and I had signed up for an evening workshop about communication at work. I did not know anyone there, so during the coffee break I felt slightly uncomfortable. Two people started talking to me. The first was Maya. She was energetic, friendly, and very confident. Within two minutes, she was telling me about her career, her contacts, and how useful the workshop would be if I “knew how to meet the right people.”","The second person was Adrian. He was quieter. He asked what had brought me to the city, listened to my answer, and then asked one simple follow-up question. He did not try to impress me. He did not interrupt or turn the conversation back to himself. There was a kind of calm confidence in the way he spoke. Strangely, I trusted him much faster.","At first, I could not explain why. Maya had been warmer on the surface. Adrian had said less. But my reaction was not random. Trust often begins as a social shortcut. We do not have enough time to collect full evidence about every new person we meet, so our brain uses tiny signals: tone of voice, eye contact, timing, consistency, and whether someone creates pressure.","Of course, this shortcut can be wrong. A confident person can seem reliable before they have actually done anything reliable. A quiet person can seem thoughtful when they are simply uninterested. First impressions are useful, but they are not proof. They are more like a first draft of an opinion.","What made Adrian feel trustworthy was not that he smiled or agreed with me. It was that his behaviour felt coherent. His words, body language, and level of attention seemed to match. He listened without taking over the conversation. He asked questions without making me feel judged. Most importantly, he did not create too much pressure. I did not feel that he wanted something from me immediately.","Later that evening, we worked in the same discussion group. When someone disagreed with him, he did not become defensive. He paused, asked them to explain, and changed part of his answer. That small moment mattered more than anything impressive he could have said. It showed that his calm manner was not just a social performance.","A week later, he sent me the notes he had promised to share. It was a very small thing, but it slowly confirmed my first impression. That is what I think trust really needs: not just a strong beginning, but repeated small evidence.","So now, when I trust someone immediately, I do not ignore that feeling. But I also do not treat it as a final decision. I see it as a useful signal. Immediate trust can tell us that something feels safe, respectful, or natural. But real trust should be tested gently over time. It grows when people do small things consistently, especially when there is no obvious reward for doing them."]},{"id":"B","title":"A discussion evening","objective":[{"id":"b2cp6-B-g1","type":"choice","prompt":"“Please confirm by Thursday; ___, I cannot reserve the right number of seats.”","answer":"otherwise","options":["otherwise","what’s more","in other words"],"why":"Otherwise introduces the consequence if the requested confirmation does not happen."},{"id":"b2cp6-B-g2","type":"choice","prompt":"A friendship has good periods and difficult ones but continues. It…","answer":"has ups and downs","options":["has ups and downs","means you always agree","has necessarily ended"],"why":"Ups and downs describe varying positive and difficult periods."},{"id":"b2cp6-B-g3","type":"choice","prompt":"Add extra information about the already identified organiser.","answer":"Ella, who runs the book club, will welcome us.","options":["Ella, who runs the book club, will welcome us.","Ella, that runs the book club, will welcome us.","Ella, runs the book club, will welcome us."],"why":"A non-defining clause keeps a pronoun and does not use that."},{"id":"b2cp6-B-g4","type":"choice","prompt":"Complete the formal phrase: “the colleague with ___ we prepared the display”.","answer":"whom","options":["whom","who","that"],"why":"After a fronted preposition, whom is the formal relative pronoun for a person."},{"id":"b2cp6-B-g5","type":"choice","prompt":"In “She clarified the location, which prevented a wasted journey”, which refers to…","answer":"the action of clarifying the location","options":["the action of clarifying the location","only an unnamed colleague","a completely separate journey she invented"],"why":"The non-defining clause comments on the previous action as a whole."},{"id":"b2cp6-B-g6","type":"choice","prompt":"“I don’t enjoy crowded venues.” Express the same preference.","answer":"Neither do I.","options":["Neither do I.","So am I.","Neither am I."],"why":"Negative agreement with present-simple enjoy uses neither do I."},{"id":"b2cp6-B-g7","type":"choice","prompt":"The action is clear from context. Choose the grammatical short answer: “Are you going to cancel?”","answer":"I’ve decided not to.","options":["I’ve decided not to.","I’ve decided not doing.","I’ve decided no to."],"why":"Not to can stand for the repeated negative infinitive."},{"id":"b2cp6-B-g8","type":"choice","prompt":"Someone helped you prepare and you want to express appreciation. You feel…","answer":"grateful","options":["grateful","indifferent","offended"],"why":"Grateful expresses thanks for help or kindness."},{"id":"b2cp6-B-g9","type":"choice","prompt":"Show an earlier ongoing activity: “I was tired because I ___ the display all morning.”","answer":"had been preparing","options":["had been preparing","have been preparing","am preparing"],"why":"Past perfect continuous describes an earlier ongoing activity explaining a past state."},{"id":"b2cp6-B-g10","type":"choice","prompt":"Which sentence describes a former state clearly?","answer":"I used to be anxious before group discussions.","options":["I used to be anxious before group discussions.","I am used to be anxious before group discussions.","I used to being anxious before group discussions."],"why":"Used to + base form can describe a former state."},{"id":"b2cp6-B-g11","type":"choice","prompt":"You enter while the discussion is already underway. Which form highlights the ongoing action?","answer":"I heard them discussing the ending.","options":["I heard them discussing the ending.","I heard them to discuss the ending.","I heard they discussing the ending."],"why":"Hear + object + -ing presents activity in progress."},{"id":"b2cp6-B-g12","type":"choice","prompt":"A person is crying with audible, interrupted breaths. They are…","answer":"sobbing","options":["sobbing","chuckling","whispering a clear instruction"],"why":"Sob describes audible crying with interrupted breathing."},{"id":"b2cp6-B-r1","type":"choice","prompt":"Which plan suits the confirmed constraints?","answer":"Use the quiet room from 6.30, with a short display introduction and time for discussion.","options":["Use the quiet room from 6.30, with a short display introduction and time for discussion.","Begin a long lecture in the main hall at six.","Cancel the discussion because nobody can contribute."],"why":"The confirmed time, quiet-space need and purpose favour a concise introduction in the quiet room."},{"id":"b2cp6-B-r2","type":"choice","prompt":"What best explains why Amir did not speak much in the first planning meeting?","answer":"He was checking which display version was current before recommending a format.","options":["He was checking which display version was current before recommending a format.","He had decided that the club was uninteresting.","His silence proves that he cannot speak to groups."],"why":"The later message supplies a practical reason that the earlier observation did not establish."},{"id":"b2cp6-B-r3","type":"choice","prompt":"Which instruction most directly addresses the problem from the trial?","answer":"Name the relevant display heading, pause and check that people have found it.","options":["Name the relevant display heading, pause and check that people have found it.","Add every available quotation to the opening talk.","Assume a confident voice guarantees that people can follow."],"why":"The trial showed a navigation problem, not a lack of available detail."},{"id":"b2cp6-B-r4","type":"choice","prompt":"Which confirmation still needs to happen before the booking deadline?","answer":"Ella needs the final numbers on Thursday so she can reserve the seats.","options":["Ella needs the final numbers on Thursday so she can reserve the seats.","Amir needs everyone to remain until midnight.","The quiet room needs a new entrance invented by the group."],"why":"The final-number deadline matters even though the room and start time are agreed."},{"id":"b2cp6-B-l1","type":"choice","prompt":"A speaker adds pauses but still includes every irrelevant table. What further change fits Sofia’s argument?","answer":"Remove detail that distracts from the main message.","options":["Remove detail that distracts from the main message.","Keep every table so no one can criticise an omission.","Speak faster to fit in more material."],"why":"Managing attention involves selective editing as well as delivery.","evidence":"They choose what to leave out."},{"id":"b2cp6-B-l2","type":"choice","prompt":"Why does the later, more complicated talk matter to Sofia’s argument?","answer":"It shows that careful guidance can make difficult material easier to follow.","options":["It shows that careful guidance can make difficult material easier to follow.","It proves that only simple subjects can be presented well.","It shows that attractive slides are always unhelpful."],"why":"The comparison separates complexity of topic from the clarity of the audience’s path.","evidence":"The audience relaxed because he was making the path clear."},{"id":"b2cp6-B-l3","type":"choice","prompt":"Which instruction would best serve Sofia’s idea of protecting attention?","answer":"You don’t need every number; focus on what this comparison shows.","options":["You don’t need every number; focus on what this comparison shows.","Remember all the numbers before asking what they mean.","Do not pause even if the audience looks confused."],"why":"The instruction makes the relevant relationship explicit rather than demanding equal attention to every detail.","evidence":"They make difficult ideas feel possible to follow."},{"id":"b2cp6-B-l4","type":"choice","prompt":"What trade-off does Sofia identify when a speaker tries to cover everything?","answer":"It may reassure the speaker while exhausting the listener.","options":["It may reassure the speaker while exhausting the listener.","It always saves the listener from making any effort.","It removes the need to understand the audience."],"why":"Comprehensive coverage may serve the speaker’s fear of criticism at the audience’s expense.","evidence":"I have also learned that too much information can feel generous to the speaker but exhausting to the listener."}],"readingTitle":"A quieter discussion evening","readingTexts":[{"title":"Booking and format notes","text":"Ella is organising a book-club evening. The main hall is busy until 6.15, and several members want somewhere quiet enough for discussion. The smaller room is available from 6.30. Ella needs the final numbers by Thursday afternoon to reserve the seats. The event is intended as a conversation, not a lecture.\nAmir has prepared a display with several quotations and offered to introduce it. He spoke little at the first planning meeting. A member assumed this meant he had no interest in presenting, but nobody checked that interpretation at the time."},{"title":"Amir’s follow-up","text":"I’d be happy to introduce the display briefly. At the planning meeting, I was checking which version was current: the old sheet and the new one used different headings. I didn’t want to recommend a format based on the wrong version.\nDuring the trial, I noticed people turning between pages while I explained the examples. They said they could not tell which heading matched the one I mentioned. I think a two-minute introduction, with the relevant heading named clearly, would help more than a longer talk. We could then discuss the two quotations that most clearly disagree with each other.\nThe quiet room at 6.30 suits me. I can send the revised headings before Thursday lunchtime. Ella will still need everyone’s reply about attendance before she confirms the seats. I’m grateful that someone asked what my silence meant instead of treating it as a final conclusion about me."}],"writing":"Reply to Ella proposing a practical discussion-evening plan. Confirm the time and room, explain why a shorter introduction and clearer headings would help, clarify Amir’s earlier silence fairly and identify the attendance deadline. Use at least two useful structures from lessons 1–5 naturally. Aim for about 120–170 words; the exact count is not a gate.","speaking":"Negotiate a discussion-evening plan with Alex. Clarify a short answer, respond to a different interpretation of someone’s behaviour, describe an earlier preparation problem and agree a specific next step. Use lesson language naturally and respond to all four turns.","conversation":[{"partner":"Would you prefer a long introduction in a lively hall or a short one in a quieter room? Give me a reason for your preference.","goal":"State a clear preference and a relevant reason."},{"partner":"One member replied “I’d rather not”. What would you ask before deciding that they were rejecting the whole event?","goal":"Clarify the missing reference instead of assuming a motive."},{"partner":"Tell me about a time unclear materials affected a group discussion. What was happening, and what had gone wrong beforehand?","goal":"Give a short timeline with a specific earlier cause; an invented example is acceptable."},{"partner":"What will you change for this event, and what do you need the organiser to confirm?","goal":"Agree an actionable change and a clear confirmation."}],"audioNumber":8,"audioTitle":"The Hidden Skill Behind Good Presentations","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a3175411677cc3e930a79dd_ElevenLabs_2026-06-16T16_07_26_Abigail%20-%20Educational%20and%20Friendly_pvc_sp93_s30_sb46_v3.mp3","localAudio":"audio/lesson08-good-presentations.mp3","trackingSlug":"listening_b2_pre_008_good_presentations","transcript":["Hi, I’m Sofia. I used to think that a good presentation depended mainly on confidence, attractive slides, and a strong voice. If someone looked relaxed and spoke without hesitation, I assumed they were a natural presenter. Then I had to give a short presentation at a professional training event, and I discovered that the most important skill was something much quieter.","The presentation was only ten minutes long, but I prepared for it as if I were giving a lecture at a conference. I designed beautiful slides, added examples, included statistics, and practised every sentence until I could almost say it from memory. I wanted to sound intelligent and well prepared. On the day itself, I was nervous, but I also felt proud of the work I had done.","The problem appeared after the first three minutes. People were looking at my slides, but not really following my argument. I could see polite faces, but very little connection. One person was reading ahead. Another was checking the printed handout. A few people looked as if they were trying to decide which detail mattered most. I kept speaking because I had practised my timing, but I realised I was delivering information instead of guiding attention.","Afterwards, a trainer gave me feedback that changed the way I understood presentations. She said, “You know your topic, but you are making the audience do too much work.” At first, I felt disappointed. I had worked hard, and the slides looked professional. But then she explained that a presenter’s job is not to prove how much they know. It is to help the audience understand what to notice, what to remember, and why it matters.","That was the hidden skill: managing attention. Good presenters are not simply confident speakers. They are careful editors. They choose what to leave out. They slow down before an important idea. They repeat a key point without sounding repetitive. They notice when the room becomes confused and adjust before people are completely lost.","A few weeks later, I watched another speaker give a presentation on a much more complicated topic. His slides were simple, almost plain. He did not use dramatic gestures or impressive language. But every few minutes, he paused and said something like, “Here is the part that matters,” or “You do not need to remember every number, but remember this comparison.” The audience relaxed because he was making the path clear.","Since then, I have changed how I prepare. I still care about facts, structure, and design, but I now ask different questions. What might confuse people? Which example will make the idea feel real? Where do they need a pause? What can I remove so the main message becomes stronger?","I have also learned that too much information can feel generous to the speaker but exhausting to the listener. When we include everything, we often protect ourselves from criticism. We think, “If someone asks, I can show that I covered it.” But a presentation is not a storage space for everything we know. It is a guided experience.","So now, when I see a great presenter, I do not only notice their confidence. I notice how carefully they protect the audience’s attention. They make difficult ideas feel possible to follow. They do not simply speak well. They help people think well. And that, in my opinion, is the real skill behind good presentations."]}],"covers":[1,2,3,4,5],"thresholds":{"overall":0.75,"strand":0.6},"familiarAudio":true},{"n":7,"module":1,"grammarSourceNumbers":[10],"grammarTrackingSlug":"b2-pre-course-7-grammar","listeningTrackingSlug":"listening_b2_pre_002_always_available","theory":"Lesson 10: **Modals for permission, obligation, prohibition & necessity**\n\n**B2 • quick reference**\n\n### Permission: *can, could, may, might*\n\n| **Function** | **Natural patterns**                     | **Register**                                                    |\n| ------------ | ---------------------------------------- | --------------------------------------------------------------- |\n| Asking       | **Can/Could I … ?**, **May/Might I … ?** | **can** informal • **could** more polite • **may/might** formal |\n| Giving       | **You can …** / **You may …**            | **can** neutral • **may** official                              |\n| Refusing     | **You can’t …** / **You may not …**      | **may not** is formal/official                                  |\n\nPast permission: use **was/were allowed to**. The affirmative *could* is not used for one-off permission in the past (*He was allowed to leave*, not \\**He could leave* for that specific occasion).\n\n### Alternatives to modal (permission/possibility)\n\n| **Form**            | **Use**                          | **Example**                                       |\n| ------------------- | -------------------------------- | ------------------------------------------------- |\n| **be allowed to**   | rules & policies                 | *Employees are allowed to work remotely.*         |\n| **be permitted to** | formal/official                  | *It is not permitted to photograph the exhibits.* |\n| **be able to**      | possibility/ability in any tense | *You won’t be able to submit after midnight.*     |\n\nAvoid *It is allowed to…* in most contexts. Prefer *You are allowed to…* or *… is allowed*.\n\n### Obligation: *must* vs *have to*\n\n- **must** = speaker’s view/strong internal obligation: *I must stop smoking.*\n- **have to** = external requirement (rules, schedule, doctor): *I have to stop smoking.*\n- Past/other tenses typically use **have to**: *I had to cancel*, *I’ll have to leave*.\n- Informal British English: **have got to** = strong obligation now: *I’ve got to go.*\n\n### Prohibition vs. no obligation\n\n| **Meaning**   | **Form**                                                            | **Example**                          |\n| ------------- | ------------------------------------------------------------------- | ------------------------------------ |\n| Prohibited    | **mustn’t + base**                                                  | *You mustn’t share client data.*     |\n| Not necessary | **don’t/doesn’t have to + base** / **don’t/doesn’t need to + base** | *You don’t have to arrive before 7.* |\n\n**Mustn’t** ≠ **don’t have to**. The first bans an action; the second removes the need.\n\n### Necessity & lack of necessity\n\n| **Time**                       | **Positive necessity** | **Absence of necessity**           | **Example**                                                   |\n| ------------------------------ | ---------------------- | ---------------------------------- | ------------------------------------------------------------- |\n| General / now                  | **need to / have to**  | **don’t need to / don’t have to**  | *We need to confirm by Friday; you don’t need to call today.* |\n| Specific occasion (now/future) | —                      | **needn’t + base**                 | *You needn’t wash up; I’ll do it.*                            |\n| Past (not done)                | **had to**             | **didn’t need to + base**          | *I didn’t need to queue because I had a pass.*                |\n| Past (done unnecessarily)      | —                      | **needn’t have + past participle** | *You needn’t have bought flowers (but you did).*              |\n\nUse **didn’t need to** when the action was not necessary and was not done; use **needn’t have + V-ed** when it turned out unnecessary but the action happened.\n\n### *Be supposed/meant to* & *had better*\n\n- **be supposed/meant to + base** — expected/required by rules or plans: *We’re supposed to check in an hour before take-off.* Negative = not allowed/against expectations: *You aren’t meant to park here.*\n- **’d better (not) + base** — strong advice with an implied negative result: *You’d better save your work* / *You’d better not be late.* (No *hadn’t better*.)\n\n### At a glance\n\n- **Permission** — **can/could/may/might**; past: **was/were allowed to**; official notices: **be permitted to**.\n- **Obligation** — **must** (speaker’s), **have to** (external). Other tenses: **have to**/**had to**. Informal: **have got to**.\n- **Prohibition** — **mustn’t**. *Not necessary* — **don’t have to / don’t need to**.\n- **Necessity** — general: **need to / have to**; specific “not necessary now”: **needn’t**; past contrast: **didn’t need to** vs **needn’t have + V-ed**.\n","audioNumber":2,"audioTitle":"The Problem with Always Being Available","speaker":"Nadia","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a2f9a5ab79970e94da94a7c_ElevenLabs_2026-06-15T06_20_53_Arabella_pvc_sp100_s63_sb100_se78_b_m2.mp3","localAudio":"audio/lesson02-always-available.mp3","transcript":["Hi, I’m Nadia. A few years ago, I thought being available all the time was a sign of professionalism. If a manager sent a message at 9 p.m., I answered it. If a colleague asked a question during the weekend, I replied quickly. I told myself I was being helpful, reliable, and committed. In reality, I was slowly teaching people that my personal time did not need to be respected.","The strange thing is that nobody officially asked me to be available every hour of the day. There was no company rule saying that I had to answer messages after work. The pressure was more subtle than that. It came from the sound of notifications, from seeing other people reply late at night, and from the fear that silence might look lazy or uncooperative.","At first, the habit seemed harmless. A two-minute reply did not feel like a big sacrifice. But those small interruptions changed the way I rested. I could be watching a film, cooking dinner, or walking with a friend, and part of my attention was still waiting for the next message. I was physically away from work, but mentally I had never really left.","Over time, I noticed that I was becoming less focused during the actual working day. Because I was always half-connected, I rarely had long periods of deep concentration. I checked messages between tasks, during tasks, and sometimes instead of tasks. The more available I became, the less thoughtful my work became.","The turning point came after a simple mistake. I replied to an important email late at night when I was tired. I misunderstood one detail and caused confusion the next morning. Nothing terrible happened, but it made me realise that speed was not always the same as responsibility. Sometimes a slower, clearer answer is much more professional than a fast one.","After that, I started setting boundaries. I turned off most work notifications after 6:30 p.m. I stopped replying to non-urgent messages during weekends. I also added a short note to my email signature saying that I usually respond during working hours. At first, I felt uncomfortable, as if I was disappointing people. But most colleagues adjusted quickly.","The biggest change was not technical; it was psychological. I had to accept that being helpful does not mean being permanently reachable. Good communication needs clarity, not constant access. If something is truly urgent, there should be a clear process for it. Everything else can usually wait.","Now I still care about my work, but I no longer confuse availability with value. A person can be committed without being online all evening. In fact, protecting time away from work can make the time at work much better."],"mappingNote":"Source recording 02 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Rules, Permission & Boundaries","goal":"Explain what is required, forbidden and optional, and negotiate a clear exception without assuming permanent availability.","topic":"Workplace communication rules, response hours and agreed exceptions","languageFocus":"Can/could/may for permission; must/have to; must not versus no necessity; need not have versus did not need to with explicit context; be supposed to and had better.","conversationTitle":"Agree a clear boundary with Alex.","readingLabel":"POLICY + CASES","readingIntro":"Use the fictional team policy and two employee cases to decide who needs to act, what is optional and where permission is needed.","readingLinkLabel":"Read the policy and cases","wordBankTitle":"Work schedules and time away.","writingGuidance":"Aim for about 120–170 words. State normal hours, an emergency route, an owner and a workable exception.","writingMaxWords":170,"theoryCards":[{"title":"Ask for and give permission","text":"“**Can I** reply tomorrow?” is neutral. “**Could I** …?” is more polite; “**May I** …?” is more formal.\n\nGive permission with can or may: “You **can** leave after the handover.”\n\nFor a particular past permission, **was/were allowed to** is a clear choice.","tip":"Be able to describes ability or practical possibility; it is not always permission."},{"title":"Explain what is necessary","text":"“We **have to** follow the rota” often points to an external requirement. “I **must** stop checking messages at dinner” can express a strong personal commitment.\n\nThe meanings overlap. Past obligation normally uses **had to**; future obligation can use **will have to**.","tip":"Do not invent a past form musted."},{"title":"A prohibition is not a choice","text":"**Mustn’t / can’t** can prohibit an action: “You **mustn’t share** a customer password.”\n\n**Don’t have to / don’t need to** remove necessity: “You **don’t have to reply** outside your shift.” You may still choose to, if permitted.","tip":"Not necessary does not mean forbidden."},{"title":"Necessity now and later","text":"“We **need to** confirm the cover.”\n\n“You **needn’t** call tonight; tomorrow is fine.”\n\nAsk with do-support for have to / need to: “**Do we have to** attend?” “**Did you need to** wait?”","tip":"Needn’t is followed by the base verb, without to."},{"title":"Past actions and unnecessary effort","text":"“I **needn’t have replied** at midnight” means I did reply, but it was unnecessary.\n\n“I **didn’t need to reply**” says the reply was not necessary. Whether it happened depends on context: “so I left it until morning” makes non-action clear.","tip":"Do not infer that an action never happened from didn’t need to alone."},{"title":"Plans, rules and strong advice","text":"“We’re **supposed to** leave a handover note” describes an expectation or rule.\n\n“You’d **better save** the draft” gives strong advice, often with a possible bad consequence. Negative: “You’d **better not share** it.”","tip":"Had better takes a base verb, not to + verb."},{"title":"Name the exception and its owner","text":"“You don’t have to monitor the routine inbox after six. The person on the evening rota has to check the emergency channel.”\n\nA useful rule explains the normal situation and the exception. A request is not automatically an obligation just because it arrives late.","tip":"Clarify the deadline and the responsible person before accepting extra work."},{"title":"Negotiate a boundary clearly","text":"“I can finish the routine report tomorrow. If this is urgent tonight, could you confirm who is on cover?”\n\nAn explicit process allows people to switch off without pretending that genuine emergencies never happen.","tip":"Workplace rules in this lesson are fictional examples, not statements of employment law."}],"tasks":[{"id":"b2g7-1","type":"choice","prompt":"Which sentence asks politely for permission?","answer":"Could I send the routine report tomorrow morning?","options":["Could I send the routine report tomorrow morning?","You could must send the routine report tomorrow.","Could I to send the routine report tomorrow?"],"why":"Could I + base verb is a polite permission request.","hint":"After could, use the base form without to."},{"id":"b2g7-2","type":"choice","prompt":"The rota requires a handover before leaving. Which sentence clearly describes that requirement?","answer":"We have to leave a handover note.","options":["We have to leave a handover note.","We don’t have to leave a handover note.","We mustn’t leave a handover note."],"why":"Have to expresses the stated requirement; the alternatives remove or prohibit it.","hint":"Read the rule before choosing the modal meaning."},{"id":"b2g7-3","type":"choice","prompt":"The policy makes an evening reply optional. Which sentence keeps that meaning?","answer":"You don’t have to reply this evening.","options":["You don’t have to reply this evening.","You mustn’t reply this evening.","You have to reply this evening."],"why":"No necessity leaves a choice; it is neither an obligation nor a prohibition.","hint":"Optional is the key word in the situation."},{"id":"b2g7-4","type":"choice","prompt":"Sharing a customer password is prohibited. Complete: “You ___ share it.”","answer":"mustn’t","options":["mustn’t","don’t have to","needn’t"],"why":"Mustn’t expresses prohibition. The other choices mean it is unnecessary.","hint":"Choose a ban, not an absence of obligation."},{"id":"b2g7-5","type":"gap","prompt":"Use the past form of have to: “Yesterday we ___ change the rota.”","answer":"had to","why":"Had to expresses a past requirement.","hint":"The auxiliary does not have a form musted."},{"id":"b2g7-6","type":"choice","prompt":"You sent an unnecessary reply at midnight. Which sentence explicitly says that you did it?","answer":"I needn’t have replied at midnight.","options":["I needn’t have replied at midnight.","I didn’t reply at midnight.","I mustn’t reply at midnight."],"why":"Needn’t have + participle indicates an action that happened but was unnecessary.","hint":"The context says the reply was actually sent."},{"id":"b2g7-7","type":"choice","prompt":"What can you conclude from “I didn’t need to reply” without more context?","answer":"The reply was not necessary; the sentence alone does not settle whether it happened.","options":["The reply was not necessary; the sentence alone does not settle whether it happened.","The reply definitely happened.","The reply definitely never happened."],"why":"The absence of necessity is explicit; the occurrence of the action needs context.","hint":"Keep necessity separate from what actually happened."},{"id":"b2g7-8","type":"edit","prompt":"Remove the unnecessary word: “You’d better to check the deadline.”","answer":"You’d better check the deadline.|You had better check the deadline.","why":"Had better is followed by the base verb without to.","hint":"This is the strong-advice pattern."},{"id":"b2g7-9","type":"order","prompt":"Build a sentence about an expected handover.","answer":"We are supposed to confirm who is on cover.","why":"Be supposed to describes an expectation or agreed procedure.","hint":"Keep supposed to together before the base verb."},{"id":"b2g7-10","type":"choice","prompt":"Which question is grammatical?","answer":"Did you have to stay late?","options":["Did you have to stay late?","Did you had to stay late?","Had you to stayed late?"],"why":"Did carries the past tense, so have stays in the base form.","hint":"Use do-support with have to."},{"id":"b2g7-11","type":"choice","prompt":"One employee received permission to leave early on a particular day. Which is the clearest account?","answer":"She was allowed to leave early that day.","options":["She was allowed to leave early that day.","She musted leave early that day.","She was allowed leave early that day."],"why":"Was allowed to clearly expresses permission for that past occasion.","hint":"Keep to after allowed."},{"id":"b2g7-12","type":"choice","prompt":"Which reply best clarifies an after-hours request?","answer":"Is this needed tonight, and who is responsible for emergency cover?","options":["Is this needed tonight, and who is responsible for emergency cover?","Any message after six must be completed by everyone.","There can never be a real emergency outside office hours."],"why":"It checks urgency and ownership before treating the message as an obligation.","hint":"A workable boundary includes an exception process."}],"listening":[{"id":"b2l7-1","type":"choice","prompt":"How did Nadia originally interpret constant availability?","answer":"As evidence that she was professional, reliable and committed.","options":["As evidence that she was professional, reliable and committed.","As an explicit requirement in her contract.","As proof that everyone e
