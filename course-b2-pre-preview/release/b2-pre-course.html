ame."},{"id":"b2l7-5","type":"choice","prompt":"Why did a late email become a turning point?","answer":"A tired, fast response misunderstood a detail and caused confusion.","options":["A tired, fast response misunderstood a detail and caused confusion.","It resulted in a large company-wide disaster.","It proved that slow replies are always irresponsible."],"why":"The mistake challenged the equation of speed with professional responsibility.","hint":"Keep the actual scale of the incident separate from its lesson.","evidence":"I misunderstood one detail and caused confusion the next morning."},{"id":"b2l7-6","type":"choice","prompt":"Which combination describes her new boundaries?","answer":"Fewer notifications after 6.30, no routine weekend replies and a clear working-hours note.","options":["Fewer notifications after 6.30, no routine weekend replies and a clear working-hours note.","No communication with any colleague at any time.","An instant automatic answer to every request."],"why":"The changes concerned routine contact and clear expectations, not total withdrawal.","hint":"Listen for both the technical change and the message to other people.","evidence":"I also added a short note to my email signature saying that I usually respond during working hours."},{"id":"b2l7-7","type":"sequence","prompt":"Put the developments in order.","answer":["Nadia treats constant availability as a sign of commitment.","A tired late-night response causes confusion.","Nadia communicates boundaries and colleagues adjust."],"why":"The original habit precedes the mistake, which prompts the boundary-setting.","hint":"Track the starting belief, the turning point and the new practice.","evidence":"But most colleagues adjusted quickly."},{"id":"b2l7-8","type":"choice","prompt":"What is Nadia’s final position on genuine emergencies?","answer":"They need a clear process rather than permanent access to everyone.","options":["They need a clear process rather than permanent access to everyone.","They should be ignored under all circumstances.","They justify treating every routine message as urgent."],"why":"She distinguishes a real emergency from routine work that can wait.","hint":"Look for the balance between boundaries and responsibility.","evidence":"If something is truly urgent, there should be a clear process for it."}],"readingTitle":"Who actually needs to respond?","readingTexts":[{"title":"North Studio · Fictional communication policy","text":"Normal office hours are 9.00–17.00. Routine messages received outside your scheduled hours can wait until your next working period; you do not have to monitor the routine inbox at home. A message marked “urgent” by its sender does not automatically count as an emergency.\nEvening cover is listed separately on the rota. The person on cover must monitor the emergency channel between 17.00 and 21.00. A confirmed service outage is an emergency; a routine slide revision is not. If the person on cover cannot respond, the duty manager assigns a replacement. Other employees are not expected to guess who should take over.\nOvertime requires the manager’s agreement before the extra work begins. Staff on sick leave should not monitor work channels. They should follow the team’s usual absence-notification process instead."},{"title":"Two cases · Friday evening","text":"Case 1: Alex works a nine-to-five job and is not on evening cover. At 19.00, a colleague sends him a slide deck labelled “urgent”. The message asks for a cleaner colour scheme for a meeting next Tuesday. Alex has already left a handover note. He wants to switch off for the evening but worries that not replying might affect how committed he appears.\nCase 2: Jo works shifts and is on Friday’s evening cover. Before the shift, Jo calls in sick and tells the duty manager that they cannot work. At 18.30, the manager receives confirmation of a service outage. No replacement has yet been named. Another employee, Sam, notices the message but has not been assigned cover or agreed overtime.\nThe team needs a clear decision in both cases, not an assumption that every available person must respond."}],"reading":[{"id":"b2r7-1","type":"choice","prompt":"Does Alex have to revise the slides at 19.00 under this policy?","answer":"No. The request is routine and he is outside his scheduled hours without cover responsibility.","options":["No. The request is routine and he is outside his scheduled hours without cover responsibility.","Yes, because the sender wrote urgent.","Yes, because next Tuesday is mentioned."],"why":"The label does not override the policy’s definition of an emergency or Alex’s role.","hint":"Combine the type of work with the rota and normal-hours rule."},{"id":"b2r7-2","type":"choice","prompt":"Who should arrange a response to the confirmed outage when Jo is sick?","answer":"The duty manager must assign a replacement.","options":["The duty manager must assign a replacement.","Jo must monitor the channel from sick leave.","Sam automatically becomes responsible because they noticed the message."],"why":"The replacement rule and sick-leave rule identify the next owner.","hint":"Use the rule for unavailable cover, not simply who is online."},{"id":"b2r7-3","type":"choice","prompt":"Which message from Alex best follows the policy?","answer":"I can review this during my next working period; tonight’s emergency cover is for confirmed outages.","options":["I can review this during my next working period; tonight’s emergency cover is for confirmed outages.","I am forbidden ever to open a work message at home.","I must complete all requests marked urgent immediately."],"why":"The reply communicates lack of necessity without turning it into an invented ban.","hint":"Separate a permitted choice from an obligation."},{"id":"b2r7-4","type":"choice","prompt":"Can Sam assume that noticing the outage authorises extra hours?","answer":"No. The manager must allocate cover and overtime needs prior agreement.","options":["No. The manager must allocate cover and overtime needs prior agreement.","Yes. Reading a message always creates overtime permission.","No employee may ever help with an emergency."],"why":"Two practical decisions are needed: ownership and agreement to additional work.","hint":"Read the cover and overtime clauses together."},{"id":"b2r7-5","type":"choice","prompt":"Which statement about Jo is supported?","answer":"Jo followed the relevant next step by reporting illness; the policy does not require monitoring while on sick leave.","options":["Jo followed the relevant next step by reporting illness; the policy does not require monitoring while on sick leave.","Calling in sick means Jo has agreed to work the evening anyway.","Jo’s absence removes the manager’s responsibility to find cover."],"why":"The case records the notification, and the policy explains what happens next.","hint":"Distinguish notifying an absence from carrying out the shift."},{"id":"b2r7-6","type":"choice","prompt":"Which improvement would most directly prevent the uncertainty in Case 2?","answer":"Name and confirm the replacement in the emergency channel before relying on their response.","options":["Name and confirm the replacement in the emergency channel before relying on their response.","Tell all staff to stay connected indefinitely.","Remove the distinction between routine changes and outages."],"why":"It fixes the missing owner while retaining the policy’s boundary.","hint":"Identify the unresolved decision instead of expanding everyone’s obligation."}],"vocab":[{"id":"vb2pre7-1","word":"nine-to-five job","definition":"A job with regular daytime working hours, often Monday to Friday.","example":"A nine-to-five job may still involve occasional agreed exceptions.","hint":"The expression describes a regular schedule, not every possible job arrangement.","sourceLesson":4},{"id":"vb2pre7-2","word":"work shifts","definition":"Work during scheduled periods that may vary across the day or week.","example":"Support staff work shifts so the service remains covered.","hint":"Different people may be responsible at different times.","sourceLesson":4},{"id":"vb2pre7-3","word":"overtime","definition":"Time worked beyond your usual scheduled hours.","example":"Overtime must be agreed with the manager in this fictional policy.","hint":"Distinguish extra hours from the hours already on your rota.","sourceLesson":4},{"id":"vb2pre7-4","word":"burnout","definition":"Severe exhaustion linked to prolonged stress, especially at work.","example":"The team discussed workload and burnout instead of praising constant availability.","hint":"In this lesson, use the word to discuss prolonged work pressure, not to diagnose a colleague.","sourceLesson":4},{"id":"vb2pre7-5","word":"job security","definition":"Confidence that your job will continue and you are unlikely to lose it.","example":"She valued job security as well as flexibility.","hint":"This concerns keeping a job, not password security.","sourceLesson":4},{"id":"vb2pre7-6","word":"sick leave","definition":"Time away from work because you are ill.","example":"He was on sick leave and did not monitor routine messages.","hint":"This is leave because of illness, not annual holiday.","sourceLesson":4},{"id":"vb2pre7-7","word":"call in sick","definition":"Inform your employer that you cannot work because you are ill.","example":"She called in sick before her morning shift.","hint":"The phrase describes notifying work, not asking a colleague to make a medical diagnosis.","sourceLesson":4},{"id":"vb2pre7-8","word":"switch off","definition":"Stop thinking about work and relax, or turn a device off.","example":"A clear handover helped him switch off after his shift.","hint":"Here the intended meaning is mentally disconnecting from work.","sourceLesson":4}],"vocabularyQuestions":[{"id":"vb2pre7-1","type":"choice","prompt":"A role normally follows regular daytime office hours. It is a…","answer":"nine-to-five job","options":["nine-to-five job","night shift by definition","temporary emergency channel"],"why":"The expression describes a regular daytime work pattern.","hint":"The expression describes a regular schedule, not every possible job arrangement."},{"id":"vb2pre7-2","type":"choice","prompt":"Employees cover different scheduled periods across the day. They…","answer":"work shifts","options":["work shifts","all work identical nine-to-five hours","have been promoted automatically"],"why":"Shift work distributes scheduled coverage across different periods.","hint":"Different people may be responsible at different times."},{"id":"vb2pre7-3","type":"choice","prompt":"You work additional hours beyond your usual schedule. This is…","answer":"overtime","options":["overtime","sick leave","job security"],"why":"Overtime means work beyond normal scheduled hours.","hint":"Distinguish extra hours from the hours already on your rota."},{"id":"vb2pre7-4","type":"choice","prompt":"Which term describes severe exhaustion associated with prolonged work stress?","answer":"burnout","options":["burnout","a short notification","a handover note"],"why":"Burnout describes a serious pattern of exhaustion, not one moment of tiredness.","hint":"In this lesson, use the word to discuss prolonged work pressure, not to diagnose a colleague."},{"id":"vb2pre7-5","type":"choice","prompt":"Confidence that your role is likely to continue is…","answer":"job security","options":["job security","password security","overtime"],"why":"Job security concerns the continuation of employment.","hint":"This concerns keeping a job, not password security."},{"id":"vb2pre7-6","type":"choice","prompt":"An employee is away from work because of illness. They are on…","answer":"sick leave","options":["sick leave","overtime","a promotion"],"why":"Sick leave is time away because of illness.","hint":"This is leave because of illness, not annual holiday."},{"id":"vb2pre7-7","type":"choice","prompt":"You notify work that you are ill and cannot attend your shift. You…","answer":"call in sick","options":["call in sick","clock off after completing the shift","apply for a promotion"],"why":"Call in sick describes notifying an absence because of illness.","hint":"The phrase describes notifying work, not asking a colleague to make a medical diagnosis."},{"id":"vb2pre7-8","type":"choice","prompt":"A clear handover helps you stop thinking about work in your free time. It helps you…","answer":"switch off","options":["switch off","take on every extra request","stay permanently reachable"],"why":"Switch off here means mentally disconnect and relax.","hint":"Here the intended meaning is mentally disconnecting from work."}],"writing":"Write to Alex proposing a response-hours arrangement for a fictional team. State the normal hours, explain which routine replies can wait, define one genuine emergency and name an owner or replacement process. Offer a realistic way to handle an exception. Use obligation, permission and no-necessity language accurately without treating them as interchangeable. Aim for about 120–170 words.","writingModel":"Hi Alex,\nCould we agree clearer response hours for the team? Routine requests received after a person’s shift should wait until their next working period. Staff don’t have to monitor the ordinary inbox at home, and a sender’s urgent label should not automatically create an obligation.\nWe do need a route for genuine problems such as a confirmed service outage. The person on the evening rota has to monitor that channel. If they are unavailable, the duty manager should name a replacement rather than leave everyone guessing. Any extra hours would need prior agreement.\nI can help prepare a short handover template so that the person on cover has the necessary details. That should let others switch off without abandoning emergencies. Could we try the arrangement for two weeks and review any cases where the rule was unclear?","speaking":"Negotiate an after-hours request with Alex. Clarify the urgency and your role, distinguish routine work from an emergency, propose an owner and agree a workable exception. Use permission, obligation and lack of necessity accurately.","conversation":[{"partner":"A request has come in after your normal working hours. Can you help tonight? Before you answer, what would you want to know?","goal":"Ask about the real deadline, urgency and your responsibility before accepting an obligation.","hint":"A polite question can clarify whether tonight’s work is necessary."},{"partner":"The slides are for a meeting next Tuesday. The sender marked them urgent, but the service itself is working normally.","goal":"Explain whether the task needs an after-hours response and offer a realistic alternative.","hint":"Don’t have to does not mean mustn’t. You can explain what can wait and when you could do it."},{"partner":"What if a confirmed outage appears later and the scheduled person on cover is unavailable?","goal":"Propose a clear replacement process rather than leaving everyone permanently reachable.","hint":"Name who has to make the assignment and what needs to be agreed."},{"partner":"Could you write a short message explaining the normal rule and that exception to the team?","goal":"Confirm the next step and summarise the boundary without inventing a total ban on contact.","hint":"Include normal hours, an emergency definition and an owner in a concise summary."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a2f9a5ab79970e94da94a7c_ElevenLabs_2026-06-15T06_20_53_Arabella_pvc_sp100_s63_sb100_se78_b_m2.mp3"}],"audioLibrary":[{"n":5,"title":"Why We Trust Some People Immediately","speaker":"Natalie","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a3163e30bd85049b5d31a7d_ElevenLabs_2026-06-16T14_52_29_Christina%20-%20Energetic%20Commercial%20American%20Female%20Voice.mp3","transcript":["Hi, I’m Natalie. I used to think that trusting someone quickly was either a sign of good instinct or a sign of being too naive. But a few years ago, after a small professional workshop, I started to see it differently.","It was my first week in a new city, and I had signed up for an evening workshop about communication at work. I did not know anyone there, so during the coffee break I felt slightly uncomfortable. Two people started talking to me. The first was Maya. She was energetic, friendly, and very confident. Within two minutes, she was telling me about her career, her contacts, and how useful the workshop would be if I “knew how to meet the right people.”","The second person was Adrian. He was quieter. He asked what had brought me to the city, listened to my answer, and then asked one simple follow-up question. He did not try to impress me. He did not interrupt or turn the conversation back to himself. There was a kind of calm confidence in the way he spoke. Strangely, I trusted him much faster.","At first, I could not explain why. Maya had been warmer on the surface. Adrian had said less. But my reaction was not random. Trust often begins as a social shortcut. We do not have enough time to collect full evidence about every new person we meet, so our brain uses tiny signals: tone of voice, eye contact, timing, consistency, and whether someone creates pressure.","Of course, this shortcut can be wrong. A confident person can seem reliable before they have actually done anything reliable. A quiet person can seem thoughtful when they are simply uninterested. First impressions are useful, but they are not proof. They are more like a first draft of an opinion.","What made Adrian feel trustworthy was not that he smiled or agreed with me. It was that his behaviour felt coherent. His words, body language, and level of attention seemed to match. He listened without taking over the conversation. He asked questions without making me feel judged. Most importantly, he did not create too much pressure. I did not feel that he wanted something from me immediately.","Later that evening, we worked in the same discussion group. When someone disagreed with him, he did not become defensive. He paused, asked them to explain, and changed part of his answer. That small moment mattered more than anything impressive he could have said. It showed that his calm manner was not just a social performance.","A week later, he sent me the notes he had promised to share. It was a very small thing, but it slowly confirmed my first impression. That is what I think trust really needs: not just a strong beginning, but repeated small evidence.","So now, when I trust someone immediately, I do not ignore that feeling. But I also do not treat it as a final decision. I see it as a useful signal. Immediate trust can tell us that something feels safe, respectful, or natural. But real trust should be tested gently over time. It grows when people do small things consistently, especially when there is no obvious reward for doing them."],"tasks":[{"id":"b2l1-1","type":"choice","prompt":"What is Natalie’s main message?","answer":"An immediate feeling of trust can be useful, but needs evidence over time.","options":["An immediate feeling of trust can be useful, but needs evidence over time.","Confident people are usually less trustworthy than quiet people.","It is safer never to trust anyone you have just met."],"why":"She accepts the first feeling as a signal while checking it against repeated behaviour.","hint":"Listen for the position she takes at the end, rather than judging one person only.","evidence":"But I also do not treat it as a final decision. I see it as a useful signal."},{"id":"b2l1-2","type":"choice","prompt":"Why did Natalie feel uncomfortable at the beginning?","answer":"She was new to the city and did not know anyone at the workshop.","options":["She was new to the city and did not know anyone at the workshop.","She had argued with the organiser.","She had been asked to give an unprepared speech."],"why":"The unfamiliar social situation, rather than a disagreement or a speech, caused her discomfort.","hint":"Locate the setting before Maya and Adrian begin speaking.","evidence":"I did not know anyone there, so during the coffee break I felt slightly uncomfortable."},{"id":"b2l1-3","type":"choice","prompt":"Which contrast between Maya and Adrian is supported by the recording?","answer":"Maya talked about her own connections; Adrian listened and asked a follow-up.","options":["Maya talked about her own connections; Adrian listened and asked a follow-up.","Maya wanted to leave early; Adrian organised the workshop.","Maya interrupted the group; Adrian refused to discuss his work."],"why":"The comparison concerns the attention given to Natalie, not who organised the event.","hint":"Notice who the conversation is focused on.","evidence":"He did not interrupt or turn the conversation back to himself."},{"id":"b2l1-4","type":"choice","prompt":"Why does Natalie call early trust a “social shortcut”?","answer":"People use small signals before they have enough evidence about a new person.","options":["People use small signals before they have enough evidence about a new person.","People decide that everyone in the same profession is reliable.","People consciously calculate how useful each new contact will be."],"why":"Limited time makes small signals useful, although they can mislead.","hint":"Listen for the reason a shortcut is needed.","evidence":"We do not have enough time to collect full evidence about every new person we meet, so our brain uses tiny signals: tone of voice, eye contact, timing, consistency, and whether someone creates pressure."},{"id":"b2l1-5","type":"choice","prompt":"What does the recording suggest about a quiet person?","answer":"Their quietness could reflect thoughtfulness or a lack of interest.","options":["Their quietness could reflect thoughtfulness or a lack of interest.","Being quiet is reliable proof of honesty.","They are less likely to keep promises."],"why":"The same behaviour can have different explanations. Quietness alone is not proof.","hint":"Separate what someone does from your interpretation of it.","evidence":"A quiet person can seem thoughtful when they are simply uninterested."},{"id":"b2l1-6","type":"choice","prompt":"What did Adrian do when someone disagreed with him?","answer":"He asked for an explanation and revised part of his answer.","options":["He asked for an explanation and revised part of his answer.","He changed the subject to avoid tension.","He agreed immediately without asking a question."],"why":"He engaged with the disagreement instead of defending his original answer automatically.","hint":"Listen for the actions after he paused.","evidence":"He paused, asked them to explain, and changed part of his answer."},{"id":"b2l1-7","type":"sequence","prompt":"Put Natalie’s experiences in order.","answer":["Natalie meets Maya and Adrian during a break.","Adrian responds thoughtfully to a disagreement.","Adrian sends the promised notes a week later."],"why":"The break comes first, the discussion group later that evening, and the notes a week later.","hint":"Use the time references: during the break, later that evening, a week later.","evidence":"A week later, he sent me the notes he had promised to share."},{"id":"b2l1-8","type":"choice","prompt":"Why is the email with the notes important?","answer":"Keeping a small promise adds evidence to the original positive impression.","options":["Keeping a small promise adds evidence to the original positive impression.","It proves that Natalie’s first impressions are always correct.","It matters mainly because the notes help Natalie win a promotion."],"why":"The small reliable action supports her impression without making it infallible.","hint":"Focus on what the action confirms, rather than inventing a benefit of the notes.","evidence":"It was a very small thing, but it slowly confirmed my first impression."}]},{"n":21,"title":"Why First Impressions Are Hard to Change","speaker":"Oliver","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a532fee11bee0fb13b1b1b3_compress%20(2).mp3","transcript":["Hi, I’m Oliver. A few years ago, a new colleague named Adrian joined my team. On his first morning, he arrived late to our introductory meeting, gave short answers, and spent most of the time looking at his laptop. When people tried to include him in the conversation, he smiled politely but did not say much.","By lunchtime, I had already formed an opinion. I thought he was distant, overconfident, and probably not very interested in working with us.","That first impression stayed with me for several weeks. When Adrian remained quiet in meetings, I saw it as proof that he was unfriendly. When he questioned an idea, I interpreted his tone as critical. Even when he offered useful help, I assumed he was doing it because he wanted to demonstrate that he knew more than everyone else.","The interesting part is that I did not feel as though I was making assumptions. I felt as though I was observing facts. But I was selecting facts that matched the opinion I had already formed.","Later, I learned that Adrian’s first morning had been unusually difficult. His train had been cancelled, his laptop was not connecting to the company system, and English was not his first language. He was trying to follow a fast conversation while solving technical problems and remembering the names of twelve new colleagues.","Once I knew this, his behaviour looked completely different. His silence no longer seemed arrogant. It seemed cautious. His short answers did not necessarily show disinterest. They may simply have reflected the effort of speaking accurately in an unfamiliar group.","But even after learning the context, my original impression did not disappear immediately. I still noticed moments that supported it. If Adrian interrupted someone, I thought, “There it is again.” If another colleague interrupted, I barely remembered it.","This made me realise why first impressions are so powerful. They do not only influence what we think about someone. They influence what we notice next. Once we have created a story, new information is often organised around that story.","There is also an emotional reason. Changing your opinion requires you to admit that your earlier judgement may have been unfair. That can feel uncomfortable, especially if you have already shared the opinion with other people.","In my case, I had casually described Adrian as “a bit difficult” to two colleagues. After that, changing my mind felt like correcting not only a private thought but also a public position. I had to admit that I had judged him too quickly.","The change finally happened through repeated experience. Adrian helped me prepare for a complicated client call and stayed late when a technical problem appeared. He listened carefully when I explained my concerns and gave feedback without making the conversation personal. Over time, these experiences became too consistent to ignore.","We eventually became good colleagues. Adrian was not perfect, and my first impression was not completely invented. He could be direct, and he sometimes became impatient. But I had turned a few real characteristics into a complete personality.","Now, when I meet someone new, I try to separate observation from interpretation. “She did not ask any questions” is an observation. “She is not interested” is an interpretation. The interpretation may be correct, but it is not the only possible explanation.","I also try to treat first impressions as temporary working ideas rather than final conclusions. They can be useful. We often need to make quick decisions about whether a situation feels comfortable or safe. The problem begins when a quick impression becomes permanent and stops responding to new evidence.","Changing a first impression does not mean ignoring warning signs or forcing yourself to like everyone. It means leaving enough space for context, patterns, and contradiction. One moment can tell you something about a person, but it rarely tells you everything."],"tasks":[{"id":"b2l2-1","type":"choice","prompt":"What is Oliver mainly explaining?","answer":"How a first impression shaped the evidence he noticed afterwards.","options":["How a first impression shaped the evidence he noticed afterwards.","Why lateness always reveals poor professional standards.","Why quiet colleagues should avoid client-facing work."],"why":"He describes noticing and interpreting later events through an opinion he had already formed.","hint":"Focus on the process behind his judgement, rather than on Adrian’s first morning.","evidence":"They do not only influence what we think about someone. They influence what we notice next."},{"id":"b2l2-2","type":"choice","prompt":"Which is an observation from Adrian’s first morning, rather than Oliver’s interpretation?","answer":"Adrian gave short answers and looked at his laptop.","options":["Adrian gave short answers and looked at his laptop.","Adrian was overconfident.","Adrian was uninterested in working with the team."],"why":"Short answers and looking at a laptop are observable actions. The other choices assign motives or personality.","hint":"Separate what a camera could record from a judgement about its meaning.","evidence":"On his first morning, he arrived late to our introductory meeting, gave short answers, and spent most of the time looking at his laptop."},{"id":"b2l2-3","type":"choice","prompt":"Which combination made that morning especially difficult for Adrian?","answer":"Transport disruption, technical problems and following a fast conversation in a second language.","options":["Transport disruption, technical problems and following a fast conversation in a second language.","A disagreement with Oliver and a cancelled client presentation.","A lack of relevant experience and an unwillingness to use English."],"why":"The later context explains several pressures without supporting the claim that he lacked interest.","hint":"Listen for the three different demands he was managing.","evidence":"His train had been cancelled, his laptop was not connecting to the company system, and English was not his first language."},{"id":"b2l2-4","type":"choice","prompt":"Did learning the context immediately remove Oliver’s first impression?","answer":"No. He still noticed Adrian’s interruptions more than other people’s.","options":["No. He still noticed Adrian’s interruptions more than other people’s.","Yes. From then on he treated every incident identically.","No. He decided that the explanation had been invented."],"why":"Oliver explicitly describes an uneven response to the same behaviour after learning the context.","hint":"Compare his reaction to Adrian interrupting with his reaction to another colleague.","evidence":"If Adrian interrupted someone, I thought, “There it is again.” If another colleague interrupted, I barely remembered it."},{"id":"b2l2-5","type":"choice","prompt":"Why did changing his opinion carry a social cost?","answer":"He had already described Adrian negatively to two other colleagues.","options":["He had already described Adrian negatively to two other colleagues.","He would have to give up a promotion.","He had publicly promised never to work with Adrian."],"why":"Correcting his view also meant correcting a position he had shared with others.","hint":"Look for the difference between a private judgement and a public position.","evidence":"In my case, I had casually described Adrian as “a bit difficult” to two colleagues."},{"id":"b2l2-6","type":"choice","prompt":"What finally changed Oliver’s opinion most strongly?","answer":"A consistent pattern of helpful, thoughtful behaviour.","options":["A consistent pattern of helpful, thoughtful behaviour.","One apology for arriving late.","A manager’s instruction that everyone must like Adrian."],"why":"Repeated experience became harder to fit into Oliver’s original negative story.","hint":"Listen for what happened repeatedly, rather than a single dramatic moment.","evidence":"Over time, these experiences became too consistent to ignore."},{"id":"b2l2-7","type":"sequence","prompt":"Put the developments in order.","answer":["Oliver forms a negative opinion on the first day.","Oliver learns about the pressures Adrian had been facing.","Repeated cooperation changes their working relationship."],"why":"The quick judgement comes first, then the missing context, and finally a longer pattern of cooperation.","hint":"Distinguish the first day, the later explanation and repeated experience.","evidence":"We eventually became good colleagues."},{"id":"b2l2-8","type":"choice","prompt":"Which conclusion would Oliver now support?","answer":"Keep first impressions open to context and contradictory evidence.","options":["Keep first impressions open to context and contradictory evidence.","Ignore every warning sign until you know someone well.","Treat a first impression as useless information in every situation."],"why":"He allows quick impressions to be useful while warning against treating them as permanent conclusions.","hint":"Listen for the balance in his final position.","evidence":"Changing a first impression does not mean ignoring warning signs or forcing yourself to like everyone."}]},{"n":1,"title":"Why People Avoid Difficult Conversations.","speaker":"Maya","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a2f8305f789986bf2ec7d3d_ElevenLabs_2026-06-15T04_39_37_Ellen_pvc_sp100_s50_sb75_se0_b_m2.mp3","transcript":["Hi, I’m Maya. A few years ago, I believed that honest people always said what they thought. If there was a problem at work, in a friendship, or in a family, I thought the mature thing was simply to talk about it directly. Then I noticed something strange: even people who valued honesty often avoided difficult conversations. And I was one of them.","At first, I thought avoidance was just a lack of courage. But the more I observed it, the more complicated it seemed. People rarely avoid a difficult conversation because they do not care. In many cases, they care too much. They are afraid of damaging a relationship, being misunderstood, or hearing something they are not ready to accept.","A difficult conversation usually contains two problems. The first is the practical issue: a missed deadline, a broken promise, an unfair decision, or a habit that creates tension. The second is the emotional meaning behind it. When someone says, “You never listen to me,” the topic is not only listening. It may also be respect, trust, or feeling invisible.","That is why simple advice like “just be honest” is not always helpful. Honesty without timing can sound like criticism. Honesty without kindness can feel like attack. And kindness without honesty can create a fake peace that does not last. Good communication requires all three: truth, timing, and care.","I learned this during a project with a colleague named Nina. She often changed small parts of our work without telling me. At first, I said nothing because the changes were not huge. But after a few weeks, I felt frustrated and started interpreting everything she did as disrespectful. Instead of asking a clear question, I became cold and distant.","Eventually, Nina asked if something was wrong. I wanted to say, “No, everything is fine,” because that answer felt safer. But I decided to be more honest. I told her that I felt confused when changes were made without discussion, and I asked whether we could agree on a clearer process.","The conversation was uncomfortable, but it was not a disaster. Nina explained that she thought she was helping by fixing small details quickly. She had not realised that it made me feel excluded. We agreed to leave short notes before changing shared documents. The problem did not disappear forever, but the tension became much smaller.","Since then, I have stopped thinking of difficult conversations as moments of conflict. I see them more as moments of repair. They are risky because they can reveal what people really feel. But avoiding them has a cost too. Silence can protect comfort for a day, but it often damages trust over time. The goal is not to say everything immediately. The goal is to say the necessary thing before distance becomes normal."],"tasks":[{"id":"b2l3-1","type":"choice","prompt":"How has Maya’s view of difficult conversations changed?","answer":"She sees them as possible repair, while recognising the risks of both speaking and silence.","options":["She sees them as possible repair, while recognising the risks of both speaking and silence.","She thinks honest people should say every thought immediately.","She now believes that avoiding disagreement always protects trust."],"why":"Her final view balances honest repair with timing and care.","hint":"Compare her opening belief with the conclusion.","evidence":"Since then, I have stopped thinking of difficult conversations as moments of conflict. I see them more as moments of repair."},{"id":"b2l3-2","type":"choice","prompt":"Why, according to Maya, might someone avoid a difficult conversation?","answer":"They may care about the relationship and fear damaging it.","options":["They may care about the relationship and fear damaging it.","They necessarily have no interest in the other person.","They always lack the vocabulary to describe the practical issue."],"why":"Avoidance may come from caring intensely, not simply from indifference.","hint":"Listen for the reason that challenges Maya’s first explanation.","evidence":"In many cases, they care too much."},{"id":"b2l3-3","type":"choice","prompt":"What are the two layers of a difficult conversation?","answer":"A practical issue and the emotional meaning attached to it.","options":["A practical issue and the emotional meaning attached to it.","The person who speaks first and the person who wins.","An official complaint and a legal decision."],"why":"A practical action can carry an emotional meaning involving respect or trust.","hint":"The speaker distinguishes the event from what it may mean to someone.","evidence":"The first is the practical issue: a missed deadline, a broken promise, an unfair decision, or a habit that creates tension. The second is the emotional meaning behind it."},{"id":"b2l3-4","type":"choice","prompt":"What went wrong before Maya spoke to Nina?","answer":"Maya stayed silent, became frustrated and interpreted Nina’s actions as disrespectful.","options":["Maya stayed silent, became frustrated and interpreted Nina’s actions as disrespectful.","Nina refused a direct request to leave the documents unchanged.","Maya immediately explained the problem in a calm discussion."],"why":"The tension grew while the meaning Maya assigned to the changes went untested.","hint":"Notice the sequence between saying nothing and becoming distant.","evidence":"Instead of asking a clear question, I became cold and distant."},{"id":"b2l3-5","type":"choice","prompt":"How did Maya eventually raise the issue?","answer":"She explained her confusion and asked for an agreed process.","options":["She explained her confusion and asked for an agreed process.","She accused Nina of deliberately excluding her.","She announced that Nina could never edit a document again."],"why":"Her opening described the effect and sought a practical arrangement.","hint":"Listen for the difference between an accusation about motives and a request about process.","evidence":"I told her that I felt confused when changes were made without discussion, and I asked whether we could agree on a clearer process."},{"id":"b2l3-6","type":"choice","prompt":"What did Nina’s explanation reveal?","answer":"She thought she was helping and had not realised the effect on Maya.","options":["She thought she was helping and had not realised the effect on Maya.","She had been ordered to replace Maya on the project.","She had changed the files mainly to embarrass Maya."],"why":"The explanation separates Nina’s intention from Maya’s experience of the changes.","hint":"Avoid adding a motive that the recording does not state.","evidence":"Nina explained that she thought she was helping by fixing small details quickly."},{"id":"b2l3-7","type":"sequence","prompt":"Put the stages of the disagreement in order.","answer":["Small unannounced changes create growing frustration.","Maya explains the effect and asks for a clearer process.","The colleagues agree to leave notes before changing shared documents."],"why":"The changes and silence precede the conversation; the shared process is its practical outcome.","hint":"Look for the move from an unspoken interpretation to a spoken request and then an agreement.","evidence":"We agreed to leave short notes before changing shared documents."},{"id":"b2l3-8","type":"choice","prompt":"What does the final advice mean for timing?","answer":"Say what is necessary before distance becomes a normal part of the relationship.","options":["Say what is necessary before distance becomes a normal part of the relationship.","Wait until every source of uncertainty has disappeared.","Speak about every irritation immediately, regardless of circumstances."],"why":"The speaker rejects both endless silence and a rule of immediate disclosure.","hint":"Focus on the boundary between a useful pause and persistent avoidance.","evidence":"The goal is not to say everything immediately. The goal is to say the necessary thing before distance becomes normal."}]},{"n":4,"title":"The Interview That Didn’t Go as Planned.","speaker":"Natalie","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a315f09800366f3665778c5_ElevenLabs_2026-06-16T14_31_57_Jessica%20-%20Playful%2C%20Bright%2C%20Warm_pvc_sp100_s50_sb75_v3.mp3","transcript":["Hi, I’m Natalie. A few years ago, I had a job interview that I was almost certain would go well. The role was in a marketing team at a medium-sized company, and on paper it looked perfect for me. I had the right experience, I knew the industry, and I had spent several evenings preparing answers to every question I thought they might ask.","In fact, I was so prepared that I stopped listening to my own doubts. I memorised examples of successful projects, practised confident body language, and even wrote down a few impressive phrases I wanted to use. By the morning of the interview, I looked calm, but inside I was treating the meeting like a performance I had to deliver perfectly.","At first, everything seemed fine. The interviewer asked about my previous role, and I gave a clear, polished answer. Then she asked a simple question: “Can you tell me about a time when a campaign didn’t work?” I had prepared success stories, but not failure stories. I paused for too long and then gave an answer that sounded safe but empty. I described a minor problem and explained how we fixed it quickly. The interviewer listened politely, but I could feel that I had not really answered the question.","A few minutes later, she asked how I normally dealt with disagreement in a team. Again, I tried to sound professional, but I avoided anything that might make me look difficult. I said I valued communication and respected different opinions, which was true, but it was also too general. I was giving the kind of answers that belong in an interview guide, not in a real conversation.","The interview changed when the interviewer closed her notebook and said, “Natalie, your experience is strong, but I’m not sure I’ve heard how you actually think.” At first, I felt embarrassed. Then I realised she was giving me a chance, not rejecting me. So I stopped trying to be the perfect candidate.","I told her about a campaign that had failed because our team had misunderstood the audience. I explained what I had done wrong, what I had learned, and how it changed the way I looked at research. Then I talked honestly about disagreements: how I used to avoid them, and how I had learned that respectful disagreement can improve a project.","The atmosphere became much more relaxed. The interviewer asked follow-up questions, and for the first time, the interview felt like a conversation rather than an exam. I did not get the job in the end. Another candidate had more direct experience with the company’s market. But the interviewer sent me a short email saying that the second half of the conversation had been much stronger.","That interview taught me something useful. Preparation matters, but over-preparation can make you sound less genuine. Employers do not only want proof that you have succeeded. They also want to understand how you handle mistakes, uncertainty, and pressure. A good interview is not about hiding every weakness. It is about showing that you can think clearly, learn honestly, and communicate like a real person."],"tasks":[{"id":"b2l4-1","type":"choice","prompt":"What was the main weakness in Natalie’s preparation?","answer":"She prepared polished success stories more than honest accounts of setbacks.","options":["She prepared polished success stories more than honest accounts of setbacks.","She knew nothing about the company’s industry.","She had not practised answering any questions."],"why":"She had relevant experience and prepared extensively, but the preparation left a gap when asked about failure.","hint":"Distinguish the amount of preparation from its focus.","evidence":"I had prepared success stories, but not failure stories."},{"id":"b2l4-2","type":"choice","prompt":"Why was her first answer about a failed campaign unsatisfactory?","answer":"It sounded safe and avoided explaining a meaningful failure.","options":["It sounded safe and avoided explaining a meaningful failure.","It included confidential financial figures.","It was mainly a complaint about the interviewer."],"why":"A minor problem with a quick fix did not show her thinking about a real setback.","hint":"Listen for what was missing, rather than assuming a factual error.","evidence":"I paused for too long and then gave an answer that sounded safe but empty."},{"id":"b2l4-3","type":"choice","prompt":"What was wrong with saying she valued communication and different opinions?","answer":"It was too general to show how she actually handled disagreement.","options":["It was too general to show how she actually handled disagreement.","The interviewer believed that disagreement should never happen.","Natalie admitted she had never worked in a team."],"why":"The claims could be true while still failing to provide evidence of behaviour.","hint":"Separate a principle from an example of applying it.","evidence":"I said I valued communication and respected different opinions, which was true, but it was also too general."},{"id":"b2l4-4","type":"choice","prompt":"How did Natalie reinterpret the interviewer’s challenge?","answer":"As a chance to show her thinking, rather than an immediate rejection.","options":["As a chance to show her thinking, rather than an immediate rejection.","As proof that the interview had already ended.","As permission to invent a more successful campaign."],"why":"Her reinterpretation allowed her to stop performing a perfect candidate and speak more honestly.","hint":"Notice the change after her initial embarrassment.","evidence":"Then I realised she was giving me a chance, not rejecting me."},{"id":"b2l4-5","type":"choice","prompt":"What specific failure did she eventually describe?","answer":"A campaign in which the team had misunderstood the audience.","options":["A campaign in which the team had misunderstood the audience.","A campaign cancelled because she missed the interview.","A successful campaign that the interviewer wrongly criticised."],"why":"The example gave her a real decision and a lesson about research to explain.","hint":"Listen for the earlier cause of the campaign’s failure.","evidence":"I told her about a campaign that had failed because our team had misunderstood the audience."},{"id":"b2l4-6","type":"choice","prompt":"What changed in the second half of the interview?","answer":"The exchange became more relaxed and included genuine follow-up questions.","options":["The exchange became more relaxed and included genuine follow-up questions.","The interviewer stopped asking anything about mistakes.","Natalie returned to reciting only the phrases she had memorised."],"why":"Specific, honest examples changed the interaction into more of a conversation.","hint":"Focus on the relationship between her answer and the interviewer’s next questions.","evidence":"The interviewer asked follow-up questions, and for the first time, the interview felt like a conversation rather than an exam."},{"id":"b2l4-7","type":"sequence","prompt":"Put the interview’s turning points in order.","answer":["Natalie gives safe, general answers about failure and disagreement.","The interviewer asks to hear how Natalie actually thinks.","Natalie explains a real failure and a change in her approach."],"why":"The unspecific answers prompt the challenge, which then leads to a more concrete account.","hint":"Separate the problem, the intervention and the changed response.","evidence":"So I stopped trying to be the perfect candidate."},{"id":"b2l4-8","type":"choice","prompt":"Which outcome and lesson are both supported?","answer":"She did not get the job, but learned to explain how she handles mistakes and uncertainty.","options":["She did not get the job, but learned to explain how she handles mistakes and uncertainty.","She got the job because honest answers always outweigh relevant experience.","She concluded that preparing at all makes an interview worse."],"why":"The result was not a job offer; the learning concerned showing real thinking alongside preparation.","hint":"Keep the actual hiring result separate from the benefit she gained.","evidence":"I did not get the job in the end. Another candidate had more direct experience with the company’s market."}]},{"n":8,"title":"The Hidden Skill Behind Good Presentations","speaker":"Sofia","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a3175411677cc3e930a79dd_ElevenLabs_2026-06-16T16_07_26_Abigail%20-%20Educational%20and%20Friendly_pvc_sp93_s30_sb46_v3.mp3","transcript":["Hi, I’m Sofia. I used to think that a good presentation depended mainly on confidence, attractive slides, and a strong voice. If someone looked relaxed and spoke without hesitation, I assumed they were a natural presenter. Then I had to give a short presentation at a professional training event, and I discovered that the most important skill was something much quieter.","The presentation was only ten minutes long, but I prepared for it as if I were giving a lecture at a conference. I designed beautiful slides, added examples, included statistics, and practised every sentence until I could almost say it from memory. I wanted to sound intelligent and well prepared. On the day itself, I was nervous, but I also felt proud of the work I had done.","The problem appeared after the first three minutes. People were looking at my slides, but not really following my argument. I could see polite faces, but very little connection. One person was reading ahead. Another was checking the printed handout. A few people looked as if they were trying to decide which detail mattered most. I kept speaking because I had practised my timing, but I realised I was delivering information instead of guiding attention.","Afterwards, a trainer gave me feedback that changed the way I understood presentations. She said, “You know your topic, but you are making the audience do too much work.” At first, I felt disappointed. I had worked hard, and the slides looked professional. But then she explained that a presenter’s job is not to prove how much they know. It is to help the audience understand what to notice, what to remember, and why it matters.","That was the hidden skill: managing attention. Good presenters are not simply confident speakers. They are careful editors. They choose what to leave out. They slow down before an important idea. They repeat a key point without sounding repetitive. They notice when the room becomes confused and adjust before people are completely lost.","A few weeks later, I watched another speaker give a presentation on a much more complicated topic. His slides were simple, almost plain. He did not use dramatic gestures or impressive language. But every few minutes, he paused and said something like, “Here is the part that matters,” or “You do not need to remember every number, but remember this comparison.” The audience relaxed because he was making the path clear.","Since then, I have changed how I prepare. I still care about facts, structure, and design, but I now ask different questions. What might confuse people? Which example will make the idea feel real? Where do they need a pause? What can I remove so the main message becomes stronger?","I have also learned that too much information can feel generous to the speaker but exhausting to the listener. When we include everything, we often protect ourselves from criticism. We think, “If someone asks, I can show that I covered it.” But a presentation is not a storage space for everything we know. It is a guided experience.","So now, when I see a great presenter, I do not only notice their confidence. I notice how carefully they protect the audience’s attention. They make difficult ideas feel possible to follow. They do not simply speak well. They help people think well. And that, in my opinion, is the real skill behind good presentations."],"tasks":[{"id":"b2l5-1","type":"choice","prompt":"What does Sofia now see as the central skill behind a good presentation?","answer":"Helping the audience manage its attention.","options":["Helping the audience manage its attention.","Showing every fact the presenter has collected.","Speaking continuously without pausing."],"why":"She shifts from the presenter’s performance to the audience’s path through the ideas.","hint":"Compare her initial assumptions with the skill named after the feedback.","evidence":"That was the hidden skill: managing attention."},{"id":"b2l5-2","type":"choice","prompt":"What was the weakness in Sofia’s preparation?","answer":"She packed and rehearsed information without making the audience’s route through it clear.","options":["She packed and rehearsed information without making the audience’s route through it clear.","She had no examples or statistics.","She intended to speak without preparing anything."],"why":"She prepared extensively, but preparation focused on delivery and coverage.","hint":"Separate how much she prepared from what that preparation achieved.","evidence":"I realised I was delivering information instead of guiding attention."},{"id":"b2l5-3","type":"choice","prompt":"Which behaviour suggested that listeners were not following one shared path?","answer":"Some read ahead or checked the handout while others seemed unsure which detail mattered.","options":["Some read ahead or checked the handout while others seemed unsure which detail mattered.","Everyone immediately asked the same precise question.","The audience refused to look at any of her material."],"why":"Different attention patterns suggested that the structure was not guiding listeners consistently.","hint":"Notice what listeners were doing, not an invented judgement of their motives.","evidence":"One person was reading ahead. Another was checking the printed handout."},{"id":"b2l5-4","type":"choice","prompt":"What did the trainer mean by making the audience do too much work?","answer":"Listeners had to work out what to notice, remember and consider important.","options":["Listeners had to work out what to notice, remember and consider important.","Listeners had been asked to design new slides during the talk.","The subject was necessarily too difficult for any audience."],"why":"The feedback concerns the guidance supplied by the presenter, not an impossible subject.","hint":"Listen to the explanation after Sofia’s first disappointment.","evidence":"It is to help the audience understand what to notice, what to remember, and why it matters."},{"id":"b2l5-5","type":"choice","prompt":"How did the later speaker help the audience?","answer":"He paused and made the important comparison explicit.","options":["He paused and made the important comparison explicit.","He used more dramatic gestures than Sofia.","He tried to make everyone remember every number."],"why":"Simple slides and selective verbal guidance made a complicated topic easier to follow.","hint":"Focus on the instructions he gave about what mattered.","evidence":"You do not need to remember every number, but remember this comparison."},{"id":"b2l5-6","type":"choice","prompt":"What can including every detail sometimes protect the speaker from?","answer":"The fear of being criticised for leaving something out.","options":["The fear of being criticised for leaving something out.","Any need to know the subject.","All possible questions about the talk."],"why":"Sofia describes comprehensive coverage as sometimes serving the speaker’s comfort rather than the audience.","hint":"Listen for the reason a speaker may feel safer when everything is included.","evidence":"When we include everything, we often protect ourselves from criticism."},{"id":"b2l5-7","type":"sequence","prompt":"Put the developments in Sofia’s account in order.","answer":["Sofia notices weak audience connection during her prepared talk.","A trainer explains the audience’s need for guidance.","Sofia observes a later speaker making a complex topic easier to follow."],"why":"The difficulty in her own presentation comes before the feedback and the later example.","hint":"Distinguish her first event, its feedback and the example a few weeks later.","evidence":"A few weeks later, I watched another speaker give a presentation on a much more complicated topic."},{"id":"b2l5-8","type":"choice","prompt":"Which new preparation question best reflects Sofia’s revised approach?","answer":"What can I remove so the main message becomes stronger?","options":["What can I remove so the main message becomes stronger?","How can I prove that I know every possible detail?","How can I avoid noticing whether the audience is confused?"],"why":"Her new questions centre on confusion, useful examples, pauses and selective editing.","hint":"Look for a question that serves the listener’s understanding.","evidence":"What can I remove so the main message becomes stronger?"}]},{"n":2,"title":"The Problem with Always Being Available","speaker":"Nadia","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a2f9a5ab79970e94da94a7c_ElevenLabs_2026-06-15T06_20_53_Arabella_pvc_sp100_s63_sb100_se78_b_m2.mp3","transcript":["Hi, I’m Nadia. A few years ago, I thought being available all the time was a sign of professionalism. If a manager sent a message at 9 p.m., I answered it. If a colleague asked a question during the weekend, I replied quickly. I told myself I was being helpful, reliable, and committed. In reality, I was slowly teaching people that my personal time did not need to be respected.","The strange thing is that nobody officially asked me to be available every hour of the day. There was no company rule saying that I had to answer messages after work. The pressure was more subtle than that. It came from the sound of notifications, from seeing other people reply late at night, and from the fear that silence might look lazy or uncooperative.","At first, the habit seemed harmless. A two-minute reply did not feel like a big sacrifice. But those small interruptions changed the way I rested. I could be watching a film, cooking dinner, or walking with a friend, and part of my attention was still waiting for the next message. I was physically away from work, but mentally I had never really left.","Over time, I noticed that I was becoming less focused during the actual working day. Because I was always half-connected, I rarely had long periods of deep concentration. I checked messages between tasks, during tasks, and sometimes instead of tasks. The more available I became, the less thoughtful my work became.","The turning point came after a simple mistake. I replied to an important email late at night when I was tired. I misunderstood one detail and caused confusion the next morning. Nothing terrible happened, but it made me realise that speed was not always the same as responsibility. Sometimes a slower, clearer answer is much more professional than a fast one.","After that, I started setting boundaries. I turned off most work notifications after 6:30 p.m. I stopped replying to non-urgent messages during weekends. I also added a short note to my email signature saying that I usually respond during working hours. At first, I felt uncomfortable, as if I was disappointing people. But most colleagues adjusted quickly.","The biggest change was not technical; it was psychological. I had to accept that being helpful does not mean being permanently reachable. Good communication needs clarity, not constant access. If something is truly urgent, there should be a clear process for it. Everything else can usually wait.","Now I still care about my work, but I no longer confuse availability with value. A person can be committed without being online all evening. In fact, protecting time away from work can make the time at work much better."],"tasks":[{"id":"b2l7-1","type":"choice","prompt":"How did Nadia originally interpret constant availability?","answer":"As evidence that she was professional, reliable and committed.","options":["As evidence that she was professional, reliable and committed.","As an explicit requirement in her contract.","As proof that everyone else worked too slowly."],"why":"Her original interpretation concerned professionalism, although no official all-hours rule existed.","hint":"Distinguish her belief from an actual company requirement.","evidence":"I told myself I was being helpful, reliable, and committed."},{"id":"b2l7-2","type":"choice","prompt":"Where did the pressure come from?","answer":"Notifications, other people’s late replies and worry about how silence would look.","options":["Notifications, other people’s late replies and worry about how silence would look.","A formal rule demanding a reply every hour.","A technical system that prevented her from disconnecting."],"why":"The pressure was social and psychological rather than the stated company rule.","hint":"Look for the sources of the subtle pressure.","evidence":"It came from the sound of notifications, from seeing other people reply late at night, and from the fear that silence might look lazy or uncooperative."},{"id":"b2l7-3","type":"choice","prompt":"How did short interruptions affect her time away from work?","answer":"Part of her attention remained ready for the next message.","options":["Part of her attention remained ready for the next message.","They helped her stop thinking about work completely.","They only affected the two minutes spent typing."],"why":"The effect continued beyond each short reply.","hint":"Compare the duration of the message with its effect on attention.","evidence":"I was physically away from work, but mentally I had never really left."},{"id":"b2l7-4","type":"choice","prompt":"What happened to her concentration at work?","answer":"Constant partial connection made sustained focus harder.","options":["Constant partial connection made sustained focus harder.","Replying at all hours created longer periods of deep concentration.","Only her colleagues’ work was affected."],"why":"She describes checking messages during and instead of tasks.","hint":"Listen for the effect during the actual working day.","evidence":"The more available I became, the less thoughtful my work became."},{"id":"b2l7-5","type":"choice","prompt":"Why did a late email become a turning point?","answer":"A tired, fast response misunderstood a detail and caused confusion.","options":["A tired, fast response misunderstood a detail and caused confusion.","It resulted in a large company-wide disaster.","It proved that slow replies are always irresponsible."],"why":"The mistake challenged the equation of speed with professional responsibility.","hint":"Keep the actual scale of the incident separate from its lesson.","evidence":"I misunderstood one detail and caused confusion the next morning."},{"id":"b2l7-6","type":"choice","prompt":"Which combination describes her new boundaries?","answer":"Fewer notifications after 6.30, no routine weekend replies and a clear working-hours note.","options":["Fewer notifications after 6.30, no routine weekend replies and a clear working-hours note.","No communication with any colleague at any time.","An instant automatic answer to every request."],"why":"The changes concerned routine contact and clear expectations, not total withdrawal.","hint":"Listen for both the technical change and the message to other people.","evidence":"I also added a short note to my email signature saying that I usually respond during working hours."},{"id":"b2l7-7","type":"sequence","prompt":"Put the developments in order.","answer":["Nadia treats constant availability as a sign of commitment.","A tired late-night response causes confusion.","Nadia communicates boundaries and colleagues adjust."],"why":"The original habit precedes the mistake, which prompts the boundary-setting.","hint":"Track the starting belief, the turning point and the new practice.","evidence":"But most colleagues adjusted quickly."},{"id":"b2l7-8","type":"choice","prompt":"What is Nadia’s final position on genuine emergencies?","answer":"They need a clear process rather than permanent access to everyone.","options":["They need a clear process rather than permanent access to everyone.","They should be ignored under all circumstances.","They justify treating every routine message as urgent."],"why":"She distinguishes a real emergency from routine work that can wait.","hint":"Look for the balance between boundaries and responsibility.","evidence":"If something is truly urgent, there should be a clear process for it."}]}],"hints":{"vb2pre1-1":"We want to meet socially. Choose the phrase for arranging a meeting.","vb2pre1-2":"Think of relaxed time together, rather than a formal appointment.","vb2pre1-3":"This describes a person’s usual behaviour, not the size of their social circle.","vb2pre1-4":"Look for movement between many social groups.","vb2pre1-5":"Think about how the connection began.","vb2pre1-6":"Think of an ongoing relationship, not necessarily an instant connection.","vb2pre1-7":"Look for shared interests or experiences.","vb2pre1-8":"Here the phrase describes the history of a relationship, not travel.","vb2pre2-1":"Quiet behaviour does not tell you whether someone cares.","vb2pre2-2":"Separate certainty about your own ability from judging other people.","vb2pre2-3":"Look for an interest in understanding, not just a lack of certainty.","vb2pre2-4":"This is a lack of concern, not simply a quiet way of speaking.","vb2pre2-5":"The feeling involves perceived disrespect.","vb2pre2-6":"The person needs an explanation rather than reassurance about success.","vb2pre2-7":"Think about someone’s position in a disagreement.","vb2pre2-8":"Look for a response to something helpful.","vb2pre3-1":"The person is saying no to a proposed event.","vb2pre3-2":"Think about ending the evening, not making a telephone call.","vb2pre3-3":"Consider the host’s comfort, not only how long you want to stay.","vb2pre3-4":"This is figurative relaxation, not a hairstyle instruction.","vb2pre3-5":"The phrase describes different views, not necessarily a broken relationship.","vb2pre3-6":"Here the phrase is about repairing a relationship, not inventing a story.","vb2pre3-7":"The change is gradual; no single argument is necessary.","vb2pre3-8":"Think of changing periods rather than a permanent failure.","vb2pre4-1":"The feeling involves worry about an uncertain event or outcome.","vb2pre4-2":"Focus on tension in a demanding situation; it can overlap with anxious.","vb2pre4-3":"Something that was worrying you has become less of a problem.","vb2pre4-4":"Compare an expected result with the actual one.","vb2pre4-5":"The central idea is more than someone feels able to cope with.","vb2pre4-6":"The event is unexpected enough to interrupt your normal response.","vb2pre4-7":"Learn the phrase with in before the area of work.","vb2pre4-8":"This is advancement within work, not simply being hired for the first time.","vb2pre5-1":"A whisper is quiet; its emotional meaning depends on context.","vb2pre5-2":"The central problem is unclear speech, not necessarily a quiet personality.","vb2pre5-3":"This describes a soft voice and can sound more literary than say.","vb2pre5-4":"A small laugh does not by itself tell you whether someone agrees.","vb2pre5-5":"Use the surrounding events to interpret the sound.","vb2pre5-6":"A groan is a sound; the precise reason still needs evidence.","vb2pre5-7":"Loudness can respond to distance or noise, not only anger.","vb2pre5-8":"This describes audible crying, not merely speaking quietly.","vb2pre7-1":"The expression describes a regular schedule, not every possible job arrangement.","vb2pre7-2":"Different people may be responsible at different times.","vb2pre7-3":"Distinguish extra hours from the hours already on your rota.","vb2pre7-4":"In this lesson, use the word to discuss prolonged work pressure, not to diagnose a colleague.","vb2pre7-5":"This concerns keeping a job, not password security.","vb2pre7-6":"This is leave because of illness, not annual holiday.","vb2pre7-7":"The phrase describes notifying work, not asking a colleague to make a medical diagnosis.","vb2pre7-8":"Here the intended meaning is mentally disconnecting from work."},"audioTranscriptMatchVerified":false};</script>
<script>(function(root){'use strict';
function validate(data){const f=data?.feedback;const ratings=['good','almost','needs_work'];if(!data?.ok||!f||!ratings.includes(f.overall_rating))throw Error('AI returned an incomplete review. Please try again.');for(const key of ['task_completion','grammar','vocabulary','clarity'])if(!ratings.includes(f[key]?.rating)||typeof f[key]?.feedback!=='string')throw Error('AI returned an incomplete review. Please try again.');for(const key of ['positive','next_step','improved_version'])if(typeof f[key]!=='string')throw Error('AI returned an incomplete review. Please try again.');if(!Array.isArray(f.corrections)||f.corrections.length>20||f.corrections.some(c=>['original','correction','explanation'].some(k=>typeof c[k]!=='string')))throw Error('AI returned invalid corrections. Please try again.');return f;}
async function call(body){let sb;try{const host=root.parent;sb=host?.supabaseClient||host?.evoSupabase||host?.supabase||host?.sb;}catch(_){throw Error('Open the course in its Evo-English host page and log in to use AI feedback.');}if(!sb?.auth?.getSession||!sb?.functions?.invoke)throw Error('Open this course on Evo-English and log in to use AI feedback.');const {data,error}=await sb.auth.getSession();if(error||!data?.session?.user?.id||data.session.user.is_anonymous)throw Error('Please log in to use AI feedback.');let timer;try{const result=await Promise.race([sb.functions.invoke('assistant_rest',{body}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('AI is taking too long. Your answer is saved; please try again.')),90000);})]);if(result.error){const status=result.error.context?.status;if(status===401||status===403)throw Error('Please log in again to use AI feedback.');if(status===429)throw Error('AI usage limit reached. Please try again later.');throw Error('AI could not review this answer. Your text is saved; please try again.');}return result.data;}finally{clearTimeout(timer);}}
async function review(lesson,kind,text){const speaking=kind==='speaking';const data=await call({action:'writing_feedback',level:'B2',lesson_slug:`b2-pre-course-${lesson.n}-${kind}`,lesson_title:lesson.title,topic:lesson.topic||'Meeting new people and arranging a follow-up',text_type:speaking?'Four-turn scripted roleplay. Evaluate LEARNER replies only, including relevance to ALEX. Do not evaluate the partner lines or infer pronunciation':'Short learner text',writing_skill:speaking?'Express ideas using the lesson grammar in spoken English':'Write a clear connected text using the lesson grammar',learning_objective:lesson.goal,task:speaking?lesson.speaking:lesson.writing,target_min_words:0,target_max_words:speaking?350:(lesson.writingMaxWords||150),language_focus:lesson.languageFocus||('B2 discourse markers: topic changes, addition, correction, clarification, contrast and results. Social connection vocabulary. '+lesson.goal),requirements:[speaking?'Evaluate the words in this transcript; do not infer pronunciation, recording duration or fluency.':'Use the target grammar naturally, with relevant supporting details.','Give concise feedback suitable for a mobile screen. Focus on 1–3 important corrections. Accept other grammatically valid ways to meet the task.',...(lesson.reviewRequirements||[])],text});return validate(data);}
async function transcribe(blob){if(!blob||blob.size===0)throw Error('Please record your answer first.');if(blob.size>8*1024*1024)throw Error('Please use a shorter recording, up to 90 seconds.');const audio_base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Could not read the recording.'));reader.readAsDataURL(blob);});const data=await call({action:'stt',transcription_language:'en',audio_base64,mime:blob.type.split(';')[0]||'audio/webm'});if(typeof data?.text!=='string'||!data.text.trim())throw Error('No speech was recognised. Please record again or type your spoken answer.');return data.text.trim();}
root.B2_AI={review,transcribe,validate};
})(globalThis);
</script>
