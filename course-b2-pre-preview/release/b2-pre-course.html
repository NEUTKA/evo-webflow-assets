om a new ongoing expectation."}],"vocab":[{"id":"vb2pre11-1","word":"qualifications","definition":"Certificates, degrees or other evidence of training and competence for a role.","example":"The advert accepts relevant qualifications or equivalent practical experience.","hint":"Check the stated requirement rather than assuming every role needs the same certificate.","sourceLesson":4},{"id":"vb2pre11-2","word":"apprenticeship","definition":"A structured period of learning a job through work and training with experienced people.","example":"She completed an apprenticeship with an experienced technician.","hint":"The focus is learning a job through a work-based training programme.","sourceLesson":4},{"id":"vb2pre11-3","word":"job vacancy","definition":"A position that an organisation wants to fill.","example":"Rina will approve the job vacancy notice before it is published.","hint":"A vacancy is an available role, not someone who already holds it.","sourceLesson":4},{"id":"vb2pre11-4","word":"do work experience","definition":"Spend a period in a workplace to learn about a job.","example":"He did work experience in the centre’s office.","hint":"Work experience can describe a learning placement; it does not itself prove every required skill.","sourceLesson":4},{"id":"vb2pre11-5","word":"do an internship","definition":"Complete a period of practical work, often connected with study or career preparation.","example":"She did an internship and practised preparing meeting notes.","hint":"Use an with the countable noun internship.","sourceLesson":4},{"id":"vb2pre11-6","word":"perks","definition":"Extra advantages associated with a job; often informal.","example":"Free use of the centre’s gym is one of the advertised perks.","hint":"Perks are extra advantages; their exact scope depends on the offer.","sourceLesson":4},{"id":"vb2pre11-7","word":"benefits","definition":"Non-salary provisions included with a job, such as an employer’s pension contribution.","example":"The benefits are listed separately from the optional gym discount.","hint":"The terms benefits and perks can overlap; read how the particular offer defines them.","sourceLesson":4},{"id":"vb2pre11-8","word":"bonus","definition":"An additional payment on top of regular pay.","example":"The fictional advert says that a bonus is discretionary, not guaranteed.","hint":"Do not treat a possible bonus as part of guaranteed salary.","sourceLesson":4}],"vocabularyQuestions":[{"id":"vb2pre11-1","type":"choice","prompt":"Certificates and evidence of training relevant to a role are…","answer":"qualifications","options":["qualifications","perks","vacancies"],"why":"Qualifications provide evidence of learning or competence.","hint":"Check the stated requirement rather than assuming every role needs the same certificate."},{"id":"vb2pre11-2","type":"choice","prompt":"A structured work-based programme for learning a job is an…","answer":"apprenticeship","options":["apprenticeship","automatic bonus","unfilled vacancy"],"why":"An apprenticeship combines work and training for a role.","hint":"The focus is learning a job through a work-based training programme."},{"id":"vb2pre11-3","type":"choice","prompt":"An organisation advertises a position it wants to fill. This is a…","answer":"job vacancy","options":["job vacancy","person already appointed","guaranteed benefit"],"why":"A vacancy is an available position.","hint":"A vacancy is an available role, not someone who already holds it."},{"id":"vb2pre11-4","type":"choice","prompt":"A learner spends a short period in an office to find out about the work. They…","answer":"do work experience","options":["do work experience","receive guaranteed promotion","own every office task"],"why":"Work experience can describe a learning placement.","hint":"Work experience can describe a learning placement; it does not itself prove every required skill."},{"id":"vb2pre11-5","type":"choice","prompt":"Which phrase correctly names completing a practical placement?","answer":"do an internship","options":["do an internship","do an internshipping","do a qualifications"],"why":"Internship is countable and takes an here.","hint":"Use an with the countable noun internship."},{"id":"vb2pre11-6","type":"choice","prompt":"The advert calls an optional gym discount an extra advantage. It is one of the…","answer":"perks","options":["perks","required qualifications","missing applications"],"why":"Perks are extra advantages; the advert defines the example here.","hint":"Perks are extra advantages; their exact scope depends on the offer."},{"id":"vb2pre11-7","type":"choice","prompt":"The offer lists non-salary provisions separately from optional extras. It calls them…","answer":"benefits","options":["benefits","job vacancies","application checklists"],"why":"Benefits can include non-salary provisions accompanying a role.","hint":"The terms benefits and perks can overlap; read how the particular offer defines them."},{"id":"vb2pre11-8","type":"choice","prompt":"An additional payment on top of regular pay is a…","answer":"bonus","options":["bonus","placement","certificate"],"why":"A bonus is extra pay; whether it is guaranteed depends on the terms.","hint":"Do not treat a possible bonus as part of guaranteed salary."}],"writing":"Write a handover for a fictional team. Rina and Sam share a guide, but each keeps a separate checklist. Rina approves the advert on Wednesday morning; Sam sends it after approval; Jo records applications and asks for missing evidence. Explain whose document and decision each is, and how the next person will know they can act. Include a limited offer to help with this week’s meeting notes without accepting all future notes. Aim for about 120–170 words.","writingModel":"Hi team,\nRina and Sam’s shared guide is in the team folder, while Rina’s and Sam’s checklists should remain separate. Rina will approve the advert on Wednesday morning. Sam, please wait for her confirmation before sending the notice, rather than treating the shared draft as an approved version.\nJo will record applications and ask candidates to describe any missing responsibilities from a placement. The centre’s requirement permits equivalent practical experience, but Rina owns that decision once the evidence is complete. Please note who has received each update so that the next person does not need to guess.\nI can prepare this week’s meeting notes if we confirm which task I should delay. That offer covers this meeting only. Could we agree a rotation for later meetings instead of assuming one person will always do them?","speaking":"Negotiate responsibility for recurring meeting notes with Alex. Clarify the task, distinguish shared resources from separate responsibilities, offer bounded help and confirm the next owner.","conversation":[{"partner":"You prepared the last meeting’s notes. Could you do them again and keep doing them each week?","goal":"Clarify the recurring request and your available capacity before agreeing.","hint":"Separate a one-off offer from an ongoing responsibility."},{"partner":"We share the meeting guide, so doesn’t that mean everybody owns all of the follow-up tasks?","goal":"Distinguish a shared resource from named decision and action owners.","hint":"Possession can identify a document; it does not itself assign every task."},{"partner":"The next meeting is tomorrow. I still need help, but I cannot change all your deadlines.","goal":"Make one feasible limited offer and explain what must be agreed.","hint":"Name the part you can do and avoid an unlimited promise."},{"partner":"All right. Who will approve the notes, send them and organise responsibility for future meetings?","goal":"Confirm explicit owners and a handover rather than leaving an ambiguous they.","hint":"Say whose decision it is and who acts after confirmation."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a32c3e2cf446cb0ca1f9fd4_ElevenLabs_2026-06-17T15_45_45_Joseff%20Novak%20-%20Calm%20and%20Professional_pvc_sp98_s60_sb75_v3.mp3"},{"n":12,"module":1,"type":"checkpoint","checkpointNumber":2,"domain":"WORK & LEARNING","title":"Checkpoint 2 · Work & Learning","goal":"Check independent use of rules, useful advice, learning plans, cause and result language, and clear responsibility, with earlier communication skills.","languageFocus":"B2 module 2: permission and necessity; verb-object patterns; gerund/infinitive meaning; cause, purpose and result; possessives and compounds. Integrate earlier relative clauses, narrative sequence, concise responses and evidence-based interpretation.","coverageNote":"13 of the 20 objective questions focus on lessons 7–11; 7 revisit communication skills from lessons 1–5. Recordings are familiar; questions are new.","theory":"","theoryCards":[],"tasks":[],"listening":[],"reading":[],"vocab":[],"vocabularyQuestions":[],"conversation":[],"variants":[{"id":"A","title":"A support-session pilot","objective":[{"id":"b2cp12-A-g1","type":"choice","scope":"current","sourcePositions":[7],"prompt":"Routine messages outside a person’s shift are optional under a fictional policy. Which message preserves that rule?","answer":"You don’t have to reply until your next shift.","options":["You don’t have to reply until your next shift.","You mustn’t reply under any circumstances.","You must reply immediately even when off duty."],"why":"No obligation leaves a choice; it is different from a prohibition or a requirement."},{"id":"b2cp12-A-g2","type":"choice","scope":"current","sourcePositions":[7],"prompt":"You printed copies, then learned that everyone already had the file. Which sentence explicitly reports an unnecessary completed action?","answer":"I needn’t have printed the copies.","options":["I needn’t have printed the copies.","I mustn’t print the copies.","I never printed any copies."],"why":"Needn’t have + past participle describes an action that happened but was unnecessary."},{"id":"b2cp12-A-g3","type":"choice","scope":"current","sourcePositions":[8],"prompt":"Choose the grammatical request.","answer":"I asked him not to answer on my behalf.","options":["I asked him not to answer on my behalf.","I asked he not to answer on my behalf.","I asked him not answer on my behalf."],"why":"Ask takes an object pronoun followed here by not to + base verb."},{"id":"b2cp12-A-g4","type":"choice","scope":"current","sourcePositions":[8],"prompt":"A schedule clash blocks the group’s progress. Which word names that obstacle?","answer":"a hurdle","options":["a hurdle","a goal already achieved","a peer who gives feedback"],"why":"A hurdle is a difficulty to overcome; a peer is a person and a goal is the desired result."},{"id":"b2cp12-A-g5","type":"choice","scope":"current","sourcePositions":[9],"prompt":"“I remember sending the revised notes.” What does the speaker claim?","answer":"They recall an earlier action.","options":["They recall an earlier action.","They are reminding themselves to send the notes later.","They have decided never to send notes."],"why":"Remember + -ing recalls an event; remember to do concerns an action needing attention."},{"id":"b2cp12-A-g6","type":"choice","scope":"current","sourcePositions":[9],"prompt":"A learner changes an unworkable routine but continues pursuing the course goal. They…","answer":"persevere","options":["persevere","necessarily abandon the goal","have already completed every task"],"why":"Persevering can involve adapting the method while continuing the effort."},{"id":"b2cp12-A-g7","type":"choice","scope":"current","sourcePositions":[10],"prompt":"Which statement reports only the purpose, without asserting that the test was completed?","answer":"We reserved time so that we could test the guide.","options":["We reserved time so that we could test the guide.","We reserved time, so we tested the guide.","We tested the guide and recorded the result."],"why":"So that + could expresses the intended benefit here; the alternatives assert completion."},{"id":"b2cp12-A-g8","type":"choice","scope":"current","sourcePositions":[11],"prompt":"Two reviewers each own a different checklist. Which phrase makes that separate ownership clear?","answer":"Iris’s and Mei’s checklists","options":["Iris’s and Mei’s checklists","Iris and Mei’s one shared checklist","Iris and Meis checklist’s"],"why":"Marking each name fits the separate documents specified by the context."},{"id":"b2cp12-A-g9","type":"choice","scope":"spiral","sourcePositions":[2],"prompt":"Only the tutors who completed training may lead the session. Which sentence identifies that subgroup?","answer":"The tutors who completed training may lead it.","options":["The tutors who completed training may lead it.","The tutors, who completed training, may lead it.","The tutors, that completed training, may lead it."],"why":"A defining relative clause identifies the subgroup without commas."},{"id":"b2cp12-A-g10","type":"choice","scope":"spiral","sourcePositions":[4],"prompt":"The file error occurred before yesterday’s rehearsal. Choose the clear earlier-past form.","answer":"Before we rehearsed, someone had sent the wrong file.","options":["Before we rehearsed, someone had sent the wrong file.","Before we rehearsed, someone has sent the wrong file.","Before we rehearsed, someone will send the wrong file."],"why":"Past perfect places the sending earlier than the past rehearsal."},{"id":"b2cp12-A-g11","type":"choice","scope":"spiral","sourcePositions":[3],"prompt":"“I haven’t checked the updated room.” Agree with the same negative experience.","answer":"Neither have I.","options":["Neither have I.","So did I.","Neither was I."],"why":"Negative agreement repeats the present-perfect auxiliary have."},{"id":"b2cp12-A-g12","type":"choice","scope":"spiral","sourcePositions":[5],"prompt":"Choose the natural description of an impression.","answer":"The revised explanation sounds clear.","options":["The revised explanation sounds clear.","The revised explanation sounds clearly.","The revised explanation sounds a clearly."],"why":"The linking verb sounds takes an adjective describing the impression."},{"id":"b2cp12-A-r1","type":"choice","scope":"current","sourcePositions":[7,11],"prompt":"Who should authorise the guide and who should send it?","answer":"Mei approves it; Iris sends the shared guide after that confirmation.","options":["Mei approves it; Iris sends the shared guide after that confirmation.","Iris publishes any draft because she can access the folder.","Every participant approves it independently before Iris can write."],"why":"The handover separates the approval decision from preparing and sending the shared document."},{"id":"b2cp12-A-r2","type":"choice","scope":"current","sourcePositions":[8,9],"prompt":"Which preparation fits the learner’s availability and the task?","answer":"Use the short recording and Wednesday’s fifteen minutes to practise the learner’s own example.","options":["Use the short recording and Wednesday’s fifteen minutes to practise the learner’s own example.","Schedule a two-hour evening rehearsal and have a peer deliver the example instead.","Wait until after Thursday’s session to ask what the assignment requires."],"why":"The stated time and individual speaking requirement rule out the alternatives."},{"id":"b2cp12-A-r3","type":"choice","scope":"current","sourcePositions":[10],"prompt":"What can the team report after uploading the guide but before the reader trial?","answer":"The guide is available; whether it reduces requests for help is still untested.","options":["The guide is available; whether it reduces requests for help is still untested.","Every reader must now understand it because a file exists.","The guide has definitely failed before anyone tries it."],"why":"Completion of the document is evidence of availability, not yet of the intended user benefit."},{"id":"b2cp12-A-r4","type":"choice","scope":"spiral","sourcePositions":[2,4],"prompt":"Why is “Mina’s short answers prove she is uninterested” not supported?","answer":"She had the wrong brief and later sent detailed corrections and a practical question.","options":["She had the wrong brief and later sent detailed corrections and a practical question.","Short answers always prove a permanent personality trait.","Her later corrections prove she will agree with every decision."],"why":"The earlier file problem and later contribution provide context that challenges the assumed motive."},{"id":"b2cp12-A-l1","type":"choice","scope":"current","sourcePositions":[10],"prompt":"A team wants to apply Clara’s argument. Which change should come before automatically accepting the next meeting?","answer":"Choose the useful outcome and consider whether the meeting supports it.","options":["Choose the useful outcome and consider whether the meeting supports it.","Assume any meeting creates the greatest possible result.","Replace every meeting with instant replies without choosing a goal."],"why":"Clara argues for direction before reactive activity fills the day.","evidence":"None of these actions are necessarily wrong, but they can fill the day before you have chosen what the day is for."},{"id":"b2cp12-A-l2","type":"choice","scope":"current","sourcePositions":[9,10],"prompt":"Which experiment best tests useful progress rather than a visible activity count?","answer":"Protect time for one significant decision and examine whether it improves the project’s direction.","options":["Protect time for one significant decision and examine whether it improves the project’s direction.","Count only how many boxes are crossed off, regardless of what they change.","Keep the calendar full so there is never a moment to think."],"why":"Her example shows that a small visible output can prevent a significant project error.","evidence":"But those notes might save a project from going in the wrong direction."},{"id":"b2cp12-A-l3","type":"choice","scope":"spiral","sourcePositions":[2],"prompt":"A colleague says “She replies instantly, so she must be the most effective person.” Which part of Clara’s argument challenges this impression?","answer":"Visible commitment and useful progress are not the same evidence.","options":["Visible commitment and useful progress are not the same evidence.","Anyone who replies quickly is necessarily ineffective.","Nobody can ever learn anything from another person’s behaviour."],"why":"Clara questions the inference from appearance without claiming that every quick response is useless.","evidence":"But visible effort is not the same as useful progress."},{"id":"b2cp12-A-l4","type":"choice","scope":"spiral","sourcePositions":[1],"prompt":"Which paraphrase accurately connects Clara’s final contrast?","answer":"Activity asks how much was done; effectiveness asks what changed as a result.","options":["Activity asks how much was done; effectiveness asks what changed as a result.","Effectiveness means avoiding all work because effort never matters.","Activity and progress are always identical, so no comparison is needed."],"why":"The concluding contrast links effort to its consequence rather than rejecting work itself.","evidence":"Effectiveness asks, “What changed because I did it?”"}],"readingTitle":"The pilot handover","readingTexts":[{"title":"Session brief and responsibilities","text":"Our short support session is on Thursday at 11.00. Each learner must explain their own example. Peers may listen to a rehearsal and suggest changes, but should not deliver another person’s assessed part. Mina can send a recording on Wednesday morning and practise from 12.10 to 12.25 that day. Evenings are unavailable.\nIris prepares the shared guide; Mei approves the final version by Wednesday at 16.00. Iris then sends it to the group and asks one reader to confirm receipt. Their individual review checklists stay separate. Routine messages can wait until each person’s next shift; only the named duty coordinator handles a confirmed session cancellation. Preparing this week’s notes does not assign all future notes to the same person."},{"title":"Update after the rehearsal","text":"Mina gave short answers at the first discussion. One participant described her as uninterested. She later explained that the link she had received led to an older brief with a different task. Before Wednesday, she sent detailed corrections and asked which example she should prepare.\nThe guide is now uploaded, but no new reader has tried it. Its purpose is to reduce repeated requests for help. We will test that with two learners after Thursday’s session instead of assuming a completed file proves success. Please propose the preparation, handover and next check. If extra work is requested, say which responsibility needs to move rather than promise unlimited availability."}],"writing":"Write a message proposing a workable plan for the pilot. Use the source texts to assign guide preparation, approval and sending; fit Mina’s own rehearsal into her available time; address the interpretation of her short answers fairly; and name a check of the guide’s usefulness. Include one clear boundary or priority decision. Use relevant language from lessons 7–11 and earlier lessons naturally. Aim for about 120–170 words; the exact count is not a gate.","speaking":"Discuss a work-and-learning plan with Alex. Clarify responsibility and capacity, propose practical preparation, respond to a shortcut that would replace useful learning, and agree evidence of progress.","conversation":[{"partner":"I’m being asked to prepare every week’s notes as well as finish my own assignment. What should we clarify before I agree?","goal":"Clarify the scope, owner and what existing task would need to move."},{"partner":"I have fifteen minutes to practise on Wednesday, but my peers keep completing my explanation for me. What should we do?","goal":"Propose feasible practice and a speaking-role agreement that keeps the explanation Alex’s own."},{"partner":"Wouldn’t having you deliver my part prove that the session is ready, even if I still cannot explain it?","goal":"Distinguish a polished output from evidence that the learner can perform the task."},{"partner":"Then give me one next action and a way to check whether the new plan actually helped.","goal":"Agree a concrete action and a check of learning or useful progress, not only an activity count."}],"audioNumber":14,"audioTitle":"The Difference Between Being Busy and Being Effective","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a32cc3c7e07b7f2fa746736_ElevenLabs_2026-06-17T16_30_35_Riley%20-%20Engaging%20Young%20Female%20Voice_pvc_sp82_s29_sb75_v3.mp3","localAudio":"audio/lesson14-busy-vs-effective.mp3","trackingSlug":"listening_b2_pre_014_busy_vs_effective","transcript":["Hi, I’m Clara. For several years, I confused being busy with being effective. If my calendar was full, my inbox was moving, and I had a long list of tasks crossed out by the end of the day, I felt productive. I liked the feeling of movement. It gave me evidence that I was working hard.","The problem was that many of my busiest days did not actually move anything important forward. I answered messages, joined meetings, updated documents, checked small details, and helped other people solve urgent problems. All of that looked useful. Some of it was useful. But at the end of the week, the projects that mattered most were often still waiting for “when things calm down.”","I started noticing the difference after a manager asked me a simple question during a review: “Which part of your work would create the biggest result if you protected time for it?” I wanted to answer quickly, but I could not. I knew what kept me busy. I was less clear about what made me effective.","That question stayed with me. I began looking at my working week differently. I realised that busyness often comes from reacting. A message arrives, so you answer it. A meeting appears, so you attend it. A colleague asks for a quick opinion, so you give one. None of these actions are necessarily wrong, but they can fill the day before you have chosen what the day is for.","Effectiveness is different. It requires direction. It asks, “What is the most useful outcome here?” not simply, “What can I do next?” Sometimes being effective means doing fewer things but doing the right thing with more attention. Sometimes it means leaving a minor email unanswered for two hours because you are working on something that prevents twenty future emails.","At first, I found this uncomfortable. Busy work gives immediate satisfaction. You can see it. You can count it. You can tell yourself, “I did a lot today.” Effective work is sometimes quieter. You may spend ninety minutes thinking through one difficult decision and have only a few notes to show for it. But those notes might save a project from going in the wrong direction.","I also learned that people often reward busyness because it is visible. Someone who replies instantly looks committed. Someone who is always in meetings looks important. Someone who says, “I’m completely booked,” sounds valuable. But visible effort is not the same as useful progress.","So I changed a few habits. I started choosing one important outcome each morning before opening my inbox. I left space between meetings so I could actually think about what had been discussed. I stopped treating every request as equally urgent. Most importantly, I began asking, “If I finish only one meaningful thing today, what should it be?”","This did not make my work perfect. There are still busy days, and some urgent tasks are genuinely unavoidable. But I no longer see a full schedule as proof of success. A full schedule can mean commitment, but it can also mean lack of focus.","The difference between being busy and being effective is not laziness versus hard work. It is movement versus progress. Busyness asks, “How much did I do?” Effectiveness asks, “What changed because I did it?” That second question is harder to answer, but it is much more useful."]},{"id":"B","title":"A demonstration team","objective":[{"id":"b2cp12-B-g1","type":"choice","scope":"current","sourcePositions":[7],"prompt":"A visitor’s access code must not be shared. Which sentence states that prohibition?","answer":"You mustn’t share the code.","options":["You mustn’t share the code.","You don’t have to share the code.","You needn’t share the code."],"why":"Mustn’t prohibits; the alternatives remove necessity without prohibiting the action."},{"id":"b2cp12-B-g2","type":"choice","scope":"current","sourcePositions":[7],"prompt":"What does “I didn’t need to send a reminder” establish on its own?","answer":"Sending it was unnecessary; more context is needed to know whether it happened.","options":["Sending it was unnecessary; more context is needed to know whether it happened.","The reminder definitely was sent.","The reminder definitely was not sent."],"why":"The sentence reports absence of necessity, not by itself the occurrence of the action."},{"id":"b2cp12-B-g3","type":"choice","scope":"current","sourcePositions":[8],"prompt":"Choose the natural pattern after encourage.","answer":"The coach encouraged us to try one short rehearsal.","options":["The coach encouraged us to try one short rehearsal.","The coach encouraged we to try one short rehearsal.","The coach encouraged us trying to one rehearsal."],"why":"Encourage takes an object pronoun followed by a to-infinitive."},{"id":"b2cp12-B-g4","type":"choice","scope":"current","sourcePositions":[8],"prompt":"A teacher who gives extra individual lessons outside the normal class is a…","answer":"private tutor","options":["private tutor","group assignment","project deadline"],"why":"A private tutor is a person providing additional teaching, not a task or time limit."},{"id":"b2cp12-B-g5","type":"choice","scope":"current","sourcePositions":[9],"prompt":"Which suggestion explicitly presents a method as an experiment?","answer":"Try recording one example and listening back.","options":["Try recording one example and listening back.","You remembered recording it last week.","You regret having recorded it yesterday."],"why":"Try + -ing proposes a method to test; the other sentences look back at an event."},{"id":"b2cp12-B-g6","type":"choice","scope":"current","sourcePositions":[9],"prompt":"A learner’s unfinished coursework is accumulating beyond the schedule. They are…","answer":"falling behind","options":["falling behind","keeping up with all coursework","already excelling in every task"],"why":"Fall behind describes a growing gap in expected progress."},{"id":"b2cp12-B-g7","type":"choice","scope":"current","sourcePositions":[10],"prompt":"Choose the correct contrast with a noun phrase.","answer":"Despite the short preparation time, we tested the opening.","options":["Despite the short preparation time, we tested the opening.","Despite we had little time, we tested the opening.","Although the short preparation time, we tested the opening."],"why":"Despite takes the noun phrase; although needs a clause in this pattern."},{"id":"b2cp12-B-g8","type":"choice","scope":"current","sourcePositions":[11],"prompt":"Kai and Bea wrote one set of instructions together. Which phrase signals the shared item?","answer":"Kai and Bea’s instructions","options":["Kai and Bea’s instructions","Kai’s and Bea’s separate instruction sheets","Kais and Beas instruction’s"],"why":"The final possessive can describe the pair’s shared instructions, as specified in context."},{"id":"b2cp12-B-g9","type":"choice","scope":"spiral","sourcePositions":[2],"prompt":"Add extra information about the already identified coach.","answer":"Jules, who leads the group, will check the sound.","options":["Jules, who leads the group, will check the sound.","Jules, that leads the group, will check the sound.","Jules, leads the group, will check the sound."],"why":"A non-defining relative clause retains its pronoun and does not use that."},{"id":"b2cp12-B-g10","type":"choice","scope":"spiral","sourcePositions":[4],"prompt":"“We ___ the example when the screen went blank.” Show the action in progress at that past interruption.","answer":"were explaining","options":["were explaining","have explained","will explain"],"why":"Past continuous supplies the background to the past-simple interruption."},{"id":"b2cp12-B-g11","type":"choice","scope":"spiral","sourcePositions":[3],"prompt":"“Will the revised plan work?” Give a natural concise hopeful answer.","answer":"I hope so.","options":["I hope so.","I hope it so to.","I hope do it so."],"why":"So can substitute for the positive clause after hope."},{"id":"b2cp12-B-g12","type":"choice","scope":"spiral","sourcePositions":[5],"prompt":"You heard the entire short explanation, from beginning to end. Which form presents that complete event?","answer":"I heard him explain the example.","options":["I heard him explain the example.","I heard him to explain the example.","I heard he explain the example."],"why":"A perception verb followed by object + bare infinitive can present a complete event."},{"id":"b2cp12-B-r1","type":"choice","scope":"current","sourcePositions":[8,9],"prompt":"Which practice plan fits Kai’s constraints and the assessment requirement?","answer":"Use his morning recording and the Friday lunchtime slot to practise his own demonstration.","options":["Use his morning recording and the Friday lunchtime slot to practise his own demonstration.","Use a long evening session and have the coach demonstrate in his place.","Postpone all preparation until after Saturday’s event."],"why":"The first plan respects both the stated availability and individual performance requirement."},{"id":"b2cp12-B-r2","type":"choice","scope":"current","sourcePositions":[7,11],"prompt":"Who can approve a change to the shared instructions, and who sends them afterwards?","answer":"Bea approves; Kai sends the confirmed shared version.","options":["Bea approves; Kai sends the confirmed shared version.","Kai may publish any change because the draft is in a shared folder.","The last person to read a message automatically becomes the approver."],"why":"The named decision owner must confirm the version before the sending step."},{"id":"b2cp12-B-r3","type":"choice","scope":"current","sourcePositions":[10],"prompt":"What remains unproven when the team has shortened its meeting and finished the instructions?","answer":"Whether new learners can complete the task with fewer requests for help.","options":["Whether new learners can complete the task with fewer requests for help.","Whether the meeting was shorter and a document was finished.","Whether the team can ever improve anything in future."],"why":"The recorded activities do not yet establish the intended learner outcome."},{"id":"b2cp12-B-r4","type":"choice","scope":"spiral","sourcePositions":[2,4],"prompt":"Why would it be premature to call Jules unhelpful because he gave brief replies?","answer":"He was checking an earlier version and later supplied precise corrections and offered a sound check.","options":["He was checking an earlier version and later supplied precise corrections and offered a sound check.","Brief replies establish that he never helps anyone.","His offer proves he will accept every future task."],"why":"The later evidence and the earlier version problem provide an alternative explanation without justifying an unlimited conclusion."},{"id":"b2cp12-B-l1","type":"choice","scope":"current","sourcePositions":[8],"prompt":"Which response best applies Samuel’s revised approach to advice?","answer":"Ask what the person needs and has tried before selecting a concrete action that fits their constraints.","options":["Ask what the person needs and has tried before selecting a concrete action that fits their constraints.","Choose a short confident slogan before asking about the situation.","Assume every workplace problem is a personal attitude failure."],"why":"He moves from quick generic advice to goal- and context-sensitive help.","evidence":"Now, before giving advice, I ask about the person’s goal, what they have already tried, and what limitations they are facing."},{"id":"b2cp12-B-l2","type":"choice","scope":"current","sourcePositions":[8,11],"prompt":"Why did agreeing question roles help more than simply telling Priya to change her attitude?","answer":"It changed how the team supported her speaking role rather than placing all responsibility on her.","options":["It changed how the team supported her speaking role rather than placing all responsibility on her.","It removed all need for Priya to prepare.","It proved the colleague had deliberately intended harm."],"why":"The revised preparation addressed the shared structure and unclear roles without inventing a motive.","evidence":"We agreed who would answer different kinds of questions."},{"id":"b2cp12-B-l3","type":"choice","scope":"spiral","sourcePositions":[2,5],"prompt":"Which observation challenges the inference that Priya’s pause meant she wanted someone else to take over?","answer":"The colleague interpreted silence as an invitation, while the team had not agreed answer roles.","options":["The colleague interpreted silence as an invitation, while the team had not agreed answer roles.","Every pause always means a speaker lacks knowledge.","Being nervous proves a person cannot lead any meeting."],"why":"An interpretation of observed behaviour is not the only possible explanation.","evidence":"When Priya paused to think, her senior colleague interpreted the silence as an invitation to speak."},{"id":"b2cp12-B-l4","type":"choice","scope":"spiral","sourcePositions":[1,3],"prompt":"What purpose do the questions about listening versus offering ideas serve in the conversation?","answer":"They clarify the kind of response wanted before someone solves the wrong problem.","options":["They clarify the kind of response wanted before someone solves the wrong problem.","They replace all practical help with a promise never to speak.","They require the receiver to agree with every suggestion."],"why":"The questions manage the exchange by establishing the receiver’s actual need.","evidence":"These questions slow the conversation down and prevent us from solving the wrong problem."}],"readingTitle":"The demonstration handover","readingTexts":[{"title":"Saturday event · Preparation brief","text":"At Saturday’s demonstration, each trainee must show their own example. A peer may suggest changes but may not perform the assessed demonstration for them. Kai can send an audio explanation on Friday morning and practise from 12.30 to 12.45. He works evenings, so a long evening rehearsal is not available.\nKai and Bea share one set of instructions, but each has a separate review checklist. Bea approves the final wording by Friday at 15.00; Kai then sends the approved file and confirms that the coach has received it. Only the duty organiser handles a confirmed cancellation outside normal hours. A request for this week’s notes does not create a permanent notes role."},{"title":"Follow-up from the coach","text":"Jules gave brief replies when he first saw the draft. Another person described him as unhelpful. Jules later explained that he had been checking an older version in a different folder. He sent precise corrections and offered to check audibility before Saturday’s demonstration.\nThe team shortened its planning meeting and finished the instructions. It has not yet tested whether a new learner can follow them without help. Two volunteers will try the task on Saturday afternoon, and the team will note where extra explanations are needed. The aim is fewer repeated questions, not just a shorter meeting or an uploaded file. Please propose a feasible rehearsal, a clear handover and a check of the intended outcome."}],"writing":"Write to the demonstration team using the source texts. Propose a rehearsal that fits Kai’s time and keeps the assessed demonstration his own. Clarify the shared file, separate checklists, approval and sending responsibilities. Address the interpretation of Jules’s brief replies fairly, and explain what evidence is still needed to judge the instructions. Include a bounded offer or clear priority decision. Aim for about 120–170 words; the exact count is not a gate.","speaking":"Discuss a demonstration plan with Alex. Clarify a recurring request, propose a feasible rehearsal, handle an objection about faster output and agree a clear owner and outcome check.","conversation":[{"partner":"Our team assumes I will prepare all future meeting notes because I helped last time. How should I respond without abandoning this week’s work?","goal":"Clarify the recurring scope and make a bounded offer or priority request."},{"partner":"I can practise my demonstration for fifteen minutes at lunchtime. What support would help without someone doing it for me?","goal":"Suggest concrete practice that respects the time limit and individual ownership."},{"partner":"We have already made the instructions shorter. Surely that proves the task will be easy for new learners?","goal":"Distinguish a visible change from evidence that learners can complete the intended task."},{"partner":"Please summarise who needs to confirm the plan and what we should check after the trial.","goal":"Name an owner, a confirmation and a relevant measure of usefulness."}],"audioNumber":17,"audioTitle":"The Advice That Sounded Helpful but Wasn’t","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a525c5108f74ba893eddef8_ElevenLabs_2026-07-11T15_03_36_Liam%20-%20Energetic%2C%20Social%20Media%20Creator_pre_sp100_s50_sb75_v3.mp3","localAudio":"audio/lesson17-bad-advice.mp3","trackingSlug":"listening_b2_pre_017_bad_advice","transcript":["Hi, I’m Samuel. A few years ago, a younger colleague named Priya asked me for advice after a difficult client presentation. She had prepared carefully, but the meeting had not gone well. The client interrupted her several times, a senior colleague answered questions that were directed at her, and by the end she had lost confidence in what she was saying.","She asked me what she should do differently next time. I wanted to be encouraging, so I said, “You just need to be more confident. Don’t overthink it.”","At the time, that sounded like helpful advice. It was positive, simple, and easy to remember. The problem was that it gave her almost nothing she could actually use. It described how I wanted her to feel, but not what she could do. It also ignored the power dynamics in the room and treated the whole situation as if it were only a personal confidence problem.","A few days later, I watched a recording of the presentation. I noticed that Priya’s opening was too broad, so the client was not sure where the conversation was going. Her slides contained too much information. More importantly, nobody on our side had agreed who would answer which questions. When Priya paused to think, her senior colleague interpreted the silence as an invitation to speak.","Her confidence had certainly been affected, but it was not the only issue. My advice had shifted responsibility entirely onto her. It suggested that if she simply changed her attitude, everything else would improve.","I apologised and asked whether we could prepare for the next presentation together. This time, we focused on actions rather than personality. She practised the first two minutes until the opening felt clear. We agreed who would answer different kinds of questions. She reduced the amount of text on her slides and prepared a sentence she could use if someone interrupted: “I’d like to finish this point first, and then I’ll come back to your question.”","We also asked the senior colleague to wait a few seconds before answering on her behalf. He had not realised that his attempt to help was making it harder for her to lead the presentation.","The next meeting went much better. Priya did not suddenly become a completely different person. She was still nervous at the beginning. But the structure supported her, the roles were clearer, and she had specific language ready for difficult moments.","That experience changed the way I think about advice. Bad advice is not always cruel or obviously wrong. Sometimes it sounds intelligent because it is short and confident. Phrases such as “Trust your instincts,” “Follow your passion,” “Communicate better,” or “Be more proactive” can contain useful ideas. But without context, they are directions without a map.","Good advice needs to connect to the actual constraints of a situation. It should be specific enough to act on, but flexible enough to respect what the other person already knows.","I have also realised that quick advice is sometimes more comfortable for the person giving it than for the person receiving it. Complex problems make us uncomfortable. We want to fix them quickly, so we offer a clean answer before we have understood the full situation.","Sometimes the most helpful response is not advice at all. It may be a question such as, “Which part was most difficult?” or “Do you want ideas, or do you just need me to listen?” These questions slow the conversation down and prevent us from solving the wrong problem.","Now, before giving advice, I ask about the person’s goal, what they have already tried, and what limitations they are facing. Sometimes they need practical ideas. Sometimes they already know the next step but need reassurance. Sometimes the problem is not personal at all; it is created by the system around them.","I no longer believe that good advice is advice that makes the speaker sound wise. Good advice should increase another person’s ability to think. It should help them see the situation more clearly and choose a realistic next action."]}],"covers":[7,8,9,10,11],"spiral":[1,2,3,4,5],"thresholds":{"overall":0.75,"strand":0.6},"familiarAudio":true},{"n":13,"module":2,"grammarSourceNumbers":[3],"grammarTrackingSlug":"b2-pre-course-13-grammar","listeningTrackingSlug":"listening_b2_pre_007_technology_tradeoffs","theory":"Lesson 3: **Dummy subjects: *there* & *it* — forms, meaning & common traps**\n\n**B2 Pre-Advanced**\n\n### THERE + be + noun (existence)\n\nUse **there** as a preparatory subject to say that something *exists/occurs*. The real subject follows *be*.\n\n- *There are* several messages on your desk.\n- *There used to be* a cinema here.\n\n#### Any tense, voice, or modal\n\n- *There will be* delays tonight.\n- *There has been* remarkable progress.\n- *There might be* a better option.\n- *There’s going to be* heavy traffic.\n\nAgreement: the verb agrees with the real subject — *There is a file* / *There are two files*; *There have been* complaints.\n\n### Useful patterns with *there*\n\n- **seem/tend + to be**: *There seems to be* no alternative. / *There tends to be* confusion at first.\n- **likely/sure/bound + to be**: *There is likely to be* a price rise.\n- **used to**: *There used to be* a library; **neg.** *There didn’t use to be* any cafés.\n\n#### Fixed expressions\n\n- **There is no use/point (in) + -ing**: *There’s no point in* arguing.\n- **There is no need + to-inf / for + noun**: *There’s no need to* panic. / *There’s no need for* an apology.\n\n### IT as a preparatory subject\n\n#### Time • weather • temperature • distance\n\n- *It’s* nearly noon. / *It’s* Thursday.\n- *It’s* raining. / *It’s* 34°C today.\n- *It’s* only two kilometres to the lake.\n\n#### Referring back\n\n- *I like your proposal. It* sounds ambitious.\n- *I watched a documentary. It* was inspiring.\n\n### Common *it* structures\n\n- **it + be/seem + adj + to-inf**: *It’s hard to* find parking. / *It seems impossible to* leave now.\n- **it + be + *noun* + to-inf**: *It would be a pleasure to* host you.\n- **it + be + adj/noun + that-clause**: *It’s likely that* they’ll cancel. / *It’s a pity that* you can’t join us.\n- **it takes + time + to-inf**: *It takes me* 20 minutes to get to work.\n- **Cleft sentences** (focus/emphasis): *It was Maria who* called. / *It was in Paris that* they met.\n\n### THERE vs IT — choose the right dummy subject\n\n| **Use**                 | **Pattern**                                | **Example**                             | **Not this**                                                         |\n| ----------------------- | ------------------------------------------ | --------------------------------------- | -------------------------------------------------------------------- |\n| Existence / presence    | **there + be + noun**                      | *There is* a problem with the invoice.  | ✖ *It is* a problem with the invoice (≠ existence; this identifies). |\n| Weather/Time            | **it + be**                                | *It’s* windy. / *It’s* midnight.        | ✖ *There is* windy / midnight.                                       |\n| Evaluation of an action | **it + be + adj + to-inf**                 | *It’s essential to* back up your files. | ✖ *There is essential to* back up…                                   |\n| Probability with nouns  | **there + be + likely/sure/bound + to be** | *There is likely to be* disruption.     | ✖ *There likely is to be* disruption.                                |\n\n**Style tip:** In speech, you may hear *There’s* with plurals (*There’s two keys*). Keep agreement in careful writing: *There are two keys*.\n\n### It’s no use vs There’s no use\n\n- *It’s no use* arguing with him.\n- *There’s no use (in)* arguing with him.\n\nBoth are acceptable with *use/point*. Choose one style and be consistent.\n","audioNumber":7,"audioTitle":"When Technology Solves One Problem and Creates Another","speaker":"Marcus","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a316b6c5187b581daa8dee0_ElevenLabs_2026-06-16T15_23_13_Ed%20-%20Sarcastic%20Funny%20Narrator_pvc_sp100_s38_sb75_v3.mp3","localAudio":"audio/lesson07-technology-tradeoffs.mp3","transcript":["Hi, I’m Marcus. A few years ago, I helped a local community centre introduce an online booking system. Before that, people had to call during office hours to book language classes, career advice sessions, and small workshops. The phone was often busy, messages were sometimes lost, and staff spent a huge amount of time writing names into notebooks.","So when the new system arrived, everyone felt relieved. People could book a place in a class at midnight if they wanted to. They received automatic reminders, they could cancel without calling, and the staff could see attendance numbers clearly. For the first few weeks, it looked like a perfect example of technology solving an old-fashioned problem.","But then we noticed something unexpected. The system had made booking easier, but it had also changed people’s behaviour. Some people booked several sessions “just in case” and cancelled at the last minute. Others stopped speaking to the staff entirely, even when they were unsure which class suited them. A few older visitors found the website stressful and came to the centre with printed screenshots, asking someone to help them understand what had gone wrong.","The technology had not created these problems from nothing. It had revealed problems that were already there: limited staff time, unclear course descriptions, and the fact that not everyone feels confident online. But because the system looked clean and efficient, it was easy to forget that real people were still confused behind the screen.","One of the staff members said something that stayed with me: “We have made the queue invisible, but we have not made it disappear.” She was right. Before, the queue was on the phone. Now it was hidden in unanswered emails, abandoned bookings, and people who gave up before asking for help.","This happens with technology more often than we admit. A navigation app can help drivers avoid traffic, but if everyone follows the same shortcut, a quiet street can suddenly become crowded. A messaging platform can make teamwork faster, but it can also create the expectation that everyone is always available. A self-checkout machine can reduce waiting time, but it may also make shopping harder for someone who needs human assistance.","I am not against technology. In fact, the booking system became much better after we changed how we used it. We added clearer descriptions, kept a small number of places available for people who came in person, and trained staff to contact learners who repeatedly booked the wrong level. The problem was not the system itself. The problem was treating the system as if it could replace judgment, patience, and conversation.","That experience changed the way I think about digital tools. Good technology does not simply remove inconvenience. It moves inconvenience around. Sometimes it moves it away from staff and toward users. Sometimes it saves time for confident people but creates barriers for people who need support.","So when someone says, “This app will solve the problem,” I usually ask, “Which problem, and for whom?” A solution that works beautifully for one group may create a new difficulty for another. The real challenge is not just building smarter tools. It is noticing what those tools make easier, what they make harder, and who gets left to deal with the hidden cost."],"mappingNote":"Source recording 07 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Describe a Digital System","goal":"Explain an existing problem, evaluate a proposed system and identify who may need support.","topic":"Online booking, technical constraints and accessible alternatives","languageFocus":"Existential there with agreement, tenses and seem/likely to be; evaluative it + adjective + to/that, it takes, no point in and no need to; distinguish reference it from dummy it.","conversationTitle":"Find a workable booking route with Alex.","readingLabel":"BOOKING PAGE + USER MESSAGE","readingIntro":"Use the booking rules, help options and the user’s constraints before recommending a technical fix.","readingLinkLabel":"Read the booking notice and message","wordBankTitle":"Files, storage and device maintenance.","writingGuidance":"Aim for about 120–170 words. Explain a specific barrier, ask a useful question and propose a feasible alternative.","writingMaxWords":170,"theoryCards":[{"title":"Say what exists with there","text":"“**There is** an upload limit.” “**There are** two booking methods.”\n\nUse there + be to introduce existence or presence. In careful writing, match be to the noun: “There **have been** several errors.”","tip":"It is two booking methods does not introduce their existence."},{"title":"Use different tenses and modals","text":"“There **used to be** only a phone line.” “There **will be** a help desk.” “There **might be** a delay.”\n\nNegative past habit: “There **didn’t use to be** an online option.”","tip":"After did, use the base form use, not used."},{"title":"Evaluate an action with it","text":"“**It is difficult to upload** the file.” “**It is important for us to keep** a copy.”\n\nWith a clause: “**It is clear that** the instructions need changing.”\n\nIt prepares the evaluation; the action or clause tells us what is evaluated.","tip":"There is difficult to upload is not this pattern."},{"title":"Time, weather, distance and reference","text":"“**It is** nearly six.” “**It is** raining.” “**It is** two kilometres to the centre.”\n\nCompare reference: “I checked the website. **It** is easy to read.” Here it refers back to the website.","tip":"Not every it is a dummy subject; ask whether it refers to an earlier noun."},{"title":"Express the time required","text":"“**It takes me** five minutes **to book**.” “**It took us** longer **to find** the help notice.”\n\nThe person is optional: “It takes ten minutes to walk there.”","tip":"It takes + time + to-infinitive describes the time required for an action."},{"title":"Describe an apparent problem or likelihood","text":"“There **seems to be** a file-size problem.” “There **seem to be** two separate issues.”\n\n“There **is likely to be** a delay.” “**It is likely that** the desk will be busy.”","tip":"A likelihood is not a confirmed fact. Keep agreement in there seem/seems to be."},{"title":"No point in; no need to","text":"“There is **no point in uploading** the same oversized file again.”\n\n“There is **no need to install** the phone app; the browser also works.”\n\n“It’s **no use trying** that route again” is another natural -ing pattern.","tip":"No point in + -ing; no need + to-infinitive. Choose a useful alternative, not just a negative statement."},{"title":"Evaluate the system for its users","text":"“There are fewer phone calls, but it is still hard for some users to book.”\n\nAn efficient-looking interface does not prove everyone can finish the process. Ask what the barrier is, who is affected and whether there is a usable alternative.","tip":"Explain the actual constraint before telling a person to change devices or delete files."}],"tasks":[{"id":"b2g13-1","type":"choice","prompt":"Introduce the existence of two booking routes.","answer":"There are two booking routes.","options":["There are two booking routes.","It is two booking routes.","There is two booking routes."],"why":"There introduces existence; careful agreement uses are with two routes.","hint":"Use a plural verb for the two routes."},{"id":"b2g13-2","type":"gap","prompt":"Use has or have: “There ___ been several failed uploads.”","answer":"have","why":"The following noun phrase several failed uploads is plural.","hint":"Match agreement to what exists after there."},{"id":"b2g13-3","type":"edit","prompt":"Correct the dummy subject: “There is difficult to read the notice.”","answer":"It is difficult to read the notice.","why":"It prepares an evaluation of the action to read the notice.","hint":"Choose it for adjective + to-infinitive."},{"id":"b2g13-4","type":"choice","prompt":"Which sentence describes an apparent plural problem?","answer":"There seem to be two separate issues.","options":["There seem to be two separate issues.","There seems to be two separate issues.","It seem to be two separate issues."],"why":"There seem to be agrees with two issues.","hint":"Identify the plural noun phrase before choosing seem or seems."},{"id":"b2g13-5","type":"order","prompt":"Build a sentence evaluating a necessary action.","answer":"It is important for us to keep a backup.","why":"It + be + adjective + for + person + to-infinitive evaluates the action.","hint":"Keep for us before the infinitive."},{"id":"b2g13-6","type":"gap","prompt":"Write the correct form of upload: “There is no point in ___ the same oversized file again.”","answer":"uploading","why":"The preposition in is followed by an -ing form.","hint":"Use the -ing pattern after no point in."},{"id":"b2g13-7","type":"choice","prompt":"Which sentence says an app is unnecessary without forbidding its use?","answer":"There is no need to install the app.","options":["There is no need to install the app.","There is no point to installing the app.","It is prohibited to use the app."],"why":"No need to removes necessity; the prohibition states a different rule.","hint":"Unnecessary and forbidden are different meanings."},{"id":"b2g13-8","type":"edit","prompt":"Correct the time-required pattern: “It takes me ten minutes book a place.”","answer":"It takes me ten minutes to book a place.","why":"The action after it takes + person + time is a to-infinitive.","hint":"Keep to before book."},{"id":"b2g13-9","type":"choice","prompt":"Which sentence introduces a probable future delay?","answer":"There is likely to be a delay.","options":["There is likely to be a delay.","There likely is to be a delay.","It is a delay likely be."],"why":"There is likely to be introduces the possible existence of a delay.","hint":"Keep is likely to be together."},{"id":"b2g13-10","type":"gap","prompt":"Complete with the base form: “There didn’t ___ to be an online option.”","answer":"use","why":"Did carries the past tense, so use stays in the base form.","hint":"This describes an earlier situation that has changed."},{"id":"b2g13-11","type":"choice","prompt":"In “I checked the website. It is clear and easy to read”, what does it refer to?","answer":"The website already mentioned.","options":["The website already mentioned.","The existence of two new websites.","Nothing: every it must be a dummy subject."],"why":"Here it refers back to a noun rather than preparing an action or that-clause.","hint":"Ask whether an earlier noun supplies the reference."},{"id":"b2g13-12","type":"choice","prompt":"Which update distinguishes a system feature from the user outcome?","answer":"There are automatic reminders, but we still need to check whether users can complete their bookings.","options":["There are automatic reminders, but we still need to check whether users can complete their bookings.","There are reminders, so every user must be able to book.","It is efficient-looking, so no human help can be needed."],"why":"A feature does not itself establish that every user can complete the process.","hint":"Keep the claim proportional to the available evidence."}],"listening":[{"id":"b2l13-1","type":"choice","prompt":"What immediate advantage did the booking system provide?","answer":"People could book outside office hours and staff could view attendance more easily.","options":["People could book outside office hours and staff could view attendance more easily.","It guaranteed that everyone selected the right class.","It removed every need for human assistance permanently."],"why":"The initial benefits concerned access, reminders and administration, not universal understanding.","hint":"Separate a useful feature from a guarantee about every user.","evidence":"People could book a place in a class at midnight if they wanted to."},{"id":"b2l13-2","type":"choice","prompt":"How did easier booking change some users’ behaviour?","answer":"Some reserved several sessions and cancelled late.","options":["Some reserved several sessions and cancelled late.","All users stopped booking any classes.","Everyone began calling staff before making any choice."],"why":"The system made speculative bookings easier, creating a new problem.","hint":"Listen for behaviour that was encouraged by convenience.","evidence":"Some people booked several sessions “just in case” and cancelled at the last minute."},{"id":"b2l13-3","type":"choice","prompt":"What did the clean interface risk hiding?","answer":"Confusion, limited support time and unequal confidence online.","options":["Confusion, limited support time and unequal confidence online.","The fact that the centre had no classes at all.","A rule that every visitor owned a computer."],"why":"The speaker says existing difficulties became easier to overlook.","hint":"The interface’s appearance is not the same as users’ experience.","evidence":"But because the system looked clean and efficient, it was easy to forget that real people were still confused behind the screen."},{"id":"b2l13-4","type":"choice","prompt":"What does the invisible queue represent?","answer":"Unanswered messages, abandoned bookings and people who gave up before asking.","options":["Unanswered messages, abandoned bookings and people who gave up before asking.","An empty building with no remaining demand.","Only a shorter physical queue outside the centre."],"why":"The demand for help had moved rather than disappeared.","hint":"What replaced the busy telephone line?","evidence":"Now it was hidden in unanswered emails, abandoned bookings, and people who gave up before asking for help."},{"id":"b2l13-5","type":"choice","prompt":"Why include examples of navigation, messaging and self-checkout?","answer":"To show that a tool’s benefits can create costs or barriers elsewhere.","options":["To show that a tool’s benefits can create costs or barriers elsewhere.","To argue that all these tools should be banned.","To claim that every user experiences the same problem."],"why":"The examples extend the argument about displaced inconvenience.","hint":"Find the shared relationship, not a universal rejection of tools.","evidence":"A self-checkout machine can reduce waiting time, but it may also make shopping harder for someone who needs human assistance."},{"id":"b2l13-6","type":"choice","prompt":"Which combination improved the booking system?","answer":"Clearer descriptions, some in-person places and staff contact for repeated wrong-level bookings.","options":["Clearer descriptions, some in-person places and staff contact for repeated wrong-level bookings.","Removing all contact with learners and all walk-in places.","Keeping the interface unchanged and blaming confused users."],"why":"The improvements combined clearer information and human judgement.","hint":"Listen for more than a purely technical redesign.","evidence":"We added clearer descriptions, kept a small number of places available for people who came in person, and trained staff to contact learners who repeatedly booked the wrong level."},{"id":"b2l13-7","type":"choice","prompt":"What was the main error in how the centre first used the tool?","answer":"Treating it as a replacement for judgement, patience and conversation.","options":["Treating it as a replacement for judgement, patience and conversation.","Allowing anybody to book after office hours.","Keeping any record of attendance."],"why":"The problem concerned the assumed replacement of human support, not every useful feature.","hint":"Distinguish the system from the assumptions made about it.","evidence":"The problem was treating the system as if it could replace judgment, patience, and conversation."},{"id":"b2l13-8","type":"choice","prompt":"Which question best applies Marcus’s final argument?","answer":"Which group benefits, and who now has to deal with a difficulty that remains?","options":["Which group benefits, and who now has to deal with a difficulty that remains?","How attractive is the interface, regardless of completion?","Can we remove every non-digital route immediately?"],"why":"The final argument asks whose problem is solved and whose hidden cost remains.","hint":"Evaluate a tool from the affected users’ perspectives.","evidence":"Which problem, and for whom?"}],"readingTitle":"Two barriers, more than one booking route","readingTexts":[{"title":"Fictional centre · Booking and help notice","text":"Registration for Thursday’s 18.00 workshop closes on Wednesday at 12.00. The browser form requires an email address and one readable PDF no larger than 2 MB. The phone app is optional; there is no need to install it if the browser form works. A recent browser version is recommended. The page confirms a booking only after it displays a reference number. Uploading a file alone does not reserve a place.\nPhone help is open from 9.00 to 17.00. On Tuesday only, an in-person help desk stays open until 18.00 and can use a small allocation of places for visitors. Availability still needs to be checked; an enquiry is not a confirmed booking. Staff can help check the file and choose a route. They do not require visitors to reset their devices."},{"title":"Ravi’s message on Monday","text":"I can receive email on my laptop. The PDF on it is 5 MB, and the form rejects it before showing a booking reference. My phone has also run out of storage, so I cannot update its software or install the app. I thought buying a new phone was the only way to register.\nI can make a short call at 12.30 on Tuesday and could reach the help desk at 17.30 that day. I have the original document backed up and can try compressing a copy on the laptop, provided the text remains readable. I do not want to lose the original. Can someone confirm whether a suitable place is still available and which route I should use before Wednesday’s deadline?"}],"reading":[{"id":"b2r13-1","type":"choice","prompt":"Which barrier directly caused the laptop form to reject Ravi’s current upload?","answer":"The PDF exceeds the stated 2 MB limit.","options":["The PDF exceeds the stated 2 MB limit.","The form requires the optional phone app first.","Ravi cannot receive any email."],"why":"His 5 MB PDF is above the limit; the phone problem is a separate issue.","hint":"Compare the upload requirement with the file he actually used."},{"id":"b2r13-2","type":"choice","prompt":"Why is a new phone not established as necessary?","answer":"The app is optional, and Ravi has a laptop plus possible phone or desk assistance before the deadline.","options":["The app is optional, and Ravi has a laptop plus possible phone or desk assistance before the deadline.","The notice promises that every large PDF will be accepted unchanged.","A new device automatically creates a confirmed booking."],"why":"There are alternative routes; the current rejection does not prove a device purchase is needed.","hint":"Use both the optional-app rule and Ravi’s available options."},{"id":"b2r13-3","type":"choice","prompt":"Which Tuesday plan fits the help hours and deadline?","answer":"Call at 12.30 to check availability, then use the 17.30 desk if needed.","options":["Call at 12.30 to check availability, then use the 17.30 desk if needed.","Wait until Thursday evening to ask about registration.","Arrive at the desk at 19.00 on Tuesday."],"why":"Both proposed contacts fit their hours and occur before Wednesday noon.","hint":"Combine Ravi’s availability with each help channel’s schedule."},{"id":"b2r13-4","type":"choice","prompt":"What should Ravi check after compressing a copy?","answer":"That it is readable and at most 2 MB, then that a booking reference is actually issued.","options":["That it is readable and at most 2 MB, then that a booking reference is actually issued.","Only that its name has changed.","Only that the original file has been deleted."],"why":"A successful file change and a confirmed booking are different stages.","hint":"Use the file requirement and the confirmation rule together."},{"id":"b2r13-5","type":"choice","prompt":"Does the small desk allocation guarantee Ravi a place?","answer":"No; availability must be checked and the enquiry still needs confirmation.","options":["No; availability must be checked and the enquiry still needs confirmation.","Yes; any Monday message reserves a place permanently.","No; the desk cannot assist anyone who owns a laptop."],"why":"The notice offers a route, not an unconditional reservation.","hint":"Keep availability, enquiry and confirmed booking separate."},{"id":"b2r13-6","type":"choice","prompt":"Which response best addresses both Ravi’s misunderstanding and his actual barrier?","answer":"You can use the browser; try a readable smaller copy or ask the desk, and check for the booking reference.","options":["You can use the browser; try a readable smaller copy or ask the desk, and check for the booking reference.","Reset the phone immediately; no other method exists.","Ignore the file limit because the app is optional."],"why":"The first response corrects the assumed phone requirement and names the upload and confirmation steps.","hint":"A useful answer should target the actual barrier rather than just name a technical action."}],"vocab":[{"id":"vb2pre13-1","word":"clear the cache","definition":"Remove temporary stored app or browser data.","example":"Clearing the cache may help a page load a fresh copy.","hint":"This does not mean deleting every personal document or resetting the device.","sourceLesson":12},{"id":"vb2pre13-2","word":"free up space","definition":"Make more storage available by removing or moving things you no longer need locally.","example":"He moved backed-up videos to free up space for the update.","hint":"Choose what to move or remove; the phrase does not specify which files.","sourceLesson":12},{"id":"vb2pre13-3","word":"back up data","definition":"Make an additional copy of files so they can be recovered if the original is lost.","example":"She backed up the original document before making a smaller copy.","hint":"A backup is a separate copy; it is not simply renaming the same file.","sourceLesson":12},{"id":"vb2pre13-4","word":"sync devices","definition":"Keep information on different devices updated to match.","example":"Syncing devices helped him see the same calendar on his phone and laptop.","hint":"Synchronisation is not automatically the same as an independent backup.","sourceLesson":12},{"id":"vb2pre13-5","word":"compress files","definition":"Reduce the size of files.","example":"She compressed a copy of the PDF to meet the upload limit.","hint":"Check the resulting file size and readability; compression is not guaranteed to meet every limit.","sourceLesson":12},{"id":"vb2pre13-6","word":"upload to the cloud","definition":"Send files to an online storage service.","example":"He uploaded the guide to the cloud to access it from another device.","hint":"Access can still depend on the service and an internet connection.","sourceLesson":12},{"id":"vb2pre13-7","word":"run out of storage","definition":"Have no available capacity left for more files or an installation.","example":"The phone had run out of storage, so it could not install the update.","hint":"Storage capacity and battery charge are different things.","sourceLesson":12},{"id":"vb2pre13-8","word":"update software","definition":"Install a newer version of an application or operating system.","example":"The help notice asked users to update software before retrying the form.","hint":"An update changes software; it does not necessarily require buying a new device.","sourceLesson":12}],"vocabularyQuestions":[{"id":"vb2pre13-1","type":"choice","prompt":"Remove temporary stored browser data to try loading a fresh page. You…","answer":"clear the cache","options":["clear the cache","delete every personal document","buy a new device"],"why":"The cache contains temporary stored data; the phrase does not mean a full reset.","hint":"This does not mean deleting every personal document or resetting the device."},{"id":"vb2pre13-2","type":"choice","prompt":"Move or remove selected local files to make more capacity available. You…","answer":"free up space","options":["free up space","use up all remaining storage","only rename the device"],"why":"Free up space means make storage capacity available.","hint":"Choose what to move or remove; the phrase does not specify which files."},{"id":"vb2pre13-3","type":"choice","prompt":"Create an additional recoverable copy of important files. You…","answer":"back up data","options":["back up data","only rename the original","delete the only copy"],"why":"Backing up means making another copy for recovery.","hint":"A backup is a separate copy; it is not simply renaming the same file."},{"id":"vb2pre13-4","type":"choice","prompt":"Keep the calendar information on your phone and laptop matching. You…","answer":"sync devices","options":["sync devices","automatically create an independent archive","compress the calendar screen"],"why":"Syncing keeps data updated across devices; it is not necessarily an independent backup.","hint":"Synchronisation is not automatically the same as an independent backup."},{"id":"vb2pre13-5","type":"choice","prompt":"Make a file smaller while checking that it remains usable. You…","answer":"compress files","options":["compress files","guarantee a place in a workshop","increase every file’s size"],"why":"Compression reduces size, but the actual result must be checked.","hint":"Check the resulting file size and readability; compression is not guaranteed to meet every limit."},{"id":"vb2pre13-6","type":"choice","prompt":"Send a document to an online storage service. You…","answer":"upload to the cloud","options":["upload to the cloud","save it only on a disconnected local drive","print a paper copy"],"why":"Uploading transfers the file to an online service.","hint":"Access can still depend on the service and an internet connection."},{"id":"vb2pre13-7","type":"choice","prompt":"Your device has no capacity for another installation. You have…","answer":"run out of storage","options":["run out of storage","used up only the battery charge","completed every software update"],"why":"Storage concerns space for data and installations, not battery energy.","hint":"Storage capacity and battery charge are different things."},{"id":"vb2pre13-8","type":"choice","prompt":"Install a newer version of an application or operating system. You…","answer":"update software","options":["update software","necessarily replace the whole device","only change the file name"],"why":"A software update changes the installed version, not necessarily the hardware.","hint":"An update changes software; it does not necessarily require buying a new device."}],"writing":"Write to a fictional centre about a booking problem. Your laptop file is 5 MB but the form allows 2 MB; the phone app is optional and your phone has no storage for an update. You can receive email and can visit Tuesday’s help desk before its 18.00 closure; registration closes Wednesday at noon. Explain the actual problem, propose a feasible digital or assisted route, and ask how availability and confirmation will be checked. Use there and it accurately. Aim for about 120–170 words.","writingModel":"Hello,\nThere seems to be a file-size problem with my booking. The form allows 2 MB, but my PDF is 5 MB, so the upload fails before I receive a reference. It is useful to know that the phone app is optional, as my phone has run out of storage and cannot install the update.\nI can use email on my laptop and have backed up the original document. I could compress a copy, check that the text is still readable and try again. If that does not work, is there a place available through Tuesday’s help desk? I can arrive at 17.30, before it closes.\nIt is important to finish registration before Wednesday at noon. Please confirm which route is suitable and how I will know that the booking, rather than only the file upload, has been completed.","speaking":"Help Alex choose a booking method. Clarify the actual obstacle, distinguish the browser and phone routes, propose a workable alternative and explain what counts as confirmation.","conversation":[{"partner":"I cannot book the workshop. My phone is full, so I think I need to buy a new one. What should you ask first?","goal":"Clarify the booking requirement and the actual failure before recommending a device change.","hint":"Ask whether the app is required and what happens in the browser form."},{"partner":"The app is optional. My laptop upload fails because the PDF is 5 MB and the limit is 2 MB. There is no reference number.","goal":"Explain the barrier and suggest a reversible file-related next step.","hint":"Use there seems to be and keep the original while testing a smaller copy."},{"partner":"I may not be able to fix the file tonight. I can visit Tuesday’s desk at 17.30; it closes at 18.00. Registration closes Wednesday at noon.","goal":"Propose an assisted route that fits the hours and acknowledge that availability needs confirmation.","hint":"An available help method is not yet a guaranteed place."},{"partner":"If the upload finally works, does that prove I have a place? What should I check?","goal":"Distinguish uploading from a confirmed booking and agree the final check.","hint":"The notice requires a reference number; explain what the user should expect."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a316b6c5187b581daa8dee0_ElevenLabs_2026-06-16T15_23_13_Ed%20-%20Sarcastic%20Funny%20Narrator_pvc_sp100_s38_sb75_v3.mp3"}],"audioLibrary":[{"n":5,"title":"Why We Trust Some People Immediately","speaker":"Natalie","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a3163e30bd85049b5d31a7d_ElevenLabs_2026-06-16T14_52_29_Christina%20-%20Energetic%20Commercial%20American%20Female%20Voice.mp3","transcript":["Hi, I’m Natalie. I used to think that trusting someone quickly was either a sign of good instinct or a sign of being too naive. But a few years ago, after a small professional workshop, I started to see it differently.","It was my first week in a new city, and I had signed up for an evening workshop about communication at work. I did not know anyone there, so during the coffee break I felt slightly uncomfortable. Two people started talking to me. The first was Maya. She was energetic, friendly, and very confident. Within two minutes, she was telling me about her career, her contacts, and how useful the workshop would be if I “knew how to meet the right people.”","The second person was Adrian. He was quieter. He asked what had brought me to the city, listened to my answer, and then asked one simple follow-up question. He did not try to impress me. He did not interrupt or turn the conversation back to himself. There was a kind of calm confidence in the way he spoke. Strangely, I trusted him much faster.","At first, I could not explain why. Maya had been warmer on the surface. Adrian had said less. But my reaction was not random. Trust often begins as a social shortcut. We do not have enough time to collect full evidence about every new person we meet, so our brain uses tiny signals: tone of voice, eye contact, timing, consistency, and whether someone creates pressure.","Of course, this shortcut can be wrong. A confident person can seem reliable before they have actually done anything reliable. A quiet person can seem thoughtful when they are simply uninterested. First impressions are useful, but they are not proof. They are more like a first draft of an opinion.","What made Adrian feel trustworthy was not that he smiled or agreed with me. It was that his behaviour felt coherent. His words, body language, and level of attention seemed to match. He listened without taking over the conversation. He asked questions without making me feel judged. Most importantly, he did not create too much pressure. I did not feel that he wanted something from me immediately.","Later that evening, we worked in the same discussion group.
