"Extra help becomes assumed and their effort can become invisible.","They are automatically given a promotion and a bonus.","They are always asked formally whether they have time."],"why":"Repeated help can turn into an unexamined expectation.","hint":"Listen for the change from flattering to taken for granted.","evidence":"They stay late, fix small problems, cover gaps, and somehow everyone else assumes they are fine."},{"id":"b2l11-3","type":"choice","prompt":"When can an extra task be an opportunity rather than automatic overload?","answer":"When it is chosen with attention to learning, role and recognition.","options":["When it is chosen with attention to learning, role and recognition.","Whenever it is accepted instantly without considering other work.","Only when it never requires any effort."],"why":"Leo does not reject extra work; he distinguishes choice from automatic agreement.","hint":"His concern is how the task is selected and what it provides.","evidence":"Extra tasks can help if they are chosen carefully."},{"id":"b2l11-4","type":"choice","prompt":"Why ask which current task should move if a request is urgent?","answer":"It makes the cost and priority decision visible instead of pretending there is unlimited capacity.","options":["It makes the cost and priority decision visible instead of pretending there is unlimited capacity.","It proves the request should always be refused.","It guarantees the extra task will take no time."],"why":"The question supports realistic planning rather than a cold refusal.","hint":"Consider what must change when new work is added.","evidence":"If this is urgent, which of my current tasks should move?"},{"id":"b2l11-5","type":"choice","prompt":"What distinguishes a genuine exception from a system problem in Leo’s argument?","answer":"The same emergency recurring every week suggests reliance on unbounded help.","options":["The same emergency recurring every week suggests reliance on unbounded help.","Any unexpected problem proves the whole team is selfish.","A real emergency must always be planned months ahead."],"why":"Repetition changes how the apparent emergency should be interpreted.","hint":"What pattern matters more than one isolated request?","evidence":"If the same emergency appears every week, it is no longer an emergency."},{"id":"b2l11-6","type":"choice","prompt":"What does Maya’s meeting-notes example show?","answer":"Agreeing to one small task can create a continuing role nobody discusses.","options":["Agreeing to one small task can create a continuing role nobody discusses.","She had explicitly agreed to prepare all future notes permanently.","She had never agreed to prepare notes at all."],"why":"The example connects one yes with an assumed recurring responsibility.","hint":"Separate the original offer from the later expectation.","evidence":"Then I became the person who always prepared them. Nobody asked if I had time."},{"id":"b2l11-7","type":"choice","prompt":"What common position do Maya and Leo reach?","answer":"Agree intentionally, understanding what is accepted and what may need to be delayed.","options":["Agree intentionally, understanding what is accepted and what may need to be delayed.","Say no to every inconvenient request regardless of context.","Accept every request quickly to avoid any awkwardness."],"why":"Their agreement balances support for the team with realistic limits.","hint":"Listen for the alternative to both automatic yes and automatic no.","evidence":"You understand what you are accepting, what you may need to delay, and whether the request fits your priorities."},{"id":"b2l11-8","type":"choice","prompt":"Why can a pause before answering protect trust?","answer":"It can prevent an unrealistic promise that later causes rushed work or resentment.","options":["It can prevent an unrealistic promise that later causes rushed work or resentment.","It removes every cost of the task.","It means no final answer needs to be given."],"why":"A considered answer can be more reliable than an immediate promise.","hint":"Compare the kindness of the moment with the later consequence.","evidence":"Saying yes too quickly can feel kind in the moment, but later it can create resentment, rushed work, and broken trust."}]},{"n":7,"title":"When Technology Solves One Problem and Creates Another","speaker":"Marcus","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a316b6c5187b581daa8dee0_ElevenLabs_2026-06-16T15_23_13_Ed%20-%20Sarcastic%20Funny%20Narrator_pvc_sp100_s38_sb75_v3.mp3","transcript":["Hi, I’m Marcus. A few years ago, I helped a local community centre introduce an online booking system. Before that, people had to call during office hours to book language classes, career advice sessions, and small workshops. The phone was often busy, messages were sometimes lost, and staff spent a huge amount of time writing names into notebooks.","So when the new system arrived, everyone felt relieved. People could book a place in a class at midnight if they wanted to. They received automatic reminders, they could cancel without calling, and the staff could see attendance numbers clearly. For the first few weeks, it looked like a perfect example of technology solving an old-fashioned problem.","But then we noticed something unexpected. The system had made booking easier, but it had also changed people’s behaviour. Some people booked several sessions “just in case” and cancelled at the last minute. Others stopped speaking to the staff entirely, even when they were unsure which class suited them. A few older visitors found the website stressful and came to the centre with printed screenshots, asking someone to help them understand what had gone wrong.","The technology had not created these problems from nothing. It had revealed problems that were already there: limited staff time, unclear course descriptions, and the fact that not everyone feels confident online. But because the system looked clean and efficient, it was easy to forget that real people were still confused behind the screen.","One of the staff members said something that stayed with me: “We have made the queue invisible, but we have not made it disappear.” She was right. Before, the queue was on the phone. Now it was hidden in unanswered emails, abandoned bookings, and people who gave up before asking for help.","This happens with technology more often than we admit. A navigation app can help drivers avoid traffic, but if everyone follows the same shortcut, a quiet street can suddenly become crowded. A messaging platform can make teamwork faster, but it can also create the expectation that everyone is always available. A self-checkout machine can reduce waiting time, but it may also make shopping harder for someone who needs human assistance.","I am not against technology. In fact, the booking system became much better after we changed how we used it. We added clearer descriptions, kept a small number of places available for people who came in person, and trained staff to contact learners who repeatedly booked the wrong level. The problem was not the system itself. The problem was treating the system as if it could replace judgment, patience, and conversation.","That experience changed the way I think about digital tools. Good technology does not simply remove inconvenience. It moves inconvenience around. Sometimes it moves it away from staff and toward users. Sometimes it saves time for confident people but creates barriers for people who need support.","So when someone says, “This app will solve the problem,” I usually ask, “Which problem, and for whom?” A solution that works beautifully for one group may create a new difficulty for another. The real challenge is not just building smarter tools. It is noticing what those tools make easier, what they make harder, and who gets left to deal with the hidden cost."],"tasks":[{"id":"b2l13-1","type":"choice","prompt":"What immediate advantage did the booking system provide?","answer":"People could book outside office hours and staff could view attendance more easily.","options":["People could book outside office hours and staff could view attendance more easily.","It guaranteed that everyone selected the right class.","It removed every need for human assistance permanently."],"why":"The initial benefits concerned access, reminders and administration, not universal understanding.","hint":"Separate a useful feature from a guarantee about every user.","evidence":"People could book a place in a class at midnight if they wanted to."},{"id":"b2l13-2","type":"choice","prompt":"How did easier booking change some users’ behaviour?","answer":"Some reserved several sessions and cancelled late.","options":["Some reserved several sessions and cancelled late.","All users stopped booking any classes.","Everyone began calling staff before making any choice."],"why":"The system made speculative bookings easier, creating a new problem.","hint":"Listen for behaviour that was encouraged by convenience.","evidence":"Some people booked several sessions “just in case” and cancelled at the last minute."},{"id":"b2l13-3","type":"choice","prompt":"What did the clean interface risk hiding?","answer":"Confusion, limited support time and unequal confidence online.","options":["Confusion, limited support time and unequal confidence online.","The fact that the centre had no classes at all.","A rule that every visitor owned a computer."],"why":"The speaker says existing difficulties became easier to overlook.","hint":"The interface’s appearance is not the same as users’ experience.","evidence":"But because the system looked clean and efficient, it was easy to forget that real people were still confused behind the screen."},{"id":"b2l13-4","type":"choice","prompt":"What does the invisible queue represent?","answer":"Unanswered messages, abandoned bookings and people who gave up before asking.","options":["Unanswered messages, abandoned bookings and people who gave up before asking.","An empty building with no remaining demand.","Only a shorter physical queue outside the centre."],"why":"The demand for help had moved rather than disappeared.","hint":"What replaced the busy telephone line?","evidence":"Now it was hidden in unanswered emails, abandoned bookings, and people who gave up before asking for help."},{"id":"b2l13-5","type":"choice","prompt":"Why include examples of navigation, messaging and self-checkout?","answer":"To show that a tool’s benefits can create costs or barriers elsewhere.","options":["To show that a tool’s benefits can create costs or barriers elsewhere.","To argue that all these tools should be banned.","To claim that every user experiences the same problem."],"why":"The examples extend the argument about displaced inconvenience.","hint":"Find the shared relationship, not a universal rejection of tools.","evidence":"A self-checkout machine can reduce waiting time, but it may also make shopping harder for someone who needs human assistance."},{"id":"b2l13-6","type":"choice","prompt":"Which combination improved the booking system?","answer":"Clearer descriptions, some in-person places and staff contact for repeated wrong-level bookings.","options":["Clearer descriptions, some in-person places and staff contact for repeated wrong-level bookings.","Removing all contact with learners and all walk-in places.","Keeping the interface unchanged and blaming confused users."],"why":"The improvements combined clearer information and human judgement.","hint":"Listen for more than a purely technical redesign.","evidence":"We added clearer descriptions, kept a small number of places available for people who came in person, and trained staff to contact learners who repeatedly booked the wrong level."},{"id":"b2l13-7","type":"choice","prompt":"What was the main error in how the centre first used the tool?","answer":"Treating it as a replacement for judgement, patience and conversation.","options":["Treating it as a replacement for judgement, patience and conversation.","Allowing anybody to book after office hours.","Keeping any record of attendance."],"why":"The problem concerned the assumed replacement of human support, not every useful feature.","hint":"Distinguish the system from the assumptions made about it.","evidence":"The problem was treating the system as if it could replace judgment, patience, and conversation."},{"id":"b2l13-8","type":"choice","prompt":"Which question best applies Marcus’s final argument?","answer":"Which group benefits, and who now has to deal with a difficulty that remains?","options":["Which group benefits, and who now has to deal with a difficulty that remains?","How attractive is the interface, regardless of completion?","Can we remove every non-digital route immediately?"],"why":"The final argument asks whose problem is solved and whose hidden cost remains.","hint":"Evaluate a tool from the affected users’ perspectives.","evidence":"Which problem, and for whom?"}]}],"hints":{"vb2pre1-1":"We want to meet socially. Choose the phrase for arranging a meeting.","vb2pre1-2":"Think of relaxed time together, rather than a formal appointment.","vb2pre1-3":"This describes a person’s usual behaviour, not the size of their social circle.","vb2pre1-4":"Look for movement between many social groups.","vb2pre1-5":"Think about how the connection began.","vb2pre1-6":"Think of an ongoing relationship, not necessarily an instant connection.","vb2pre1-7":"Look for shared interests or experiences.","vb2pre1-8":"Here the phrase describes the history of a relationship, not travel.","vb2pre2-1":"Quiet behaviour does not tell you whether someone cares.","vb2pre2-2":"Separate certainty about your own ability from judging other people.","vb2pre2-3":"Look for an interest in understanding, not just a lack of certainty.","vb2pre2-4":"This is a lack of concern, not simply a quiet way of speaking.","vb2pre2-5":"The feeling involves perceived disrespect.","vb2pre2-6":"The person needs an explanation rather than reassurance about success.","vb2pre2-7":"Think about someone’s position in a disagreement.","vb2pre2-8":"Look for a response to something helpful.","vb2pre3-1":"The person is saying no to a proposed event.","vb2pre3-2":"Think about ending the evening, not making a telephone call.","vb2pre3-3":"Consider the host’s comfort, not only how long you want to stay.","vb2pre3-4":"This is figurative relaxation, not a hairstyle instruction.","vb2pre3-5":"The phrase describes different views, not necessarily a broken relationship.","vb2pre3-6":"Here the phrase is about repairing a relationship, not inventing a story.","vb2pre3-7":"The change is gradual; no single argument is necessary.","vb2pre3-8":"Think of changing periods rather than a permanent failure.","vb2pre4-1":"The feeling involves worry about an uncertain event or outcome.","vb2pre4-2":"Focus on tension in a demanding situation; it can overlap with anxious.","vb2pre4-3":"Something that was worrying you has become less of a problem.","vb2pre4-4":"Compare an expected result with the actual one.","vb2pre4-5":"The central idea is more than someone feels able to cope with.","vb2pre4-6":"The event is unexpected enough to interrupt your normal response.","vb2pre4-7":"Learn the phrase with in before the area of work.","vb2pre4-8":"This is advancement within work, not simply being hired for the first time.","vb2pre5-1":"A whisper is quiet; its emotional meaning depends on context.","vb2pre5-2":"The central problem is unclear speech, not necessarily a quiet personality.","vb2pre5-3":"This describes a soft voice and can sound more literary than say.","vb2pre5-4":"A small laugh does not by itself tell you whether someone agrees.","vb2pre5-5":"Use the surrounding events to interpret the sound.","vb2pre5-6":"A groan is a sound; the precise reason still needs evidence.","vb2pre5-7":"Loudness can respond to distance or noise, not only anger.","vb2pre5-8":"This describes audible crying, not merely speaking quietly.","vb2pre7-1":"The expression describes a regular schedule, not every possible job arrangement.","vb2pre7-2":"Different people may be responsible at different times.","vb2pre7-3":"Distinguish extra hours from the hours already on your rota.","vb2pre7-4":"In this lesson, use the word to discuss prolonged work pressure, not to diagnose a colleague.","vb2pre7-5":"This concerns keeping a job, not password security.","vb2pre7-6":"This is leave because of illness, not annual holiday.","vb2pre7-7":"The phrase describes notifying work, not asking a colleague to make a medical diagnosis.","vb2pre7-8":"Here the intended meaning is mentally disconnecting from work.","vb2pre8-1":"The person teaches outside the ordinary class.","vb2pre8-2":"This word refers to people, not the work they submit.","vb2pre8-3":"One specified piece of course work.","vb2pre8-4":"Usually uncountable: some project work, not a project work.","vb2pre8-5":"A desired result, rather than the difficulty blocking it.","vb2pre8-6":"A hurdle is a barrier on the way to a goal.","vb2pre8-7":"Deal with names a response; it does not guarantee a complete solution.","vb2pre8-8":"Encouragement is useful, but it is not a substitute for actionable advice.","vb2pre9-1":"This means avoiding a growing gap, not necessarily being best in the class.","vb2pre9-2":"The gap in progress grows; it is more than choosing to rest once.","vb2pre9-3":"A deliberate rest is not automatically procrastination.","vb2pre9-4":"Attend is followed directly by the session: attend a class, without to.","vb2pre9-5":"Excelling in one area does not mean every skill is equally strong.","vb2pre9-6":"Wanting to act and having a workable opportunity are different things.","vb2pre9-7":"A strong commitment can support a sensible plan, not just a demanding one.","vb2pre9-8":"Persevering can include changing your method.","vb2pre10-1":"Meet a deadline means finish on time, not arrange a meeting about it.","vb2pre10-2":"An informal workload expression, not a weather report.","vb2pre10-3":"Demanding describes the demands of the role; it does not automatically mean badly organised.","vb2pre10-4":"The topic is professional matters outside the usual work discussion.","vb2pre10-5":"A setback slows progress; it need not end the project.","vb2pre10-6":"Overcome means deal successfully with the obstacle, not just notice it.","vb2pre10-7":"Natural combinations include achieve a goal and fulfil an ambition or dream.","vb2pre10-8":"Compare the actual result with an expectation, not only with past performance.","vb2pre11-1":"Check the stated requirement rather than assuming every role needs the same certificate.","vb2pre11-2":"The focus is learning a job through a work-based training programme.","vb2pre11-3":"A vacancy is an available role, not someone who already holds it.","vb2pre11-4":"Work experience can describe a learning placement; it does not itself prove every required skill.","vb2pre11-5":"Use an with the countable noun internship.","vb2pre11-6":"Perks are extra advantages; their exact scope depends on the offer.","vb2pre11-7":"The terms benefits and perks can overlap; read how the particular offer defines them.","vb2pre11-8":"Do not treat a possible bonus as part of guaranteed salary.","vb2pre13-1":"This does not mean deleting every personal document or resetting the device.","vb2pre13-2":"Choose what to move or remove; the phrase does not specify which files.","vb2pre13-3":"A backup is a separate copy; it is not simply renaming the same file.","vb2pre13-4":"Synchronisation is not automatically the same as an independent backup.","vb2pre13-5":"Check the resulting file size and readability; compression is not guaranteed to meet every limit.","vb2pre13-6":"Access can still depend on the service and an internet connection.","vb2pre13-7":"Storage capacity and battery charge are different things.","vb2pre13-8":"An update changes software; it does not necessarily require buying a new device."},"audioTranscriptMatc <script>(function(root){'use strict';

async function review(lesson,kind,text){const speaking=kind==='speaking';const data=await call({action:'writing_feedback',level:'B2',lesson_slug:`b2-pre-course-${lesson.n}-${kind}`,lesson_title:lesson.title,topic:lesson.topic||'Meeting new people and arranging a follow-up',text_type:speaking?'Four-turn scripted roleplay. Evaluate LEARNER replies only, including relevance to ALEX. Do not evaluate the partner lines or infer pronunciation':'Short learner text',writing_skill:speaking?'Express ideas using the lesson grammar in spoken English':'Write a clear connected text using the lesson grammar',learning_objective:lesson.goal,task:speaking?lesson.speaking:lesson.writing,target_min_words:0,target_max_words:speaking?350:(lesson.writingMaxWords||150),language_focus:lesson.languageFocus||('B2 discourse markers: topic changes, addition, correction, clarification, contrast and results. Social connection vocabulary. '+lesson.goal),requirements:[speaking?'Evaluate the words in this transcript; do not infer pronunciation, recording duration or fluency.':'Use the target grammar naturally, with relevant supporting details.','Give concise feedback suitable for a mobile screen. Focus on 1–3 important corrections. Accept other grammatically valid ways to meet the task.',...(lesson.reviewRequirements||[])],text});return validate(data);}
async function transcribe(blob){if(!blob||blob.size===0)throw Error('Please record your answer first.');if(blob.size>8*1024*1024)throw Error('Please use a shorter recording, up to 90 seconds.');const audio_base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Could not read the recording.'));reader.readAsDataURL(blob);});const data=await call({action:'stt',transcription_language:'en',audio_base64,mime:blob.type.split(';')[0]||'audio/webm'});if(typeof data?.text!=='string'||!data.text.trim())throw Error('No speech was recognised. Please record again or type your spoken answer.');return data.text.trim();}
root.B2_AI={review,transcribe,validate};
})(globalThis);

let hintOpen=false;
const localDay=()=>new Date().toLocaleDateString('en-CA');
function streak(){const days=new Set(Object.values(state.answers).filter(x=>x.correct&&x.updatedAt).map(x=>new Date(x.updatedAt).toLocaleDateString('en-CA')));let d=new Date(),n=0;if(!days.has(d.toLocaleDateString('en-CA')))d.setDate(d.getDate()-1);while(days.has(d.toLocaleDateString('en-CA'))){n++;d.setDate(d.getDate()-1);}return n;}
function wordsToday(){return Object.entries(state.answers).filter(([id,a])=>id.startsWith('v')&&a.correct&&new Date(a.updatedAt).toLocaleDateString('en-CA')===localDay()).length;}
function hintText(q){return q.hint||B.hints[q.originalId||q.id]||'Find the subject first, then check what this question asks you to do.';}
function splitText(s,max=420){const chunks=[];const sentences=s.replace(/<br>/g,' · ').split(/(?<=[.!?])\s+(?=[A-Z*“])/);let chunk='';for(const sentence of sentences){if(sentence.length>max){if(chunk){chunks.push(chunk);chunk='';}let words=sentence.split(' '),part='';for(const w of words){if(part.length+w.length>max&&part){chunks.push(part);part='';}part+=(part?' ':'')+w;}if(part)chunks.push(part);}else if(chunk.length+sentence.length>max){chunks.push(chunk);chunk=sentence;}else chunk+=(chunk?' ':'')+sentence;}if(chunk)chunks.push(chunk);return chunks;}
function paginateTheory(text){const parts=[];let heading='Key idea',headers=null;for(const raw of text.replace(/\r/g,'').split('\n')){const line=raw.trim();if(!line)continue;if(/^#{1,4} /.test(line)){heading=line.replace(/^#+ /,'').replace(/\*/g,'');headers=null;continue;}if(line.startsWith('|')){const cells=line.slice(1,-1).split('|').map(x=>x.trim());if(cells.every(x=>/^[-: ]+$/.test(x)))continue;if(!headers){headers=cells;continue;}const row=cells.map((x,i)=>x?`**${headers[i].replace(/\*/g,'')}:** ${x}`:'').filter(Boolean).join('  ·  ');for(const chunk of splitText(row))parts.push({title:heading,text:chunk});continue;}headers=null;for(const chunk of splitText(line))parts.push({title:heading,text:chunk});}
const pages=[];for(const p of parts){const prev=pages[pages.length-1];if(prev&&prev.title===p.title&&prev.text.length+p.text.length<450)prev.text+='\n\n'+p.text;else pages.push({...p});}return pages;}
const theoryPages=new Map(B.lessons.map(x=>[x.n,state.savedTheoryPages[x.n]?.source===x.theory?state.savedTheoryPages[x.n].pages:x.theoryCards?.map(c=>({...c}))||paginateTheory(x.theory)]));
function currentTasks(){if(view==='review')return reviewDeck;if(view==='exam')return examQuestions();if(state.phase==='grammar')return l().tasks;if(state.phase==='listening')return l().listening;if(state.phase==='reading')return l().reading;return [];}
function qNow(){return currentTasks()[view==='review'?reviewIndex:view==='exam'?step:['listening','reading'].includes(state.phase)?step-1:step];}
function vocabQuestion(v){return l().vocabularyQuestions.find(q=>q.id===v.id);}
function getCurrentQuestion(){return state.phase==='vocabulary'&&view==='lesson'?vocabQuestion(l().vocab[step]):qNow();}
function examQuestions(){return E.shuffle(B.lessons.filter(x=>x.module===examModule).flatMap(x=>x.tasks),55+examModule).slice(0,12).map(q=>({...q,originalId:q.id,id:`exam${examModule}-${q.id}`}));}
function footer(left,right){return `<div class="flow-actions">${left}${right}</div>`;}
const btn=(text,action,cls='primary',attrs='')=>`<button type="button" class="${cls}" data-action="${action}" ${attrs}>${text}</button>`;
function frame(label,at,total,body,actions,extra=''){return `<div class="lesson-flow"><div class="flow-top">${btn('← Course map','map','quiet')}<span class="pill">${esc(label)}</span><div class="progress" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${Math.min(at,total)}"><span style="width:${Math.min(at/Math.max(1,total),1)*100}%"></span></div><span class="small">${at} / ${total}</span></div><section class="flow-card ${extra}"><div class="flow-content">${body}</div>${actions}</section></div>`;}
function phaseFooter(nextText='Continue'){return footer(btn(step?'Back':'Course map',step?'back':'map','quiet'),btn(nextText,'next'));}
function map(){const due=E.due(state,allQuestions).length,words=wordsToday(),xp=Object.values(state.answers).filter(a=>a.correct).length*10;return `<div class="dashboard"><section><section class="map-head"><span class="pill">B2 PRE-ADVANCED · POSITIONS 01–13</span><h1>B2 Pre-advanced</h1><p class="muted">11 lessons + 2 checkpoints available · Learn, listen and use your English</p><div class="stats"><div class="stat"><strong>${xp} XP</strong><small>Evo-English</small></div><div class="stat"><strong>🔥 ${streak()}</strong><small>Study streak</small></div><div class="stat"><strong>${state.completed.length}/${B.lessons.length}</strong><small>Available activities complete</small></div></div>${btn('Continue','resume')}<div class="daily-goal"><div><strong>Today’s goal</strong><p>Complete one lesson or recall five words.</p><small>Words today: ${Math.min(5,words)}/5</small></div>${btn('Review words','words')}</div>${!saveOK?'<p class="notice">Storage is unavailable. Export a backup before closing.</p>':''}</section><div class="journey">${B.modules.map((m,i)=>`<div class="module-label">MODULE ${i+1} · ${esc(m.title.toUpperCase())}</div>${B.lessons.filter(x=>x.module===i).map(x=>`<div class="node ${state.completed.includes(x.n)?'done':x.n===state.current?'current':''}"><div class="orb">${state.completed.includes(x.n)?'✓':x.n}</div><article class="node-card"><h2>${esc(x.title)}</h2><p>${esc(x.goal)}</p>${x.type==='checkpoint'?cpMapStatus(x):lessonStatus(x)}${btn(x.type==='checkpoint'?(state.completed.includes(x.n)?'View checkpoint':'Open checkpoint'):state.completed.includes(x.n)?'Practise again':'Start lesson','lesson','primary',`data-n="${x.n}"`)}<div class="stage-links" aria-label="Lesson sections">${(x.type==='checkpoint'?[]:phases).map(p=>btn(({theory:'Learn',grammar:x.tasks.length+' grammar tasks',listening:'Listen',reading:'Read',vocabulary:x.vocab.length+' words',writing:'Write',speaking:'Speak'})[p],'stage','quiet',`data-phase="${p}" data-n="${x.n}"`)).join('')}</div></article></div>`).join('')}`).join('')}</div></section><aside><section class="aside-card"><div class="goal-icon" aria-hidden="true">✦</div><h2>Today’s goal</h2><div class="welcome-illustration"><div class="avatar">A</div><div class="bubble">Hi!</div><div class="avatar warm">D</div></div><p class="muted">Complete one lesson or recall five words.</p></section><section class="aside-card"><span class="pill">A1 → C1</span><div class="levels">${['A1','A2','B1','B2','C1'].map(level=>`<span class="${level==='B2'?'active':''}">${level}</span>`).join('')}</div><p class="small">Planned course: 30 teaching lessons + 6 checkpoints. Positions 1–13 are available: eleven teaching lessons and two checkpoints.</p></section><section class="aside-card course-tools">${btn(unresolvedQuestions().length?`Correct mistakes · ${unresolvedQuestions().length}`:`Spaced review${due?` · ${due} due`:''}`,'review','secondary')}${btn('Audio library','library','secondary')}${btn('Export progress','export','quiet')}<p class="small">Progress and drafts are saved on this device.</p></section></aside></div>`;}
function choiceControls(q){const selected=view==='exam'?examDraft[q.id]:state.taskDrafts[q.id]??state.answers[q.id]?.answer;return `<div class="choices">${E.shuffle(q.options,q.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0)).map((x,i)=>`<label class="option"><input type="radio" name="${q.id}" value="${esc(x)}" ${selected===x?'checked':''}><span class="option-num">${i+1}</span><span>${esc(x)}</span></label>`).join('')}</div>`;}
function controls(q){if(q.options)return choiceControls(q);if(q.type==='order'){const tokens=E.tokens(q),picked=arrangements[q.id]||[];return `<div class="assembled" aria-label="Your sentence">${picked.map(i=>btn(esc(tokens[i])+' ×','remove-token','token',`data-i="${i}"`)).join('')}</div><div class="token-bank">${tokens.map((w,i)=>btn(esc(w),'token','token',`data-i="${i}" ${picked.includes(i)?'disabled':''}`)).join('')}</div>`;}if(q.type==='sequence'){const rows=arrangements[q.id]||E.scramble(q.answer);arrangements[q.id]=rows;return rows.map((s,i)=>`<div class="sequence-row"><span>${i+1}. ${esc(s)}</span>${btn('↑','move','secondary',`data-i="${i}" data-dir="-1" aria-label="Move event ${i+1} up" ${i===0?'disabled':''}`)}${btn('↓','move','secondary',`data-i="${i}" data-dir="1" aria-label="Move event ${i+1} down" ${i===rows.length-1?'disabled':''}`)}</div>`).join('');}return `<label class="small" for="answer">${q.type==='gap'?'Write only the missing word(s).':'Write the complete sentence using the wording in the task.'}</label><input id="answer" class="answer-input" autocomplete="off" spellcheck="false" value="${esc(view==='exam'?examDraft[q.id]||'':state.taskDrafts[q.id]??state.answers[q.id]?.answer??'')}" aria-label="Your answer">`;}
function inputAnswer(q){if(q.options)return document.querySelector(`input[name="${q.id}"]:checked`)?.value||'';if(q.type==='order'){const tokens=E.tokens(q);return (arrangements[q.id]||[]).map(i=>tokens[i]).join(' ');}if(q.type==='sequence')return arrangements[q.id]||[];return document.getElementById('answer')?.value||'';}
function syncReady(){const turnNext=main.querySelector('[data-action="turn-next"]');if(turnNext)turnNext.disabled=!!aiBusy||!!recorder||!conversation().replies[conversation().turn]?.trim();const check=main.querySelector('[data-action="check"], [data-action="exam-next"]');if(check){const q=getCurrentQuestion();if(q){const answer=inputAnswer(q);check.disabled=!answer||Array.isArray(answer)&&!answer.length||q.type==='order'&&(arrangements[q.id]||[]).length!==E.tokens(q).length;}}const cachedButton=main.querySelector('[data-action="show-ai"]');if(cachedButton&&!validReview(state.phase)){cachedButton.dataset.action='analyse';cachedButton.textContent='Analyse with AI';cachedButton.onclick=()=>act('analyse',{});}const analyse=main.querySelector('[data-action="analyse"]');if(analyse)analyse.disabled=!!aiBusy||!answerText(state.phase).trim()||(state.phase==='speaking'&&!conversationComplete());const next=main.querySelector('[data-action="next"]');if(next&&view==='lesson'&&['writing','speaking'].includes(state.phase))next.disabled=!!aiBusy||!!recorder||(step===2&&!productionReady(state.phase));}

n().id;arrangements[id]=arrangements[id].filter(i=>i!==+d.i);render(false);break;}case'move':{const id=getCurrentQuestion().id,a=arrangements[id],i=+d.i,j=i+(+d.dir);[a[i],a[j]]=[a[j],a[i]];render(false);break;}case'transcript':if(toggleListeningTranscript())break;state.transcriptSeen ||= {};state.transcriptSeen[l().n]=true;transcriptNumber=l().audioNumber;transcriptIndex=0;transcriptReturn='lesson';navigate('transcript');break;case'transcript-next':transcriptIndex++;render();break;case'transcript-back':transcriptIndex--;render();break;case'transcript-exit':navigate(transcriptReturn);break;case'reading-text':readingReturn=view;view='reading-text';render();break;case'reading-exit':view=readingReturn;render();break;case'library':libraryIndex=0;navigate('library');break;case'library-next':libraryIndex++;render();break;case'library-back':libraryIndex--;render();break;case'library-transcript':transcriptNumber=B.audioLibrary[libraryIndex].n;transcriptIndex=0;transcriptReturn='library';navigate('transcript');break;case'review':reviewDeck=unresolvedQuestions();if(!reviewDeck.length)reviewDeck=E.due(state,allQuestions);reviewIndex=0;navigate('review');break;case'record':record();break;case'exam':examModule=+d.n;step=0;examDraft=state.examDrafts[examModule]||{};navigate('exam');break;case'exam-next':{const q=qNow(),a=inputAnswer(q);if(!a||Array.isArray(a)&&!a.length){announce('Answer before continuing.');return;}examDraft[q.id]=a;state.examDrafts[examModule]=examDraft;step++;if(step===12)examQuestions().filter(x=>!E.correct(x,examDraft[x.id]||'')).forEach(x=>{state.review[x.originalId]={due:Date.now(),streak:0};});arrangements={};render();break;}case'exam-review':reviewDeck=examQuestions().filter(q=>!E.correct(q,examDraft[q.id]||'')).map(q=>({...q,id:q.originalId}));reviewDeck.forEach(q=>{state.review[q.id]={due:Date.now(),streak:0};});reviewIndex=0;navigate('review');break;case'export':{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='evo-b2-pre-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}}}

<script>(()=>{
  // Forward a real learner selection to the host page's existing translator.
  // The host retains its translation, authentication, quota and card-saving logic.
  if(window.parent===window)return;
  let timer,lastText="",lastTime=0;
  function forward(){if(document.body.classList.contains('is-checkpoint-assessment'))return;
    const selection=window.getSelection();
    const text=(selection?.toString()||"").trim();
    if(!text||text.length>240)return;
    const node=selection.anchorNode;
    const element=node?.nodeType===1?node:node?.parentElement;
    if(element?.closest("input,textarea,select,[contenteditable=true]"))return;
    const now=Date.now();
    if(text===lastText&&now-lastTime<700)return;
    let host,hostSelection;
    try{host=window.parent.document;hostSelection=window.parent.getSelection();}catch(_){return;}
    if(!window.parent.__translatorInit||!hostSelection||host.getElementById("cards-app"))return;
    const previous=[];
    for(let i=0;i<hostSelection.rangeCount;i++)previous.push(hostSelection.getRangeAt(i).cloneRange());
    const proxy=host.createElement("span");
    proxy.textContent=text;
    proxy.setAttribute("aria-hidden","true");
    proxy.style.cssText="position:fixed;left:-10000px;top:0;opacity:0;pointer-events:none;user-select:text;";
    host.body.appendChild(proxy);
    try{
      const range=host.createRange();range.selectNodeContents(proxy);
      hostSelection.removeAllRanges();hostSelection.addRange(range);
      proxy.dispatchEvent(new window.parent.MouseEvent("mouseup",{bubbles:true,view:window.parent}));
      lastText=text;lastTime=now;
    }finally{
      hostSelection.removeAllRanges();
      for(const range of previous)try{hostSelection.addRange(range);}catch(_){}
      proxy.remove();
    }
  }
  function schedule(){clearTimeout(timer);timer=setTimeout(forward,300);}
  document.addEventListener("mouseup",schedule);
  document.addEventListener("touchend",schedule,{passive:true});
  document.addEventListener("selectionchange",schedule);
})();</script></body></html>
