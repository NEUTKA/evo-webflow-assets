studying)**.\n\n**Perfect meaning** She didn’t win, but she could have **(won)**. — “Did you go?” “No, but I should have **(gone)**.”\n\n**Do-support** She doesn’t like it, but I do. / She liked it, but I didn’t.\n\n**Reduced infinitive** I really want to **(go out)**, but I shouldn’t. — “Are you going to sell the car?” “No, I’ve decided not to **(sell it)**.”\n\n**Keep polarity.** Don’t switch positive/negative when you drop the verb phrase.\n\n### Substitution for nouns\n\n**one / ones** avoid repeating a countable noun.\n\n- “Which car?” — “The red **one**.”\n- Will you wear these trousers or the **ones** I gave you?\n- I’d lend you a pen, but this is the only **one** I have.\n\n*Another / others* can also substitute nouns when you mean “a different one/others”.\n\n### Substitution for verb phrases & clauses\n\n**do so** (formal/neutral) = repeat the whole action.\n\n- If I can help, I’ll be happy to **do so**.\n- I won’t apologise because **doing so** would admit I was wrong.\n\nInformal alternatives: *do it / do that*.\n\n**if so / if not** replace conditional clauses: *Be there at 9. If not, call me.*\n\n**so / not** after thinking/saying verbs:\n\n- “Are they coming?” — “I **think so**.”\n- “Will it take long?” — “I **don’t think so**.”\n- “Can we go?” — “I’m **afraid not**.”\n- “Did they leave a key?” — “It **doesn’t seem so** / It **seems not**.”\n\n**so / neither + auxiliary + subject** to agree:\n\n- “I can be there at 10.” — “**So can I**.”\n- “I shouldn’t say anything.” — “**Neither should you**.”\n- “I love this book.” — “**So do I**.”\n\n### Quick patterns\n\n| **Pattern**                    | **Use**                         | **Example**                                                 |\n| ------------------------------ | ------------------------------- | ----------------------------------------------------------- |\n| **[and/but/or] (+) S/AUX (…)** | Drop repeated subject/auxiliary | She called, but **(she)** didn’t leave a message.           |\n| **AUX (+/−) … but S AUX (…)**  | Verb-phrase ellipsis            | We should start, but they **shouldn’t** *(start)*.          |\n| **do/does/did**                | Ellipsis with simple tenses     | She likes it, but I **don’t**.                              |\n| **to / not to** (+ …)          | Reduced infinitive              | I want **to** *(go)*, but I decided **not to** *(go)*.      |\n| **one / ones**                 | Noun substitution               | Take the red **one**, not the blue **one**.                 |\n| **do so / do it**              | Action substitution             | If you must complain, **do so** politely.                   |\n| **so / not** after V           | Replace whole clause            | I **hope so**. / I’m **afraid not**.                        |\n| **so / neither + AUX + S**     | Agreement                       | “I was late.” — “**So was** Tom.” / “**Neither was** Kate.” |\n\n### Common pitfalls\n\n- **Don’t mix tenses/auxiliaries:** *\\*She likes coffee, and I do too drink it* ➜ **and I do** / **and so do I**.\n- **Keep reference clear:** with *do it/that*, make sure *it/that* points to one obvious action.\n- **Use *one/ones* only for countables:** not for uncountables (*some advice*, not *\\*an advice one*).\n\n**Style tip.** Ellipsis and substitution are frequent in speech, emails, and headlines. In formal writing, prefer *do so* over *do it* and keep structures parallel.\n\n\nLesson 19: **Reduced / bare infinitives**\n\n**B2 · ellipsis with*to*· bare infinitive formsavoid repetition · when*to*is kept/dropped**\n\n### 1) What do “reduced” and “bare” infinitives mean?\n\n- **Reduced infinitive (pro-form *to*)** We use **to** alone instead of repeating a full infinitive phrase already understood from context: *“Are you going to watch it?” — “Yes, I’m going **to**.”*\n- **Bare infinitive** The infinitive **without** *to* after certain verbs and patterns: *can go, let him go, make her laugh*.\n\n**Goal:** keep sentences natural and concise while staying grammatical.\n\n### 2) Using *to* instead of a full phrase\n\n#### … + to when the meaning is clear\n\n- *She promised to help and she really wanted **to**.*\n- *I don’t play tennis now, but I used **to**.*\n- *“Will you pay him back?” — “I’m planning **to**.”*\n\nCommon after verbs (*want, hope, plan, refuse, decide, promise, expect*), adjectives (*ready, willing, happy, afraid*) and nouns (*chance, plan, need, decision, way*).\n\n**Be careful with *be*:** when the repeated verb is *be*, we usually keep the full form: *I know I’m not very positive, but I try **to be**.*\n\n### 3) Omitting the whole infinitive (including *to*)\n\n- *We can start unpacking whenever you’re **ready** (to).*\n- *Bring dessert if you like; there’s no **need** (to).*\n\nWe omit the complement when it is obvious and the preceding word can stand alone (*ready, willing, able, allowed, permitted, the plan/need/opportunity*).\n\n### 4) When *to* is normally kept\n\n- **Verb types** after verbs that require a complement: *afford, advise, be able, choose, decide, plan, pretend* → *We can’t afford **to**.* (✗ *\\*We can’t afford.*)\n- **Preference verbs** *would like/love/hate/prefer, want, choose* → *“Would you like to join?” — “I’d like **to**.”*\n- **Negative infinitives** keep *to*: *We agreed **not to** include that rule.*\n\n**After conjunctions** (*if, when, what, as*) speakers often drop *to* with **want/like**: *You can go if you want (to).* · *Come whenever you like.*\n\n### 5) The bare infinitive (no *to*)\n\n| **Pattern**                                 | **Form**                                                | **Example**                                                                                         |\n| ------------------------------------------- | ------------------------------------------------------- | --------------------------------------------------------------------------------------------------- |\n| **Modals**                                  | **modal + V**                                           | *can/could **go**, should **help**, must **leave***                                                 |\n| **Perception verbs** (object + V)           | **see/hear/feel + O + V**                               | *I saw her **cross** the road.* (progressive possible: *crossing*)                                  |\n| **Let / Make / Have**                       | **let/make/have + O + V**                               | *They made us **wait**. · Let him **go**.* (*be made to V* in passive: *We were made **to wait**.*) |\n| **Help**                                    | **help + O + (to) V**                                   | *She helped me (**to**) **finish**.* (both forms OK)                                                |\n| **Had better / would rather / rather than** | **had better V**, **would rather V**, **rather than V** | *You’d better **leave** now. · I’d rather **stay** than **go**.*                                    |\n| **Why (not)…?**                             | **why (not) + V**                                       | *Why not **try** again?*                                                                            |\n\n### 6) Style & clarity tips\n\n- **Avoid repetition** Use the pro-form *to* when the whole phrase is obvious.\n- **Keep meaning clear** If omitting the complement creates ambiguity, repeat the full phrase.\n- **Don’t drop required items** Some verbs sound incomplete without *to*: *\\*We can’t afford.*\n\n### 7) Quick reference\n\n| **Function**           | **Typical form**                                                                 | **Example**                                          |\n| ---------------------- | -------------------------------------------------------------------------------- | ---------------------------------------------------- |\n| Reduce repetition      | **… + to**                                                                       | *“Are you going to watch it?” — “I’m going **to**.”* |\n| Drop entire complement | **adjective/noun + (to)**                                                        | *ready (to), allowed (to), no need (to)*             |\n| Keep *to*              | **afford / advise / decide … ; would like / want; not to**                       | *We agreed **not to** publish.*                      |\n| Bare infinitive        | **modals; let/make/have; see/hear + O + V; had better; would rather; why (not)** | *They made us **wait**.*                             |\n","audioNumber":1,"audioTitle":"Why People Avoid Difficult Conversations.","speaker":"Maya","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a2f8305f789986bf2ec7d3d_ElevenLabs_2026-06-15T04_39_37_Ellen_pvc_sp100_s50_sb75_se0_b_m2.mp3","localAudio":"audio/lesson01-difficult-conversations.mp3","transcript":["Hi, I’m Maya. A few years ago, I believed that honest people always said what they thought. If there was a problem at work, in a friendship, or in a family, I thought the mature thing was simply to talk about it directly. Then I noticed something strange: even people who valued honesty often avoided difficult conversations. And I was one of them.","At first, I thought avoidance was just a lack of courage. But the more I observed it, the more complicated it seemed. People rarely avoid a difficult conversation because they do not care. In many cases, they care too much. They are afraid of damaging a relationship, being misunderstood, or hearing something they are not ready to accept.","A difficult conversation usually contains two problems. The first is the practical issue: a missed deadline, a broken promise, an unfair decision, or a habit that creates tension. The second is the emotional meaning behind it. When someone says, “You never listen to me,” the topic is not only listening. It may also be respect, trust, or feeling invisible.","That is why simple advice like “just be honest” is not always helpful. Honesty without timing can sound like criticism. Honesty without kindness can feel like attack. And kindness without honesty can create a fake peace that does not last. Good communication requires all three: truth, timing, and care.","I learned this during a project with a colleague named Nina. She often changed small parts of our work without telling me. At first, I said nothing because the changes were not huge. But after a few weeks, I felt frustrated and started interpreting everything she did as disrespectful. Instead of asking a clear question, I became cold and distant.","Eventually, Nina asked if something was wrong. I wanted to say, “No, everything is fine,” because that answer felt safer. But I decided to be more honest. I told her that I felt confused when changes were made without discussion, and I asked whether we could agree on a clearer process.","The conversation was uncomfortable, but it was not a disaster. Nina explained that she thought she was helping by fixing small details quickly. She had not realised that it made me feel excluded. We agreed to leave short notes before changing shared documents. The problem did not disappear forever, but the tension became much smaller.","Since then, I have stopped thinking of difficult conversations as moments of conflict. I see them more as moments of repair. They are risky because they can reveal what people really feel. But avoiding them has a cost too. Silence can protect comfort for a day, but it often damages trust over time. The goal is not to say everything immediately. The goal is to say the necessary thing before distance becomes normal."],"mappingNote":"Source recording 01 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Keep the Conversation Moving","goal":"Agree, clarify and avoid unnecessary repetition while negotiating a plan and repairing a disagreement.","topic":"Invitations, tactful disagreement and conversational repair","languageFocus":"Auxiliary ellipsis with clear tense and polarity; so/neither, so/not, one/ones, do so, pro-form to, bare infinitives after modals/let/make/help/would rather.","conversationTitle":"Work out a plan with Alex.","readingLabel":"MESSAGE THREAD","readingIntro":"Follow a group’s messages about a reunion. Resolve short answers and substituted words, then decide what has actually been agreed.","wordBankTitle":"Invitations, boundaries and repair.","theoryCards":[{"title":"Say less without losing meaning","text":"**Ellipsis** leaves out words that the listener can recover: “I can come on Sunday.” — “I **can** too.”\n\n**Substitution** uses a shorter expression: “Which café?” — “The quiet **one**.”\n\nA short answer works only if its reference is clear.","tip":"If two possible meanings compete, repeat the important noun or action."},{"title":"Keep the right auxiliary","text":"“I like small dinners, but Sam **doesn’t**.” (= doesn’t like them)\n\n“She was waiting, and I **was** too.”\n\n“We didn’t book it, but we should **have**.” (= should have booked it)\n\nThe remaining auxiliary shows the tense and meaning of the omitted phrase.","tip":"Positive and negative answers may contrast; do not copy an auxiliary without checking the intended meaning."},{"title":"Agree — or give a different answer","text":"Positive agreement: “I’m tired.” — “**So am I**.” “I like it.” — “**So do I**.”\n\nNegative agreement: “I can’t stay late.” — “**Neither can I**.”\n\nA different answer: “I don’t mind noise.” — “Well, **I do**.”","tip":"So/neither agreement uses auxiliary + subject. It does not mean “therefore”."},{"title":"Replace a whole idea or a noun","text":"“Will Sunday work?” — “I **think so**.” “Is Friday possible?” — “I’m afraid **not**.”\n\n“Use the blue chairs, not the broken **ones**.” Use one/ones for countable nouns, not advice or information.\n\n“You can reply today. If **not**, call tomorrow.” In a formal message, **do so** can replace a clear action.","tip":"Make sure if not and do so point to one recoverable idea."},{"title":"Keep to — omit the repeated action","text":"“Would you like to join?” — “I’d love **to**.”\n\n“I don’t go clubbing now, but I used **to**.”\n\n“We could invite them, but we’ve decided **not to**.”\n\nWhen the repeated verb is be, normally keep it: “I’m not always patient, but I try **to be**.”","tip":"This to stands for a full infinitive; it is not followed by a missing object you need to guess."},{"title":"When a shorter ending is enough","text":"“Come when you’re **ready**.” “Join us if you **want (to)**.”\n\nSome words can stand alone when the complement is obvious. With “I’d like **to**” or “We can’t afford **to**”, keep to in the usual short reply.\n\nDo not shorten an answer so much that the listener cannot tell what you intend.","tip":"An optional omission after want in an if-clause does not make to optional after every verb."},{"title":"Bare infinitives — no to","text":"After core modals: “We can **meet**.” After let/make + object: “Let her **choose**”; “They made us **wait**.”\n\nPassive: “We were made **to wait**.” Help allows either: “Help me **(to) carry** it.”\n\n“Why not **ask**?” “I’d rather **leave** early.” “You’d better **reply**.”","tip":"After would rather use the base form, not to + verb."},{"title":"Clarify the part that matters","text":"“I heard her **leave**” presents the event as a whole; “I heard her **talking**” describes activity in progress.\n\nEllipsis is useful for familiar information. If a short reply sounds negative or ambiguous, check: “Do you mean you can’t come, or that you’d prefer another plan?”","tip":"Natural conversation balances concise answers with explicit clarification."}],"tasks":[{"id":"b2g3-1","type":"choice","prompt":"“I like small gatherings.” Agree with the same preference.","answer":"So do I.","options":["So do I.","So am I.","Neither do I."],"why":"Like is a present-simple main verb. Positive agreement therefore uses so do I.","hint":"Choose the auxiliary for like, then check whether the statement is positive."},{"id":"b2g3-2","type":"choice","prompt":"“I can’t stay after ten.” Say that this is also true for you.","answer":"Neither can I.","options":["Neither can I.","So can I.","Neither do I."],"why":"Negative agreement repeats the modal can after neither.","hint":"The speaker is agreeing with a negative statement involving can."},{"id":"b2g3-3","type":"choice","prompt":"“Maya enjoys big parties, but I ___.” Express the opposite preference.","answer":"don’t","options":["don’t","am not","haven’t"],"why":"Don’t replaces don’t enjoy big parties. The negative contrast is intentional.","hint":"The main verb is enjoy in the present simple."},{"id":"b2g3-4","type":"gap","prompt":"Complete with one word: “Are they coming?” — “I think ___.”","answer":"so","why":"So substitutes for the affirmative clause they are coming.","hint":"You need a substitute for the whole idea, not another auxiliary."},{"id":"b2g3-5","type":"choice","prompt":"Which sentence uses noun substitution naturally?","answer":"I prefer the quiet café to the noisy one.","options":["I prefer the quiet café to the noisy one.","I need some useful advice, not an unhelpful one.","Could you send the information and the other ones?"],"why":"One replaces the countable noun café. Advice and information are uncountable in these contexts.","hint":"Check whether the omitted noun is countable."},{"id":"b2g3-6","type":"choice","prompt":"“You could apologise today.” Replace the repeated action in a formal reply.","answer":"I intend to do so.","options":["I intend to do so.","I intend so.","I intend to one."],"why":"Do so replaces the action apologise today after intend to.","hint":"The substitute refers to an action, not a noun or a belief."},{"id":"b2g3-7","type":"choice","prompt":"“Would you like to come?” Choose the usual concise positive reply.","answer":"I’d love to.","options":["I’d love to.","I’d love.","I’d love coming to."],"why":"To stands for to come after would love.","hint":"The question supplies the full infinitive that the reply can shorten."},{"id":"b2g3-8","type":"gap","prompt":"Keep the repeated verb where needed: “I’m not always patient, but I try ___.”","answer":"to be","why":"With a repeated be complement, the normal shortened phrase is try to be.","hint":"The omitted phrase describes being patient, not doing an unnamed action."},{"id":"b2g3-9","type":"order","prompt":"Build a suggestion using a bare infinitive.","answer":"Why not ask her to choose?","why":"Why not is followed by the base verb ask. Ask someone to do something keeps to before choose.","hint":"There are two verb patterns here; only the first is bare."},{"id":"b2g3-10","type":"edit","prompt":"Remove the unnecessary word: “They made us to wait outside.”","answer":"They made us wait outside.","why":"Active make + object takes the bare infinitive.","hint":"The sentence is active, not we were made to wait."},{"id":"b2g3-11","type":"choice","prompt":"Which passive version is correct?","answer":"We were made to wait outside.","options":["We were made to wait outside.","We were made wait outside.","We were made waiting outside."],"why":"The passive of make someone do uses be made to do.","hint":"The passive pattern differs from the active one."},{"id":"b2g3-12","type":"choice","prompt":"Which sentence expresses a preference correctly?","answer":"I’d rather leave early than miss the last bus.","options":["I’d rather leave early than miss the last bus.","I’d rather to leave early than miss the last bus.","I’d rather leaving early than miss the last bus."],"why":"Would rather takes a bare infinitive for a preference with the same subject.","hint":"Look at the verb immediately after rather."},{"id":"b2g3-13","type":"choice","prompt":"“You can join us if you want.” What has been left out after want?","answer":"to join us","options":["to join us","that we want it","joining the bus"],"why":"The invitation makes to join us recoverable. In this if-clause, to itself may also be omitted.","hint":"Recover the proposed action from the first part of the sentence."},{"id":"b2g3-14","type":"choice","prompt":"Alex says, “I can’t.” Two different activities were just discussed. What is the best response?","answer":"Do you mean you can’t come at all, or can’t stay for dinner?","options":["Do you mean you can’t come at all, or can’t stay for dinner?","Assume Alex is refusing every invitation.","Answer “So do I” without checking."],"why":"A concise reply can be ambiguous when more than one action is available. Clarification protects the intended meaning.","hint":"Grammar alone cannot choose between two possible references."}],"listening":[{"id":"b2l3-1","type":"choice","prompt":"How has Maya’s view of difficult conversations changed?","answer":"She sees them as possible repair, while recognising the risks of both speaking and silence.","options":["She sees them as possible repair, while recognising the risks of both speaking and silence.","She thinks honest people should say every thought immediately.","She now believes that avoiding disagreement always protects trust."],"why":"Her final view balances honest repair with timing and care.","hint":"Compare her opening belief with the conclusion.","evidence":"Since then, I have stopped thinking of difficult conversations as moments of conflict. I see them more as moments of repair."},{"id":"b2l3-2","type":"choice","prompt":"Why, according to Maya, might someone avoid a difficult conversation?","answer":"They may care about the relationship and fear damaging it.","options":["They may care about the relationship and fear damaging it.","They necessarily have no interest in the other person.","They always lack the vocabulary to describe the practical issue."],"why":"Avoidance may come from caring intensely, not simply from indifference.","hint":"Listen for the reason that challenges Maya’s first explanation.","evidence":"In many cases, they care too much."},{"id":"b2l3-3","type":"choice","prompt":"What are the two layers of a difficult conversation?","answer":"A practical issue and the emotional meaning attached to it.","options":["A practical issue and the emotional meaning attached to it.","The person who speaks first and the person who wins.","An official complaint and a legal decision."],"why":"A practical action can carry an emotional meaning involving respect or trust.","hint":"The speaker distinguishes the event from what it may mean to someone.","evidence":"The first is the practical issue: a missed deadline, a broken promise, an unfair decision, or a habit that creates tension. The second is the emotional meaning behind it."},{"id":"b2l3-4","type":"choice","prompt":"What went wrong before Maya spoke to Nina?","answer":"Maya stayed silent, became frustrated and interpreted Nina’s actions as disrespectful.","options":["Maya stayed silent, became frustrated and interpreted Nina’s actions as disrespectful.","Nina refused a direct request to leave the documents unchanged.","Maya immediately explained the problem in a calm discussion."],"why":"The tension grew while the meaning Maya assigned to the changes went untested.","hint":"Notice the sequence between saying nothing and becoming distant.","evidence":"Instead of asking a clear question, I became cold and distant."},{"id":"b2l3-5","type":"choice","prompt":"How did Maya eventually raise the issue?","answer":"She explained her confusion and asked for an agreed process.","options":["She explained her confusion and asked for an agreed process.","She accused Nina of deliberately excluding her.","She announced that Nina could never edit a document again."],"why":"Her opening described the effect and sought a practical arrangement.","hint":"Listen for the difference between an accusation about motives and a request about process.","evidence":"I told her that I felt confused when changes were made without discussion, and I asked whether we could agree on a clearer process."},{"id":"b2l3-6","type":"choice","prompt":"What did Nina’s explanation reveal?","answer":"She thought she was helping and had not realised the effect on Maya.","options":["She thought she was helping and had not realised the effect on Maya.","She had been ordered to replace Maya on the project.","She had changed the files mainly to embarrass Maya."],"why":"The explanation separates Nina’s intention from Maya’s experience of the changes.","hint":"Avoid adding a motive that the recording does not state.","evidence":"Nina explained that she thought she was helping by fixing small details quickly."},{"id":"b2l3-7","type":"sequence","prompt":"Put the stages of the disagreement in order.","answer":["Small unannounced changes create growing frustration.","Maya explains the effect and asks for a clearer process.","The colleagues agree to leave notes before changing shared documents."],"why":"The changes and silence precede the conversation; the shared process is its practical outcome.","hint":"Look for the move from an unspoken interpretation to a spoken request and then an agreement.","evidence":"We agreed to leave short notes before changing shared documents."},{"id":"b2l3-8","type":"choice","prompt":"What does the final advice mean for timing?","answer":"Say what is necessary before distance becomes a normal part of the relationship.","options":["Say what is necessary before distance becomes a normal part of the relationship.","Wait until every source of uncertainty has disappeared.","Speak about every irritation immediately, regardless of circumstances."],"why":"The speaker rejects both endless silence and a rule of immediate disclosure.","hint":"Focus on the boundary between a useful pause and persistent avoidance.","evidence":"The goal is not to say everything immediately. The goal is to say the necessary thing before distance becomes normal."}],"readingTitle":"What did the short reply mean?","readingTexts":[{"title":"Group messages · Wednesday morning","text":"Lena: Shall we get together on Friday for the reunion? The Dock is lively, but the smaller café on Hill Street might make talking easier.\nOmar: I can’t do Friday. I’m working until nine.\nLena: Neither can Eva. She’s on a late shift too. What about Saturday?\nOmar: I could, but I’d rather not go to The Dock. I couldn’t hear anyone last time.\nLena: The Hill Street one, then? It closes at ten. We could meet at seven and call it a night by 9.30.\nOmar: I’d like to. Let me check the bus.\nLena: Please do so before lunch if possible. I need to book a table. If not, I’ll ask the café to hold a provisional place and confirm it tomorrow."},{"title":"Private clarification · Later that morning","text":"Eva: I thought Omar was turning down the invitation. He wrote “I’d rather not”, didn’t he?\nLena: He meant The Dock, not the whole reunion. He’s interested in the Hill Street café. I think you and he just don’t see eye to eye on noisy venues.\nEva: You’re right. We had an argument about plans last week, and I read his reply through that. I don’t want us to drift apart over a misunderstanding. I’ll message him.\nOmar: Thanks for checking, Eva. The Saturday bus works. I can be at the café at seven, but I’ll need to leave at nine. I don’t want to rush everyone.\nEva: That’s fine. I can leave then too. Shall we meet outside and go in together?\nOmar: I’d love to. And I’m sorry our earlier conversation got awkward.\nLena: Great — I’ll book for seven. Eva and Omar can leave at nine, and the rest of us by 9.30. That way we won’t outstay our welcome. Nobody has to stay later to prove they care."}],"reading":[{"id":"b2r3-1","type":"choice","prompt":"What does “Neither can Eva” mean in this thread?","answer":"Eva also cannot meet on Friday.","options":["Eva also cannot meet on Friday.","Eva also dislikes The Dock.","Eva can meet on Friday but refuses to."],"why":"The omitted action comes from Omar’s immediately preceding statement about Friday.","hint":"Recover the action from the previous sentence, not a later preference."},{"id":"b2r3-2","type":"choice","prompt":"What does “the Hill Street one” replace?","answer":"The smaller café on Hill Street.","options":["The smaller café on Hill Street.","The reunion held the previous year.","The last bus from The Dock."],"why":"One substitutes for the countable noun café introduced earlier.","hint":"Find the noun that distinguishes the two venue options."},{"id":"b2r3-3","type":"choice","prompt":"What does Lena ask Omar to “do so” before lunch?","answer":"Check the bus so she can confirm the table numbers.","options":["Check the bus so she can confirm the table numbers.","Book a different venue without telling her.","Apologise to Eva before accepting."],"why":"The previous message supplies check the bus; Lena’s booking explains why the timing matters.","hint":"Connect the substituted action to Lena’s practical reason."},{"id":"b2r3-4","type":"choice","prompt":"Which interpretation of Omar’s first refusal is correct?","answer":"He rejects The Dock, while remaining interested in a Saturday meeting elsewhere.","options":["He rejects The Dock, while remaining interested in a Saturday meeting elsewhere.","He rejects the whole friendship.","He accepts Friday because he finishes work at nine."],"why":"The object of would rather not go is The Dock. Later messages confirm that a different Saturday venue works.","hint":"Use both the original phrase and its later clarification."},{"id":"b2r3-5","type":"choice","prompt":"Which is the final agreed plan?","answer":"Meet at Hill Street at seven; Eva and Omar leave at nine, and others by 9.30.","options":["Meet at Hill Street at seven; Eva and Omar leave at nine, and others by 9.30.","Meet at The Dock after nine on Friday.","Everyone must stay at Hill Street until it closes at ten."],"why":"The final message combines the confirmed arrival with different departure times.","hint":"Check the last message against Omar’s transport constraint."},{"id":"b2r3-6","type":"choice","prompt":"What best explains why the private clarification helps?","answer":"It tests a negative interpretation against the actual preference and produces a workable plan.","options":["It tests a negative interpretation against the actual preference and produces a workable plan.","It proves that concise replies are always rude.","It requires Omar to stay late to show loyalty."],"why":"Eva recognises the influence of an earlier argument; checking the reference repairs a misunderstanding without removing anyone’s boundary.","hint":"Look for both the relationship repair and the practical arrangement."}],"vocab":[{"id":"vb2pre3-1","word":"turn down an invitation","definition":"Politely refuse an invitation.","example":"I had to turn down the invitation because I was working.","hint":"The person is saying no to a proposed event.","sourceLesson":1},{"id":"vb2pre3-2","word":"call it a night","definition":"Decide to stop an evening activity and go home or to bed.","example":"We were tired, so we called it a night at ten.","hint":"Think about ending the evening, not making a telephone call.","sourceLesson":1},{"id":"vb2pre3-3","word":"outstay your welcome","definition":"Stay longer than your host wants or considers polite.","example":"We left before we outstayed our welcome.","hint":"Consider the host’s comfort, not only how long you want to stay.","sourceLesson":1},{"id":"vb2pre3-4","word":"let your hair down","definition":"Relax and enjoy yourself after work or stress.","example":"After the deadline, everyone needed to let their hair down.","hint":"This is figurative relaxation, not a hairstyle instruction.","sourceLesson":1},{"id":"vb2pre3-5","word":"not see eye to eye (with someone)","definition":"Disagree or have different opinions about something.","example":"We don’t see eye to eye on the best venue.","hint":"The phrase describes different views, not necessarily a broken relationship.","sourceLesson":2},{"id":"vb2pre3-6","word":"make up (with someone)","definition":"Become friendly again after an argument.","example":"They made up after talking the problem through.","hint":"Here the phrase is about repairing a relationship, not inventing a story.","sourceLesson":2},{"id":"vb2pre3-7","word":"drift apart","definition":"Gradually become less close or lose contact.","example":"After moving to different cities, we began to drift apart.","hint":"The change is gradual; no single argument is necessary.","sourceLesson":2},{"id":"vb2pre3-8","word":"have ups and downs","definition":"Experience both good and difficult periods.","example":"Our friendship has ups and downs, but we keep talking.","hint":"Think of changing periods rather than a permanent failure.","sourceLesson":2}],"vocabularyQuestions":[{"id":"vb2pre3-1","type":"choice","prompt":"You cannot attend and politely say no. You…","answer":"turn down the invitation","options":["turn down the invitation","outstay your welcome","make up the invitation"],"why":"Turn down means refuse; it need not imply a damaged friendship.","hint":"The person is saying no to a proposed event."},{"id":"vb2pre3-2","type":"choice","prompt":"At 9.30 you decide the evening is over. You…","answer":"call it a night","options":["call it a night","let your hair down","drift apart"],"why":"Call it a night means stop for the evening.","hint":"Think about ending the evening, not making a telephone call."},{"id":"vb2pre3-3","type":"choice","prompt":"You remain at a friend’s house after they clearly want to go to bed. You…","answer":"outstay your welcome","options":["outstay your welcome","make up with them","see eye to eye with them"],"why":"The problem is staying beyond the host’s comfort or polite limit.","hint":"Consider the host’s comfort, not only how long you want to stay."},{"id":"vb2pre3-4","type":"choice","prompt":"After a stressful month you want to relax and have fun. You want to…","answer":"let your hair down","options":["let your hair down","turn an invitation down","drift apart"],"why":"The idiom describes relaxing and enjoying yourself.","hint":"This is figurative relaxation, not a hairstyle instruction."},{"id":"vb2pre3-5","type":"choice","prompt":"Two friends disagree about whether a noisy venue is enjoyable. They…","answer":"don’t see eye to eye on the venue","options":["don’t see eye to eye on the venue","have no interests at all","have definitely ended their friendship"],"why":"Not seeing eye to eye identifies a difference of opinion, not necessarily a permanent break.","hint":"The phrase describes different views, not necessarily a broken relationship."},{"id":"vb2pre3-6","type":"choice","prompt":"After an argument, you talk and become friendly again. You…","answer":"make up","options":["make up","make it up as a false story","outstay your welcome"],"why":"Make up in this relationship context means reconcile.","hint":"Here the phrase is about repairing a relationship, not inventing a story."},{"id":"vb2pre3-7","type":"choice","prompt":"Two friends gradually stop contacting each other after moving away. They…","answer":"drift apart","options":["drift apart","hit it off immediately","call it a night"],"why":"Drift apart describes a gradual loss of closeness.","hint":"The change is gradual; no single argument is necessary."},{"id":"vb2pre3-8","type":"choice","prompt":"Your friendship includes good periods and difficult ones. It…","answer":"has ups and downs","options":["has ups and downs","has no future by definition","means you always agree"],"why":"Ups and downs are changing positive and difficult periods.","hint":"Think of changing periods rather than a permanent failure."}],"writing":"Reply to Alex’s invitation to a noisy Friday gathering. You cannot attend Friday, but would enjoy a quieter meeting on Saturday. Suggest a time and place, clarify that you are declining the plan rather than rejecting the friendship, and address a recent misunderstanding tactfully. Use two natural ellipsis or substitution patterns without making the reference unclear. Aim for about 110–160 words.","writingModel":"Hi Alex,\nThanks for inviting me. I can’t do Friday because I’m working late, but I could on Saturday. I’d rather meet somewhere quieter than The Dock. Would the Hill Street café at seven work for you? If so, I’ll ask them to hold a table.\nI also wanted to clear up my short reply yesterday. When I said I’d rather not, I meant the noisy venue, not spending time together. We don’t always see eye to eye on places, but I value our friendship. I’d like to make up after that awkward conversation.\nI’ll need to call it a night at nine to catch my bus. You don’t have to leave then too. Let me know whether Saturday suits you — I’d love to see you.","speaking":"Negotiate a reunion plan with Alex. Respond to a difference of preference, clarify an ambiguous short answer, offer a workable alternative and confirm the agreement. Use concise answers and at least two natural ellipsis/substitution patterns while keeping the meaning clear.","conversation":[{"partner":"I’d like to organise a reunion this weekend. Would you prefer Friday at a lively bar or Saturday at a small café? Tell me what works for you.","goal":"State your availability and preference, using a concise answer that remains clear.","hint":"You can say “I could on Saturday” if the omitted action is obvious. Give a reason or time constraint."},{"partner":"I’m not keen on a long evening. I’d rather not, actually. I’ve had a tiring week.","goal":"Clarify whether Alex means not meeting at all or not staying for a long evening.","hint":"Ask a direct, tactful clarification instead of treating the short refusal as a rejection of you."},{"partner":"I mean I’d rather not stay late — I would still like to see everyone. Could we make it a short visit somewhere we can hear each other?","goal":"Acknowledge the clarification and propose a place, start time and finish time.","hint":"Use the information about tiredness and noise. You can substitute “the quieter one” only if its reference is clear."},{"partner":"That sounds manageable. Will you check the venue and send the details? I’m glad we cleared up what I meant.","goal":"Confirm the next action and close warmly, using a natural short form such as do so or I’d be happy to.","hint":"Make it explicit which action you are agreeing to; avoid an ambiguous “I can’t” or “I won’t”."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a2f8305f789986bf2ec7d3d_ElevenLabs_2026-06-15T04_39_37_Ellen_pvc_sp100_s50_sb75_se0_b_m2.mp3","writingGuidance":"Use your lesson task and relevant examples. Aim for about 110–160 words; the exact count is not a gate.","writingMaxWords":160,"readingLinkLabel":"Read the source texts"},{"n":4,"module":0,"grammarSourceNumbers":[8],"grammarTrackingSlug":"b2-pre-course-4-grammar","listeningTrackingSlug":"listening_b2_pre_004_interview_wrong","theory":"Lesson 8: **Narrative Tenses + “used to / would”**\n\n**B1–B2 • story grammarPast Simple • Past Continuous • Past Perfect**\n\n### Overview\n\nIn stories we mix past tenses to show **sequence** (what happened), **background** (what was going on), and **earlier past** (what had already happened). For past habits we add *used to* and, in narratives, *would*.\n\n| **Function**                      | **Best choice**             | **Mini pattern**                                           |\n| --------------------------------- | --------------------------- | ---------------------------------------------------------- |\n| Main events (in order)            | **Past Simple**             | **V2 / did + base** — *She opened the door and screamed.*  |\n| Background / actions in progress  | **Past Continuous**         | **was/were + V-ing** — *It was raining as we drove.*       |\n| Earlier past (completed)          | **Past Perfect Simple**     | **had + V3** — *By 8, they had left.*                      |\n| Earlier past (ongoing / repeated) | **Past Perfect Continuous** | **had been + V-ing** — *She had been waiting for an hour.* |\n\n### Past Simple — main line of the story\n\n- **Events** *He parked, locked the car, and ran inside.*\n- **Past habits/states** *We often met after work.* / *She was shy.*\n\nTypical markers: *yesterday, then, suddenly, in 2019, when…*\n\n### Past Continuous — scene setting\n\n- **Background** *The wind was howling and people were queuing outside.*\n- **Interrupted action** *We were having dinner when the lights went out.*\n- **Parallel actions** *She was packing while I was booking the taxi.*\n\n**While** + past continuous (background); **when** commonly introduces the shorter past-simple event.\n\n### Past Perfect Simple — one step earlier\n\n- **Earlier event** *By the time we arrived, the concert had started.*\n- **Experience before a past point** *She had never flown before that trip.*\n- **Quantity up to a past point** *They had written three drafts before Monday.*\n\nOptional after *after/before* when the order is obvious, but preferred in careful writing to avoid ambiguity.\n\n### Past Perfect Continuous — longer, earlier activity\n\n- **Duration** *He was exhausted; he had been driving since dawn.*\n- **Recent activity with present result in the past** *Her eyes were red; she had been crying.*\n- **Repeated earlier action** *She had been emailing him every day that month.*\n\nPrefer simple (not continuous) with *stative* verbs: *They had known each other for years.*\n\n### Past habits: *used to* vs *would*\n\n#### used to + base — habits *and* states now finished\n\n- *We used to live near the sea.* (state)\n- *I used to walk to school.* (habit)\n- **Neg./Q:** *didn’t use to*, *Did you use to…?* (no \\**usedn’t to*)\n\n#### would + base — *narrative* habits (not states)\n\n- *On Sundays my dad would make pancakes and we would eat in the garden.*\n- Avoid with stative verbs: not \\**I would know*, use *I used to know*.\n- Also means “future in the past” in other contexts; rely on story context/time markers.\n\n### Form quick-view\n\n| **Tense**          | **Affirmative**      | **Negative**             | **Question**                      |\n| ------------------ | -------------------- | ------------------------ | --------------------------------- |\n| Past Simple        | **V2** / *was/were*  | **did not + base**       | **did + subject + base?**         |\n| Past Continuous    | **was/were + V-ing** | **was/were not + V-ing** | **was/were + subject + V-ing?**   |\n| Past Perfect       | **had + V3**         | **had not + V3**         | **had + subject + V3?**           |\n| Past Perfect Cont. | **had been + V-ing** | **had not been + V-ing** | **had + subject + been + V-ing?** |\n\n### Signals & common pitfalls\n\n- **Sequence** *First… then… finally…* → mostly Past Simple.\n- **Background** *while, as* → Past Continuous for the longer action.\n- **Earlier past** *by the time, already, before* → Past Perfect.\n- **Duration** *for, since, all morning* → Past Perf. Cont. (dynamic) / Past Perf. (stative).\n- **Not Present Perfect** Stories are anchored in finished past time — avoid Present Perfect unless the time is “up to now”.\n- **“Be used to / get used to”** ≠ *used to*. They mean “be/ become accustomed to” and take a noun/-ing: *I’m used to getting up early.*\n\n### Mini-story (all together)\n\n*It was snowing* when we reached the village (background). The streets *were empty* and the café *looked* closed (past simple states/events). We *had booked* a room earlier, so we went straight to the hotel (earlier past). I was tired — I *had been driving* for six hours (earlier continuous). On winter Saturdays we *would play* board games by the fire and we *used to stay* up late (past habits; one is narrative, one is a state-like routine).\n","audioNumber":4,"audioTitle":"The Interview That Didn’t Go as Planned.","speaker":"Natalie","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a315f09800366f3665778c5_ElevenLabs_2026-06-16T14_31_57_Jessica%20-%20Playful%2C%20Bright%2C%20Warm_pvc_sp100_s50_sb75_v3.mp3","localAudio":"audio/lesson04-interview-wrong.mp3","transcript":["Hi, I’m Natalie. A few years ago, I had a job interview that I was almost certain would go well. The role was in a marketing team at a medium-sized company, and on paper it looked perfect for me. I had the right experience, I knew the industry, and I had spent several evenings preparing answers to every question I thought they might ask.","In fact, I was so prepared that I stopped listening to my own doubts. I memorised examples of successful projects, practised confident body language, and even wrote down a few impressive phrases I wanted to use. By the morning of the interview, I looked calm, but inside I was treating the meeting like a performance I had to deliver perfectly.","At first, everything seemed fine. The interviewer asked about my previous role, and I gave a clear, polished answer. Then she asked a simple question: “Can you tell me about a time when a campaign didn’t work?” I had prepared success stories, but not failure stories. I paused for too long and then gave an answer that sounded safe but empty. I described a minor problem and explained how we fixed it quickly. The interviewer listened politely, but I could feel that I had not really answered the question.","A few minutes later, she asked how I normally dealt with disagreement in a team. Again, I tried to sound professional, but I avoided anything that might make me look difficult. I said I valued communication and respected different opinions, which was true, but it was also too general. I was giving the kind of answers that belong in an interview guide, not in a real conversation.","The interview changed when the interviewer closed her notebook and said, “Natalie, your experience is strong, but I’m not sure I’ve heard how you actually think.” At first, I felt embarrassed. Then I realised she was giving me a chance, not rejecting me. So I stopped trying to be the perfect candidate.","I told her about a campaign that had failed because our team had misunderstood the audience. I explained what I had done wrong, what I had learned, and how it changed the way I looked at research. Then I talked honestly about disagreements: how I used to avoid them, and how I had learned that respectful disagreement can improve a project.","The atmosphere became much more relaxed. The interviewer asked follow-up questions, and for the first time, the interview felt like a conversation rather than an exam. I did not get the job in the end. Another candidate had more direct experience with the company’s market. But the interviewer sent me a short email saying that the second half of the conversation had been much stronger.","That interview taught me something useful. Preparation matters, but over-preparation can make you sound less genuine. Employers do not only want proof that you have succeeded. They also want to understand how you handle mistakes, uncertainty, and pressure. A good interview is not about hiding every weakness. It is about showing that you can think clearly, learn honestly, and communicate like a real person."],"mappingNote":"Source recording 04 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Tell the Story Behind a Setback","goal":"Tell a coherent story that distinguishes background, main events and earlier causes, then explain what changed.","topic":"Interviews, setbacks and learning from mistakes","languageFocus":"Past simple for events, past continuous for background, past perfect and past perfect continuous for earlier causes/duration; used to versus habitual would. Specific evidence rather than polished generalities.","conversationTitle":"Explain a setback to Alex.","readingLabel":"TIMELINE + NOTES","readingIntro":"Compare a candidate’s timeline with interview notes. Identify the missing earlier event and decide which details explain the setback.","wordBankTitle":"Describe pressure, outcomes and experience.","theoryCards":[{"title":"Build a timeline, not a list of tenses","text":"Use the **past simple** for the main events: “I arrived, opened my slides and started.”\n\nUse the **past continuous** for an activity in progress: “While the client **was checking** the chart, I explained the plan.”\n\nChoose the tense from the relationship between events.","tip":"A finished past event normally uses the past simple, even if it matters now."},{"title":"Background and interruption","text":"“I **was answering** a question when the screen **went** blank.” The answer was in progress; the screen failure interrupted it.\n\n“While I **was speaking**, my colleague **was taking** notes.” Both activities were in progress.","tip":"When and while do not mechanically choose a tense. Check the actual time relationship."},{"title":"One step earlier","text":"Use **had + past participle** to show an event earlier than a past reference point: “By the time I opened the file, someone **had changed** the figures.”\n\nThe listener needs to understand which event happened first, not just that both are past.","tip":"After before/after, past perfect may be optional when the order is already clear. Use it when the earlier relationship matters."},{"title":"An earlier activity and its duration","text":"Use **had been + -ing** for an earlier ongoing activity: “I was tired because I **had been preparing** all night.”\n\nCompare a finished amount: “I **had prepared three examples** before the interview.”\n\nWith states, prefer the simple: “I **had known** the client for years.”","tip":"Duration words help, but the distinction between an activity and a state still matters."},{"title":"Used to — habits and states","text":"**Used to + base form** describes a past habit or state that has changed: “I **used to avoid** difficult questions.” “I **used to be** very anxious before interviews.”\n\nQuestions/negatives: “Did you **use to** …?” “I didn’t **use to** …”.","tip":"Be used to doing means be accustomed to doing. It is a different pattern."},{"title":"Would — repeated narrative actions","text":"With a clear past-habit context: “Before each interview, I **would memorise** a perfect introduction.”\n\nFor a past state, use used to: “I **used to have** very little experience.”\n\nWould can also mean future from a past viewpoint; the story must make the intended meaning clear.","tip":"Do not use would for a single completed event just because it happened in the past."},{"title":"Make the setback concrete","text":"Instead of “I communicated badly”, describe the moment: “I **was explaining** the plan when I noticed the client’s confusion. We **had misunderstood** their priorities.”\n\nThen give a result: “I asked a question, rewrote the proposal and sent it the next day.”","tip":"A specific earlier cause is more useful than a vague claim that everything was difficult."},{"title":"Leave the story with learning","text":"“I didn’t get the job, but I learned to explain how I had handled mistakes.” A useful outcome need not be a perfect success.\n\nKeep past events in the past. Move to the present deliberately for a current habit: “Now I prepare one honest setback example.”","tip":"Use time markers to guide the listener: at first, while, by the time, earlier, eventually, afterwards."}],"tasks":[{"id":"b2g4-1","type":"choice","prompt":"Choose the natural main-event sequence for a completed interview yesterday.","answer":"I arrived, introduced myself and answered the first question.","options":["I arrived, introduced myself and answered the first question.","I had been arriving, had been introducing myself and answered the first question.","I have arrived, introduced myself and answered the first question yesterday."],"why":"The past simple carries the sequence of completed events at a finished past time.","hint":"These are main events, not background or events earlier than another past point."},{"id":"b2g4-2","type":"choice","prompt":"“I ___ my first example when the interviewer interrupted me.” Show the action in progress.","answer":"was explaining","options":["was explaining","had explained","have explained"],"why":"The explanation was ongoing when the interruption happened.","hint":"Which action was already in progress at that moment?"},{"id":"b2g4-3","type":"choice","prompt":"Choose the version that explicitly puts the rehearsal before the interview began.","answer":"By the time the interview began, I had rehearsed three examples.","options":["By the time the interview began, I had rehearsed three examples.","By the time the interview began, I will have rehearsed three examples.","By the time the interview began, I have rehearsed three examples."],"why":"Had rehearsed marks completed preparation before a past reference point.","hint":"The reference point is itself past: the interview began."},{"id":"b2g4-4","type":"gap","prompt":"Use the past perfect continuous: “I was exhausted because I ___ all night.” (prepare)","answer":"had been preparing","why":"The earlier activity continued over a period and explains the later exhaustion.","hint":"You need had + been + the -ing form of prepare."},{"id":"b2g4-5","type":"choice","prompt":"Which earlier-past sentence uses a state verb naturally?","answer":"I had known the client for years.","options":["I had known the client for years.","I had been knowing the client for years.","I was know the client for years."],"why":"Know normally describes a state and does not take the continuous form here.","hint":"Duration does not automatically require a continuous tense."},{"id":"b2g4-6","type":"choice","prompt":"You lived near the office in the past but no longer do. Which sentence clearly expresses the former state?","answer":"I used to live near the office.","options":["I used to live near the office.","I am used to live near the office.","I used to living near the office."],"why":"Used to + base form describes a former state; be used to takes a noun or -ing form and has a different meaning.","hint":"You are describing a past living situation, not becoming accustomed to something."},{"id":"b2g4-7","type":"choice","prompt":"The paragraph begins “When I was a junior assistant, every Monday…” Choose the repeated narrative action.","answer":"I would practise my presentation with a colleague.","options":["I would practise my presentation with a colleague.","I would knew the answers.","I have practised my presentation last Monday."],"why":"Would + base form can describe a repeated action when the past-habit context is established.","hint":"The context supplies repetition and a past period."},{"id":"b2g4-8","type":"edit","prompt":"Correct only the verb form after didn’t: “I didn’t used to ask follow-up questions.”","answer":"I didn’t use to ask follow-up questions.","why":"After did not, use the base form use.","hint":"The auxiliary didn’t already carries the past tense."},{"id":"b2g4-9","type":"order","prompt":"Build a sentence explaining an earlier cause.","answer":"I felt anxious because I had lost my notes.","why":"The loss happens earlier than the feeling in the past.","hint":"Start with the later feeling, then use past perfect in its explanation."},{"id":"b2g4-10","type":"choice","prompt":"“While I was setting up the screen, Alex was checking the figures.” What does this suggest?","answer":"Two activities were in progress during the same period.","options":["Two activities were in progress during the same period.","Alex had finished checking before the setup began.","Both activities are predictions about tomorrow."],"why":"The two past continuous clauses describe parallel ongoing actions.","hint":"The sentence gives background activities, rather than an explicit earlier-past step."},{"id":"b2g4-11","type":"choice","prompt":"Which version keeps a finished past story and a current lesson clear?","answer":"I missed the question yesterday. Now I listen before choosing an example.","options":["I missed the question yesterday. Now I listen before choosing an example.","I have missed the question yesterday. Now I listened before choosing an example.","I miss the question yesterday. Now I had listened before choosing an example."],"why":"Past simple anchors yesterday’s event; present simple describes the current habit.","hint":"The time changes deliberately between yesterday and now."},{"id":"b2g4-12","type":"choice","prompt":"Which answer provides the clearest evidence of learning from a setback?","answer":"Our campaign failed because we had interviewed only existing customers. Afterwards, I added interviews with people who had stopped using the product.","options":["Our campaign failed because we had interviewed only existing customers. Afterwards, I added interviews with people who had stopped using the product.","I have always been a very excellent communicator in every situation.","Things were difficult, but I handled them professionally and everything was perfect."],"why":"The answer supplies an earlier cause, a concrete action and a change in method.","hint":"Look for a specific decision and a changed practice, not just a positive self-description."}],"listening":[{"id":"b2l4-1","type":"choice","prompt":"What was the main weakness in Natalie’s preparation?","answer":"She prepared polished success stories more than honest accounts of setbacks.","options":["She prepared polished success stories more than honest accounts of setbacks.","She knew nothing about the company’s industry.","She had not practised answering any questions."],"why":"She had relevant experience and prepared extensively, but the preparation left a gap when asked about failure.","hint":"Distinguish the amount of preparation from its focus.","evidence":"I had prepared success stories, but not failure stories."},{"id":"b2l4-2","type":"choice","prompt":"Why was her first answer about a failed campaign unsatisfactory?","answer":"It sounded safe and avoided explaining a meaningful failure.","options":["It sounded safe and avoided explaining a meaningful failure.","It included confidential financial figures.","It was mainly a complaint about the interviewer."],"why":"A minor problem with a quick fix did not show her thinking about a real setback.","hint":"Listen for what was missing, rather than assuming a factual error.","evidence":"I paused for too long and then gave an answer that sounded safe but empty."},{"id":"b2l4-3","type":"choice","prompt":"What was wrong with saying she valued communication and different opinions?","answer":"It was too general to show how she actually handled disagreement.","options":["It was too general to show how she actually handled disagreement.","The interviewer believed that disagreement should never happen.","Natalie admitted she had never worked in a team."],"why":"The claims could be true while still failing to provide evidence of behaviour.","hint":"Separate a principle from an example of applying it.","evidence":"I said I valued communication and respected different opinions, which was true, but it was also too general."},{"id":"b2l4-4","type":"choice","prompt":"How did Natalie reinterpret the interviewer’s challenge?","answer":"As a chance to show her thinking, rather than an immediate rejection.","options":["As a chance to show her thinking, rather than an immediate rejection.","As proof that the interview had already ended.","As permission to invent a more successful campaign."],"why":"Her reinterpretation allowed her to stop performing a perfect candidate and speak more honestly.","hint":"Notice the change after her initial embarrassment.","evidence":"Then I realised she was giving me a chance, not rejecting me."},{"id":"b2l4-5","type":"choice","prompt":"What specific failure did she eventually describe?","answer":"A campaign in which the team had misunderstood the audience.","options":["A campaign in which the team had misunderstood the audience.","A campaign cancelled because she missed the interview.","A successful campaign that the interviewer wrongly criticised."],"why":"The example gave her a real decision and a lesson about research to explain.","hint":"Listen for the earlier cause of the campaign’s failure.","evidence":"I told her about a campaign that had failed because our team had misunderstood the audience."},{"id":"b2l4-6","type":"choice","prompt":"What changed in the second half of the interview?","answer":"The exchange became more relaxed and included genuine follow-up questions.","options":["The exchange became more relaxed and included genuine follow-up questions.","The interviewer stopped asking anything about mistakes.","Natalie returned to reciting only the phrases she had memorised."],"why":"Specific, honest examples changed the interaction into more of a conversation.","hint":"Focus on the relationship between her answer and the interviewer’s next questions.","evidence":"The interviewer asked follow-up questions, and for the first time, the interview felt like a conversation rather than an exam."},{"id":"b2l4-7","type":"sequence","prompt":"Put the interview’s turning points in order.","answer":["Natalie gives safe, general answers about failure and disagreement.","The interviewer asks to hear how Natalie actually thinks.","Natalie explains a real failure and a change in her approach."],"why":"The unspecific answers prompt the challenge, which then leads to a more concrete account.","hint":"Separate the problem, the intervention and the changed response.","evidence":"So I stopped trying to be the perfect candidate."},{"id":"b2l4-8","type":"choice","prompt":"Which outcome and lesson are both supported?","answer":"She did not get the job, but learned to explain how she handles mistakes and uncertainty.","options":["She did not get the job, but learned to explain how she handles mistakes and uncertainty.","She got the job because honest answers always outweigh relevant experience.","She concluded that preparing at all makes an interview worse."],"why":"The result was not a job offer; the learning concerned showing real thinking alongside preparation.","hint":"Keep the actual hiring result separate from the benefit she gained.","evidence":"I did not get the job in the end. Another candidate had more direct experience with the company’s market."}],"readingTitle":"The missing step in the timeline","readingTexts":[{"title":"Mara’s notes · Before a project interview","text":"Monday, 4.00 p.m. — I finished a slide deck about a campaign that had underperformed. I had used the first customer brief, which focused on attracting new subscribers.\nMonday, 5.40 p.m. — A revised brief arrived by email. I saw the message on my phone while I was travelling home, but I did not open its attachment.\nTuesday, 8.00 a.m. — I rehearsed the slides I had finished on Monday. I felt nervous and wanted the wording to be perfect.\nTuesday, 10.00 a.m. — The interviewer asked why I had treated new subscriptions as the main goal. I was stunned by the question and began defending the old figures.\nTuesday, after the interview — I realised that my account was missing an important step between receiving the email and rehearsing. I had not compared the revised brief with my slides."},{"title":"Interview feedback and Mara’s reflection","text":"The revised brief had changed the priority from gaining new customers to keeping existing ones. The original campaign had brought in many trial users, but few continued paying. Your slides showed experience in analysing acquisition, yet they did not address the retention problem we asked you to discuss.\nWhen you stopped defending the old goal and described how you would check it, the conversation improved. You asked which customers had left and what their first week had been like. Those were useful questions.\nMara’s reflection: I was disappointed with my opening, but relieved that I eventually asked for clarification. I used to believe that a polished presentation would protect me from difficult questions. Before interviews, I would memorise transitions rather than check what had changed. This time, I had been rehearsing the same wording for two hours without testing the central assumption. For the next interview, I will read the latest brief first and prepare one honest explanation of a mistake. I have not been offered this role yet; learning from the discussion is a result in itself."}],"reading":[{"id":"b2r4-1","type":"choice","prompt":"Which earlier action best explains why Mara rehearsed the wrong goal?","answer":"She saw the revised email but did not open and compare its attachment.","options":["She saw the revised email but did not open and compare its attachment.","She had never made a slide deck before.","The interviewer changed the brief during the interview without warning."],"why":"The revised information arrived before the rehearsal, but she did not examine it.","hint":"Use the Monday email and Tuesday rehearsal together."},{"id":"b2r4-2","type":"choice","prompt":"What changed between the two briefs?","answer":"The priority shifted from acquiring new subscribers to retaining existing customers.","options":["The priority shifted from acquiring new subscribers to retaining existing customers.","The company stopped caring about customers altogether.","The presentation was moved from Tuesday to Monday."],"why":"The feedback explains the different business priorities behind the same figures.","hint":"Compare the goal in the original notes with the revised goal in the feedback."},{"id":"b2r4-3","type":"choice","prompt":"Why did evidence of new trial users fail to answer the revised question?","answer":"The revised goal concerned continued use and payment, which trial sign-ups alone did not demonstrate.","options":["The revised goal concerned continued use and payment, which trial sign-ups alone did not demonstrate.","Trial users cannot ever become paying customers.","The interviewer had asked for a biography rather than campaign analysis."],"why":"An increase in acquisition does not by itself show improved retention.","hint":"Connect the metric Mara used to the outcome the revised brief asked about."},{"id":"b2r4-4","type":"choice","prompt":"What does “had been rehearsing” explain in Mara’s reflection?","answer":"An earlier ongoing activity that failed to test the central assumption.","options":["An earlier ongoing activity that failed to test the central assumption.","A future promise that the interview would last two hours.","A completed promotion to a more senior role."],"why":"The earlier repeated rehearsal explains why polished wording did not guarantee an appropriate answer.","hint":"Look for the duration and what the activity did not include."},{"id":"b2r4-5","type":"choice","prompt":"Which sentence about the outcome is accurate?","answer":"Mara has identified a better preparation method, but no job offer is confirmed.","options":["Mara has identified a better preparation method, but no job offer is confirmed.","Mara was immediately promoted after the interview.","The feedback says the whole conversation was useless."],"why":"The notes identify learning and improvement while explicitly leaving the hiring result open.","hint":"Separate improvement in performance from a confirmed employment decision."},{"id":"b2r4-6","type":"choice","prompt":"Which opening would make Mara’s revised setback story most coherent?","answer":"While I was preparing for the interview, I missed a revised goal that had arrived by email. My rehearsal then reinforced the wrong assumption.","options":["While I was preparing for the interview, I missed a revised goal that had arrived by email. My rehearsal then reinforced the wrong assumption.","I am always excellent at preparation, so there was no real problem.","I was promoted because the interviewer disliked every question I asked."],"why":"It establishes background, an earlier cause and the consequence without inventing an outcome.","hint":"A coherent story needs a timeline and evidence, not only a judgement of success or failure."}],"vocab":[{"id":"vb2pre4-1","word":"anxious","definition":"Worried about something uncertain that may happen.","example":"I was anxious about the interview result.","hint":"The feeling involves worry about an uncertain event or outcome.","sourceLesson":3},{"id":"vb2pre4-2","word":"nervous","definition":"Worried or tense before or during a challenging situation.","example":"I felt nervous as I began the presentation.","hint":"Focus on tension in a demanding situation; it can overlap with anxious.","sourceLesson":3},{"id":"vb2pre4-3","word":"relieved","definition":"Pleased because a worry or difficult situation has ended or been avoided.","example":"I was relieved when the missing file was found.","hint":"Something that was worrying you has become less of a problem.","sourceLesson":3},{"id":"vb2pre4-4","word":"disappointed","definition":"Unhappy because something was worse than you hoped or expected.","example":"She was disappointed not to get the job.","hint":"Compare an expected result with the actual one.","sourceLesson":3},{"id":"vb2pre4-5","word":"overwhelmed","definition":"Feeling that demands or emotions are too much to manage.","example":"I felt overwhelmed by the deadlines arriving together.","hint":"The central idea is more than someone feels able to cope with.","sourceLesson":3},{"id":"vb2pre4-6","word":"stunned","definition":"So surprised or shocked that you find it hard to react.","example":"He was stunned by the unexpected announcement.","hint":"The event is unexpected enough to interrupt your normal response.","sourceLesson":3},{"id":"vb2pre4-7","word":"have experience in","definition":"Have done work or activities in a particular area before.","example":"She has experience in customer research.","hint":"Learn the phrase with in before the area of work.","sourceLesson":4},{"id":"vb2pre4-8","word":"be promoted","definition":"Be given a more senior or better-paid position at work.","example":"He was promoted to team leader after a successful year.","hint":"This is advancement within work, not simply being hired for the first time.","sourceLesson":4}],"vocabularyQuestions":[{"id":"vb2pre4-1","type":"choice","prompt":"You keep worrying about an uncertain interview result. You feel…","answer":"anxious","options":["anxious","relieved","indifferent"],"why":"Anxious describes worry about an uncertain situation or outcome.","hint":"The feeling involves worry about an uncertain event or outcome."},{"id":"vb2pre4-2","type":"choice","prompt":"You feel tense and slightly shaky as you begin presenting. You feel…","answer":"nervous","options":["nervous","relieved","neutral"],"why":"Nervous describes tension in a challenging situation. Anxious can overlap, but the other options here do not fit.","hint":"Focus on tension in a demanding situation; it can overlap with anxious."},{"id":"vb2pre4-3","type":"choice","prompt":"You were worried the file was lost, but someone finds it. You feel…","answer":"relieved","options":["relieved","disappointed","offended"],"why":"The removal of a worry produces relief.","hint":"Something that was worrying you has become less of a problem."},{"id":"vb2pre4-4","type":"choice","prompt":"Which word describes an unhappy reaction when a result falls short of your hopes?","answer":"disappointed","options":["disappointed","relieved","neutral"],"why":"Disappointed describes a result falling short of a hope or expectation.","hint":"Compare an expected result with the actual one."},{"id":"vb2pre4-5","type":"choice","prompt":"Several urgent demands arrive together and feel impossible to manage. You feel…","answer":"overwhelmed","options":["overwhelmed","indifferent","relieved"],"why":"Overwhelmed highlights the sense that demands exceed your ability to cope.","hint":"The central idea is more than someone feels able to cope with."},{"id":"vb2pre4-6","type":"choice","prompt":"An unexpected announcement shocks you so much that you cannot answer at first. You are…","answer":"stunned","options":["stunned","curious","relaxed"],"why":"Stunned describes a very strong surprise or shock that interrupts your reaction.","hint":"The event is unexpected enough to interrupt your normal response."},{"id":"vb2pre4-7","type":"choice","prompt":"Choose the correct preposition: “She has experience ___ customer research.”","answer":"in","options":["in","at","on"],"why":"Have experience in + area of work is the target phrase.","hint":"Learn the phrase with in before the area of work."},{"id":"vb2pre4-8","type":"choice","prompt":"A company moves you from assistant to team leader. You…","answer":"are promoted to team leader","options":["are promoted to team leader","are simply attending an interview","have turned down an invitation"],"why":"Being promoted means moving into a more senior or better-paid position.","hint":"This is advancement within work, not simply being hired for the first time."}],"writing":"Tell a specific story about an interview, presentation or project that went wrong. You may use an invented example. Establish the background, explain an earlier cause, describe two main events and state what you learned or changed. Use past simple, a natural past continuous background and an earlier-past form where the time relationship calls for it. Avoid claiming that every setback must end in a job offer or promotion. Aim for about 130–170 words.","writingModel":"Last year, I gave a presentation that went badly at first. I was explaining our campaign results when a client asked why I was measuring new subscriptions. We had changed the project’s priority to retention the previous week, but I had not updated the opening slides.\nI felt nervous and started defending the old figures. I had been practising the presentation for two hours that morning, so the wording felt familiar even though the argument was wrong. Eventually, I stopped and asked which outcome the client needed us to explain.\nWe reviewed the questions together, and I sent a revised report the next day. I was disappointed with my preparation but relieved that we had clarified the problem. I used to memorise presentations too closely. Now I check the latest brief before rehearsing and practise explaining one mistake honestly. The meeting did not become a perfect success, but it changed my preparation for the better.","speaking":"Answer an interview question about a setback. Establish the situation, explain what had happened beforehand, describe your own action and handle follow-up questions about causes and learning. Use a clear past timeline and concrete details. An invented professional or study example is acceptable.","conversation":[{"partner":"Tell me about an interview, presentation or project that did not go as planned. What was happening, and when did you notice the problem?","goal":"Set the background and give a clear main event without hiding the setback.","hint":"A past continuous background can lead into a past simple event. Give a specific moment."},{"partner":"What had happened before that moment? I’d like to understand the cause, not just hear that you were under pressure.","goal":"Explain an earlier event or ongoing preparation that contributed to the problem.","hint":"Use a past perfect form where it clarifies the earlier cause. Say what you did or failed to check."},{"partner":"What did you personally do once you recognised the problem? How did the other people respond?","goal":"Describe your actions and the response with concrete events in order.","hint":"Distinguish your action from the team’s outcome. A useful answer need not claim complete success."},{"partner":"What changed afterwards? Give one example of a habit you used to have and the practical approach you use now.","goal":"Connect the story to a former habit and a specific current improvement.","hint":"Used to works for habits and states. Contrast the old approach with one observable change."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a315f09800366f3665778c5_ElevenLabs_2026-06-16T14_31_57_Jessica%20-%20Playful%2C%20Bright%2C%20Warm_pvc_sp100_s50_sb75_v3.mp3","writingGuidance":"Use your lesson task and relevant examples. Aim for about 130–170 words; the exact count is not a gate.","writingMaxWords":170,"readingLinkLabel":"Read the source texts"},{"n":5,"module":0,"grammarSourceNumbers":[20],"grammarTrackingSlug":"b2-pre-course-5-grammar","listeningTrackingSlug":"listening_b2_pre_008_good_presentations","theory":"Lesson 20: **Perception verbs (look, sound, feel, smell, taste, see, hear)**\n\n**B2 • reference**\n\n### 1) Stative vs dynamic uses\n\n**Stative** When the verb names the *impression* your senses receive, it behaves like a linking verb. Continuous forms are not used.\n\n- *You smell* nice. (not *are smelling*)\n- *This soup tastes* fantastic. (not *is tasting*)\n- *She looks* tired. *You sound* happy.\n\n**Now meaning:** use **can/can’t** with sense verbs → *I can’t hear you.* / *I can see the mountains.*\n\n**Dynamic** Continuous forms are possible when the action is deliberate or has a different meaning.\n\n- *Why are you smelling* the milk? (=checking it)\n- *He’s tasting* the sauce. (=testing flavour)\n- *I’m feeling* the fabric. (=touching)\n- *Why are you looking* over there?\n\nWith **feel** you can also talk about physical/mental state: *I’m not feeling well.*\n\n### 2) Extra meanings of *see/hear*\n\n- *I’m seeing* Jerry for lunch. (=meeting)\n- We *have been seeing* each other. (=dating)\n- I’ve *been hearing* odd rumours about him. (=receiving information)\n\nThese are dynamic uses, so progressive forms are natural.\n\n### 3) Complements after perception verbs\n\n| **Pattern**                                               | **Use**                                            | **Example**                                                 |\n| --------------------------------------------------------- | -------------------------------------------------- | ----------------------------------------------------------- |\n| **look/sound/feel/smell/taste + ADJECTIVE**               | Linking verb (= “seem”). Describes quality.        | *Your skin feels smooth.* / *He sounded nervous.*           |\n| **… + like + NOUN**                                       | Comparison with a noun.                            | *You sound like your mother.* / *This tastes like chicken.* |\n| **… + as if/as though + CLAUSE**                          | Comparison with a whole situation; formal/neutral. | *You look as if you’ve seen a ghost.*                       |\n| **… + like + CLAUSE**                                     | Informal alternative to *as if/as though*.         | *You sound like you didn’t sleep.*                          |\n| **smell/taste of + NOUN**                                 | The real ingredient/odour is present.              | *The soup smells of garlic.*                                |\n| **see/hear/feel/notice/watch + OBJECT + -ing**            | Action in progress / incomplete / repeated.        | *I saw them kissing in the park.*                           |\n| **see/hear/feel/notice/watch + OBJECT + bare infinitive** | Complete, usually short, single action.            | *We watched the runner fall.*                               |\n\n**Listen (to)** behaves like the verbs above when followed by an object: *We listened to her sing / singing.*\n\n### 4) *Seem*, *appear* & *look*\n\n- **seem/appear + ADJ** → *He seems upset.*\n- **seem like + NOUN** → *It seems like a mistake.*\n- **It seems/appears that + CLAUSE**\n- **seem/appear + to + INF** (present) / **to have + PP** (past)\\\n  *She appears to be fine.* / *He seems to have lost the file.*\n\n**Look vs seem:** *You look tired* (visual evidence). *You seem tired* (overall impression from behaviour/voice).\n\n### 5) Adjective, not adverb\n\nWhen perception verbs are linking (stative) verbs, they take an **adjective**, not an adverb—just like *be*.\n\n- ✔ *You look terrible.* ✘ *look terribly* (meaning “seem”).\n- ✔ *She felt bad after that.* ✘ *felt badly*.\n\nUse adverbs only when the verb i
