lse worked too slowly."],"why":"Her original interpretation concerned professionalism, although no official all-hours rule existed.","hint":"Distinguish her belief from an actual company requirement.","evidence":"I told myself I was being helpful, reliable, and committed."},{"id":"b2l7-2","type":"choice","prompt":"Where did the pressure come from?","answer":"Notifications, other people’s late replies and worry about how silence would look.","options":["Notifications, other people’s late replies and worry about how silence would look.","A formal rule demanding a reply every hour.","A technical system that prevented her from disconnecting."],"why":"The pressure was social and psychological rather than the stated company rule.","hint":"Look for the sources of the subtle pressure.","evidence":"It came from the sound of notifications, from seeing other people reply late at night, and from the fear that silence might look lazy or uncooperative."},{"id":"b2l7-3","type":"choice","prompt":"How did short interruptions affect her time away from work?","answer":"Part of her attention remained ready for the next message.","options":["Part of her attention remained ready for the next message.","They helped her stop thinking about work completely.","They only affected the two minutes spent typing."],"why":"The effect continued beyond each short reply.","hint":"Compare the duration of the message with its effect on attention.","evidence":"I was physically away from work, but mentally I had never really left."},{"id":"b2l7-4","type":"choice","prompt":"What happened to her concentration at work?","answer":"Constant partial connection made sustained focus harder.","options":["Constant partial connection made sustained focus harder.","Replying at all hours created longer periods of deep concentration.","Only her colleagues’ work was affected."],"why":"She describes checking messages during and instead of tasks.","hint":"Listen for the effect during the actual working day.","evidence":"The more available I became, the less thoughtful my work became."},{"id":"b2l7-5","type":"choice","prompt":"Why did a late email become a turning point?","answer":"A tired, fast response misunderstood a detail and caused confusion.","options":["A tired, fast response misunderstood a detail and caused confusion.","It resulted in a large company-wide disaster.","It proved that slow replies are always irresponsible."],"why":"The mistake challenged the equation of speed with professional responsibility.","hint":"Keep the actual scale of the incident separate from its lesson.","evidence":"I misunderstood one detail and caused confusion the next morning."},{"id":"b2l7-6","type":"choice","prompt":"Which combination describes her new boundaries?","answer":"Fewer notifications after 6.30, no routine weekend replies and a clear working-hours note.","options":["Fewer notifications after 6.30, no routine weekend replies and a clear working-hours note.","No communication with any colleague at any time.","An instant automatic answer to every request."],"why":"The changes concerned routine contact and clear expectations, not total withdrawal.","hint":"Listen for both the technical change and the message to other people.","evidence":"I also added a short note to my email signature saying that I usually respond during working hours."},{"id":"b2l7-7","type":"sequence","prompt":"Put the developments in order.","answer":["Nadia treats constant availability as a sign of commitment.","A tired late-night response causes confusion.","Nadia communicates boundaries and colleagues adjust."],"why":"The original habit precedes the mistake, which prompts the boundary-setting.","hint":"Track the starting belief, the turning point and the new practice.","evidence":"But most colleagues adjusted quickly."},{"id":"b2l7-8","type":"choice","prompt":"What is Nadia’s final position on genuine emergencies?","answer":"They need a clear process rather than permanent access to everyone.","options":["They need a clear process rather than permanent access to everyone.","They should be ignored under all circumstances.","They justify treating every routine message as urgent."],"why":"She distinguishes a real emergency from routine work that can wait.","hint":"Look for the balance between boundaries and responsibility.","evidence":"If something is truly urgent, there should be a clear process for it."}],"readingTitle":"Who actually needs to respond?","readingTexts":[{"title":"North Studio · Fictional communication policy","text":"Normal office hours are 9.00–17.00. Routine messages received outside your scheduled hours can wait until your next working period; you do not have to monitor the routine inbox at home. A message marked “urgent” by its sender does not automatically count as an emergency.\nEvening cover is listed separately on the rota. The person on cover must monitor the emergency channel between 17.00 and 21.00. A confirmed service outage is an emergency; a routine slide revision is not. If the person on cover cannot respond, the duty manager assigns a replacement. Other employees are not expected to guess who should take over.\nOvertime requires the manager’s agreement before the extra work begins. Staff on sick leave should not monitor work channels. They should follow the team’s usual absence-notification process instead."},{"title":"Two cases · Friday evening","text":"Case 1: Alex works a nine-to-five job and is not on evening cover. At 19.00, a colleague sends him a slide deck labelled “urgent”. The message asks for a cleaner colour scheme for a meeting next Tuesday. Alex has already left a handover note. He wants to switch off for the evening but worries that not replying might affect how committed he appears.\nCase 2: Jo works shifts and is on Friday’s evening cover. Before the shift, Jo calls in sick and tells the duty manager that they cannot work. At 18.30, the manager receives confirmation of a service outage. No replacement has yet been named. Another employee, Sam, notices the message but has not been assigned cover or agreed overtime.\nThe team needs a clear decision in both cases, not an assumption that every available person must respond."}],"reading":[{"id":"b2r7-1","type":"choice","prompt":"Does Alex have to revise the slides at 19.00 under this policy?","answer":"No. The request is routine and he is outside his scheduled hours without cover responsibility.","options":["No. The request is routine and he is outside his scheduled hours without cover responsibility.","Yes, because the sender wrote urgent.","Yes, because next Tuesday is mentioned."],"why":"The label does not override the policy’s definition of an emergency or Alex’s role.","hint":"Combine the type of work with the rota and normal-hours rule."},{"id":"b2r7-2","type":"choice","prompt":"Who should arrange a response to the confirmed outage when Jo is sick?","answer":"The duty manager must assign a replacement.","options":["The duty manager must assign a replacement.","Jo must monitor the channel from sick leave.","Sam automatically becomes responsible because they noticed the message."],"why":"The replacement rule and sick-leave rule identify the next owner.","hint":"Use the rule for unavailable cover, not simply who is online."},{"id":"b2r7-3","type":"choice","prompt":"Which message from Alex best follows the policy?","answer":"I can review this during my next working period; tonight’s emergency cover is for confirmed outages.","options":["I can review this during my next working period; tonight’s emergency cover is for confirmed outages.","I am forbidden ever to open a work message at home.","I must complete all requests marked urgent immediately."],"why":"The reply communicates lack of necessity without turning it into an invented ban.","hint":"Separate a permitted choice from an obligation."},{"id":"b2r7-4","type":"choice","prompt":"Can Sam assume that noticing the outage authorises extra hours?","answer":"No. The manager must allocate cover and overtime needs prior agreement.","options":["No. The manager must allocate cover and overtime needs prior agreement.","Yes. Reading a message always creates overtime permission.","No employee may ever help with an emergency."],"why":"Two practical decisions are needed: ownership and agreement to additional work.","hint":"Read the cover and overtime clauses together."},{"id":"b2r7-5","type":"choice","prompt":"Which statement about Jo is supported?","answer":"Jo followed the relevant next step by reporting illness; the policy does not require monitoring while on sick leave.","options":["Jo followed the relevant next step by reporting illness; the policy does not require monitoring while on sick leave.","Calling in sick means Jo has agreed to work the evening anyway.","Jo’s absence removes the manager’s responsibility to find cover."],"why":"The case records the notification, and the policy explains what happens next.","hint":"Distinguish notifying an absence from carrying out the shift."},{"id":"b2r7-6","type":"choice","prompt":"Which improvement would most directly prevent the uncertainty in Case 2?","answer":"Name and confirm the replacement in the emergency channel before relying on their response.","options":["Name and confirm the replacement in the emergency channel before relying on their response.","Tell all staff to stay connected indefinitely.","Remove the distinction between routine changes and outages."],"why":"It fixes the missing owner while retaining the policy’s boundary.","hint":"Identify the unresolved decision instead of expanding everyone’s obligation."}],"vocab":[{"id":"vb2pre7-1","word":"nine-to-five job","definition":"A job with regular daytime working hours, often Monday to Friday.","example":"A nine-to-five job may still involve occasional agreed exceptions.","hint":"The expression describes a regular schedule, not every possible job arrangement.","sourceLesson":4},{"id":"vb2pre7-2","word":"work shifts","definition":"Work during scheduled periods that may vary across the day or week.","example":"Support staff work shifts so the service remains covered.","hint":"Different people may be responsible at different times.","sourceLesson":4},{"id":"vb2pre7-3","word":"overtime","definition":"Time worked beyond your usual scheduled hours.","example":"Overtime must be agreed with the manager in this fictional policy.","hint":"Distinguish extra hours from the hours already on your rota.","sourceLesson":4},{"id":"vb2pre7-4","word":"burnout","definition":"Severe exhaustion linked to prolonged stress, especially at work.","example":"The team discussed workload and burnout instead of praising constant availability.","hint":"In this lesson, use the word to discuss prolonged work pressure, not to diagnose a colleague.","sourceLesson":4},{"id":"vb2pre7-5","word":"job security","definition":"Confidence that your job will continue and you are unlikely to lose it.","example":"She valued job security as well as flexibility.","hint":"This concerns keeping a job, not password security.","sourceLesson":4},{"id":"vb2pre7-6","word":"sick leave","definition":"Time away from work because you are ill.","example":"He was on sick leave and did not monitor routine messages.","hint":"This is leave because of illness, not annual holiday.","sourceLesson":4},{"id":"vb2pre7-7","word":"call in sick","definition":"Inform your employer that you cannot work because you are ill.","example":"She called in sick before her morning shift.","hint":"The phrase describes notifying work, not asking a colleague to make a medical diagnosis.","sourceLesson":4},{"id":"vb2pre7-8","word":"switch off","definition":"Stop thinking about work and relax, or turn a device off.","example":"A clear handover helped him switch off after his shift.","hint":"Here the intended meaning is mentally disconnecting from work.","sourceLesson":4}],"vocabularyQuestions":[{"id":"vb2pre7-1","type":"choice","prompt":"A role normally follows regular daytime office hours. It is a…","answer":"nine-to-five job","options":["nine-to-five job","night shift by definition","temporary emergency channel"],"why":"The expression describes a regular daytime work pattern.","hint":"The expression describes a regular schedule, not every possible job arrangement."},{"id":"vb2pre7-2","type":"choice","prompt":"Employees cover different scheduled periods across the day. They…","answer":"work shifts","options":["work shifts","all work identical nine-to-five hours","have been promoted automatically"],"why":"Shift work distributes scheduled coverage across different periods.","hint":"Different people may be responsible at different times."},{"id":"vb2pre7-3","type":"choice","prompt":"You work additional hours beyond your usual schedule. This is…","answer":"overtime","options":["overtime","sick leave","job security"],"why":"Overtime means work beyond normal scheduled hours.","hint":"Distinguish extra hours from the hours already on your rota."},{"id":"vb2pre7-4","type":"choice","prompt":"Which term describes severe exhaustion associated with prolonged work stress?","answer":"burnout","options":["burnout","a short notification","a handover note"],"why":"Burnout describes a serious pattern of exhaustion, not one moment of tiredness.","hint":"In this lesson, use the word to discuss prolonged work pressure, not to diagnose a colleague."},{"id":"vb2pre7-5","type":"choice","prompt":"Confidence that your role is likely to continue is…","answer":"job security","options":["job security","password security","overtime"],"why":"Job security concerns the continuation of employment.","hint":"This concerns keeping a job, not password security."},{"id":"vb2pre7-6","type":"choice","prompt":"An employee is away from work because of illness. They are on…","answer":"sick leave","options":["sick leave","overtime","a promotion"],"why":"Sick leave is time away because of illness.","hint":"This is leave because of illness, not annual holiday."},{"id":"vb2pre7-7","type":"choice","prompt":"You notify work that you are ill and cannot attend your shift. You…","answer":"call in sick","options":["call in sick","clock off after completing the shift","apply for a promotion"],"why":"Call in sick describes notifying an absence because of illness.","hint":"The phrase describes notifying work, not asking a colleague to make a medical diagnosis."},{"id":"vb2pre7-8","type":"choice","prompt":"A clear handover helps you stop thinking about work in your free time. It helps you…","answer":"switch off","options":["switch off","take on every extra request","stay permanently reachable"],"why":"Switch off here means mentally disconnect and relax.","hint":"Here the intended meaning is mentally disconnecting from work."}],"writing":"Write to Alex proposing a response-hours arrangement for a fictional team. State the normal hours, explain which routine replies can wait, define one genuine emergency and name an owner or replacement process. Offer a realistic way to handle an exception. Use obligation, permission and no-necessity language accurately without treating them as interchangeable. Aim for about 120–170 words.","writingModel":"Hi Alex,\nCould we agree clearer response hours for the team? Routine requests received after a person’s shift should wait until their next working period. Staff don’t have to monitor the ordinary inbox at home, and a sender’s urgent label should not automatically create an obligation.\nWe do need a route for genuine problems such as a confirmed service outage. The person on the evening rota has to monitor that channel. If they are unavailable, the duty manager should name a replacement rather than leave everyone guessing. Any extra hours would need prior agreement.\nI can help prepare a short handover template so that the person on cover has the necessary details. That should let others switch off without abandoning emergencies. Could we try the arrangement for two weeks and review any cases where the rule was unclear?","speaking":"Negotiate an after-hours request with Alex. Clarify the urgency and your role, distinguish routine work from an emergency, propose an owner and agree a workable exception. Use permission, obligation and lack of necessity accurately.","conversation":[{"partner":"A request has come in after your normal working hours. Can you help tonight? Before you answer, what would you want to know?","goal":"Ask about the real deadline, urgency and your responsibility before accepting an obligation.","hint":"A polite question can clarify whether tonight’s work is necessary."},{"partner":"The slides are for a meeting next Tuesday. The sender marked them urgent, but the service itself is working normally.","goal":"Explain whether the task needs an after-hours response and offer a realistic alternative.","hint":"Don’t have to does not mean mustn’t. You can explain what can wait and when you could do it."},{"partner":"What if a confirmed outage appears later and the scheduled person on cover is unavailable?","goal":"Propose a clear replacement process rather than leaving everyone permanently reachable.","hint":"Name who has to make the assignment and what needs to be agreed."},{"partner":"Could you write a short message explaining the normal rule and that exception to the team?","goal":"Confirm the next step and summarise the boundary without inventing a total ban on contact.","hint":"Include normal hours, an emergency definition and an owner in a concise summary."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a2f9a5ab79970e94da94a7c_ElevenLabs_2026-06-15T06_20_53_Arabella_pvc_sp100_s63_sb100_se78_b_m2.mp3"},{"n":8,"module":1,"grammarSourceNumbers":[17],"grammarTrackingSlug":"b2-pre-course-8-grammar","listeningTrackingSlug":"listening_b2_pre_017_bad_advice","theory":"Lesson 17: **Verb patterns: *verb + object + -ing / to-infinitive***\n\n**B2 • reference**\n\n### Overview\n\nThese patterns place an **object** (me, you, her, us, them, etc.) between a main verb and the next verb. Choice of to-infinitive vs -ing depends on the main verb and meaning.\n\n| **Pattern**                      | **Typical use**                                                   | **Examples**                                                     |\n| -------------------------------- | ----------------------------------------------------------------- | ---------------------------------------------------------------- |\n| **V + object + to-infinitive**   | Requests, permission, obligation, persuasion, plans/arrangements  | *They persuaded me to apply.* • *She allowed us to leave early.* |\n| **V + object + -ing**            | Dislike/complaint, prevention, continuation/repetition            | *I don’t mind you borrowing the car.* • *They kept me waiting.*  |\n| **V + object + bare infinitive** | After *let, make, help*; perception verbs for a *complete* action | *They made us wait.* • *I heard her sing.*                       |\n\nNegation comes before the infinitive: *He advised me not to go*. Use object pronouns (me/him/her/us/them), not subject forms.\n\n### 1) V + object + to-infinitive\n\n#### Common verbs\n\n**advise, allow, ask, beg, cause, convince, enable, encourage, expect, force, get, help, intend, invite, mean, order, persuade, remind, require, teach, tell, urge, warn**\n\n- *They encouraged me to take the course.*\n- *I don’t expect you to understand immediately.*\n- *She warned us not to swim there.*\n\n#### “Want/need/would …”\n\n- *I need you to sign here.*\n- *We’d like you to be on time.*\n- *I’d prefer you to email first.*\n\n**advise / allow** take **object + to-infinitive**; without the object use **-ing**: *They allowed us to park* → *They don’t allow parking*.\n\n### 2) Same verbs with a *that-clause*\n\n**advise, persuade, remind, teach, tell, warn** can also be followed by a **that**-clause.\n\n- *Our tutor advised us that we should start early.*\n- *He reminded me that the deadline was Friday.*\n- *The coach told them that effort beats talent.*\n\nRegister choice: *object + to-infinitive* is often more concise; a *that-clause* is useful for longer content.\n\n### 3) for someone + to-infinitive\n\n#### After verbs of planning/arranging\n\n**arrange, ask, plan, wait** + **for + person + to-infinitive**: *We arranged for the technician to visit.*\n\n#### After adjectives\n\n**essential, important, nice, difficult, possible, common**…: *It’s essential for us to be ready.*\n\n#### After nouns\n\n**advantage, idea, mistake, disaster, request**…: *It was a mistake for you to lend him money.*\n\n#### With *too / enough*\n\n*The file was too large for me to upload.* • *It was warm enough for us to sit outside.*\n\n#### Infinitive of purpose\n\n*The aim is for the students to practise note-taking.*\n\n### 4) Bare infinitive after *let/make/help*\n\n- *She let me leave early.*\n- *The manager made us rewrite the report.*\n- *Can I help you fix the door?* (*help* + to-infinitive is also possible.)\n\n**Passive**: *be made to do* (*We were made to wait*). We don’t use a passive of *let*; use *be allowed to* instead.\n\n#### Perception verbs\n\n**see, hear, notice, watch, feel** + **object + bare inf.** for a *complete* action: *I heard her sing the anthem.*\n\nUse **object + -ing** for an action *in progress*: *I heard her singing in the shower.*\n\n### 5) V + object + -ing\n\nCommon with verbs of **liking/disliking, prevention, continuation**:\n\n**dislike, hate, imagine, involve, keep, mind, prevent, (not) like, remember, resent, risk, stop**\n\n- *I don’t mind you opening the window.*\n- *They kept us waiting for an hour.*\n- *Nothing will prevent them from leaving.*\n- *She resents him telling her what to do.*\n\n**preposition + -ing**: with *prevent/stop/keep* use **from + -ing**.\n\n### Usage notes & pitfalls\n\n- **Object is required** after many verbs: ✗ *They allowed to leave* → ✓ *They allowed us to leave*.\n- **Word order with negation**: *advise/tell/ask + object + not to + V*.\n- **Passive options**: *be expected/allowed/required to do*; *be made to do*.\n- **Meaning difference**: *remember/forget* + **to-inf.** = do a duty later; + **-ing** = recall a past event. (e.g., *Remember to lock* vs *Remember locking*.)\n- **Get + object + to-infinitive** = “persuade/arrange”: *How did you get him to agree?*\n\n### Quick verb lists\n\n| **Take *object + to-inf.***   | advise, allow, ask, beg, cause, convince, enable, encourage, expect, force, get, help, invite, order, persuade, remind, require, teach, tell, urge, warn, want, need, would like/prefer/hate |\n| ----------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Take *object + -ing***      | dislike, hate, imagine, involve, keep, mind, prevent/stop/keep (from), resent, risk, remember (past), deny, catch/find (sb) doing                                                            |\n| **Take *object + bare inf.*** | let, make, help; see/hear/notice/watch/feel (for complete actions)                                                                                                                           |\n\nSome verbs can use *either* pattern with a change in meaning (e.g., *try to do* = attempt; *try doing* = experiment).\n","audioNumber":17,"audioTitle":"The Advice That Sounded Helpful but Wasn’t","speaker":"Samuel","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a525c5108f74ba893eddef8_ElevenLabs_2026-07-11T15_03_36_Liam%20-%20Energetic%2C%20Social%20Media%20Creator_pre_sp100_s50_sb75_v3.mp3","localAudio":"audio/lesson17-bad-advice.mp3","transcript":["Hi, I’m Samuel. A few years ago, a younger colleague named Priya asked me for advice after a difficult client presentation. She had prepared carefully, but the meeting had not gone well. The client interrupted her several times, a senior colleague answered questions that were directed at her, and by the end she had lost confidence in what she was saying.","She asked me what she should do differently next time. I wanted to be encouraging, so I said, “You just need to be more confident. Don’t overthink it.”","At the time, that sounded like helpful advice. It was positive, simple, and easy to remember. The problem was that it gave her almost nothing she could actually use. It described how I wanted her to feel, but not what she could do. It also ignored the power dynamics in the room and treated the whole situation as if it were only a personal confidence problem.","A few days later, I watched a recording of the presentation. I noticed that Priya’s opening was too broad, so the client was not sure where the conversation was going. Her slides contained too much information. More importantly, nobody on our side had agreed who would answer which questions. When Priya paused to think, her senior colleague interpreted the silence as an invitation to speak.","Her confidence had certainly been affected, but it was not the only issue. My advice had shifted responsibility entirely onto her. It suggested that if she simply changed her attitude, everything else would improve.","I apologised and asked whether we could prepare for the next presentation together. This time, we focused on actions rather than personality. She practised the first two minutes until the opening felt clear. We agreed who would answer different kinds of questions. She reduced the amount of text on her slides and prepared a sentence she could use if someone interrupted: “I’d like to finish this point first, and then I’ll come back to your question.”","We also asked the senior colleague to wait a few seconds before answering on her behalf. He had not realised that his attempt to help was making it harder for her to lead the presentation.","The next meeting went much better. Priya did not suddenly become a completely different person. She was still nervous at the beginning. But the structure supported her, the roles were clearer, and she had specific language ready for difficult moments.","That experience changed the way I think about advice. Bad advice is not always cruel or obviously wrong. Sometimes it sounds intelligent because it is short and confident. Phrases such as “Trust your instincts,” “Follow your passion,” “Communicate better,” or “Be more proactive” can contain useful ideas. But without context, they are directions without a map.","Good advice needs to connect to the actual constraints of a situation. It should be specific enough to act on, but flexible enough to respect what the other person already knows.","I have also realised that quick advice is sometimes more comfortable for the person giving it than for the person receiving it. Complex problems make us uncomfortable. We want to fix them quickly, so we offer a clean answer before we have understood the full situation.","Sometimes the most helpful response is not advice at all. It may be a question such as, “Which part was most difficult?” or “Do you want ideas, or do you just need me to listen?” These questions slow the conversation down and prevent us from solving the wrong problem.","Now, before giving advice, I ask about the person’s goal, what they have already tried, and what limitations they are facing. Sometimes they need practical ideas. Sometimes they already know the next step but need reassurance. Sometimes the problem is not personal at all; it is created by the system around them.","I no longer believe that good advice is advice that makes the speaker sound wise. Good advice should increase another person’s ability to think. It should help them see the situation more clearly and choose a realistic next action."],"mappingNote":"Source recording 17 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Give Advice Someone Can Use","goal":"Ask about constraints and offer practical advice that leaves room for the other person to decide.","topic":"Actionable advice for learning, project work and presentations","languageFocus":"Verb + object + to-infinitive; let/make/help + object + bare infinitive; passive be made to; mind/keep + object + -ing; prevent/stop/keep from + -ing; arrange for someone to do.","conversationTitle":"Help Alex prepare without taking over.","readingLabel":"REQUEST + THREE REPLIES","readingIntro":"Compare the learner’s constraints with three advice replies. Choose actions that help her complete her own task.","readingLinkLabel":"Read the request and replies","wordBankTitle":"Learning support, goals and hurdles.","writingGuidance":"Aim for about 120–170 words. Ask one useful question and give two feasible actions, leaving the learner responsible for their own work.","writingMaxWords":170,"theoryCards":[{"title":"Give an action, not just a personality label","text":"“Be confident” describes a hoped-for state. “I **advise you to practise** the first minute” names an action.\n\nCommon patterns: **ask / advise / encourage / remind / tell + object + to + verb**.","tip":"Choose advice that fits the actual task and the time available."},{"title":"Keep the object and place not correctly","text":"“She reminded **me to send** the example.” “I asked **them not to interrupt**.”\n\nUse an object pronoun: me, him, her, us or them. Negation normally goes before to: **object + not to + verb**.","tip":"They told to wait is incomplete; say They told us to wait."},{"title":"Allow someone to do; allow doing","text":"With a person: “The tutor **allows us to record** a rehearsal.”\n\nWithout an object: “The tutor **allows recording**.” The same distinction is useful with advise: “She **advised me to practise**” / “She **advised practising**.”","tip":"Do not use allow to record without saying who is allowed."},{"title":"Let, make and help","text":"“Let **her finish**.” “The deadline made **us focus**.”\n\nLet and make take **object + bare infinitive**, without to. Help allows either: “Help **me prepare / to prepare**.”","tip":"The passive changes make: We were made to wait. For permission, use We were allowed to leave."},{"title":"Mind and keep with -ing","text":"“I don’t **mind you asking** a question.”\n\n“The unclear instructions **kept us guessing**.” Keep + object + -ing describes continuing an activity or state.","tip":"Keep us waiting means make the waiting continue; it does not mean prevent us from waiting."},{"title":"Prevent an action with from + -ing","text":"“The noise **prevented her from concentrating**.”\n\n“We should **stop people from interrupting** the opening.” “A clear role agreement **keeps us from talking** over each other.”","tip":"Keep someone doing continues an action; keep someone from doing prevents it."},{"title":"Arrange for a different person to act","text":"“We **arranged for a peer to listen**.” “I’m **waiting for the tutor to reply**.”\n\nCompare **ask someone to do** (make a request to that person) and **ask for someone to do** (request an arrangement).","tip":"A plan can support another person without doing the assessed work for them."},{"title":"Check the result your advice should produce","text":"“I heard **her explain** the whole example” presents the complete event. “I heard **her practising**” focuses on activity in progress.\n\nAsk the learner to try one action, then ask what changed. Useful advice can be revised when the situation becomes clearer.","tip":"A clear request, a feasible action and a check are more useful than a vague command."}],"tasks":[{"id":"b2g8-1","type":"choice","prompt":"Which advice sentence has the correct verb pattern?","answer":"I advised her to rehearse the opening.","options":["I advised her to rehearse the opening.","I advised her rehearse the opening.","I advised she to rehearse the opening."],"why":"Advise takes an object pronoun followed by a to-infinitive.","hint":"Identify who receives the advice before choosing the next verb form."},{"id":"b2g8-2","type":"edit","prompt":"Correct the pronoun: “I asked they not to interrupt.”","answer":"I asked them not to interrupt.","why":"Ask takes an object pronoun; the negative infinitive here is not to interrupt.","hint":"Use the object form of they after asked."},{"id":"b2g8-3","type":"choice","prompt":"The rule permits recording, without naming a person. Complete: “The tutor allows ___.”","answer":"recording","options":["recording","to recording","record"],"why":"Without a person as object, allow can take -ing.","hint":"Compare allows us to record with allows recording."},{"id":"b2g8-4","type":"gap","prompt":"Use the correct form of finish: “Please let me ___ my point.”","answer":"finish","why":"Let + object takes a bare infinitive.","hint":"Do not add to after let."},{"id":"b2g8-5","type":"edit","prompt":"Correct the passive pattern: “We were made wait outside.”","answer":"We were made to wait outside.","why":"The passive of make + object + bare infinitive uses to.","hint":"The active is They made us wait."},{"id":"b2g8-6","type":"choice","prompt":"Which pair is grammatical after help?","answer":"Help me prepare. / Help me to prepare.","options":["Help me prepare. / Help me to prepare.","Help me preparing. / Help me prepared.","Help I prepare. / Help I to prepare."],"why":"Help can take an object followed by a bare or to-infinitive.","hint":"Two infinitive forms are possible here."},{"id":"b2g8-7","type":"choice","prompt":"The delayed feedback caused an hour of waiting. Complete: “It kept us ___.”","answer":"waiting","options":["waiting","from waiting","to wait"],"why":"Keep + object + -ing describes the continued wait; from waiting would reverse the meaning.","hint":"The group did wait; the delay prolonged it."},{"id":"b2g8-8","type":"gap","prompt":"Add the missing preposition: “The noise prevented me ___ concentrating.”","answer":"from","why":"Prevent someone from doing is the target pattern.","hint":"A preposition introduces the -ing form."},{"id":"b2g8-9","type":"choice","prompt":"Which answer naturally gives permission after “Do you mind me recording this practice?”","answer":"No, I don’t mind you recording it.","options":["No, I don’t mind you recording it.","No, I don’t mind you to record it.","No, I don’t mind you record it."],"why":"Mind is followed here by object + -ing.","hint":"The reply permits the recording; check the form after mind."},{"id":"b2g8-10","type":"order","prompt":"Build a sentence about arranging support.","answer":"We arranged for a peer to check the opening.","why":"Arrange for + person + to-infinitive describes the planned support.","hint":"Keep for a peer before the infinitive."},{"id":"b2g8-11","type":"choice","prompt":"You heard an entire rehearsal, from start to finish. Which pattern presents the complete event?","answer":"I heard her explain the example.","options":["I heard her explain the example.","I heard her to explain the example.","I heard she explained the example."],"why":"Perception verb + object + bare infinitive can present a complete observed event.","hint":"This reviews the complete-event pattern from lesson 5."},{"id":"b2g8-12","type":"choice","prompt":"Which advice best fits someone who has ten minutes and must present their own work?","answer":"Ask a peer to listen to one short opening and name one unclear point.","options":["Ask a peer to listen to one short opening and name one unclear point.","Tell a peer to write and deliver the whole presentation instead.","Encourage them to redesign every slide before the ten minutes end."],"why":"The first action respects both the time constraint and ownership of the task.","hint":"Useful advice needs to be feasible and leave the learner able to act."}],"listening":[{"id":"b2l8-1","type":"choice","prompt":"Why did Samuel’s first advice give Priya little practical help?","answer":"It named a desired feeling without explaining what to do or addressing the room’s dynamics.","options":["It named a desired feeling without explaining what to do or addressing the room’s dynamics.","It contained a detailed plan that she refused to follow.","It focused on changing the client’s presentation slides."],"why":"He distinguished a hoped-for feeling from an actionable response.","hint":"Listen for the gap between feeling and action.","evidence":"It described how I wanted her to feel, but not what she could do."},{"id":"b2l8-2","type":"choice","prompt":"What did the recording reveal about the senior colleague’s interruptions?","answer":"Question roles were unclear, so he treated her thinking pauses as a chance to answer.","options":["Question roles were unclear, so he treated her thinking pauses as a chance to answer.","He had been assigned every client question in advance.","Priya had asked him to replace her as lead presenter."],"why":"The team’s lack of a role agreement helped create the problem.","hint":"Connect the unagreed roles with the interpretation of silence.","evidence":"When Priya paused to think, her senior colleague interpreted the silence as an invitation to speak."},{"id":"b2l8-3","type":"choice","prompt":"Why was it unfair to treat the whole problem as a lack of confidence?","answer":"It placed all responsibility on Priya while ignoring structural and interpersonal factors.","options":["It placed all responsibility on Priya while ignoring structural and interpersonal factors.","It meant nobody was allowed to practise the opening.","It proved that confidence can never affect a presentation."],"why":"Confidence was affected, but Samuel had ignored other causes.","hint":"The speaker does not say that confidence was irrelevant.","evidence":"My advice had shifted responsibility entirely onto her."},{"id":"b2l8-4","type":"choice","prompt":"Which preparation directly helped Priya retain the speaking turn?","answer":"She prepared a sentence for interruptions, and the senior colleague was asked to wait.","options":["She prepared a sentence for interruptions, and the senior colleague was asked to wait.","She agreed never to pause or answer a question.","She added more text so nobody could interrupt."],"why":"Both a prepared phrase and an agreed change in the colleague’s behaviour supported her role.","hint":"Look for changes on both sides of the interaction.","evidence":"We also asked the senior colleague to wait a few seconds before answering on her behalf."},{"id":"b2l8-5","type":"choice","prompt":"What does the better meeting suggest about the source of improvement?","answer":"Clearer structure and roles helped even though Priya was still initially nervous.","options":["Clearer structure and roles helped even though Priya was still initially nervous.","Success required her to become an entirely different person.","The client was no longer allowed to ask questions."],"why":"The outcome improved without the instant personality change implied by the first advice.","hint":"Compare her feelings with the support now available.","evidence":"She was still nervous at the beginning. But the structure supported her, the roles were clearer, and she had specific language ready for difficult moments."},{"id":"b2l8-6","type":"choice","prompt":"What does “directions without a map” mean in this argument?","answer":"A confident general phrase may lack the context needed to turn it into action.","options":["A confident general phrase may lack the context needed to turn it into action.","Every short piece of advice is necessarily false.","Good advice must contain literal geographical directions."],"why":"The speaker allows that the phrases can contain useful ideas, but requires context.","hint":"Do not turn a qualified criticism into an absolute ban.","evidence":"But without context, they are directions without a map."},{"id":"b2l8-7","type":"choice","prompt":"Why might someone offer advice too quickly?","answer":"A neat answer can ease the giver’s discomfort before they understand the problem.","options":["A neat answer can ease the giver’s discomfort before they understand the problem.","The receiver always wants an immediate command.","Complex problems usually have one obvious solution."],"why":"The comfort of the advice giver can drive premature solutions.","hint":"Ask whose discomfort the quick answer may reduce.","evidence":"We want to fix them quickly, so we offer a clean answer before we have understood the full situation."},{"id":"b2l8-8","type":"choice","prompt":"Which response best follows Samuel’s final approach?","answer":"Ask what the person wants, has tried and faces before proposing a realistic next step.","options":["Ask what the person wants, has tried and faces before proposing a realistic next step.","Give the shortest confident slogan so the speaker sounds wise.","Assume every difficulty is caused by the receiver’s attitude."],"why":"Useful advice should support the receiver’s thinking and action.","hint":"Focus on the person’s ability to choose, not the giver’s image.","evidence":"It should help them see the situation more clearly and choose a realistic next action."}],"readingTitle":"Three replies, one real constraint","readingTexts":[{"title":"Mara’s request to the study group","text":"Our assignment is a four-person presentation on Tuesday. Each of us must explain our own example for one minute. I have finished my research, but I lose my place when the others answer questions during my part. The lecturer allows us to practise together but will assess each person’s own explanation.\nI look after my younger brother in the evenings. I can practise from 12.15 to 12.30 on Monday, and I can send a voice recording earlier that morning. My peers live in different time zones, so a full evening rehearsal is not possible. I could ask my private tutor for feedback, but their next lesson is on Wednesday. My goal is to finish one clear explanation, not redesign the whole project. What would you suggest?"},{"title":"Replies from three peers","text":"Reply A: You need to believe in yourself. Stop worrying and sound confident. Book a two-hour rehearsal tonight so everybody feels prepared.\nReply B: Which part makes you lose your place: finding the example or responding to the interruption? Ask one peer to listen to your morning recording and identify one unclear point. Use Monday’s fifteen minutes to practise that point and agree who answers questions. Let each speaker finish before the others add details.\nReply C: Ask your private tutor to write a new script on Wednesday. Then get the strongest member of the group to deliver your part. That will remove the hurdle of speaking.\nMara wants support with her own explanation. She has not asked someone to replace her."}],"reading":[{"id":"b2r8-1","type":"choice","prompt":"Which reply best meets both Mara’s timing and the assignment requirement?","answer":"B: it uses the recording and Monday slot while keeping her responsible for her explanation.","options":["B: it uses the recording and Monday slot while keeping her responsible for her explanation.","A: tonight’s long rehearsal matches her stated availability.","C: a Wednesday script and replacement speaker meet Tuesday’s individual assessment."],"why":"Only B fits the available preparation window and the requirement to speak for herself.","hint":"Combine the dates, available time and assessment rule."},{"id":"b2r8-2","type":"choice","prompt":"Why is the private tutor not the main solution suggested in Reply C?","answer":"The next lesson is after the presentation, and a substitute speaker would defeat the individual task.","options":["The next lesson is after the presentation, and a substitute speaker would defeat the individual task.","Private tutors are forbidden from giving any practice feedback.","Mara has not completed any research for the project."],"why":"The tutor’s timing and the proposed substitution are separate conflicts with the request.","hint":"Use what the text says, rather than inventing a ban on support."},{"id":"b2r8-3","type":"choice","prompt":"What does B’s first question help establish?","answer":"Whether the hurdle concerns locating the content or handling turn-taking.","options":["Whether the hurdle concerns locating the content or handling turn-taking.","Whether Mara should abandon the completed research.","Whether all her peers are in the same time zone."],"why":"It clarifies the actual difficulty before choosing an action.","hint":"Find the distinction within the question."},{"id":"b2r8-4","type":"choice","prompt":"Which role agreement would directly address Mara’s reported problem?","answer":"Let her finish her example before peers add answers, then use an agreed question handover.","options":["Let her finish her example before peers add answers, then use an agreed question handover.","Give every peer permission to answer during her minute.","Remove her example so only one person is assessed."],"why":"The problem arises when others answer during her part, not from the absence of research.","hint":"Link the intervention to the reported interruption."},{"id":"b2r8-5","type":"choice","prompt":"What is missing from “believe in yourself” as used in Reply A?","answer":"A feasible action linked to the interruption problem and her real availability.","options":["A feasible action linked to the interruption problem and her real availability.","A promise that the private tutor is free before Tuesday.","A requirement to replace all her peers."],"why":"The encouragement does not explain how she can manage the practical hurdle; the added rehearsal also conflicts with her schedule.","hint":"Positive tone does not make an action feasible."},{"id":"b2r8-6","type":"choice","prompt":"How could Mara check whether B’s plan helped before Tuesday?","answer":"Record the revised example and ask whether the peer can follow it without completing her sentences.","options":["Record the revised example and ask whether the peer can follow it without completing her sentences.","Count how many new slides the tutor writes on Wednesday.","Measure success only by whether she feels completely fearless."],"why":"A relevant check tests clarity and ownership of her speaking turn.","hint":"Choose evidence of the intended skill, within the available time."}],"vocab":[{"id":"vb2pre8-1","word":"private tutor","definition":"A teacher who gives additional lessons to one learner or a small group.","example":"A private tutor can help Mara practise her own opening, rather than write it for her.","hint":"The person teaches outside the ordinary class.","sourceLesson":5},{"id":"vb2pre8-2","word":"peers","definition":"People of a similar age, level or status to you.","example":"Her peers can give feedback on whether the explanation is clear.","hint":"This word refers to people, not the work they submit.","sourceLesson":5},{"id":"vb2pre8-3","word":"assignment","definition":"A particular piece of work a teacher asks a learner to complete.","example":"The assignment requires each group member to speak.","hint":"One specified piece of course work.","sourceLesson":5},{"id":"vb2pre8-4","word":"project work","definition":"Work on an extended task with an aim, often involving several stages.","example":"Their project work includes research, slides and a group presentation.","hint":"Usually uncountable: some project work, not a project work.","sourceLesson":5},{"id":"vb2pre8-5","word":"goal","definition":"A result you want to achieve.","example":"Her immediate goal is to explain one example clearly.","hint":"A desired result, rather than the difficulty blocking it.","sourceLesson":6},{"id":"vb2pre8-6","word":"hurdle","definition":"A difficulty you need to overcome to make progress.","example":"Finding a shared practice time was the main hurdle.","hint":"A hurdle is a barrier on the way to a goal.","sourceLesson":6},{"id":"vb2pre8-7","word":"deal with (a problem)","definition":"Take action to manage or resolve a difficulty.","example":"Agreeing question roles helped the group deal with interruptions.","hint":"Deal with names a response; it does not guarantee a complete solution.","sourceLesson":6},{"id":"vb2pre8-8","word":"believe in yourself / someone","definition":"Have confidence in your own or another person’s ability or potential.","example":"I believe in you; let us also choose a practical first step.","hint":"Encouragement is useful, but it is not a substitute for actionable advice.","sourceLesson":6}],"vocabularyQuestions":[{"id":"vb2pre8-1","type":"choice","prompt":"A learner pays for additional individual teaching outside class. Who provides it?","answer":"a private tutor","options":["a private tutor","a class assignment","an assessment deadline"],"why":"A private tutor gives extra individual or small-group lessons.","hint":"The person teaches outside the ordinary class."},{"id":"vb2pre8-2","type":"choice","prompt":"Students at a similar level give one another feedback. They are…","answer":"peers","options":["peers","private assignments","study timetables"],"why":"Peers are people at a comparable level or stage.","hint":"This word refers to people, not the work they submit."},{"id":"vb2pre8-3","type":"choice","prompt":"The teacher sets one particular piece of work to submit. It is an…","answer":"assignment","options":["assignment","ambition","interruption"],"why":"An assignment is a specified piece of work.","hint":"One specified piece of course work."},{"id":"vb2pre8-4","type":"choice","prompt":"Research, drafting and presenting form stages of a longer learning task. This is…","answer":"project work","options":["project work","a moment of small talk","a private tutor"],"why":"Project work can involve several connected stages towards an aim.","hint":"Usually uncountable: some project work, not a project work."},{"id":"vb2pre8-5","type":"choice","prompt":"“Explain one example clearly by Tuesday” names Mara’s…","answer":"goal","options":["goal","hurdle","peer"],"why":"The goal is the result she wants to reach.","hint":"A desired result, rather than the difficulty blocking it."},{"id":"vb2pre8-6","type":"choice","prompt":"The practical barrier she needs to get past is a…","answer":"hurdle","options":["hurdle","goal already achieved","model answer"],"why":"A hurdle is a difficulty standing in the way.","hint":"A hurdle is a barrier on the way to a goal."},{"id":"vb2pre8-7","type":"choice","prompt":"Choosing an action to manage interruptions means trying to…","answer":"deal with a problem","options":["deal with a problem","ignore every constraint","replace every learner"],"why":"Deal with describes taking action to manage a difficulty.","hint":"Deal with names a response; it does not guarantee a complete solution."},{"id":"vb2pre8-8","type":"choice","prompt":"“I am confident you can improve” expresses that I…","answer":"believe in you","options":["believe in you","have assessed your work already","am your assignment"],"why":"Believe in someone expresses confidence in their ability or potential.","hint":"Encouragement is useful, but it is not a substitute for actionable advice."}],"writing":"Mara must explain her own example on Tuesday. She has completed her research, but peers interrupt and she loses her place. She can send a recording on Monday morning and practise for fifteen minutes at lunchtime; evenings are unavailable. Write her a supportive reply: ask one clarifying question, suggest two feasible actions and explain how she could check improvement without someone doing her assessed work. Use useful object + infinitive/-ing patterns naturally. Aim for about 120–170 words.","writingModel":"Hi Mara,\nWhich part is harder: returning to your example after an interruption or explaining the example itself? Knowing that would help us choose the right practice.\nI suggest asking one peer to listen to your Monday recording and name one point they could not follow. You already have the research, so I would not encourage you to rewrite the whole project. During your fifteen-minute session, practise that point and ask the group to agree who will answer questions. They should let you finish before adding their own explanations.\nI believe in you, but you need a workable structure as well as encouragement. To check the result, record your minute again and ask whether your peer can follow it without filling in missing steps. That keeps the explanation yours and gives you useful evidence before Tuesday.","speaking":"Help Alex prepare a presentation. Ask what went wrong, respond to a time constraint, propose actions that preserve Alex’s responsibility and agree how to check improvement.","conversation":[{"partner":"My last presentation went badly. People tell me to be more confident. Before giving me advice, what would you ask?","goal":"Ask a specific question about the difficulty, the goal or what Alex has tried.","hint":"Avoid assuming that a feeling is the only cause; ask which moment was hardest."},{"partner":"I knew the material, but my colleague kept answering questions during my part. I have only ten minutes to practise before tomorrow’s meeting.","goal":"Suggest a feasible preparation action and a role agreement that address those constraints.","hint":"Use ask someone to, let someone finish or arrange for someone to listen."},{"partner":"Wouldn’t it be easier if you wrote my whole opening and answered the difficult questions for me?","goal":"Explain how you can help without taking over; offer a practical alternative.","hint":"Support can make Alex more able to act, rather than replace Alex’s role."},{"partner":"All right. What exactly should we do first, and how will we know whether it helped?","goal":"Agree a clear first action and a relevant check within the available time.","hint":"Name something observable: an explanation the listener can follow or a successful handover."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a525c5108f74ba893eddef8_ElevenLabs_2026-07-11T15_03_36_Liam%20-%20Energetic%2C%20Social%20Media%20Creator_pre_sp100_s50_sb75_v3.mp3"},{"n":9,"module":1,"grammarSourceNumbers":[18],"grammarTrackingSlug":"b2-pre-course-9-grammar","listeningTrackingSlug":"listening_b2_pre_009_habits_survive","theory":"Lesson 18: **Gerunds & Infinitives — advanced/complex uses**\n\n**B2 • reference**\n\n### All forms at a glance\n\n| **Function**                        | **Active**             | **Passive**           | **Typical time**           |\n| ----------------------------------- | ---------------------- | --------------------- | -------------------------- |\n| **Infinitive (simple)**             | **to do**              | **to be done**        | present/future or general  |\n| **Infinitive (continuous)**         | **to be doing**        | —                     | in progress around a time  |\n| **Infinitive (perfect)**            | **to have done**       | **to have been done** | earlier/finished action    |\n| **Infinitive (perfect continuous)** | **to have been doing** | —                     | duration up to a time      |\n| **Gerund (simple)**                 | **doing**              | **being done**        | any time (context decides) |\n| **Gerund (perfect)**                | **having done**        | **having been done**  | earlier/finished action    |\n\nThe gerund behaves like a noun phrase; infinitives behave like clauses of purpose/result or complements. Negatives: **not doing**, **not to do**.\n\n### Perfect vs. simple gerunds\n\n- Often interchangeable when the timing is obvious: *He denied **stealing** it* (=before the denial) \\~ *denied **having stolen** it*.\n- Use the perfect form to insist on a previous time: *She denied **having been married*** (=at some time in the past).\n\n### Perfect vs. simple infinitives\n\n- Use the perfect infinitive for earlier events relative to the main verb: *I’m glad **to have worked** here* (past) vs *glad **to work** here* (now).\n- After evaluative patterns (*It was foolish of me …*) either form is possible; the perfect adds “earlier”: *to have said*.\n\n### Continuous infinitive\n\nDescribes an action in progress around a reference time: *You shouldn’t **be doing** this now*; *Nice **to be spending** the weekend together*.\n\n### Perfect continuous infinitive\n\nExpresses duration up to a point: *They are thought **to have been hiding** in the mountains*; *I’m happy **to have been working** with you*.\n\n### After reporting passives\n\nWith passive reporting verbs (*is said, is believed, is thought*): use a simple/continuous infinitive for present or future; use the perfect infinitive for past.\n\n- *She is believed **to be living** in Brussels* (now) • *They are believed **to have been** lovers* (earlier).\n\n### After *would like / would rather / would prefer*\n\nFor earlier events, use the perfect infinitive:\n\n- *I’d like **to have seen** the show* (=but I didn’t).\n- *She’d rather **have been** with you* (earlier preference).\n\n### Passive gerunds & infinitives\n\n- *This gate needs **to be fixed*** • *I don’t mind **being told** what to do*.\n- Perfect-passive: *He denied **having been offered** a bribe*.\n\n### Verbs with a meaning change\n\n| **Verb**              | **+ gerund**                                                      | **+ to-infinitive**                                                           |\n| --------------------- | ----------------------------------------------------------------- | ----------------------------------------------------------------------------- |\n| **remember / forget** | recall a past action: *I remember **locking** the door*.          | think of a duty/new action: *Remember **to lock** the door*.                  |\n| **regret**            | feel sorry about a past action: *We regret **telling** you this*. | formal announcement about the future message: *We regret **to inform** you …* |\n| **stop**              | quit an activity: *She stopped **smoking***.                      | pause one activity to do another: *She stopped **to smoke***.                 |\n| **try**               | experiment/solution: *Try **restarting** the app*.                | attempt/effort: *Try **to finish** before 5*.                                 |\n| **go on**             | continue the same activity: *He went on **talking***.             | move to a new topic/action: *He went on **to talk** about costs*.             |\n| **mean**              | involve/result in: *Doing this means **working** weekends*.       | intend: *I didn’t mean **to hurt** you*.                                      |\n| **need**              | passive sense (BrE): *The car needs **washing*** (=to be washed). | ordinary necessity: *The car needs **to be washed***.                         |\n\n### Key verb patterns (advanced)\n\n#### V + object + to-infinitive\n\n- *advise, allow, ask, enable, encourage, expect, help, invite, need, persuade, tell, want*\n- *They persuaded us **to stay*** • *I want you **to meet** Sara*.\n\n#### V + object + bare infinitive\n\n- *make, let, have (causative)* • *They let me **leave*** • passive → *I was made **to leave***.\n\n#### Perception verbs\n\n- *see/hear/feel/watch/notice + object + **V-ing*** (in progress) vs *+ **bare V*** (complete event).\n\n#### V + gerund (as complement)\n\n- *admit, avoid, consider, delay, deny, enjoy, finish, imagine, keep, mind, miss, practise, recommend, suggest*.\n- *He suggested **going** by train*.\n\n#### Dual pattern (similar meaning)\n\n- *begin, start, continue, hate, like, love, prefer*: either form is possible; the infinitive often sounds more specific.\n\n### Useful structures with the infinitive\n\n- **Purpose** *(in order) **to** do* • **Result** *only **to** find …*\n- **Adjective + to**: *easy/too difficult/enough + **to*** • *It was kind of you **to help***.\n- **the first/next/only + *to***: *the first person **to arrive***.\n\n* **for + object + to**: *It’s unusual **for children to** be so quiet*.\n* **be to + inf** (plan/official instruction): *The President is **to address** the nation at 9*.\n* **Split infinitives?** Acceptable in modern English when it improves clarity: *to **really** understand*.\n\n### Gerund as a noun phrase\n\n- Takes determiners & possessives in formal English: ***Her** arriving late* / ***his** refusing*. In everyday English, an object pronoun is common: *him arriving*.\n- Prepositions require gerunds: *after **finishing***, *without **asking***, *by **changing***.\n- Fixed frames: *It’s no use/It’s (not) worth **doing***; *be busy **doing***.\n\nQuick recap: use **-ing** after prepositions and as subjects/objects; use the **to-infinitive** after adjectives, to express purpose, and after many “control” verbs (*want, plan, hope*). The **perfect** forms (*having done / to have done*) point to *earlier* time; the **continuous** forms (*to be doing*) show an action in progress.\n","audioNumber":9,"audioTitle":"Why Some Habits Survive and Others Disappear","speaker":"Daniel","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a317b785474df437e1e78ea_ElevenLabs_2026-06-16T16_34_35_David%20-%20Deep%2C%20Warm%2C%20Narration_pvc_sp100_s50_sb75_v3.mp3","localAudio":"audio/lesson09-habits-survive.mp3","transcript":["Hi, I’m Daniel. For a long time, I thought habits survived because people were disciplined. If someone went running every morning, I assumed they had more willpower than the rest of us. If someone stopped after two weeks, I assumed they simply did not want it badly enough. But my own experience taught me that this explanation is too simple.","A few years ago, I decided to learn Spanish. I bought a grammar book, downloaded an app, and promised myself I would study for forty-five minutes every evening. For the first week, I felt motivated. I imagined myself having conversations while travelling, watching films without subtitles, and reading articles in another language. The goal felt exciting.","Then normal life returned. Some evenings I came home tired. Sometimes a friend called. Sometimes I opened the app, saw a long lesson waiting for me, and suddenly remembered something urgent in the kitchen. After a month, I had not quit completely, but the habit was no longer alive. It had become something I felt guilty about.","Around the same time, I started another habit almost by accident. Every morning, while waiting for my coffee, I listened to a three-minute Spanish dialogue. I did not call it studying. I did not track it carefully. It was just attached to something I already did every day. Surprisingly, that tiny habit lasted much longer than the ambitious evening plan.","That made me think differently about why habits survive. A habit does not only need motivation. It needs a place in your life. My evening study plan had no stable home. It depended on free time, energy, and the hope that nothing else would interrupt me. The morning dialogue, however, had a clear trigger: coffee. I did not need to decide when to do it. The moment already existed.","Another reason some habits disappear is that they are built around an imagined version of ourselves. We design routines for the person we want to be, not the person who actually comes home tired, distracted, and hungry. We say, “I will read for an hour before bed,” while ignoring the fact that we usually fall asleep after ten minutes. Then, when the routine fails, we blame our character instead of questioning the design.","The habits that survive are often smaller, less dramatic, and less impressive to talk about. They do not require us to become a completely different person overnight. They fit into the rhythm of ordinary life. They also create some kind of immediate reward, even if it is small: a feeling of progress, a cleaner desk, a calmer morning, or a sense that the day has started well.","There is another important point. A habit is easier to keep when it protects your identity rather than threatens it. When I told myself, “I must become fluent quickly,” every missed day felt like failure. But when I thought, “I am someone who stays connected to Spanish a little every day,” the habit felt lighter. It became evidence, not pressure.","I still believe discipline matters, but I no longer see it as the whole story. Many habits disappear not because people are weak, but because the habit is too large, too isolated, or too dependent on a perfect mood. Many habits survive because they are easy to start, connected to a real situation, and forgiving enough to continue after an imperfect day.","So now, when I want to build a habit, I do not ask, “How motivated am I?” I ask, “Where will this live in my day? What will remind me? How small can I make it without making it meaningless?” A lasting habit is not always the one that looks impressive at the beginning. It is often the one that quietly fits into real life."],"mappingNote":"Source recording 09 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Build a Realistic Learning Habit","goal":"Describe habits, earlier attempts and possible changes using accurate verb complements.","topic":"Study routines that fit changing work hours and imperfect days","languageFocus":"Gerund/infinitive meaning contrasts with remember, stop, try, regret, go on and mean; passive and perfect gerunds; simple, continuous, perfect and perfect continuous infinitives with clear time reference.","conversationTitle":"Test a realistic study plan with Alex.","readingLabel":"SCHEDULE + STUDY DIARIES","readingIntro":"Use the course schedule and both learners’ real circumstances to test proposed routines.","readingLinkLabel":"Read the schedule and diaries","wordBankTitle":"Study habits and persistence.","writingGuidance":"Aim for about 120–170 words. Explain a failed attempt, choose a feasible trigger and include a recovery plan for a missed day.","writingMaxWords":170,"theoryCards":[{"title":"Choose the complement, then check the meaning","text":"Some verbs take **-ing**: avoid, enjoy, finish, practise, suggest. Others often take **to + verb**: want, plan, hope, decide.\n\nAfter a preposition, use -ing: “after **finishing**”, “without **checking**”. “It’s worth **trying**.”","tip":"Begin/start/continue can often take either form with little difference. Do not invent a sharp contrast for every verb."},{"title":"Remember a duty or recall an event","text":"“Remember **to download** the lesson” means do not forget that action.\n\n“I remember **downloading** it” means I recall the earlier event. Forget can show the same contrast, although “I’ll never forget meeting her” is especially natural for a memorable event.","tip":"Ask whether the action is a duty still to be done or an event being recalled."},{"title":"Stop one activity; start another","text":"“I stopped **checking** my phone” means I ended that activity.\n\n“I stopped **to check** my phone” means I paused something else in order to check it.\n\n“Go on **reading**” continues the same activity; “go on **to discuss** the result” moves to the next one.","tip":"The to-infinitive can express the purpose of a pause."},{"title":"Experiment, effort and intention","text":"“Try **studying** after breakfast” proposes an experiment. “Try **to finish** before work” stresses the attempt.\n\n“This means **changing** my routine” describes what is involved. “I mean **to change** it” describes an intention.","tip":"The situation should make the intended meaning clear; a different form can create a different valid meaning."},{"title":"Regret and agency","text":"“I regret **leaving** it until Sunday” expresses regret about an action. “We regret **to inform** you …” is a formal way to announce unwelcome news.\n\n“I dislike **being interrupted**” is passive: someone interrupts me. “The draft needs **checking**” can mean it needs **to be checked**.","tip":"Would rather uses a bare infinitive: I’d rather study; for a past preference, I’d rather have studied earlier."},{"title":"Mark an earlier action when it matters","text":"“She denied **having copied** the answer” emphasises an earlier event; “denied **copying**” is also possible when the sequence is clear. Passive: “denied **having been given** the answer”.\n\n“I’m glad **to have completed** it” looks back; “I’m glad **to study** here” can describe the current situation.","tip":"Perfect forms locate an action before the main reference point. A simple gerund can already have past meaning in context."},{"title":"An action in progress or a duration","text":"“I’m happy **to be studying** with you” focuses on current activity.\n\n“She seems **to have been practising** for weeks” looks back at ongoing effort over a period.\n\nCompare “to have finished” (completion) with “to have been working” (activity and duration).","tip":"These longer forms are useful when timing matters; do not add them just to sound advanced."},{"title":"Turn the grammar into a manageable plan","text":"“I plan **to review** one example after **making** coffee. I’ll try **listening** on a busy day. Missing a day does not mean **abandoning** the routine.”\n\nPurpose: “I save the file **to use** it offline.” Person: “It’s easier **for me to start** with one question.”","tip":"Define when the habit happens, how small it can be and what you will do after a missed day."}],"tasks":[{"id":"b2g9-1","type":"choice","prompt":"The file is not downloaded yet. Which reminder asks for a future action?","answer":"Remember to download the lesson.","options":["Remember to download the lesson.","I remember downloading the lesson.","I remember having downloaded the lesson."],"why":"Remember to do refers here to an action still needing attention; the other forms recall a past event.","hint":"Check whether the download has already happened."},{"id":"b2g9-2","type":"choice","prompt":"“I stopped to check the timetable.” What happened?","answer":"I paused another activity in order to check it.","options":["I paused another activity in order to check it.","I gave up checking timetables.","I recalled checking it last week."],"why":"Stop + to-infinitive expresses the purpose of the pause.","hint":"Distinguish pausing in order to act from ending that action."},{"id":"b2g9-3","type":"choice","prompt":"You want a learner to test a new method, not promise to complete a task. Which advice highlights an experiment?","answer":"Try listening to one short dialogue after breakfast.","options":["Try listening to one short dialogue after breakfast.","Try to finish all ten chapters tonight.","Remember having listened yesterday."],"why":"Try + -ing proposes a method to test.","hint":"The aim is to see whether a method fits, not just attempt a target."},{"id":"b2g9-4","type":"gap","prompt":"Use the correct form of change: “Keeping this appointment means ___ my study time.”","answer":"changing","why":"Mean + -ing describes what a choice involves.","hint":"The sentence describes a consequence, not an intention."},{"id":"b2g9-5","type":"choice","prompt":"Which sentence expresses regret about a study decision already made?","answer":"I regret leaving the work until Sunday.","options":["I regret leaving the work until Sunday.","I plan to leave the work until Sunday.","I regret to inform you that the class is cancelled."],"why":"Regret + -ing refers to an action the speaker feels sorry about; regret to inform introduces unwelcome news.","hint":"Select a reflection on a past decision, not a plan or formal announcement."},{"id":"b2g9-6","type":"choice","prompt":"Which sentence means that somebody else interrupts the learner?","answer":"She dislikes being interrupted during practice.","options":["She dislikes being interrupted during practice.","She dislikes interrupting other learners.","She dislikes to being interrupt."],"why":"The passive gerund being interrupted makes her the receiver of the action.","hint":"Who performs the interruption, and who receives it?"},{"id":"b2g9-7","type":"edit","prompt":"Correct the form after the preposition: “After to finish the recording, I wrote one question.”","answer":"After finishing the recording, I wrote one question.","why":"After as a preposition is followed by an -ing form here.","hint":"Do not put to before the verb after after."},{"id":"b2g9-8","type":"choice","prompt":"Which statement about “He denied copying” and “He denied having copied” is accurate?","answer":"Both can refer to copying before the denial; the perfect form makes the earlier timing explicit.","options":["Both can refer to copying before the denial; the perfect form makes the earlier timing explicit.","Only the perfect form can ever refer to a past action.","The simple gerund necessarily means he will copy later."],"why":"A simple gerund can refer to an earlier event when context establishes the order.","hint":"Do not assume that every -ing form describes the present."},{"id":"b2g9-9","type":"choice","prompt":"The course ended yesterday. Which sentence explicitly looks back at a completed experience?","answer":"I’m glad to have taken the course.","options":["I’m glad to have taken the course.","I’m planning to take the course next year.","I hope to be taking the course next month."],"why":"To have taken is a perfect infinitive referring to an experience before the current feeling.","hint":"Find the form that makes prior completion explicit."},{"id":"b2g9-10","type":"order","prompt":"Build a sentence emphasising an activity in progress now.","answer":"I am happy to be studying with you today.","why":"To be studying is a continuous infinitive focusing on ongoing activity.","hint":"Keep to be studying as the infinitive phrase."},{"id":"b2g9-11","type":"choice","prompt":"Which form highlights practice continuing over the weeks before now?","answer":"She seems to have been practising for weeks.","options":["She seems to have been practising for weeks.","She intends to start practising next week.","She was asked to practise once tomorrow."],"why":"The perfect continuous infinitive relates an extended earlier activity to a current impression.","hint":"Look for have been + -ing and a duration."},{"id":"b2g9-12","type":"choice","prompt":"In “We revised the vocabulary, then went on to discuss the text”, what does went on to show?","answer":"A move to a different activity after the revision.","options":["A move to a different activity after the revision.","The vocabulary revision continued without a change of activity.","The discussion was cancelled."],"why":"Go on to do introduces the next activity; go on doing continues the same activity.","hint":"Use the two different actions to interpret the pattern."}],"listening":[{"id":"b2l9-1","type":"choice","prompt":"What belief does Daniel revise?","answer":"That discipline or willpower alone explains whether habits last.","options":["That discipline or willpower alone explains whether habits last.","That any kind of discipline is harmful.","That language learning can only happen in a classroom."],"why":"He retains a role for discipline while rejecting it as the complete explanation.","hint":"Listen for a qualified change of view, not the opposite extreme.","evidence":"But my own experience taught me that this explanation is too simple."},{"id":"b2l9-2","type":"choice","prompt":"Why was his evening plan fragile?","answer":"It depended on spare time, energy and freedom from interruption.","options":["It depended on spare time, energy and freedom from interruption.","The app had no Spanish lessons available.","He had no interest in travelling or understanding another language."],"why":"The plan depended on conditions that ordinary evenings did not reliably provide.","hint":"Separate the exciting goal from the practical opportunity.","evidence":"It depended on free time, energy, and the hope that nothing else would interrupt me."},{"id":"b2l9-3","type":"choice","prompt":"What gave the morning dialogue a stable place?","answer":"It was attached to waiting for coffee, an existing daily event.","options":["It was attached to waiting for coffee, an existing daily event.","It required him to wake up forty-five minutes earlier.","It replaced breakfast with a formal language exam."],"why":"An existing trigger removed the need to choose a study time each day.","hint":"What already happened before the new habit was added?","evidence":"The morning dialogue, however, had a clear trigger: coffee."},{"id":"b2l9-4","type":"choice","prompt":"What is wrong with a routine designed for an imagined self?","answer":"It can ignore the learner’s normal tiredness, distractions and energy.","options":["It can ignore the learner’s normal tiredness, distractions and energy.","It always contains goals that are too easy.","It prevents anyone from having a long-term ambition."],"why":"The issue is a mismatch with real conditions, not the mere existence of an ambition.","hint":"Compare the ideal person in the plan with the person who comes home.","evidence":"We design routines for the person we want to be, not the person who actually comes home tired, distracted, and hungry."},{"id":"b2l9-5","type":"choice","prompt":"Which small reward does Daniel say can help?","answer":"A sense of progress or a calmer start to the day.","options":["A sense of progress or a calmer start to the day.","A guaranteed financial prize for every session.","An immediate promise of fluency after three minutes."],"why":"He mentions modest immediate rewards rather than dramatic guaranteed outcomes.","hint":"Look for something available during ordinary daily life.","evidence":"They also create some kind of immediate reward, even if it is small: a feeling of progress, a cleaner desk, a calmer morning, or a sense that the day has started well."},{"id":"b2l9-6","type":"choice","prompt":"How did the new way of describing his identity reduce pressure?","answer":"Small contact with Spanish became evidence of being a learner rather than a daily test of rapid fluency.","options":["Small contact with Spanish became evidence of being a learner rather than a daily test of rapid fluency.","It made every missed day proof that he could not learn.","It meant he no longer needed any contact with Spanish."],"why":"He changed the interpretation of small actions and imperfect days.","hint":"Compare must become fluent quickly with staying connected a little each day.","evidence":"It became evidence, not pressure."},{"id":"b2l9-7","type":"sequence","prompt":"Put Daniel’s developments in order.","answer":["He begins an ambitious evening Spanish plan.","Ordinary interruptions make the evening routine fade.","A short dialogue attached to coffee lasts longer."],"why":"The initial promise comes before the evening difficulties; the smaller coffee habit provides the contrasting experience.","hint":"Track the plan, its difficulty and the alternative habit.","evidence":"Surprisingly, that tiny habit lasted much longer than the ambitious evening plan."},{"id":"b2l9-8","type":"choice","prompt":"Which new plan best applies the final questions Daniel asks?","answer":"One meaningful question after a reliable daily event, with a small restart after a missed day.","options":["One meaningful question after a reliable daily event, with a small restart after a missed day.","A long session whenever the learner happens to feel perfectly motivated.","A routine judged only by how impressive it sounds to others."],"why":"The final advice concerns a real place, a reminder and a manageable size.","hint":"Find a plan with a trigger and a forgiving way to continue.","evidence":"Many habits survive because they are easy to start, connected to a real situation, and forgiving enough to continue after an imperfect day."}],"readingTitle":"A routine that has somewhere to live","readingTexts":[{"title":"Course schedule and Ada’s first week","text":"The course has live seminars on Tuesday and Thursday at 20.00. Recordings appear the following morning. The weekly application task is due on Sunday at 18.00; watching a recording does not submit the task. Learners can ask a question in the forum at any time.\nAda works late on Tuesdays and Thursdays this
