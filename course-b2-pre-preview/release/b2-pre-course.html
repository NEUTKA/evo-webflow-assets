<main id="main" tabindex="-1"></main><div id="status" class="sr-only" aria-live="polite"></div><script>(function(root){'use strict';
function normalize(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\b(is|are|was|were|do|does|did|have|has|had|would|will|should|could|can|must)n['’]t\b/g,(_,v)=>v+' not').replace(/\bwon't\b/g,'will not').replace(/[.,?!;:]/g,'').replace(/\s+/g,' ').trim();}
function correct(q,answer){if(q.type==='choice')return typeof answer==='string'&&answer.trim()===q.answer.trim();if(q.type==='sequence')return Array.isArray(answer)&&answer.join('|')===q.answer.join('|');return q.answer.split('|').some(x=>normalize(x)===normalize(answer));}
function shuffle(a,seed){const out=a.slice();let s=seed||17;for(let i=out.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[out[i],out[j]]=[out[j],out[i]];}return out;}
function scramble(items,random=Math.random){const out=items.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}if(out.every((item,i)=>item===items[i])){const other=out.findIndex(item=>item!==out[0]);if(other>0)[out[0],out[other]]=[out[other],out[0]];}return out;}
const tokenOrders=new Map();

function record(state,q,answer,now=Date.now()){const prev=state.answers[q.id]||{attempts:0};const ok=correct(q,answer);state.answers[q.id]={...prev,answer,correct:ok,attempts:prev.attempts+1,firstCorrect:prev.firstCorrect??(prev.attempts===0?ok:false),updatedAt:now};if(!ok)state.review[q.id]={due:now,streak:0};else if(state.review[q.id]){const streak=state.review[q.id].streak+1;state.review[q.id]={streak,due:now+[1,3,7,14][Math.min(streak-1,3)]*86400000};}return ok;}
function initial(){return {version:1,current:1,phase:'theory',answers:{},drafts:{},spoken:{},self:{},review:{},completed:[],moduleAttempts:{}};}
function due(state,questions,now=Date.now()){return questions.filter(q=>state.review[q.id]&&state.review[q.id].due<=now);}
const engine={normalize,correct,shuffle,scramble,tokens,record,initial,due};root.B2_ENGINE=engine;if(typeof module==='object'&&module.exports)module.exports=engine;
})(globalThis);
</script>
<script>(function(root){'use strict';
const copy=x=>JSON.parse(JSON.stringify(x));
const variant=(lesson,a)=>lesson.variants.find(v=>v.id===a.variantId);
function record(state,n=6){state.checkpoints ||= {};return state.checkpoints[n] ||= {attempts:[]};}
function current(state,n=6){return record(state,n).attempts.at(-1)||null;}
function start(state,lesson,now=Date.now()){
 const r=record(state,lesson.n),last=r.attempts.at(-1);if(last&&!last.submittedAt)return last;
 const used=new Set(r.attempts.map(a=>a.variantId)),fresh=lesson.variants.find(v=>!used.has(v.id)),v=fresh||lesson.variants[r.attempts.length%lesson.variants.length];
 const a={id:`${lesson.n}-${r.attempts.length+1}-${now}`,variantId:v.id,independent:!!fresh,supported:false,startedAt:now,phase:'objective',step:0,answers:{},writing:'',replies:[],turn:0,reviews:{},corrected:{}};r.attempts.push(a);return a;
}
function score(lesson,a){const v=variant(lesson,a),answers=a.submission?.answers||a.answers,groups={grammar:[],reading:[],listening:[]};for(const q of v.objective){const kind=q.id.includes('-g')?'grammar':q.id.includes('-r')?'reading':'listening';groups[kind].push(q);}const result={total:0,max:v.objective.length,strands:{}};for(const [name,qs]of Object.entries(groups)){const correct=qs.filter(q=>answers[q.id]===q.answer).length;result.total+=correct;result.strands[name]={correct,total:qs.length,passed:correct/qs.length>=lesson.thresholds.strand};}result.passed=result.total/result.max>=lesson.thresholds.overall&&Object.values(result.strands).every(x=>x.passed);return result;}
function lockObjectives(lesson,a){if(a.submittedAt)throw Error('This attempt is already submitted.');const v=variant(lesson,a);if(!v.objective.every(q=>typeof a.answers[q.id]==='string'&&q.options.includes(a.answers[q.id])))throw Error('Answer all 20 questions before locking this section.');a.objectiveLocked=true;a.phase='writing';}
function submit(lesson,a,now=Date.now()){if(a.submittedAt)return a;if(!a.objectiveLocked||!a.writing.trim()||!variant(lesson,a).conversation.every((_,i)=>!!a.replies[i]?.trim()))throw Error('Complete the objective questions, writing and all four replies first.');a.submission=copy({answers:a.answers,writing:a.writing.trim(),replies:a.replies.map(s=>s.trim())});a.submittedAt=now;a.phase='results';a.score=score(lesson,a);return a;}
function text(lesson,a,kind){const data=a.submission||a;if(kind==='writing')return data.writing.trim();return variant(lesson,a).conversation.map((t,i)=>`ALEX: ${t.partner}\nLEARNER: ${data.replies[i]||''}`).join('\n\n');}
function reviewed(lesson,a,kind){const r=a.reviews[kind];return !!a.submittedAt&&!!r&&r.text===text(lesson,a,kind);}
function essentials(lesson,a,kind){if(!reviewed(lesson,a,kind))return false;const f=a.reviews[kind].feedback;return ['good','almost'].includes(f.task_completion?.rating)&&['good','almost'].includes(f.clarity?.rating);}
function qualifies(lesson,a){return !!a.submittedAt&&a.independent&&!a.supported&&score(lesson,a).passed&&essentials(lesson,a,'writing')&&essentials(lesson,a,'speaking');}
function ready(state,lesson){return record(state,lesson.n).attempts.some(a=>qualifies(lesson,a));}
function wrong(lesson,a){if(!a.submittedAt)return[];return variant(lesson,a).objective.filter(q=>a.submission.answers[q.id]!==q.answer);}
function correctionsComplete(lesson,a){return wrong(lesson,a).every(q=>a.corrected[q.id]);}
function canRetake(lesson,a){return !!a?.submittedAt&&correctionsComplete(lesson,a)&&reviewed(lesson,a,'writing')&&reviewed(lesson,a,'speaking');}
const api={record,current,start,variant,score,lockObjectives,submit,text,reviewed,essentials,qualifies,ready,wrong,correctionsComplete,canRetake};root.B2_CHECKPOINT_ENGINE=api;if(typeof module==='object'&&module.exports)module.exports=api;
})(globalThis);

<script>globalThis.B2_BANK={"version":1,"level":"B2 Pre-advanced","courseTotal":36,"availableLessons":13,"availableTeachingLessons":11,"availableCheckpoints":2,"pilot":true,"modules":[{"title":"People and connections","first":1,"last":6},{"title":"Work & learning","first":7,"last":12},{"title":"Choices, systems & plans","first":13,"last":17}],"lessons":[{"n":1,"module":0,"title":"Make a Connection","goal":"Start, extend and close a conversation; link ideas and respond thoughtfully to a new person.","grammarTrackingSlug":"grammar_b2_pre_001_discourse_markers","listeningTrackingSlug":"listening_b2_pre_005_trust_people","theory":"Lesson 1: **Discourse markers — connectors & linking words**\n\n**B1–B2 • quick referenceregister & punctuation included**\n\n### What are discourse markers?\n\nThey are words/phrases that guide a reader or listener through your ideas (topic change, addition, contrast, results, summaries, etc.). Choose them for *function* and *register* (formal vs informal) and place them correctly in the sentence.\n\n### Topic management\n\n**by the wayincidentallyinformal**\n\n→ change to a related/new topic: *By the way, do you have the photos?*\n\n**as I was saying**\n\n→ return to a point after a digression: *As I was saying, we could leave early.*\n\n**regardingas regardsas far as … is concernedmore formal**\n\n→ introduce topic: *Regarding the new hire, we’ll decide next week.*\n\n### Adding & emphasising\n\n**besidesinformal**\n\n*It’s far; besides, taxis are expensive.*\n\n**furthermoremoreoverformal**\n\n*Sales rose; furthermore, costs fell.*\n\n**what’s more**\n\n*The flat is bright; what’s more, it’s quiet.*\n\n**actuallyin factas a matter of fact**\n\n→ correction/contrast with expectations: *People think he’s tough; actually, he’s kind.* Not “at the moment”.\n\n### Contrast & concession\n\n**on the other hand**\n\n*Remote work gives flexibility; on the other hand, it can be isolating.* Optionally pair with *on the one hand*.\n\n**whereas**\n\n*The north is wet, whereas the south is dry.*\n\n**after all**\n\na) reason/support: *Let him rest; after all, he’s ill.* b) concession: *Maybe he wasn’t wrong after all.*\n\n**anywayin any case**\n\n→ return to main point or give overriding reason: *It’s late and, in any case, it’s too expensive.*\n\n**yet**\n\n→ “however/but”: *She was tired, yet she kept working.*\n\n### Reformulating & clarifying\n\n**in other words**\n\n*We need to pivot — in other words, change strategy.*\n\n**that is to saymore formal**\n\n*The device is modular, that is to say, parts are replaceable.*\n\n**basicallyobviously**\n\n*Basically, we build the app; obviously, testing takes time.*\n\n### Result, minimising & condition\n\n**sothereforeconsequentlyformal (last two)**\n\n*Flights were cancelled; therefore, we stayed home.*\n\n**at least**\n\na) positive twist: *We lost, but at least we qualified.* b) hedge: *He knows the CEO — at least, that’s what he says.*\n\n**otherwise**\n\n→ if not: *Be here by eight; otherwise you’ll miss the start.*\n\n### Summary & generalisation\n\n**all in all**\n\n*There were delays, but all in all the trip was great.*\n\n**on the whole**\n\n*On the whole, customers like the redesign.*\n\n### Position & punctuation\n\n- **Sentence initial** + comma: *However,* / *Therefore,* / *On the whole,*\n- **Mid-position** (before main verb, after *be*, or after first auxiliary) for formal adverbs: *has therefore decided*, *is consequently difficult*.\n- **End position** is possible for a few items in speech: *We enjoyed it, though.* / *We had a great time, however.* (more formal/rare)\n\n**Tip** Don’t stack too many markers; one clear connector per relationship is usually enough.\n","theoryCards":[{"title":"Guide the conversation","text":"Discourse markers show how one idea connects to the next. Choose the relationship first: a new topic, an extra point, a correction, a contrast or a clearer explanation.\n\n“You like photography? **By the way**, there’s an exhibition near here.”","tip":"Lesson goal: make a connection, ask a follow-up and close with a clear next step."},{"title":"Change topic — or return to it","text":"**By the way** introduces a related or new topic in conversation. **Incidentally** has a similar use but can sound more formal.\n\n**As I was saying** returns to an interrupted point: “As I was saying, we could meet after work.”","tip":"In a formal email, use Regarding + topic: “Regarding Saturday’s event, …”."},{"title":"Add an extra point","text":"**What’s more** adds another point. **Besides** adds a supporting reason and is common in conversation.\n\n“The café is nearby. What’s more, it has a quiet garden.”\n\n**Furthermore** and **moreover** usually suit formal writing better than a friendly chat.","tip":"One clear connector is usually enough for one relationship."},{"title":"Correct an expectation","text":"**Actually**, **in fact** and **as a matter of fact** can correct an assumption.\n\n“Is Sam your brother?” — “Actually, we work together.”\n\nActually does not mean “at the moment”: “I’m currently working from home.”","tip":"A correction can be polite. Your tone and the rest of the sentence matter too."},{"title":"Show another side","text":"**On the other hand** introduces a contrasting consideration. **Yet** links contrasting clauses.\n\n“A big party is lively. On the other hand, a small dinner gives us time to talk.”\n\n“He was nervous, yet he asked a thoughtful question.”","tip":"Whereas connects two clauses directly: “I enjoy big parties, whereas my sister prefers small groups.”"},{"title":"Make the meaning clearer","text":"**In other words** restates an idea more clearly. **That is to say** is more formal.\n\n“I can come for the café part. In other words, don’t buy me a concert ticket.”\n\n**Anyway** can return to the main point: “Anyway, shall we choose a time?”","tip":"A clarification should keep the same meaning; it should not introduce an unrelated fact."},{"title":"Explain a result or condition","text":"**So** introduces a result in everyday conversation: “We both like films, so I suggested the cinema.”\n\n**Therefore** and **consequently** are more formal.\n\n**Otherwise** means “if not”: “Please reply by Thursday; otherwise, I can’t confirm the table.”","tip":"At least can highlight a positive point: “It rained, but at least we had time to talk.”"},{"title":"Punctuation and a natural ending","text":"Use a comma after sentence-initial markers: “Actually, …” / “On the whole, …”.\n\nLink complete sentences with a full stop or semicolon: “It was late; however, we stayed.” Avoid joining them with only a comma.\n\n**All in all** summarises an experience. **On the whole** gives a general assessment.","tip":"Now practise the relationship and register, not just the position of a word."}],"audioNumber":5,"audioTitle":"Why We Trust Some People Immediately","speaker":"Natalie","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a3163e30bd85049b5d31a7d_ElevenLabs_2026-06-16T14_52_29_Christina%20-%20Energetic%20Commercial%20American%20Female%20Voice.mp3","localAudio":"audio/lesson05-trust-people.mp3","transcript":["Hi, I’m Natalie. I used to think that trusting someone quickly was either a sign of good instinct or a sign of being too naive. But a few years ago, after a small professional workshop, I started to see it differently.","It was my first week in a new city, and I had signed up for an evening workshop about communication at work. I did not know anyone there, so during the coffee break I felt slightly uncomfortable. Two people started talking to me. The first was Maya. She was energetic, friendly, and very confident. Within two minutes, she was telling me about her career, her contacts, and how useful the workshop would be if I “knew how to meet the right people.”","The second person was Adrian. He was quieter. He asked what had brought me to the city, listened to my answer, and then asked one simple follow-up question. He did not try to impress me. He did not interrupt or turn the conversation back to himself. There was a kind of calm confidence in the way he spoke. Strangely, I trusted him much faster.","At first, I could not explain why. Maya had been warmer on the surface. Adrian had said less. But my reaction was not random. Trust often begins as a social shortcut. We do not have enough time to collect full evidence about every new person we meet, so our brain uses tiny signals: tone of voice, eye contact, timing, consistency, and whether someone creates pressure.","Of course, this shortcut can be wrong. A confident person can seem reliable before they have actually done anything reliable. A quiet person can seem thoughtful when they are simply uninterested. First impressions are useful, but they are not proof. They are more like a first draft of an opinion.","What made Adrian feel trustworthy was not that he smiled or agreed with me. It was that his behaviour felt coherent. His words, body language, and level of attention seemed to match. He listened without taking over the conversation. He asked questions without making me feel judged. Most importantly, he did not create too much pressure. I did not feel that he wanted something from me immediately.","Later that evening, we worked in the same discussion group. When someone disagreed with him, he did not become defensive. He paused, asked them to explain, and changed part of his answer. That small moment mattered more than anything impressive he could have said. It showed that his calm manner was not just a social performance.","A week later, he sent me the notes he had promised to share. It was a very small thing, but it slowly confirmed my first impression. That is what I think trust really needs: not just a strong beginning, but repeated small evidence.","So now, when I trust someone immediately, I do not ignore that feeling. But I also do not treat it as a final decision. I see it as a useful signal. Immediate trust can tell us that something feels safe, respectful, or natural. But real trust should be tested gently over time. It grows when people do small things consistently, especially when there is no obvious reward for doing them."],"mappingNote":"Source recording 05 · Natalie compares two people she met at a workshop. First listen without the transcript. Opening it marks subsequent listening answers as supported.","tasks":[{"id":"b2g1-1","type":"choice","prompt":"You want to introduce a related topic during a friendly chat. Which reply fits?","answer":"By the way, have you seen the new photography exhibition?","options":["By the way, have you seen the new photography exhibition?","Therefore, have you seen the new photography exhibition?","In other words, have you seen the new photography exhibition?"],"why":"By the way introduces a related topic; there is no result or reformulation here.","hint":"Decide whether the speaker is changing topic, explaining a result or clarifying the same idea."},{"id":"b2g1-2","type":"choice","prompt":"“So you and Sam met at school?” Correct the assumption politely.","answer":"Actually, we met at work last month.","options":["Actually, we met at work last month.","Furthermore, we met at work last month.","On the whole, we met at work last month."],"why":"Actually corrects the assumption about where the two people met.","hint":"Choose a marker for a correction, rather than an additional supporting point."},{"id":"b2g1-3","type":"choice","prompt":"“The venue is close to the station. ___, there’s a quiet room where we can talk.” Add an advantage.","answer":"What’s more","options":["What’s more","Otherwise","In other words"],"why":"The quiet room is an extra advantage, not a restatement or a negative alternative.","hint":"Does the second sentence give extra information or say the same thing more clearly?"},{"id":"b2g1-4","type":"choice","prompt":"Choose the correctly punctuated contrast.","answer":"The party was lively; however, I found it hard to have a quiet conversation.","options":["The party was lively; however, I found it hard to have a quiet conversation.","The party was lively, however I found it hard to have a quiet conversation.","The party was lively however, I found it hard to have a quiet conversation."],"why":"However is a linking adverb. Here a semicolon separates the complete clauses, and a comma follows however.","hint":"Find the boundary between the two complete clauses."},{"id":"b2g1-5","type":"order","prompt":"Build a sentence returning to an interrupted plan.","answer":"As I was saying, we could meet after work.","why":"As I was saying brings the listener back to an earlier point.","hint":"Start with the phrase for returning to your previous point."},{"id":"b2g1-6","type":"choice","prompt":"“I’m free until seven. ___, I can join you for coffee but not for the film.”","answer":"In other words","options":["In other words","Besides","By the way"],"why":"The second sentence explains the practical meaning of being free only until seven.","hint":"The time limit is being explained, not replaced by a new topic."},{"id":"b2g1-7","type":"gap","prompt":"Use the marker meaning “if not”: “Please reply today; ___, I can’t book enough places.”","answer":"otherwise","why":"Otherwise introduces what will happen if the person does not reply.","hint":"Look for a condition implied by the first instruction."},{"id":"b2g1-8","type":"choice","prompt":"Which sentence best fits a friendly follow-up message?","answer":"It was great to meet you. What’s more, I’ve found another interest we share.","options":["It was great to meet you. What’s more, I’ve found another interest we share.","It was great to meet you. Furthermore, I hereby confirm a further common interest.","It was great to meet you. Consequently, I hereby record a common interest."],"why":"What’s more suits a friendly message. The other versions sound official and unnatural in this context.","hint":"Match the register to a friendly personal message."},{"id":"b2g1-9","type":"choice","prompt":"“I enjoy large events. ___, small groups make it easier to listen properly.” Show a contrasting advantage.","answer":"On the other hand","options":["On the other hand","As I was saying","Therefore"],"why":"On the other hand introduces the advantage of the opposite option.","hint":"Both options have benefits; the speaker is considering a different side."},{"id":"b2g1-10","type":"choice","prompt":"Choose the word meaning “at the moment”: “I’m ___ working from home while our office is being repaired.”","answer":"currently","options":["currently","actually","incidentally"],"why":"Currently means at the moment. Actually usually corrects an expectation or emphasises what is true; incidentally introduces an incidental topic.","hint":"Separate time from correction: they are different meanings."},{"id":"b2g1-11","type":"choice","prompt":"“We both enjoy hiking, ___ we arranged a walk.” Choose the natural everyday result marker.","answer":"so","options":["so","whereas","yet"],"why":"So introduces the result of the shared interest.","hint":"The walk follows from a shared interest; it does not contrast with it."},{"id":"b2g1-12","type":"choice","prompt":"You have finished describing an evening with a few small problems. Give an overall assessment.","answer":"All in all, it was a lovely chance to catch up.","options":["All in all, it was a lovely chance to catch up.","By the way, it was a lovely chance to catch up.","Otherwise, it was a lovely chance to catch up."],"why":"All in all introduces a summary judgement after the details.","hint":"Are you opening a topic, setting a condition or summarising the experience?"}],"listening":[{"id":"b2l1-1","type":"choice","prompt":"What is Natalie’s main message?","answer":"An immediate feeling of trust can be useful, but needs evidence over time.","options":["An immediate feeling of trust can be useful, but needs evidence over time.","Confident people are usually less trustworthy than quiet people.","It is safer never to trust anyone you have just met."],"why":"She accepts the first feeling as a signal while checking it against repeated behaviour.","hint":"Listen for the position she takes at the end, rather than judging one person only.","evidence":"But I also do not treat it as a final decision. I see it as a useful signal."},{"id":"b2l1-2","type":"choice","prompt":"Why did Natalie feel uncomfortable at the beginning?","answer":"She was new to the city and did not know anyone at the workshop.","options":["She was new to the city and did not know anyone at the workshop.","She had argued with the organiser.","She had been asked to give an unprepared speech."],"why":"The unfamiliar social situation, rather than a disagreement or a speech, caused her discomfort.","hint":"Locate the setting before Maya and Adrian begin speaking.","evidence":"I did not know anyone there, so during the coffee break I felt slightly uncomfortable."},{"id":"b2l1-3","type":"choice","prompt":"Which contrast between Maya and Adrian is supported by the recording?","answer":"Maya talked about her own connections; Adrian listened and asked a follow-up.","options":["Maya talked about her own connections; Adrian listened and asked a follow-up.","Maya wanted to leave early; Adrian organised the workshop.","Maya interrupted the group; Adrian refused to discuss his work."],"why":"The comparison concerns the attention given to Natalie, not who organised the event.","hint":"Notice who the conversation is focused on.","evidence":"He did not interrupt or turn the conversation back to himself."},{"id":"b2l1-4","type":"choice","prompt":"Why does Natalie call early trust a “social shortcut”?","answer":"People use small signals before they have enough evidence about a new person.","options":["People use small signals before they have enough evidence about a new person.","People decide that everyone in the same profession is reliable.","People consciously calculate how useful each new contact will be."],"why":"Limited time makes small signals useful, although they can mislead.","hint":"Listen for the reason a shortcut is needed.","evidence":"We do not have enough time to collect full evidence about every new person we meet, so our brain uses tiny signals: tone of voice, eye contact, timing, consistency, and whether someone creates pressure."},{"id":"b2l1-5","type":"choice","prompt":"What does the recording suggest about a quiet person?","answer":"Their quietness could reflect thoughtfulness or a lack of interest.","options":["Their quietness could reflect thoughtfulness or a lack of interest.","Being quiet is reliable proof of honesty.","They are less likely to keep promises."],"why":"The same behaviour can have different explanations. Quietness alone is not proof.","hint":"Separate what someone does from your interpretation of it.","evidence":"A quiet person can seem thoughtful when they are simply uninterested."},{"id":"b2l1-6","type":"choice","prompt":"What did Adrian do when someone disagreed with him?","answer":"He asked for an explanation and revised part of his answer.","options":["He asked for an explanation and revised part of his answer.","He changed the subject to avoid tension.","He agreed immediately without asking a question."],"why":"He engaged with the disagreement instead of defending his original answer automatically.","hint":"Listen for the actions after he paused.","evidence":"He paused, asked them to explain, and changed part of his answer."},{"id":"b2l1-7","type":"sequence","prompt":"Put Natalie’s experiences in order.","answer":["Natalie meets Maya and Adrian during a break.","Adrian responds thoughtfully to a disagreement.","Adrian sends the promised notes a week later."],"why":"The break comes first, the discussion group later that evening, and the notes a week later.","hint":"Use the time references: during the break, later that evening, a week later.","evidence":"A week later, he sent me the notes he had promised to share."},{"id":"b2l1-8","type":"choice","prompt":"Why is the email with the notes important?","answer":"Keeping a small promise adds evidence to the original positive impression.","options":["Keeping a small promise adds evidence to the original positive impression.","It proves that Natalie’s first impressions are always correct.","It matters mainly because the notes help Natalie win a promotion."],"why":"The small reliable action supports her impression without making it infallible.","hint":"Focus on what the action confirms, rather than inventing a benefit of the notes.","evidence":"It was a very small thing, but it slowly confirmed my first impression."}],"readingTitle":"A reunion — two different expectations","readingTexts":[{"title":"Message 1 · Rosa → Daniel · Monday","text":"Hi Daniel,\nIt was lovely to run into you at the bookshop. We go back years, but I had no idea you were living nearby again! I’m getting together with a few people from our old evening class on Saturday. We’ll meet at North Café at 5.30, then some of us are going to a concert at eight. I’ve booked a table for six; actually, that includes you only if you can come. Please let me know by Thursday lunchtime so I can confirm the numbers.\nYou mentioned that your new colleague Sam enjoys photography. You’re welcome to invite them too, provided you tell me before I call the café. Don’t worry about the concert: I’m buying tickets only for people who have already asked for one. Anyway, the main point is to catch up. You can leave whenever you need to.\nRosa"},{"title":"Message 2 · Daniel → Rosa · Tuesday","text":"Hi Rosa,\nThanks — I’d love to come. Sam is outgoing and usually finds it easy to join a new group. We hit it off over our photography projects, so I think they’d enjoy meeting everyone. I’ll ask them tonight.\nI finish helping at the community centre at 5.45. It’s a fifteen-minute walk from there to North Café, so I could be with you at six. Is that too late for the table booking? By the way, I’m looking after my niece later and have to leave by 7.15. In other words, I can join the café conversation but won’t be able to stay for the concert.\nCould you keep a café place for me while I check with Sam? I’ll send you a definite answer about them tomorrow evening. Also, is the café still on River Street? The one beside the station has a similar name.\nDaniel"}],"reading":[{"id":"b2r1-1","type":"choice","prompt":"Which plan best respects both messages?","answer":"Daniel joins the café at six, leaves by 7.15 and skips the concert.","options":["Daniel joins the café at six, leaves by 7.15 and skips the concert.","Daniel arrives at 5.30 and stays for the concert.","Daniel joins only the concert because he misses the start of the café meeting."],"why":"His work ends at 5.45 and the walk takes fifteen minutes; his later responsibility limits the visit.","hint":"Combine Daniel’s finishing time, travel time and latest departure."},{"id":"b2r1-2","type":"choice","prompt":"Which detail still needs Rosa’s confirmation?","answer":"Whether a six o’clock arrival is acceptable for the café booking.","options":["Whether a six o’clock arrival is acceptable for the café booking.","Whether Daniel should buy his own concert ticket.","Whether Rosa has invited people from their old class."],"why":"Daniel explicitly asks about arriving late. He has already ruled out the concert.","hint":"Distinguish an unanswered practical question from a decision already made."},{"id":"b2r1-3","type":"choice","prompt":"Does Daniel’s proposed deadline for Sam meet Rosa’s request?","answer":"Yes. Wednesday evening is before Thursday lunchtime.","options":["Yes. Wednesday evening is before Thursday lunchtime.","No. Daniel promises an answer after the café’s deadline.","It is impossible to compare the deadlines because neither message gives a day."],"why":"Message 2 is dated Tuesday, so tomorrow evening means Wednesday evening.","hint":"Use the date of Daniel’s message to interpret tomorrow."},{"id":"b2r1-4","type":"choice","prompt":"Why does Daniel use “In other words” before mentioning the concert?","answer":"To make the consequence of his time limit explicit.","options":["To make the consequence of his time limit explicit.","To introduce a separate topic about music.","To add a second reason why Sam enjoys photography."],"why":"He restates what leaving early means for the plan.","hint":"Look at the relationship between the sentence before and the sentence after the marker."},{"id":"b2r1-5","type":"choice","prompt":"Which statement about Sam is supported?","answer":"Sam and Daniel connected through a shared interest; Sam has not accepted yet.","options":["Sam and Daniel connected through a shared interest; Sam has not accepted yet.","Sam has already confirmed a café place and concert ticket.","Sam was in Rosa’s evening class years ago."],"why":"Their shared photography interest explains the invitation, but Daniel still needs to ask Sam.","hint":"Separate Daniel’s positive expectation from an actual acceptance."},{"id":"b2r1-6","type":"choice","prompt":"Which reply from Rosa resolves the remaining practical questions most fully?","answer":"Six is fine; we’ll hold your place. Yes, River Street — not the café by the station. Let me know about Sam tomorrow.","options":["Six is fine; we’ll hold your place. Yes, River Street — not the café by the station. Let me know about Sam tomorrow.","Great, see you both at the concert at eight!","Thanks, I’ve cancelled the table because you can’t come at 5.30."],"why":"This reply confirms the late arrival, the correct location and the still-pending guest.","hint":"Check the arrival, venue and extra guest; a useful reply should deal with all three."}],"vocab":[{"id":"vb2pre1-1","word":"get together","definition":"Meet friends or family to spend time and socialise.","example":"Let’s get together for coffee next week.","hint":"We want to meet socially. Choose the phrase for arranging a meeting.","sourceLesson":1},{"id":"vb2pre1-2","word":"hang out (with)","definition":"Spend time with someone in a relaxed, informal way.","example":"We hang out at a café after work.","hint":"Think of relaxed time together, rather than a formal appointment.","sourceLesson":1},{"id":"vb2pre1-3","word":"outgoing","definition":"Friendly and confident about talking to new people.","example":"Her outgoing personality helps her meet new people.","hint":"This describes a person’s usual behaviour, not the size of their social circle.","sourceLesson":1},{"id":"vb2pre1-4","word":"social butterfly","definition":"Someone who enjoys socialising and easily talks to many different people.","example":"At the reception, the social butterfly chatted to every group.","hint":"Look for movement between many social groups.","sourceLesson":1},{"id":"vb2pre1-5","word":"hit it off (with someone)","definition":"Like each other immediately and quickly develop a friendly connection.","example":"We hit it off as soon as we started talking.","hint":"Think about how the connection began.","sourceLesson":2},{"id":"vb2pre1-6","word":"get along (with someone)","definition":"Have a good, friendly relationship with someone.","example":"Despite our different interests, we get along well.","hint":"Think of an ongoing relationship, not necessarily an instant connection.","sourceLesson":2},{"id":"vb2pre1-7","word":"have a lot in common (with someone)","definition":"Share many interests, experiences or opinions with someone.","example":"We have a lot in common: we both hike and love old films.","hint":"Look for shared interests or experiences.","sourceLesson":2},{"id":"vb2pre1-8","word":"go back (years / a long time)","definition":"Have known each other for a long period of time.","example":"We go back years; we met at school.","hint":"Here the phrase describes the history of a relationship, not travel.","sourceLesson":2}],"vocabularyQuestions":[{"id":"vb2pre1-1","type":"choice","prompt":"Choose the invitation that uses “get together” naturally.","answer":"Shall we get together for coffee after work?","options":["Shall we get together for coffee after work?","Shall we get together a coffee after work?","Shall we get together to each other after work?"],"why":"Get together means meet socially; for introduces the activity or occasion.","hint":"We want to meet socially. Choose the phrase for arranging a meeting."},{"id":"vb2pre1-2","type":"choice","prompt":"After work, we often sit in the park chatting with no particular plan. What do we do?","answer":"We hang out together.","options":["We hang out together.","We go back together.","We turn each other down."],"why":"Hang out describes relaxed informal time together.","hint":"Think of relaxed time together, rather than a formal appointment."},{"id":"vb2pre1-3","type":"choice","prompt":"Leah is comfortable starting conversations with people she has never met. She is…","answer":"outgoing","options":["outgoing","clingy","indifferent"],"why":"Outgoing describes a friendly, socially confident personality.","hint":"This describes a person’s usual behaviour, not the size of their social circle."},{"id":"vb2pre1-4","type":"choice","prompt":"Ben enjoys moving between groups and chats easily with almost everyone at an event. He is…","answer":"a social butterfly","options":["a social butterfly","a third wheel","a party pooper"],"why":"A social butterfly socialises widely and easily.","hint":"Look for movement between many social groups."},{"id":"vb2pre1-5","type":"choice","prompt":"“We ___ immediately and talked for an hour.” Which phrase describes the beginning of the connection?","answer":"hit it off","options":["hit it off","went back","had it in for each other"],"why":"Hit it off refers to liking each other from the start.","hint":"Think about how the connection began."},{"id":"vb2pre1-6","type":"choice","prompt":"“We have different hobbies, but we ___ well.” Choose the phrase for a friendly ongoing relationship.","answer":"get along","options":["get along","go back","stand each other up"],"why":"Get along describes the quality of a relationship, even when interests differ.","hint":"Think of an ongoing relationship, not necessarily an instant connection."},{"id":"vb2pre1-7","type":"choice","prompt":"“We both collect old cameras and enjoy hiking.” Which summary is supported?","answer":"We have a lot in common.","options":["We have a lot in common.","We have known each other for years.","We are both social butterflies."],"why":"Shared interests support have a lot in common, but do not show how long the people have known each other.","hint":"Look for shared interests or experiences."},{"id":"vb2pre1-8","type":"choice","prompt":"Rosa says, “Daniel and I go back years.” What does she mean?","answer":"They have known each other for a long time.","options":["They have known each other for a long time.","They regularly travel to the same place.","They have recently become close friends."],"why":"Go back years describes a long shared history.","hint":"Here the phrase describes the history of a relationship, not travel."}],"writing":"You met Alex at a local photography event. Write a friendly follow-up message: mention a specific interest you share, clarify one detail about a possible meeting, suggest a time and place, and leave Alex a comfortable way to decline or suggest an alternative. Use two or three linking expressions naturally. Aim for about 100–150 words; clarity matters more than the exact length.","writingModel":"Hi Alex,\nIt was lovely to meet you at the photography evening. I enjoyed hearing about your street portraits — I’m interested in photographing everyday life too. By the way, I checked the exhibition we discussed: it’s at the gallery on King Street, not at the museum.\nWould you like to get together there on Saturday at three? We could look around and then have a coffee. Actually, I need to leave by five, so an afternoon visit would work best for me. If Saturday is inconvenient, feel free to suggest another day. It would be great to continue our conversation.\nBest,\nJamie","speaking":"Have a four-turn conversation with Alex, a new colleague at an event. Introduce yourself and ask a relevant follow-up. Respond to an unexpected preference, clarify a meeting detail and close politely. Use linking expressions naturally and listen to what Alex actually says. Review and improve the language of your own replies.","conversation":[{"partner":"Hi, I’m Alex. I’ve just joined the team. I saw the photography book you brought — do you take photos yourself?","goal":"Introduce yourself, answer Alex’s question and ask a relevant follow-up.","hint":"Give Alex one concrete detail to respond to. Ask about their interest, rather than listing everything you do."},{"partner":"Actually, I mostly photograph old buildings. Big group photo walks make me a bit uncomfortable, though. I prefer going with one or two people.","goal":"Respond to the unexpected preference and suggest a suitable activity.","hint":"Acknowledge the preference first. Suggest something that fits a small group."},{"partner":"A short walk sounds good. I can do Saturday, but I have to leave by four. Did you mean the café beside the station or the one on River Street?","goal":"Clarify which café you mean and suggest a time that works before four.","hint":"Choose one café explicitly. Check the time limit instead of assuming Alex is free all afternoon."},{"partner":"Thanks, that works. Could you send me a short message with the place and time? I should get back to the event now.","goal":"Agree on the next step and close the conversation warmly.","hint":"Confirm that you will send the details. A short, friendly closing is enough."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a3163e30bd85049b5d31a7d_ElevenLabs_2026-06-16T14_52_29_Christina%20-%20Energetic%20Commercial%20American%20Female%20Voice.mp3"},{"n":2,"module":0,"grammarSourceNumbers":[13],"grammarTrackingSlug":"b2-pre-course-2-grammar","listeningTrackingSlug":"listening_b2_pre_021_first_impressions","theory":"Lesson 13:**Relative clauses: defining vs non-defining**\n\n**B2 · relative pronouns & adverbscomma rules · omission · prepositions**\n\n### 1) What is a relative clause?\n\nA **relative clause** adds information about a noun (person, thing, idea). It is introduced by a relative **pronoun** (*who, whom, whose, which, that*) or a relative **adverb** (*where, when, why*).\n\n- **Defining (= identifying)** *The student **who sits by the window** won the prize.* (tells us which student)\n- **Non-defining (= extra)** *Maria, **who sits by the window**, won the prize.* (extra detail about Maria)\n\n### 2) Core contrast & comma rule\n\n**Defining** clauses are essential to identify the noun → **no commas**.\\\n**Non-defining** clauses add extra information → set off by **commas**.\n\n- *The houses **that face the park** are expensive.*\n- *My house, **which faces the park**, gets a lot of light.*\n\nIf removing the clause changes *who/what* we mean, it’s **defining**. If removal leaves reference clear, it’s **non-defining**.\n\n### 3) Relative pronouns: choices & register\n\n| **Target**       | **Defining**                | **Non-defining**                                       | **Notes**                                             |\n| ---------------- | --------------------------- | ------------------------------------------------------ | ----------------------------------------------------- |\n| People (subject) | **who / that**              | **who**                                                | *that* not used with commas.                          |\n| People (object)  | **who / whom / that / Ø**   | **who / whom**                                         | **whom** = formal; **Ø** (omission) only in defining. |\n| Things/ideas     | **which / that / Ø**        | **which**                                              | *that* never in non-defining.                         |\n| Possession       | **whose** (people & things) | *whose* is fine for objects: *the company whose logo…* |                                                       |\n\nSpoken, informal English often prefers **that** in defining clauses. Avoid **that** after a comma or after a preposition placed before the pronoun.\n\n### 4) Relative adverbs: time, place, reason\n\n- **when** *2005 was the year **when** we met.*\n- **where** *This is the café **where** they first talked.*\n- **why** *I’ll never forget the reason **why** he left.* (Many writers drop *why* after *reason*: *the reason he left*.)\n\nMore formal equivalents use a preposition + **which**: *the year in which…, the café at which…*\n\n### 5) Prepositions in relative clauses\n\n#### Preposition + which/whom (formal; written)\n\n- *She finally bought the violin **for which** she had saved for years.*\n- *He was a mentor **to whom** many young lawyers turned.*\n\n#### … + preposition (at the end) (neutral/informal)\n\n- *She finally bought the violin (which/that) she had saved for years **for**.*\n\n**After a fronted preposition, use only which/whom/whose.** Do not use *who* or *that* there.\n\n### 6) Omission (Ø) of the relative pronoun\n\n- **Allowed** *The book **Ø** I told you about is out of print.* (object)\n- **Allowed** *The colleague **Ø** you were talking to called back.* (object of preposition; preposition stranded)\n- **Not allowed** *\\*The engineer **Ø** fixed the server is here.* (subject)\n- **Not allowed** Omission is **never** used in non-defining clauses.\n\n### 7) *which/that* vs *what*\n\n- **Referring back** **which/that** point back to a noun or to a whole clause.\\\n  *I kept the postcard **which/that** she sent me.*\\\n  *He offered to help us, **which** was very kind.* (refers to the whole idea)\n- **Independent** **what** means “the thing(s) that” and does not follow a noun.\\\n  *I didn’t like **what** he said.* / ***What** you need is a break.*\n- ✱ Don’t use *what* as a relative pronoun after a noun: *\\*the postcard what…*\n\n**Informal *that* is common in defining clauses, but** it is never used after a comma (non-defining) or after a fronted preposition.\n\n### 8) Quantifier + of which/whom (non-defining only)\n\n- *The engineers, **many of whom** work remotely, meet monthly.*\n- *The shelters, **none of which** were full, stayed open all night.*\n- *The library owns rare journals, **several of which** date from the 19th century.*\n- *We joined a hiking group, **most of whose** members are families.*\n\nTypical quantifiers: *some, any, none, all, both, several, many, most, few, each, either, neither*.\n\n### 9) Special tendencies with *that*\n\n- **Superlatives/only** Defining clauses after *the first/only/best/next* often use **that**: *She’s the only person **that** understands.*\n- **Indefinite pronouns** After *everything, nothing, something, anything* use **that**: *Tell me everything **that** happened.*\n- **No commas** *that* does not occur in non-defining clauses.\n\n### 10) Clause-reference *which* (non-defining)\n\n*which* can refer to a whole idea in the previous clause and must be set off by commas:\n\n- *The flight was delayed, **which** meant we missed the connection.*\n- *He ignored the safety rules, **which** was irresponsible.*\n\n### 11) Quick reference\n\n|                  | **Defining**                                                            | **Non-defining**                                     |\n| ---------------- | ----------------------------------------------------------------------- | ---------------------------------------------------- |\n| Punctuation      | No commas                                                               | Between commas                                       |\n| Pronouns         | who/whom/whose/which/that                                               | who/whom/whose/which                                 |\n| Omission (Ø)     | Allowed for objects / prepositional objects (with stranded preposition) | Not allowed                                          |\n| Prepositions     | before *which/whom* (formal) or at end (neutral)                        | before *which/whom* only (since commas block *that*) |\n| Adverbs          | *when/where/why* or *prep + which*                                      | *when/where/why* or *prep + which* (commas)          |\n| Clause-reference | —                                                                       | *, which …* only                                     |\n\n### 12) Editing tests you can use\n\n- **Which one? test** If the clause answers “*Which one?*”, it’s defining.\n- **By-the-way test** If the clause feels like an aside, use commas → non-defining.\n- **Comma ban** Never mix commas with *that*; switch to *who/which*.\n","audioNumber":21,"audioTitle":"Why First Impressions Are Hard to Change","speaker":"Oliver","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a532fee11bee0fb13b1b1b3_compress%20(2).mp3","localAudio":"audio/lesson21-first-impressions.mp3","transcript":["Hi, I’m Oliver. A few years ago, a new colleague named Adrian joined my team. On his first morning, he arrived late to our introductory meeting, gave short answers, and spent most of the time looking at his laptop. When people tried to include him in the conversation, he smiled politely but did not say much.","By lunchtime, I had already formed an opinion. I thought he was distant, overconfident, and probably not very interested in working with us.","That first impression stayed with me for several weeks. When Adrian remained quiet in meetings, I saw it as proof that he was unfriendly. When he questioned an idea, I interpreted his tone as critical. Even when he offered useful help, I assumed he was doing it because he wanted to demonstrate that he knew more than everyone else.","The interesting part is that I did not feel as though I was making assumptions. I felt as though I was observing facts. But I was selecting facts that matched the opinion I had already formed.","Later, I learned that Adrian’s first morning had been unusually difficult. His train had been cancelled, his laptop was not connecting to the company system, and English was not his first language. He was trying to follow a fast conversation while solving technical problems and remembering the names of twelve new colleagues.","Once I knew this, his behaviour looked completely different. His silence no longer seemed arrogant. It seemed cautious. His short answers did not necessarily show disinterest. They may simply have reflected the effort of speaking accurately in an unfamiliar group.","But even after learning the context, my original impression did not disappear immediately. I still noticed moments that supported it. If Adrian interrupted someone, I thought, “There it is again.” If another colleague interrupted, I barely remembered it.","This made me realise why first impressions are so powerful. They do not only influence what we think about someone. They influence what we notice next. Once we have created a story, new information is often organised around that story.","There is also an emotional reason. Changing your opinion requires you to admit that your earlier judgement may have been unfair. That can feel uncomfortable, especially if you have already shared the opinion with other people.","In my case, I had casually described Adrian as “a bit difficult” to two colleagues. After that, changing my mind felt like correcting not only a private thought but also a public position. I had to admit that I had judged him too quickly.","The change finally happened through repeated experience. Adrian helped me prepare for a complicated client call and stayed late when a technical problem appeared. He listened carefully when I explained my concerns and gave feedback without making the conversation personal. Over time, these experiences became too consistent to ignore.","We eventually became good colleagues. Adrian was not perfect, and my first impression was not completely invented. He could be direct, and he sometimes became impatient. But I had turned a few real characteristics into a complete personality.","Now, when I meet someone new, I try to separate observation from interpretation. “She did not ask any questions” is an observation. “She is not interested” is an interpretation. The interpretation may be correct, but it is not the only possible explanation.","I also try to treat first impressions as temporary working ideas rather than final conclusions. They can be useful. We often need to make quick decisions about whether a situation feels comfortable or safe. The problem begins when a quick impression becomes permanent and stops responding to new evidence.","Changing a first impression does not mean ignoring warning signs or forcing yourself to like everyone. It means leaving enough space for context, patterns, and contradiction. One moment can tell you something about a person, but it rarely tells you everything."],"mappingNote":"Source recording 21 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Describe People Fairly","goal":"Identify people precisely and distinguish observed behaviour from assumptions about personality.","topic":"First impressions, colleague profiles and fair descriptions","languageFocus":"Defining and non-defining relative clauses; who/which/that/whose, object omission, prepositions and clause-reference which. Separate observation from interpretation.","conversationTitle":"Compare your impressions with Alex.","readingLabel":"PROFILES + EMAIL","readingIntro":"Read two colleague profiles and the organiser’s email. Recommend people for specific roles using both their experience and the new context.","wordBankTitle":"Describe feelings and behaviour fairly.","theoryCards":[{"title":"Identify — or add information?","text":"A **defining relative clause** tells us which person or thing we mean: “The colleague **who tested the website** found the error.” No commas.\n\nA **non-defining clause** adds information about an already identified person: “Mina, **who tested the website**, found the error.” Use commas.","tip":"Changing the commas can change the meaning, not just the appearance."},{"title":"Choose the pronoun","text":"For people, use **who**; **that** is also possible in defining clauses. For things, use **which** or defining **that**.\n\n“Mina, **who** works remotely, will join us.”\n\nNever use **that** in a non-defining clause: not “Mina, that works remotely, …”.","tip":"Whom is a more formal object form for people."},{"title":"When can you leave it out?","text":"In a defining clause you can omit an **object** pronoun: “The person **(who/that) I interviewed** was helpful.”\n\nKeep a **subject** pronoun: “The person **who interviewed me** was helpful.”\n\nKeep the pronoun in all non-defining clauses.","tip":"Ask who does the verb inside the clause. If the pronoun does it, do not omit it."},{"title":"Show possession with whose","text":"**Whose + noun** identifies a connection or possession: “The colleague **whose report we discussed** is here.”\n\nIt can refer to people or organisations: “a company **whose staff work remotely**”.\n\n**Whose** is not the same as **who’s** (= who is / who has).","tip":"Do not add another possessive: not “whose her report”."},{"title":"Place the preposition","text":"Neutral: “the colleague **who I work with**”. Formal: “the colleague **with whom I work**”.\n\nWith a fronted preposition, use **whom** for people and **which** for things.\n\nA final preposition is also possible in a non-defining clause: “Mina, **who I work with**, checked it.”","tip":"Commas do not force a preposition to move to the front."},{"title":"Place, time and reason","text":"Use **where** for a place relationship: “the office **where we met**”. Compare an object relationship: “the office **which we rented**”.\n\nUse **when** for time and **why** after reason: “the day **when we met**”; “the reason **why he left**”.","tip":"A place noun does not automatically require where: check the role in the clause."},{"title":"A whole idea — or part of a group?","text":"“He explained the delay, **which** helped us understand.” Here which refers to the previous action.\n\n“The volunteers, **two of whom** had tested the form, described the problem.”\n\n“The reports, **both of which** were anonymous, raised similar concerns.”","tip":"What means “the thing(s) that”: “What she said helped.” Do not put what after a noun."},{"title":"Describe evidence fairly","text":"“The colleague **who left early** missed the discussion” identifies a person and an observed action.\n\n“The colleague is indifferent” adds an interpretation that may be wrong.\n\nChoose relative clauses to explain relevant experience, not to turn one moment into a complete personality.","tip":"Before judging, ask what other context would explain the same behaviour."}],"tasks":[{"id":"b2g2-1","type":"choice","prompt":"There are several volunteers. Identify only the ones with testing experience.","answer":"The volunteers who tested the form can explain the problem.","options":["The volunteers who tested the form can explain the problem.","The volunteers, who tested the form, can explain the problem.","The volunteers, that tested the form, can explain the problem."],"why":"The defining clause selects a subgroup. Commas would present the information as true of the already identified group.","hint":"Are you selecting a subgroup or adding a fact about the whole group?"},{"id":"b2g2-2","type":"choice","prompt":"Mina is already identified. Add the fact that she works remotely.","answer":"Mina, who works remotely, will join by video.","options":["Mina, who works remotely, will join by video.","Mina, that works remotely, will join by video.","Mina, works remotely, will join by video."],"why":"A non-defining clause needs a pronoun and cannot use that.","hint":"The commas make this extra information about Mina."},{"id":"b2g2-3","type":"choice","prompt":"In which sentence can the relative pronoun be omitted?","answer":"The colleague who I interviewed sent a follow-up.","options":["The colleague who I interviewed sent a follow-up.","The colleague who interviewed me sent a follow-up.","Mina, who I interviewed yesterday, sent a follow-up."],"why":"I is the subject of interviewed in the first sentence, so who is its object in a defining clause.","hint":"Check the subject inside the relative clause and whether there are commas."},{"id":"b2g2-4","type":"gap","prompt":"Complete with the possessive relative pronoun: “The researcher ___ notes we used has joined the call.”","answer":"whose","why":"Whose links the researcher to their notes.","hint":"You need a word that expresses possession before notes."},{"id":"b2g2-5","type":"choice","prompt":"Choose the formal version of “the colleague who we spoke to”.","answer":"the colleague to whom we spoke","options":["the colleague to whom we spoke","the colleague to who we spoke","the colleague to that we spoke"],"why":"After a fronted preposition, use whom for people.","hint":"The preposition comes before the relative pronoun in this formal version."},{"id":"b2g2-6","type":"choice","prompt":"Which non-defining clause is grammatical in neutral English?","answer":"Jon, who I work with, checked the figures.","options":["Jon, who I work with, checked the figures.","Jon, I work with, checked the figures.","Jon, that I work with, checked the figures."],"why":"The pronoun must stay. The preposition may remain at the end of a non-defining clause.","hint":"A final preposition is allowed; omission and that are the issues here."},{"id":"b2g2-7","type":"choice","prompt":"Complete: “This is the meeting room ___ we booked for the interviews.”","answer":"which","options":["which","where","what"],"why":"The room is the object of booked, so which is appropriate. Where would require a place relationship such as where we held the interviews.","hint":"Does the missing word mean “in that place”, or is the room being booked?"},{"id":"b2g2-8","type":"choice","prompt":"What does “which” refer to in “She explained the delay, which changed my view of her”?","answer":"Her action of explaining the delay.","options":["Her action of explaining the delay.","Only the noun delay.","An unidentified female colleague."],"why":"The non-defining clause comments on the previous action as a whole.","hint":"Ask what caused the change of view: the delay alone, or its explanation?"},{"id":"b2g2-9","type":"order","prompt":"Build a defining description of the colleague.","answer":"The colleague whose report I read seemed curious.","why":"Whose report expresses possession; I read modifies that report.","hint":"Start with the person, then add whose + noun."},{"id":"b2g2-10","type":"edit","prompt":"Replace the incorrect relative word; keep the rest: “The feedback what she gave was useful.”","answer":"The feedback which she gave was useful.|The feedback that she gave was useful.","why":"A noun already comes before the clause, so use which or that, not independent what.","hint":"The task asks you to keep a relative word, not omit it."},{"id":"b2g2-11","type":"choice","prompt":"Complete: “The researchers, two of ___ work remotely, joined online.”","answer":"whom","options":["whom","which","that"],"why":"The reference is to people; two of whom introduces extra information about part of the group.","hint":"Use a pronoun for people after of."},{"id":"b2g2-12","type":"choice","prompt":"Which description separates observation from interpretation most fairly?","answer":"The colleague who gave short answers may have needed more time to think.","options":["The colleague who gave short answers may have needed more time to think.","The colleague who gave short answers is obviously indifferent to everyone.","The colleague, that gave short answers, has no interest in the team."],"why":"The first sentence identifies an observed action and leaves room for another explanation.","hint":"Look for a precise observed action and a cautious interpretation."}],"listening":[{"id":"b2l2-1","type":"choice","prompt":"What is Oliver mainly explaining?","answer":"How a first impression shaped the evidence he noticed afterwards.","options":["How a first impression shaped the evidence he noticed afterwards.","Why lateness always reveals poor professional standards.","Why quiet colleagues should avoid client-facing work."],"why":"He describes noticing and interpreting later events through an opinion he had already formed.","hint":"Focus on the process behind his judgement, rather than on Adrian’s first morning.","evidence":"They do not only influence what we think about someone. They influence what we notice next."},{"id":"b2l2-2","type":"choice","prompt":"Which is an observation from Adrian’s first morning, rather than Oliver’s interpretation?","answer":"Adrian gave short answers and looked at his laptop.","options":["Adrian gave short answers and looked at his laptop.","Adrian was overconfident.","Adrian was uninterested in working with the team."],"why":"Short answers and looking at a laptop are observable actions. The other choices assign motives or personality.","hint":"Separate what a camera could record from a judgement about its meaning.","evidence":"On his first morning, he arrived late to our introductory meeting, gave short answers, and spent most of the time looking at his laptop."},{"id":"b2l2-3","type":"choice","prompt":"Which combination made that morning especially difficult for Adrian?","answer":"Transport disruption, technical problems and following a fast conversation in a second language.","options":["Transport disruption, technical problems and following a fast conversation in a second language.","A disagreement with Oliver and a cancelled client presentation.","A lack of relevant experience and an unwillingness to use English."],"why":"The later context explains several pressures without supporting the claim that he lacked interest.","hint":"Listen for the three different demands he was managing.","evidence":"His train had been cancelled, his laptop was not connecting to the company system, and English was not his first language."},{"id":"b2l2-4","type":"choice","prompt":"Did learning the context immediately remove Oliver’s first impression?","answer":"No. He still noticed Adrian’s interruptions more than other people’s.","options":["No. He still noticed Adrian’s interruptions more than other people’s.","Yes. From then on he treated every incident identically.","No. He decided that the explanation had been invented."],"why":"Oliver explicitly describes an uneven response to the same behaviour after learning the context.","hint":"Compare his reaction to Adrian interrupting with his reaction to another colleague.","evidence":"If Adrian interrupted someone, I thought, “There it is again.” If another colleague interrupted, I barely remembered it."},{"id":"b2l2-5","type":"choice","prompt":"Why did changing his opinion carry a social cost?","answer":"He had already described Adrian negatively to two other colleagues.","options":["He had already described Adrian negatively to two other colleagues.","He would have to give up a promotion.","He had publicly promised never to work with Adrian."],"why":"Correcting his view also meant correcting a position he had shared with others.","hint":"Look for the difference between a private judgement and a public position.","evidence":"In my case, I had casually described Adrian as “a bit difficult” to two colleagues."},{"id":"b2l2-6","type":"choice","prompt":"What finally changed Oliver’s opinion most strongly?","answer":"A consistent pattern of helpful, thoughtful behaviour.","options":["A consistent pattern of helpful, thoughtful behaviour.","One apology for arriving late.","A manager’s instruction that everyone must like Adrian."],"why":"Repeated experience became harder to fit into Oliver’s original negative story.","hint":"Listen for what happened repeatedly, rather than a single dramatic moment.","evidence":"Over time, these experiences became too consistent to ignore."},{"id":"b2l2-7","type":"sequence","prompt":"Put the developments in order.","answer":["Oliver forms a negative opinion on the first day.","Oliver learns about the pressures Adrian had been facing.","Repeated cooperation changes their working relationship."],"why":"The quick judgement comes first, then the missing context, and finally a longer pattern of cooperation.","hint":"Distinguish the first day, the later explanation and repeated experience.","evidence":"We eventually became good colleagues."},{"id":"b2l2-8","type":"choice","prompt":"Which conclusion would Oliver now support?","answer":"Keep first impressions open to context and contradictory evidence.","options":["Keep first impressions open to context and contradictory evidence.","Ignore every warning sign until you know someone well.","Treat a first impression as useless information in every situation."],"why":"He allows quick impressions to be useful while warning against treating them as permanent conclusions.","hint":"Listen for the balance in his final position.","evidence":"Changing a first impression does not mean ignoring warning signs or forcing yourself to like everyone."}],"readingTitle":"Choosing project partners","readingTexts":[{"title":"Two profiles · Community research project","text":"Mina is a researcher who has carried out interviews with local residents. She is reserved in large meetings, but her written summaries are detailed and she often asks curious, precise questions in small groups. She works remotely on Tuesdays and Thursdays. The interviews for our new project are on Wednesday afternoon, when she is available. She has not used our survey software before and would need a short introduction.\nJon, who joined the team in September, has experience presenting to community groups. He is confident in front of an audience and knows the survey software well. He is unavailable on Wednesday until four, however. The public briefing is on Friday morning, which suits him. He has offered to review interview questions in writing before Wednesday."},{"title":"Organiser’s email · New context","text":"Hi Alex,\nBefore we assign roles, I want to clarify two things from yesterday. Mina left the meeting early because she had agreed to collect equipment from another building. The colleague whose laptop she borrowed needed it back by three. Her leaving was not evidence that she was indifferent to the project. She has already sent three useful suggestions, for which I’m grateful.\nJon’s silence when we discussed the survey was easy to misread too. He later explained that he was puzzled by two conflicting instructions. He wanted to check which version was current before recommending a process. He was not offended by your question.\nWe need someone to lead the resident interviews on Wednesday from two to three, and someone else to present the findings on Friday. We also need a software practice session before the interviews. Please propose a plan that uses people’s actual availability and experience. Neither profile tells us everything about the person.\nRosa"}],"reading":[{"id":"b2r2-1","type":"choice","prompt":"Which allocation best fits the skills and availability?","answer":"Mina leads Wednesday’s interviews; Jon presents on Friday.","options":["Mina leads Wednesday’s interviews; Jon presents on Friday.","Jon leads Wednesday’s interviews; Mina presents on Friday.","Both people lead the interviews, and the briefing is cancelled."],"why":"Mina has interview experience and is available Wednesday; Jon’s presentation experience and Friday availability suit the briefing.","hint":"Combine relevant experience with the actual time of each task."},{"id":"b2r2-2","type":"choice","prompt":"Which preparation would make that plan more workable?","answer":"Arrange a survey-software introduction for Mina before Wednesday.","options":["Arrange a survey-software introduction for Mina before Wednesday.","Ask Jon to arrive after four for the two o’clock interviews.","Assume Mina already knows the software because she is a researcher."],"why":"Mina’s interview skills do not remove her stated need for a software introduction.","hint":"Identify the gap between having relevant experience and knowing a particular tool."},{"id":"b2r2-3","type":"choice","prompt":"Which earlier interpretation does the email directly challenge?","answer":"Mina’s leaving early showed that she did not care about the project.","options":["Mina’s leaving early showed that she did not care about the project.","Mina works remotely on certain days.","Jon has presented to community groups."],"why":"The equipment collection and borrowed laptop explain the observed departure; they challenge its assumed meaning.","hint":"Find the action whose reason was missing in the original judgement."},{"id":"b2r2-4","type":"choice","prompt":"What is supported about Jon’s silence?","answer":"He was uncertain about which instructions were current, rather than offended by the question.","options":["He was uncertain about which instructions were current, rather than offended by the question.","He could not understand any of the survey software.","He intended to refuse all work on the project."],"why":"The email identifies a specific uncertainty, while his profile says he knows the software.","hint":"Use the profile and the later explanation together."},{"id":"b2r2-5","type":"choice","prompt":"In “The colleague whose laptop she borrowed”, what does whose connect?","answer":"The colleague and the laptop belonging to that colleague.","options":["The colleague and the laptop belonging to that colleague.","Mina and a laptop she owns.","The organiser and all the equipment in the building."],"why":"The phrase identifies the person by their connection to the borrowed laptop.","hint":"Follow the ownership, not just the nearest person’s name."},{"id":"b2r2-6","type":"choice","prompt":"Which response to Rosa is fairest and most useful?","answer":"I’ll check Mina’s software needs and confirm the two roles; yesterday’s behaviour alone was not enough to judge either person.","options":["I’ll check Mina’s software needs and confirm the two roles; yesterday’s behaviour alone was not enough to judge either person.","I’ll give Jon everything because confident people are always more reliable.","I’ll exclude Mina because leaving early proves indifference."],"why":"It acts on the practical information while revising unsupported personality judgements.","hint":"A good plan should address both the role allocation and the missing context."}],"vocab":[{"id":"vb2pre2-1","word":"reserved","definition":"Not showing your feelings or thoughts openly.","example":"Mina is reserved in large meetings but thoughtful in small groups.","hint":"Quiet behaviour does not tell you whether someone cares.","sourceLesson":3},{"id":"vb2pre2-2","word":"confident","definition":"Sure of yourself and your abilities.","example":"Jon sounds confident when he explains the project.","hint":"Separate certainty about your own ability from judging other people.","sourceLesson":3},{"id":"vb2pre2-3","word":"curious","definition":"Interested in learning or finding out more.","example":"The new researcher was curious about how customers used the service.","hint":"Look for an interest in understanding, not just a lack of certainty.","sourceLesson":3},{"id":"vb2pre2-4","word":"indifferent","definition":"Not interested or concerned about something.","example":"She was indifferent to the choice of restaurant.","hint":"This is a lack of concern, not simply a quiet way of speaking.","sourceLesson":3},{"id":"vb2pre2-5","word":"offended","definition":"Hurt or annoyed because something seems rude or disrespectful.","example":"He felt offended when his colleague laughed at his suggestion.","hint":"The feeling involves perceived disrespect.","sourceLesson":3},{"id":"vb2pre2-6","word":"puzzled","definition":"Confused because something is hard to understand.","example":"I was puzzled by the instructions, so I asked for an example.","hint":"The person needs an explanation rather than reassurance about success.","sourceLesson":3},{"id":"vb2pre2-7","word":"neutral","definition":"Not supporting either side in a disagreement.","example":"The facilitator remained neutral and invited both sides to explain.","hint":"Think about someone’s position in a disagreement.","sourceLesson":3},{"id":"vb2pre2-8","word":"grateful","definition":"Thankful for help or kindness.","example":"I was grateful to the colleague who checked my draft.","hint":"Look for a response to something helpful.","sourceLesson":3}],"vocabularyQuestions":[{"id":"vb2pre2-1","type":"choice","prompt":"Mina keeps her feelings private in large meetings. This makes her…","answer":"reserved","options":["reserved","indifferent","offended"],"why":"Reserved concerns expression; it does not establish a lack of concern.","hint":"Quiet behaviour does not tell you whether someone cares."},{"id":"vb2pre2-2","type":"choice","prompt":"Jon believes he can explain the project clearly in public. He feels…","answer":"confident","options":["confident","puzzled","neutral"],"why":"Confidence is a belief in your own ability.","hint":"Separate certainty about your own ability from judging other people."},{"id":"vb2pre2-3","type":"choice","prompt":"Someone asks detailed follow-up questions because they want to understand. They are…","answer":"curious","options":["curious","indifferent","offended"],"why":"Curious describes a desire to learn more.","hint":"Look for an interest in understanding, not just a lack of certainty."},{"id":"vb2pre2-4","type":"choice","prompt":"“I don’t mind which room we use; I have no preference.” About the room, I am…","answer":"indifferent","options":["indifferent","grateful","puzzled"],"why":"Indifferent means not having a strong interest or concern about that choice.","hint":"This is a lack of concern, not simply a quiet way of speaking."},{"id":"vb2pre2-5","type":"choice","prompt":"A colleague feels hurt because a joke seemed disrespectful. They feel…","answer":"offended","options":["offended","neutral","curious"],"why":"Offended links hurt or annoyance to perceived rudeness.","hint":"The feeling involves perceived disrespect."},{"id":"vb2pre2-6","type":"choice","prompt":"Two instructions contradict each other, and you cannot work out which to follow. You are…","answer":"puzzled","options":["puzzled","grateful","confident"],"why":"Puzzled means confused by something that needs explanation.","hint":"The person needs an explanation rather than reassurance about success."},{"id":"vb2pre2-7","type":"choice","prompt":"A facilitator listens to both sides and supports neither position. They remain…","answer":"neutral","options":["neutral","indifferent to the outcome","offended"],"why":"Neutral concerns taking sides; it need not mean that the facilitator does not care.","hint":"Think about someone’s position in a disagreement."},{"id":"vb2pre2-8","type":"choice","prompt":"A colleague helped you prepare, and you want to thank them. You feel…","answer":"grateful","options":["grateful","reserved","indifferent"],"why":"Grateful describes appreciation of help or kindness.","hint":"Look for a response to something helpful."}],"writing":"Introduce two possible partners for a community project in a message to Alex. Give each person a relevant skill and a practical constraint. Use defining clauses to identify experience and at least one non-defining clause to add context. Recommend a fair division of work without treating a single quiet or confident moment as proof of personality. Aim for about 120–160 words; the exact count is not a gate.","writingModel":"Hi Alex,\nI’d suggest Mina for the interviews and Jon for the public briefing. Mina, who has interviewed local residents before, is available on Wednesday afternoon. She is the researcher whose written questions we discussed yesterday. Although she seemed reserved at the meeting, she has already sent useful ideas. I wouldn’t assume that she lacks interest. The main preparation she needs is a short introduction to the survey software.\nJon is the colleague who presented last month’s community report. He sounds confident in public and can attend the Friday briefing. He cannot make the Wednesday interviews, but he could review our questions beforehand.\nCould we confirm these roles and arrange Mina’s software session on Tuesday? That would use their experience while respecting their actual availability.","speaking":"Discuss a colleague whose first impression may have been misleading. Describe observed behaviour, distinguish it from an interpretation, respond to Alex’s alternative explanation and revise your recommendation using context. Use relative clauses naturally. Do not invent certainty about someone’s motives.","conversation":[{"partner":"We need someone for the new project. Tell me about a person you know whose first impression changed over time. What did you notice at first?","goal":"Identify the person with a relative clause, describe an observed action and explain your initial interpretation.","hint":"Use an anonymous example if you prefer. Keep “what they did” separate from “what I assumed”."},{"partner":"That behaviour could have another explanation. Perhaps they were dealing with something outside the meeting. What information would you want before judging?","goal":"Respond to the alternative explanation and say what context you would check.","hint":"Acknowledge uncertainty. A colleague who stays quiet is not necessarily indifferent."},{"partner":"Suppose they later help carefully with a task but remain reserved in large groups. How would you describe them now, and which role might suit them?","goal":"Revise the description using both pieces of information and recommend a relevant role.","hint":"Describe what the helpful behaviour supports. Do not replace one sweeping judgement with another."},{"partn
