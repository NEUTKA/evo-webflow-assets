 month. She planned to attend both seminars live and finish all the reading after work, although she usually gets home exhausted at 22.00. She excels in spoken discussion but has begun to fall behind with the written tasks. On Friday she watched a recording and felt she had caught up, but she had not started the application task. She is motivated and wants to keep up with the coursework; the plan is not giving her a reliable moment to begin."},{"title":"Ben’s two-week experiment","text":"Ben’s shifts change each week, so “study at seven” kept failing. He also used to procrastinate because each session meant completing a whole chapter. His revised trigger is finishing his first meal after waking, whatever the clock says. He reviews one example and writes one question for five minutes before opening social media.\nOn Friday he uses the relevant recording to answer his question. He has also reserved twenty minutes on Saturday afternoon to draft the application task, with Sunday morning as a backup. He does not assume the five-minute review will complete the whole course. If he misses one day, he resumes with the small review after his next first meal; he does not double the following session as a punishment. At the end of two weeks he will check both how often he started and whether he submitted the task on time."}],"reading":[{"id":"b2r9-1","type":"choice","prompt":"Why is Ada’s live-attendance plan unsuitable this month?","answer":"Both live seminars overlap her late shifts, and the proposed after-work study starts when she is normally exhausted.","options":["Both live seminars overlap her late shifts, and the proposed after-work study starts when she is normally exhausted.","The course provides no recordings or forum support.","Her spoken ability means she has no written task to submit."],"why":"The timing conflicts with her shifts and the backup assumes energy the diary says she lacks.","hint":"Combine the timetable with her actual work pattern."},{"id":"b2r9-2","type":"choice","prompt":"What has Ada not caught up with simply by watching Friday’s recording?","answer":"The application task, which is separate and still has to be submitted by Sunday.","options":["The application task, which is separate and still has to be submitted by Sunday.","A compulsory live seminar on Saturday.","A forum reply that only the teacher can submit for her."],"why":"The schedule separates access to teaching from completing the assessed application.","hint":"Check the stated deadline and what watching a recording does not do."},{"id":"b2r9-3","type":"choice","prompt":"Why is Ben’s new trigger more suitable than a fixed clock time?","answer":"The first meal happens after waking across different shifts, so it gives the small review a repeatable cue.","options":["The first meal happens after waking across different shifts, so it gives the small review a repeatable cue.","His shifts now begin at exactly the same time every day.","It guarantees that he can attend both live seminars."],"why":"The trigger is tied to an event that survives the changing schedule.","hint":"A consistent event can be useful even when its clock time varies."},{"id":"b2r9-4","type":"choice","prompt":"What stops Ben’s five-minute habit from becoming a substitute for completing the course task?","answer":"He separately reserves a drafting slot and backup before the submission deadline.","options":["He separately reserves a drafting slot and backup before the submission deadline.","He counts any five-minute session as a submitted assignment.","He avoids checking deadlines so that motivation stays high."],"why":"The habit helps him begin, while the longer application still has protected time.","hint":"Distinguish the daily starting cue from the weekly deliverable."},{"id":"b2r9-5","type":"choice","prompt":"Which action follows Ben’s recovery rule after missing Wednesday?","answer":"Resume the small review after the next first meal, then keep the planned weekly task slot.","options":["Resume the small review after the next first meal, then keep the planned weekly task slot.","Abandon the course because the streak is broken.","Double every future session and cancel the backup slot."],"why":"The diary specifies a forgiving restart without removing the larger weekly responsibility.","hint":"Recover the routine without treating a missed day as permanent failure."},{"id":"b2r9-6","type":"choice","prompt":"Which review would best test whether Ben’s experiment is useful?","answer":"Compare how often he starts and whether the weekly application is completed by the deadline.","options":["Compare how often he starts and whether the weekly application is completed by the deadline.","Count only the number of social-media notifications he receives.","Judge success only by whether the routine sounds ambitious."],"why":"He needs evidence of both a sustainable start and meaningful course progress.","hint":"Use both measures Ben names, rather than visible activity alone."}],"vocab":[{"id":"vb2pre9-1","word":"keep up with (work / coursework)","definition":"Make enough progress to stay on schedule with the work expected of you.","example":"Short reviews helped her keep up with the coursework.","hint":"This means avoiding a growing gap, not necessarily being best in the class.","sourceLesson":5},{"id":"vb2pre9-2","word":"fall behind","definition":"Make slower progress than required and become late with work.","example":"After missing two weeks, he began to fall behind.","hint":"The gap in progress grows; it is more than choosing to rest once.","sourceLesson":5},{"id":"vb2pre9-3","word":"procrastinate","definition":"Delay a task you should do, often by doing something easier instead.","example":"I procrastinate when the next step feels too large or unclear.","hint":"A deliberate rest is not automatically procrastination.","sourceLesson":5},{"id":"vb2pre9-4","word":"attend classes / lectures / seminars","definition":"Be present at organised teaching sessions.","example":"She could attend Thursday’s seminar but needed a recording of Tuesday’s class.","hint":"Attend is followed directly by the session: attend a class, without to.","sourceLesson":5},{"id":"vb2pre9-5","word":"excel in (a subject / skill)","definition":"Be particularly good at a subject or skill.","example":"He excels in discussing ideas but still needs to practise written accuracy.","hint":"Excelling in one area does not mean every skill is equally strong.","sourceLesson":5},{"id":"vb2pre9-6","word":"motivation","definition":"The desire or reason that makes you want to act.","example":"Her motivation was high at the start, but the evening slot was unrealistic.","hint":"Wanting to act and having a workable opportunity are different things.","sourceLesson":6},{"id":"vb2pre9-7","word":"determination","definition":"A firm intention to continue working towards a goal despite difficulty.","example":"Determination helped him return after a missed session.","hint":"A strong commitment can support a sensible plan, not just a demanding one.","sourceLesson":6},{"id":"vb2pre9-8","word":"persevere / never give up","definition":"Continue trying despite difficulty or slow progress.","example":"She persevered by adjusting the routine instead of abandoning the goal.","hint":"Persevering can include changing your method.","sourceLesson":6}],"vocabularyQuestions":[{"id":"vb2pre9-1","type":"choice","prompt":"You stay on schedule with the tasks the course expects. You…","answer":"keep up with the coursework","options":["keep up with the coursework","fall behind with every assignment","leave all work unfinished"],"why":"Keep up with means maintain the expected progress.","hint":"This means avoiding a growing gap, not necessarily being best in the class."},{"id":"vb2pre9-2","type":"choice","prompt":"Your unfinished tasks accumulate and you are later than the course schedule. You…","answer":"fall behind","options":["fall behind","excel in every skill","attend every optional event"],"why":"Fall behind describes a growing gap in required progress.","hint":"The gap in progress grows; it is more than choosing to rest once."},{"id":"vb2pre9-3","type":"choice","prompt":"You keep postponing a task by checking unrelated posts instead. You…","answer":"procrastinate","options":["procrastinate","submit the task","attend the seminar"],"why":"Procrastinate means delay work that needs doing; not every planned break is procrastination.","hint":"A deliberate rest is not automatically procrastination."},{"id":"vb2pre9-4","type":"choice","prompt":"Which phrase correctly means “be present at a teaching session”?","answer":"attend a seminar","options":["attend a seminar","attend to a seminar","attend for a seminar"],"why":"Attend takes the session directly, without to or for.","hint":"Attend is followed directly by the session: attend a class, without to."},{"id":"vb2pre9-5","type":"choice","prompt":"A learner is particularly good at spoken discussion. They…","answer":"excel in discussion","options":["excel in discussion","fall behind in discussion by definition","procrastinate every time they speak"],"why":"Excel in describes being especially good at an area.","hint":"Excelling in one area does not mean every skill is equally strong."},{"id":"vb2pre9-6","type":"choice","prompt":"The desire to learn and the reasons that make the goal attractive are your…","answer":"motivation","options":["motivation","course recording","submission form"],"why":"Motivation concerns wanting to act, not merely having a free hour.","hint":"Wanting to act and having a workable opportunity are different things."},{"id":"vb2pre9-7","type":"choice","prompt":"A firm commitment to continue despite difficulty is…","answer":"determination","options":["determination","a missed timetable","an automatic qualification"],"why":"Determination describes a strong intention to persist.","hint":"A strong commitment can support a sensible plan, not just a demanding one."},{"id":"vb2pre9-8","type":"choice","prompt":"You adapt an unworkable method but continue pursuing the learning goal. You…","answer":"persevere","options":["persevere","give up the goal entirely","avoid all future practice"],"why":"Persevering can mean changing the method while continuing the effort.","hint":"Persevering can include changing your method."}],"writing":"Write to Alex about a realistic learning routine. Your shifts change each week, and a previous forty-minute evening plan failed when you came home tired. The course offers recordings, but a short application is due every Sunday. Explain the earlier attempt, propose a small habit linked to a repeatable event, reserve time for the weekly task and say how you will restart after a missed day. Use relevant gerund/infinitive contrasts naturally; do not force every advanced form into the message. Aim for about 120–170 words.","writingModel":"Hi Alex,\nI regret planning long evening sessions because I usually came home too tired to start. Changing shifts also meant moving the study time every week. I kept postponing the lesson until the routine disappeared.\nI’m going to try reviewing one example after my first meal following sleep. The clock time may change, but the event is reliable. Before opening social media, I’ll write one question and save the relevant recording. This small review should help me begin; it will not replace the weekly application. I’ll reserve twenty minutes before Sunday to draft that task and keep a backup slot.\nIf I miss a day, I’ll resume after the next first meal rather than try to repay a large study debt. After two weeks, I want to check whether I am starting more regularly and submitting work on time.","speaking":"Negotiate a study routine with Alex, whose shifts vary. Identify an unreliable part of a plan, propose a small experiment, keep the weekly task visible and agree a recovery rule and check.","conversation":[{"partner":"I want to study every evening at seven, but my shifts change weekly. I keep falling behind. What would you ask before designing a new routine?","goal":"Clarify what stays reliable and which course work actually needs completing.","hint":"Ask about a repeatable event, available materials or the real deadline."},{"partner":"My first meal after waking is fairly reliable, but I often have only five minutes then. Surely that is too little to matter?","goal":"Propose a meaningful small experiment and explain what it can and cannot achieve.","hint":"Try doing introduces a method to test. A small review can start a habit without completing a whole assignment."},{"partner":"The weekly task is due Sunday. If I miss a day, should I double the next session and skip working on the task?","goal":"Keep the deadline visible and propose a forgiving restart rather than a growing penalty.","hint":"Separate the daily cue from the weekly application and its backup time."},{"partner":"Let us try it for two weeks. What should I record so we can decide whether to keep the plan?","goal":"Agree evidence of a sustainable start and useful progress; summarise the next action.","hint":"Use both how often you begin and what work you finish."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a317b785474df437e1e78ea_ElevenLabs_2026-06-16T16_34_35_David%20-%20Deep%2C%20Warm%2C%20Narration_pvc_sp100_s50_sb75_v3.mp3"},{"n":10,"module":1,"grammarSourceNumbers":[2],"grammarTrackingSlug":"b2-pre-course-10-grammar","listeningTrackingSlug":"listening_b2_pre_014_busy_vs_effective","theory":"Lesson 2: **Clause types: contrast, purpose, cause & result**\n\n**B2 Pre-Advanced**\n\n### CONTRAST — showing difference\n\n| **Linker**                               | **Form**                                         | **Example**                                                                        | **Register**   |\n| ---------------------------------------- | ------------------------------------------------ | ---------------------------------------------------------------------------------- | -------------- |\n| **although / even though**               | **linker + S + V**                               | *Even though* we played poorly, we won.                                            | **neutral**    |\n| **however / nevertheless / nonetheless** | Start new sentence; follow with comma            | We didn’t like the hotel. *However,* the view was amazing.                         | **formal-ish** |\n| **yet**                                  | **, yet + S + V** (or after *and*)               | She was exhausted, *yet* she kept working.                                         | **neutral**    |\n| **despite / in spite of**                | **+ noun / -ing** • **+ the fact that + clause** | *Despite* the rain, we stayed. / In spite of *the fact that* it rained, we stayed. | **neutral**    |\n| **while / whereas**                      | **linker + S + V** (start or mid; comma)         | *While* she loves cooking, he prefers take-away.                                   | **formal-ish** |\n| **still** (adverb)                       | mid-position                                     | It was raining; we *still* went for a walk.                                        | **spoken**     |\n\n**Punctuation:** no comma after *although/even though*. Place a comma after *however / nevertheless / nonetheless*. **Despite** ≠ *despite of* (❌).\n\n### PURPOSE — why we do something\n\n| **Linker**                                    | **Form**                         | **Example**                                                         | **Register**       |\n| --------------------------------------------- | -------------------------------- | ------------------------------------------------------------------- | ------------------ |\n| **to**                                        | **to + V**                       | He studied hard *to* pass.                                          | **neutral**        |\n| **in order (not) to / so as (not) to**        | **+ V**                          | They left early *so as not to* miss the train.                      | **more formal**    |\n| **in order for**                              | **in order for + N/Pron + to V** | We raised funds *in order for* the team *to* travel.                | **formal**         |\n| **so that**                                   | **so that + S + (modal) V**      | We left early *so that* we *could* park nearby.                     | **neutral**        |\n| **for** (purpose) / **for + -ing** (function) | **for + N** / **for + V-ing**    | We went to the lake *for* a swim. This tool is *for cutting* metal. | **neutral**        |\n| **in case**                                   | **in case + S + V** (precaution) | Take an umbrella *in case* it rains. (≠ *if*)                       | **spoken/neutral** |\n\n**Meaning tips:** *so that* commonly takes a modal (*can/could/will/would*). *In case* = do X *because you think* Y might happen.\n\n### CAUSE / REASON — why something happens\n\n| **Linker**                            | **Form**                                 | **Example**                                         | **Register**      |\n| ------------------------------------- | ---------------------------------------- | --------------------------------------------------- | ----------------- |\n| **because**                           | **because + S + V**                      | We stayed in *because* it was snowing.              | **neutral**       |\n| **since / as**                        | **linker + clause** (often at the start) | *Since* the roads were closed, we worked from home. | **more formal**   |\n| **because of**                        | **because of + N**                       | The flight was delayed *because of* fog.            | **neutral**       |\n| **due to / owing to / on account of** | **+ N**                                  | The event was cancelled *due to* lack of funds.     | **formal**        |\n| **thanks to**                         | **thanks to + N** (positive cause)       | *Thanks to* your help, we finished early.           | **positive tone** |\n\n**Punctuation:** when the reason clause comes first (*Because/Since/As...*), add a comma before the main clause.\n\n### RESULT — what happens because of something\n\n| **Linker**                                 | **Form**                                                                       | **Example**                                                                                       | **Register**    |\n| ------------------------------------------ | ------------------------------------------------------------------------------ | ------------------------------------------------------------------------------------------------- | --------------- |\n| **so**                                     | **..., so + S + V**                                                            | We had nothing to do, *so* we watched a film.                                                     | **very common** |\n| **for this reason**                        | sentence-initial + comma                                                       | *For this reason,* we moved the meeting online.                                                   | **formal-ish**  |\n| **as a result / consequently / therefore** | usually sentence-initial + comma; also mid-position for therefore/consequently | The flight was cancelled. *As a result,* we stayed overnight. We have *therefore* issued refunds. | **formal**      |\n| **so … that / such (a) … that**            | **so + adj/adv + that** / **such (a) + adj + N + that**                        | It was *so* cold *that* the lake froze. It was *such a* noisy room *that* nobody could sleep.     | **neutral**     |\n\n**Meaning:** these linkers explain outcomes. *So/such…that* express a strong degree that *causes* the result.\n\n### Common pitfalls & quick checks\n\n- **No comma** after *although/even though*. ✔ *Although* it rained, we played. ❌ *Although,* it rained…\n- **Despite / in spite of** take a *noun* or *-ing*: *despite being late*. Use *the fact that* to follow with a full clause.\n- **However** is adverbial: place it after a full stop/semicolon and follow with a comma: *…; however, …*\n- **In case** ≠ *if*: it expresses precaution (*Take cash in case the card doesn’t work*).\n- **Due to / owing to / on account of** are more formal than *because of*; avoid them in very casual speech.\n\n### Register at a glance\n\n- **informal/spoken**\\\n  **so, still, yet**\n- **neutral**\\\n  **although/even though, because, because of, while, for + N, so that**\n- **formal-ish → formal**\\\n  **since/as (reason), nevertheless, consequently, therefore, owing to, in order (not) to**\n\nChoose linkers to match the tone of your writing (email to a friend vs. report/exam essay).\n","audioNumber":14,"audioTitle":"The Difference Between Being Busy and Being Effective","speaker":"Clara","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a32cc3c7e07b7f2fa746736_ElevenLabs_2026-06-17T16_30_35_Riley%20-%20Engaging%20Young%20Female%20Voice_pvc_sp82_s29_sb75_v3.mp3","localAudio":"audio/lesson14-busy-vs-effective.mp3","transcript":["Hi, I’m Clara. For several years, I confused being busy with being effective. If my calendar was full, my inbox was moving, and I had a long list of tasks crossed out by the end of the day, I felt productive. I liked the feeling of movement. It gave me evidence that I was working hard.","The problem was that many of my busiest days did not actually move anything important forward. I answered messages, joined meetings, updated documents, checked small details, and helped other people solve urgent problems. All of that looked useful. Some of it was useful. But at the end of the week, the projects that mattered most were often still waiting for “when things calm down.”","I started noticing the difference after a manager asked me a simple question during a review: “Which part of your work would create the biggest result if you protected time for it?” I wanted to answer quickly, but I could not. I knew what kept me busy. I was less clear about what made me effective.","That question stayed with me. I began looking at my working week differently. I realised that busyness often comes from reacting. A message arrives, so you answer it. A meeting appears, so you attend it. A colleague asks for a quick opinion, so you give one. None of these actions are necessarily wrong, but they can fill the day before you have chosen what the day is for.","Effectiveness is different. It requires direction. It asks, “What is the most useful outcome here?” not simply, “What can I do next?” Sometimes being effective means doing fewer things but doing the right thing with more attention. Sometimes it means leaving a minor email unanswered for two hours because you are working on something that prevents twenty future emails.","At first, I found this uncomfortable. Busy work gives immediate satisfaction. You can see it. You can count it. You can tell yourself, “I did a lot today.” Effective work is sometimes quieter. You may spend ninety minutes thinking through one difficult decision and have only a few notes to show for it. But those notes might save a project from going in the wrong direction.","I also learned that people often reward busyness because it is visible. Someone who replies instantly looks committed. Someone who is always in meetings looks important. Someone who says, “I’m completely booked,” sounds valuable. But visible effort is not the same as useful progress.","So I changed a few habits. I started choosing one important outcome each morning before opening my inbox. I left space between meetings so I could actually think about what had been discussed. I stopped treating every request as equally urgent. Most importantly, I began asking, “If I finish only one meaningful thing today, what should it be?”","This did not make my work perfect. There are still busy days, and some urgent tasks are genuinely unavoidable. But I no longer see a full schedule as proof of success. A full schedule can mean commitment, but it can also mean lack of focus.","The difference between being busy and being effective is not laziness versus hard work. It is movement versus progress. Busyness asks, “How much did I do?” Effectiveness asks, “What changed because I did it?” That second question is harder to answer, but it is much more useful."],"mappingNote":"Source recording 14 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Explain Causes and Useful Results","goal":"Explain why a change matters, contrast options and distinguish an intended purpose from an actual result.","topic":"Workload, protected thinking time and evidence of useful progress","languageFocus":"Contrast with although/even though versus despite/in spite of; cause with because versus because of; purpose with to/in order to/so that/in order for; precaution in case versus condition if; result so/therefore and so/such that.","conversationTitle":"Defend a useful workflow change with Alex.","readingLabel":"PROJECT PLAN + OUTCOME","readingIntro":"Compare the team’s intended improvements with what the later report actually demonstrates.","readingLinkLabel":"Read the plan and outcome report","wordBankTitle":"Effort, deadlines and useful achievements.","writingGuidance":"Aim for about 120–170 words. Explain one cause, a realistic change, its purpose, a trade-off and a way to check the result.","writingMaxWords":170,"theoryCards":[{"title":"Contrast a clause with a clause","text":"“**Although we were busy**, the important task did not move forward.” “We were busy, **yet** the task stayed unfinished.”\n\n**Although / even though / while / whereas** introduce a subject and verb. Even though emphasises the unexpected contrast.","tip":"Do not put a comma directly after although: Although we were busy, …"},{"title":"Despite takes a noun or -ing","text":"“**Despite the interruptions**, we finished.” “**Despite being interrupted**, we finished.”\n\nFor a full clause: “**In spite of the fact that we were interrupted**, we finished.”","tip":"Despite of is incorrect. Compare despite the delay with although there was a delay."},{"title":"Explain a cause with the right structure","text":"“We lost time **because the owner was unclear**.”\n\n“We lost time **because of an unclear handover**.”\n\nSince/as can introduce a reason; owing to/due to introduce a noun phrase. Choose a clear cause rather than a formal-looking phrase.","tip":"A reason clause placed first is usually followed by a comma: Because the guide was unclear, people asked again."},{"title":"State the purpose of an action","text":"“I blocked time **to finish** the guide.” “We left early **so as not to miss** the session.”\n\n**To / in order to / so as to + base verb** express purpose. For function, use for + -ing: “a tool **for checking** forms”.","tip":"I went there for asking a question is not the normal purpose pattern; use to ask."},{"title":"Let a different subject express the purpose","text":"“We changed the notes **so that new staff could use them**.”\n\n“We made time **in order for the team to test** the guide.”\n\nSo that takes a clause, often with a modal; in order for takes a person or group + to-infinitive.","tip":"The intended benefit is not proof that the benefit actually happened."},{"title":"Prepare in case; act if","text":"“I saved a copy **in case the connection failed**.” I saved it beforehand as a precaution.\n\n“**If the connection fails**, I’ll use the copy.” This describes what I will do under that condition.","tip":"Keep a backup in case it is needed; do not wait for the problem before making the precaution."},{"title":"Show the result and its degree","text":"“The instructions were unclear, **so** people asked again.” “The instructions were unclear; **therefore,** we revised them.”\n\n“The text was **so dense that** readers missed the warning.” “It was **such a dense text that** readers missed it.”","tip":"So + adjective/adverb; such (a/an) + adjective + noun. Do not join two full clauses with only a comma before therefore."},{"title":"Separate an intention from evidence","text":"“We shortened meetings **so that** we could write the guide” states a purpose. “We shortened meetings, **so** we finished the guide” claims a result.\n\nA useful update explains the cause, the action, the trade-off and what changed. It also identifies outcomes not yet measured.","tip":"Fewer meetings or more completed tasks are measures of activity; explain how they connect to the goal."}],"tasks":[{"id":"b2g10-1","type":"choice","prompt":"Choose the correct full-clause contrast.","answer":"Although the team was busy, the guide remained unfinished.","options":["Although the team was busy, the guide remained unfinished.","Despite the team was busy, the guide remained unfinished.","Although, the team was busy, the guide remained unfinished."],"why":"Although introduces a full clause without a comma immediately after the linker.","hint":"Find the version with a subject and verb after although."},{"id":"b2g10-2","type":"edit","prompt":"Remove the extra word: “Despite of the delay, we met the deadline.”","answer":"Despite the delay, we met the deadline.","why":"Despite takes the noun phrase directly; in spite of includes of.","hint":"Keep despite followed by the delay."},{"id":"b2g10-3","type":"choice","prompt":"Which form correctly introduces this noun phrase as a reason?","answer":"The task stalled because of an unclear handover.","options":["The task stalled because of an unclear handover.","The task stalled because an unclear handover.","The task stalled although of an unclear handover."],"why":"Because of takes a noun phrase; because needs a clause in this pattern.","hint":"There is no finite verb in an unclear handover."},{"id":"b2g10-4","type":"gap","prompt":"Add the reason linker: “We revised the form ___ users could not find the final step.”","answer":"because|as|since","why":"Because, as and since can all introduce the reason clause in this context.","hint":"A full clause follows the missing linker."},{"id":"b2g10-5","type":"choice","prompt":"Which sentence states the purpose of setting aside time?","answer":"We blocked forty minutes to test the instructions.","options":["We blocked forty minutes to test the instructions.","We blocked forty minutes for test the instructions.","We blocked forty minutes because of test the instructions."],"why":"The to-infinitive expresses why the team blocked time.","hint":"Use to + base verb for the intended action."},{"id":"b2g10-6","type":"order","prompt":"Build a purpose clause with a different subject.","answer":"We simplified the guide so that new staff could follow it.","why":"So that introduces the purpose clause, with new staff as its subject.","hint":"Keep could follow as the verb phrase of the purpose clause."},{"id":"b2g10-7","type":"gap","prompt":"Add the word before the team: “We reserved a slot in order ___ the team to practise.”","answer":"for","why":"In order for + person/group + to-infinitive allows a separate subject.","hint":"The person or group comes between for and the to-infinitive."},{"id":"b2g10-8","type":"choice","prompt":"You save an offline copy before travelling because the network might fail. Which sentence expresses that precaution?","answer":"I save a copy in case the network fails.","options":["I save a copy in case the network fails.","I save a copy only after the network has failed.","I save a copy unless I want a backup."],"why":"In case explains an action taken in advance for a possible future need.","hint":"Do the precaution before the possible problem."},{"id":"b2g10-9","type":"choice","prompt":"Which sentence asserts an achieved result rather than only an intention?","answer":"We protected the writing slot, so we completed the guide.","options":["We protected the writing slot, so we completed the guide.","We protected the writing slot so that we could complete the guide.","We protected the writing slot in order to complete the guide."],"why":"So joins the cause to the claimed outcome; the other sentences state a purpose.","hint":"Ask whether the sentence says the guide was actually completed."},{"id":"b2g10-10","type":"gap","prompt":"Choose so or such: “The instructions were ___ unclear that everyone asked again.”","answer":"so","why":"So modifies the adjective unclear directly.","hint":"There is no noun after the adjective here."},{"id":"b2g10-11","type":"edit","prompt":"Correct so/such: “It was so a demanding job that she needed careful priorities.”","answer":"It was such a demanding job that she needed careful priorities.","why":"Such a modifies the adjective + singular countable noun phrase.","hint":"The phrase includes a demanding job, not only an adjective."},{"id":"b2g10-12","type":"choice","prompt":"Which update accurately separates the purpose from the available evidence?","answer":"We revised the guide to reduce questions, but we have not yet tested whether questions fell.","options":["We revised the guide to reduce questions, but we have not yet tested whether questions fell.","We hoped to reduce questions, so that proves the number fell.","We shortened the guide; therefore every reader must now understand it."],"why":"An intended benefit needs evidence before it can be reported as an achieved result.","hint":"Choose the claim that matches what has actually been measured."}],"listening":[{"id":"b2l10-1","type":"choice","prompt":"What initially made Clara feel productive?","answer":"Visible activity such as a full calendar and completed task lists.","options":["Visible activity such as a full calendar and completed task lists.","Clear evidence that her most important projects had advanced.","A decision to leave every request unanswered."],"why":"She originally used visible movement as evidence of hard work.","hint":"Distinguish the signal she liked from the result later questioned.","evidence":"I liked the feeling of movement. It gave me evidence that I was working hard."},{"id":"b2l10-2","type":"choice","prompt":"What was wrong with many of her busiest weeks?","answer":"Useful-looking reactions left the most important projects waiting.","options":["Useful-looking reactions left the most important projects waiting.","She did no work and attended no meetings.","Every urgent request was unnecessary by definition."],"why":"Some activity was useful, but it crowded out significant progress.","hint":"Avoid turning some of it was useful into none of it was useful.","evidence":"But at the end of the week, the projects that mattered most were often still waiting for “when things calm down.”"},{"id":"b2l10-3","type":"choice","prompt":"Why was the manager’s question difficult for her?","answer":"She could identify what occupied her time more easily than what produced the biggest result.","options":["She could identify what occupied her time more easily than what produced the biggest result.","The manager asked her to count all her emails exactly.","She had already decided every project should be cancelled."],"why":"The question exposed a gap between activity and impact.","hint":"What did she know clearly, and what was she less clear about?","evidence":"I knew what kept me busy. I was less clear about what made me effective."},{"id":"b2l10-4","type":"choice","prompt":"What risk does reacting to messages and meetings create?","answer":"The day can fill before you choose its main purpose.","options":["The day can fill before you choose its main purpose.","Every reply automatically harms the team.","Meetings can never be part of effective work."],"why":"The problem is unchosen direction, not a universal ban on reactive tasks.","hint":"Listen for the order of choosing a purpose and filling the day.","evidence":"None of these actions are necessarily wrong, but they can fill the day before you have chosen what the day is for."},{"id":"b2l10-5","type":"choice","prompt":"Why might leaving a minor email unanswered briefly be effective?","answer":"Concentrating on a larger problem might prevent many later emails.","options":["Concentrating on a larger problem might prevent many later emails.","The sender’s needs never matter.","It guarantees that no urgent messages will arrive."],"why":"She contrasts immediate visible response with work that prevents future problems.","hint":"Consider the outcome protected by the delayed reply.","evidence":"Sometimes it means leaving a minor email unanswered for two hours because you are working on something that prevents twenty future emails."},{"id":"b2l10-6","type":"choice","prompt":"Why can quiet thinking look less productive than busy work?","answer":"It may produce only a few notes even when those notes prevent a costly wrong direction.","options":["It may produce only a few notes even when those notes prevent a costly wrong direction.","Thinking always means avoiding decisions.","Only a large number of documents can help a project."],"why":"The visible output can be small while its effect is significant.","hint":"Compare what can be counted with the consequence of the decision.","evidence":"But those notes might save a project from going in the wrong direction."},{"id":"b2l10-7","type":"choice","prompt":"Which change did Clara make before opening her inbox?","answer":"She chose one important outcome for the day.","options":["She chose one important outcome for the day.","She accepted every new request as equally urgent.","She filled every gap between meetings."],"why":"She chose direction before entering the stream of incoming demands.","hint":"Identify the decision she moved earlier in the morning.","evidence":"I started choosing one important outcome each morning before opening my inbox."},{"id":"b2l10-8","type":"choice","prompt":"Which question best captures her final criterion of effectiveness?","answer":"What changed because I did the work?","options":["What changed because I did the work?","How full was my calendar?","How quickly did I answer every routine message?"],"why":"She ends by contrasting amounts of activity with the changes produced.","hint":"Look for progress rather than motion alone.","evidence":"Effectiveness asks, “What changed because I did it?”"}],"readingTitle":"A shorter calendar is not yet a useful result","readingTexts":[{"title":"Workshop team · Monday plan","text":"Our goal is to publish clear workshop instructions and send invitations by Friday at 16.00. Last week’s draft stalled for two reasons: final wording needed a named approver, and the writer kept being interrupted by routine requests. We were snowed under with replies, although the number of meetings also looked impressive.\nThis week we will reduce six status meetings to three so that the writer can finish the guide. We also propose a forty-minute writing slot each morning. A named colleague will handle routine questions during that slot; confirmed event cancellations will still reach the writer through the urgent channel. We need approval by Thursday at 12.00 to use Friday’s 9.00 printing slot. The revised guide is intended to reduce repeated questions, but that benefit needs a reader trial. We will save an editable copy in case the venue changes."},{"title":"Friday outcome report","text":"The meeting count fell from six to three. However, the covering colleague was never confirmed, so routine requests interrupted four of the planned writing slots. The approver replied at 17.00 on Thursday, five hours after the agreed cutoff. We missed Friday’s 9.00 printing slot, although invitations were eventually sent digitally at 14.00, before the final deadline.\nThe writer finished the guide at 15.00 on Friday. Nobody has yet tested it with a new reader, so we cannot report that repeated questions have decreased. Next Tuesday, two volunteers will try to follow the instructions without help. We will note any step that needs an explanation. A shorter calendar helped create potential time; it did not by itself protect that time or establish that the guide worked."}],"reading":[{"id":"b2r10-1","type":"choice","prompt":"Which proposed safeguard failed to become an actual arrangement?","answer":"Routine-question cover: no colleague was confirmed, and the writer was interrupted.","options":["Routine-question cover: no colleague was confirmed, and the writer was interrupted.","The digital invitations: the team never sent any.","The editable backup: its absence caused a confirmed venue change."],"why":"The outcome report explicitly connects the missing owner with continuing routine interruptions.","hint":"Compare the proposed cover with what was actually agreed."},{"id":"b2r10-2","type":"choice","prompt":"Why was the Friday morning printing slot missed?","answer":"Approval arrived after the Thursday cutoff needed for that slot.","options":["Approval arrived after the Thursday cutoff needed for that slot.","The invitations were required on Wednesday but arrived Tuesday.","New readers had already rejected the finished guide."],"why":"The approval time missed the specified dependency for printing.","hint":"Use Thursday at 12.00 and the actual reply at 17.00."},{"id":"b2r10-3","type":"choice","prompt":"Which deadline claim is accurate?","answer":"The morning printing slot was missed, but digital invitations still went out before Friday’s final 16.00 deadline.","options":["The morning printing slot was missed, but digital invitations still went out before Friday’s final 16.00 deadline.","Missing the printing slot means the final invitation deadline was necessarily missed.","All planned milestones were met exactly as arranged."],"why":"The report distinguishes an intermediate schedule failure from the final delivery time.","hint":"Do not confuse Friday at 9.00 with Friday at 16.00."},{"id":"b2r10-4","type":"choice","prompt":"Can the team claim that the new guide reduced repeated questions?","answer":"Not yet: finishing the guide is recorded, but a trial with new readers has not happened.","options":["Not yet: finishing the guide is recorded, but a trial with new readers has not happened.","Yes: fewer meetings prove the guide is understood.","No: the report proves the guide can never help readers."],"why":"There is evidence of completion, not yet evidence of the intended usability benefit.","hint":"Separate a missing result measure from evidence of failure."},{"id":"b2r10-5","type":"choice","prompt":"Which next step best addresses both reasons the original draft stalled?","answer":"Confirm routine cover and agree an approval owner and response time before the next protected writing slot.","options":["Confirm routine cover and agree an approval owner and response time before the next protected writing slot.","Reduce the meeting count again without assigning any responsibility.","Ask the writer to answer every routine message during the writing slot."],"why":"A protected work period and a reliable approval decision address the two separate causes.","hint":"Choose a process change that deals with ownership as well as interruptions."},{"id":"b2r10-6","type":"choice","prompt":"What will Tuesday’s volunteer trial help establish?","answer":"Whether new readers can use the instructions without extra explanation.","options":["Whether new readers can use the instructions without extra explanation.","Whether the invitations were sent before last Friday’s deadline.","Whether the number of status meetings changed from six to three."],"why":"The trial examines the guide’s purpose; the other outcomes are already in the report.","hint":"Identify the uncertainty that remains after completion."}],"vocab":[{"id":"vb2pre10-1","word":"meet a deadline","definition":"Finish or submit something by the time it is due.","example":"We need the approval early enough to meet the printing deadline.","hint":"Meet a deadline means finish on time, not arrange a meeting about it.","sourceLesson":4},{"id":"vb2pre10-2","word":"be snowed under","definition":"Have more work than you can comfortably manage; informal.","example":"I’m snowed under with small requests, so the main task keeps waiting.","hint":"An informal workload expression, not a weather report.","sourceLesson":4},{"id":"vb2pre10-3","word":"demanding job","definition":"A job that requires considerable effort, attention or skill.","example":"A demanding job still needs clear priorities and time to think.","hint":"Demanding describes the demands of the role; it does not automatically mean badly organised.","sourceLesson":4},{"id":"vb2pre10-4","word":"talk shop","definition":"Talk about your work, especially in a social or non-work setting; informal.","example":"We agreed not to talk shop throughout the whole dinner.","hint":"The topic is professional matters outside the usual work discussion.","sourceLesson":4},{"id":"vb2pre10-5","word":"setback","definition":"A difficulty or event that delays progress or reverses some of it.","example":"The late approval was a setback, but the team revised the schedule.","hint":"A setback slows progress; it need not end the project.","sourceLesson":6},{"id":"vb2pre10-6","word":"overcome a problem / hurdle","definition":"Successfully get past a difficulty that blocks progress.","example":"They overcame the handover problem by naming one owner.","hint":"Overcome means deal successfully with the obstacle, not just notice it.","sourceLesson":6},{"id":"vb2pre10-7","word":"achieve / fulfil a goal, ambition or dream","definition":"Reach a desired result or make an important aim become real.","example":"They achieved their goal of making the instructions easier to follow.","hint":"Natural combinations include achieve a goal and fulfil an ambition or dream.","sourceLesson":6},{"id":"vb2pre10-8","word":"exceed expectations","definition":"Perform or produce a result better than was expected.","example":"The trial exceeded expectations: all six readers could follow the steps without help.","hint":"Compare the actual result with an expectation, not only with past performance.","sourceLesson":6}],"vocabularyQuestions":[{"id":"vb2pre10-1","type":"choice","prompt":"The invitations are due at 16.00 and are sent at 14.00. The team…","answer":"meets the deadline","options":["meets the deadline","misses the deadline by definition","only talks shop"],"why":"Meeting a deadline means completing the required work by its due time.","hint":"Meet a deadline means finish on time, not arrange a meeting about it."},{"id":"vb2pre10-2","type":"choice","prompt":"Informally, a colleague with far too much work says…","answer":"I’m snowed under.","options":["I’m snowed under.","I’m a snowed job.","I have already exceeded every expectation."],"why":"Be snowed under is an informal expression for excessive workload.","hint":"An informal workload expression, not a weather report."},{"id":"vb2pre10-3","type":"choice","prompt":"A role requiring considerable effort and concentration is a…","answer":"demanding job","options":["demanding job","job with no demands","completed deadline"],"why":"Demanding describes substantial requirements or effort.","hint":"Demanding describes the demands of the role; it does not automatically mean badly organised."},{"id":"vb2pre10-4","type":"choice","prompt":"Colleagues spend a social dinner discussing office projects. They…","answer":"talk shop","options":["talk shop","meet every deadline automatically","leave all professional topics aside"],"why":"Talk shop means discuss work, especially outside the normal work setting.","hint":"The topic is professional matters outside the usual work discussion."},{"id":"vb2pre10-5","type":"choice","prompt":"A late approval slows progress but does not end the project. It is a…","answer":"setback","options":["setback","finished ambition","guaranteed breakthrough"],"why":"A setback delays or reverses progress without necessarily causing permanent failure.","hint":"A setback slows progress; it need not end the project."},{"id":"vb2pre10-6","type":"choice","prompt":"The team successfully removes a barrier to progress. They…","answer":"overcome a hurdle","options":["overcome a hurdle","only notice a hurdle","create an unresolved problem"],"why":"Overcome indicates successfully getting past a difficulty.","hint":"Overcome means deal successfully with the obstacle, not just notice it."},{"id":"vb2pre10-7","type":"choice","prompt":"Which pair contains natural combinations for reaching a desired result?","answer":"achieve a goal / fulfil an ambition","options":["achieve a goal / fulfil an ambition","achieve an interruption / fulfil a workload","achieve a deadline meeting / fulfil a routine question"],"why":"Achieve a goal and fulfil an ambition are natural collocations.","hint":"Natural combinations include achieve a goal and fulfil an ambition or dream."},{"id":"vb2pre10-8","type":"choice","prompt":"The trial result is better than the team predicted. It…","answer":"exceeds expectations","options":["exceeds expectations","only equals expectations","proves that no goal existed"],"why":"Exceed expectations compares the result with the expected standard.","hint":"Compare the actual result with an expectation, not only with past performance."}],"writing":"A fictional team answers many routine messages but keeps postponing a guide that could reduce repeated questions. Propose one realistic workflow change in a message to Alex. Explain a cause of the delay, the change’s purpose, one trade-off or exception and how the team should check whether the change produced a useful result. Distinguish a hoped-for benefit from evidence of success. Use cause, purpose, contrast and result language naturally. Aim for about 120–170 words.","writingModel":"Hi Alex,\nThe guide keeps waiting because the writer answers routine questions throughout the morning. Although those replies help individual colleagues, they leave little time for work that could prevent the same questions returning.\nI suggest protecting forty minutes after the daily handover so that the writer can finish and test one section. We should name a colleague to handle routine requests during that period. A confirmed event cancellation could still use the urgent channel, so the arrangement would not require ignoring genuinely time-sensitive work.\nThis may delay some ordinary replies, but it gives the main task a realistic place in the day. We should not claim success just because the calendar is shorter. After the section is ready, ask two new readers to follow it and record where they still need help. That would show whether we have made the process clearer, rather than simply completed another document.","speaking":"Explain why a team may be busy without making useful progress. Propose a realistic change, defend it against an objection, clarify a precaution and agree evidence of the outcome.","conversation":[{"partner":"Our team answers messages all day, but the important guide is still unfinished. Does that mean people are not working hard enough?","goal":"Explain a possible process cause without treating visible busyness as proof of either success or laziness.","hint":"Use because or because of to link the interruption pattern to the delayed task."},{"partner":"If we protect a writing slot, some routine replies will be slower. That might annoy colleagues. Why should we try it?","goal":"Acknowledge the cost, explain the purpose and propose clear responsibility for routine requests.","hint":"Although or despite can introduce the trade-off; so that can state the intended benefit."},{"partner":"What about a real event cancellation? Should the writer ignore that too? And what if the venue changes after the guide is written?","goal":"Define an urgent exception and suggest a precaution for a possible later change.","hint":"A named urgent route and an editable backup serve different purposes. Use in case for advance preparation."},{"partner":"Suppose the guide is finished by Friday. Can we tell everyone the new system is effective?","goal":"Separate completing the document from proving its usefulness, and agree a relevant check.","hint":"Name what new readers should be able to do and what evidence is still missing."}],"sourceAudioUrl":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a32cc3c7e07b7f2fa746736_ElevenLabs_2026-06-17T16_30_35_Riley%20-%20Engaging%20Young%20Female%20Voice_pvc_sp82_s29_sb75_v3.mp3"},{"n":11,"module":1,"grammarSourceNumbers":[29],"grammarTrackingSlug":"b2-pre-course-11-grammar","listeningTrackingSlug":"listening_b2_pre_012_saying_yes","theory":"Lesson 29: **Compound nouns & possessive patterns**\n\n**B2 · Pre-AdvancedNoun patterns · Possession**\n\n### 1) Two main ways to mark possession\n\n- **’s / s’** → preferred for *people & animals* and often for *time, places & organisations*.\\\n  ➜ *Mary’s laptop* · *yesterday’s meeting* · *the company’s decision*\n- **of**-phrase → preferred for *inanimate things, parts & abstractions*.\\\n  ➜ *the roof of the church* · *the end of the street* · *the cause of the fire*\n\nBoth are possible with many institutions: *the university’s policy* / *the policy of the university* (the first is shorter and more natural).\n\n### 2) Apostrophe: spelling & form\n\n| **Use**            | **After…**                     | **Example**                                                     |\n| ------------------ | ------------------------------ | --------------------------------------------------------------- |\n| **’s**             | singular noun                  | *my father’s car*, *the dog’s toys*                             |\n| **’s**             | irregular plural (no final -s) | *children’s games*, *people’s views*                            |\n| **s’**             | regular plural in -s           | *the teachers’ lounge*, *tourists’ passports*                   |\n| **’s** or **’**    | singular ending in -s          | *Chris’s* / *Chris’* laptop (both accepted; follow house style) |\n| **Group genitive** | phrase head                    | *the Prime Minister of Spain’s visit* (often better with *of*)  |\n\nPronunciation of **’s**: /z/ after vowels & voiced consonants (*Anna’s*), /s/ after /p t k f θ/ (*Jack’s*), /ɪz/ after sibilants (*James’s*).\n\n### 3) Meaning: shared or separate? + the “double genitive”\n\n- **Shared**_Anna and Tom’s car_ (= one car owned by both)\n- **Separate**_Anna’s and Tom’s cars_ (= two cars)\n- **Double genitive** *some friends of Anna’s* / *a colleague of mine* (= one of Anna’s/my friends). Useful with determiners: *a*, *some*, *this*, etc.\n\n### 4) When the *of*-pattern is favoured\n\n- **Inanimate/abstract**: *the beauty of the park*, *the history of art*\n- **Parts of things**: *the back of the envelope*, *the head of the shower*\n- **Long noun phrases**: prefer clarity → *the child of the neighbours who live next door* (rather than piling ’s at the end)\n- **Containers + contents**: *a cup of tea*, *a box of matches* (contrast with compound noun below)\n\n### 5) Shops, homes & places with **’s**\n\n- **Shops/workplaces**: *the baker’s*, *the chemist’s*, *the hairdresser’s* (= shop or home).\\\n  Ellipsis of a head noun: *shop*, *house*, etc.\n- **Places & organisations**: *London’s airports*, *the bank’s prediction*, *the club’s budget*\n- **Time & distance**: *a day’s work*, *three weeks’ holiday*, *an hour’s drive*\n\n### 6) Compound nouns (noun + noun) instead of possession\n\n#### Use a plain modifier noun before the main noun (often singular). Stress falls on the second noun.\n\n- **Common patterns**: *school bus*, *ticket office*, *car park*, *toothpaste*, *stomach bug*\n- **Variant choices**: more than one form may work → *the shower head* / *the head of the shower*; *school policy* / *the school’s policy*\n- **Irregular plural modifiers**: keep the -s when it’s part of the word → *sports car*, *clothes shop*, *customs officer*, *physics teacher*\n- **Hyphen or no hyphen?** Many compounds are two words (*car park*), some one word (*bathroom*), some hyphenated (*letter-box*). Follow your style guide or dictionary.\n- **Container nouns (empty)**: *tea cup*, *wine glass*, *matchbox*. For container + contents, use *of*: *a cup of tea*.\n- **Compound adjectives for measures**: *a two-hour flight* (hyphenated adjective) vs *two hours’ flight* (possessive measure).\n\n### 7) Quick contrasts & pitfalls\n\n- **Don’t overuse ’s with long phrases**\\\n  Prefer *of* for readability.\n- **Institution choice**\\\n  Both forms acceptable: *the country’s decision* / *the decision of the country* (’s is shorter and more idiomatic).\n- **Names ending in -s**\\\n  *Chris’s* and *Chris’* are both defensible; be consistent. Classical names often take just the apostrophe: *Socrates’ life*.\n- **Clarity first**\\\n  Pick the version that is shortest and clearest in your sentence.\n\nAll examples are illustrative and can be adapted to academic, business or everyday contexts.\n","audioNumber":12,"audioTitle":"The Cost of Saying Yes Too Often","speaker":"Maya and Leo","audio":"https://cdn.prod.website-files.com/67aa2baa0c65412632c4b3d1/6a32c3e2cf446cb0ca1f9fd4_ElevenLabs_2026-06-17T15_45_45_Joseff%20Novak%20-%20Calm%20and%20Professional_pvc_sp98_s60_sb75_v3.mp3","localAudio":"audio/lesson12-saying-yes.mp3","transcript":["Maya: I know people keep talking about boundaries at work, but sometimes I think we have taken the idea too far. If everyone says no whenever something is inconvenient, teams stop functioning. Work is not only about protecting your own schedule. Sometimes you say yes because someone needs help.","Leo: I agree that teamwork matters, but that is not the same as saying yes to everything. The problem is that some people become the “reliable person” everyone depends on. At first, it feels flattering. Then it becomes invisible labour. They stay late, fix small problems, cover gaps, and somehow everyone else assumes they are fine.","Maya: But isn’t that also how people build trust? If you always protect your time too carefully, people may stop asking you to join important projects. I have seen people grow in their careers because they were willing to take on extra tasks.","Leo: Extra tasks can help if they are chosen carefully. But there is a difference between opportunity and automatic agreement. If you say yes before thinking, you may accept work that does not teach you anything, does not match your role, and does not get recognised. That is not growth. That is overload with a positive name.","Maya: I understand that, but saying no can sound selfish, especially in a small team. Imagine a deadline is close and someone says, “Sorry, that is not my responsibility.” It creates tension.","Leo: It depends how they say it. A boundary does not have to be cold. You can say, “I cannot take this today, but I can help you find another option,” or “If this is urgent, which of my current tasks should move?” That is not selfish. It is honest planning.","Maya: Still, I think some people use boundaries as a way to avoid discomfort. They do not want to stretch themselves, so they call every difficult request unhealthy.","Leo: That can happen. But the opposite happens too. Some workplaces use “being helpful” to hide poor planning. If a team constantly needs emergency help, maybe the real problem is not individual attitude. Maybe the workload is unrealistic, or responsibilities are unclear.","Maya: So where is the line? Because work will always include unexpected problems. You cannot plan everything perfectly.","Leo: The line is repetition. If you help once during a real emergency, that is teamwork. If the same emergency appears every week, it is no longer an emergency. It is a system depending on people not setting limits.","Maya: That is a fair point. I once said yes to preparing meeting notes because it seemed small. Then I became the person who always prepared them. Nobody asked if I had time. They just expected it. I did not feel generous anymore. I felt trapped by my own helpfulness.","Leo: Exactly. Saying yes has a cost, even when the task is small. It uses attention, time, and energy. It may also teach people what they can expect from you. One yes can become a pattern.","Maya: But I still think the answer cannot simply be “say no more often.” That sounds too negative.","Leo: I agree. The goal is not to say no to everything. The goal is to say yes more intentionally. A useful yes has space around it. You understand what you are accepting, what you may need to delay, and whether the request fits your priorities.","Maya: So maybe the real skill is not refusing people. It is pausing before agreeing.","Leo: Yes. A pause can protect both sides. It gives you time to think, and it gives the other person a more realistic answer. Saying yes too quickly can feel kind in the moment, but later it can create resentment, rushed work, and broken trust.","Maya: I can accept that. Saying yes should not mean disappearing from your own priorities. And saying no should not mean abandoning the team.","Leo: Exactly. Healthy boundaries are not walls. They are agreements about what people can actually do well."],"mappingNote":"Source recording 12 · Listen for the argument and supporting examples. Opening the transcript before an answer marks it as supported.","title":"Whose Work, Whose Responsibility?","goal":"Describe responsibilities, shared resources and qualifications clearly, and resolve ambiguous ownership.","topic":"Team handovers, shared documents and a fictional job vacancy","languageFocus":"Singular and plural possessives, irregular plurals, shared versus separate possession, double genitive, of-phrases and noun compounds; compound stress often on the first part, checked in a dictionary rather than treated as universal.","conversationTitle":"Agree who owns the meeting notes.","readingLabel":"HANDOVER + JOB ADVERT","readingIntro":"Use the handover and advert to identify the decision owner, shared resources and what applicants actually need.","readingLinkLabel":"Read the handover and advert","wordBankTitle":"Roles, training and job offers.","writingGuidance":"Aim for about 120–170 words. Name each owner, distinguish shared and separate documents, and specify what happens next.","writingMaxWords":170,"theoryCards":[{"title":"Singular and plural possession","text":"“The **manager’s** decision” belongs to one manager. “The **managers’** decision” belongs to more than one manager.\n\nIrregular plurals add ’s: “the **children’s** room”, “the **people’s** questions”.","tip":"Place the apostrophe according to the number of possessors, not the number of things possessed."},{"title":"One shared item or separate items","text":"“**Rina and Sam’s guide**” normally means one guide associated with both.\n\n“**Rina’s and Sam’s guides**” normally means separate guides. Use an explicit phrase if ownership still matters: “the guide they wrote together”.","tip":"Grammar can signal a distinction; clear wording should confirm it when a decision depends on it."},{"title":"People, organisations and of-phrases","text":"“The **centre’s policy**” and “the **policy of the centre**” are both possible.\n\nAn of-phrase is often natural for a part or a long phrase: “the end **of the document**”, “the decision **of the committee that met yesterday**”.","tip":"Do not apply an absolute ban on ’s with organisations or things; choose the clearest natural form."},{"title":"A friend of mine","text":"“A colleague **of mine**” means one of my colleagues. “A friend **of Rina’s**” means one of Rina’s friends.\n\nCompare “a photo **of Rina**” (shows her) and “a photo **of Rina’s**” (one associated with her, often belonging to her).","tip":"Use mine/yours/his/hers/ours/theirs after of in this pattern, not me/you/her."},{"title":"Noun compounds describe a type","text":"A **training course**, **job advert** or **meeting room** is a kind of course, advert or room. The first noun is usually singular.\n\nCompare **coffee cup** (a type of cup) and **cup of coffee** (a cup containing coffee).","tip":"Some modifiers are conventionally plural, such as sports in sports centre. Check established forms."},{"title":"Keep forms and meanings separate","text":"“**Staff training**” names a type of training. “The **staff’s concerns**” identifies whose concerns they are.\n\n“The **company’s training policy**” combines possession with a compound: whose policy, and what kind of policy?","tip":"An apostrophe does not make an ordinary plural. Two adverts, not two advert’s."},{"title":"Short possessives and time phrases","text":"“I’m at the **hairdresser’s**” can omit shop or salon.\n\nTime also takes possession: “**today’s** meeting”, “**a week’s** notice”, “**two weeks’** notice”.\n\nA long chain of possessives can be grammatical but hard to follow; rewrite when the owner becomes unclear.","tip":"For singular names ending in s, spelling conventions vary. Follow a consistent style."},{"title":"Check the compound, including its stress","text":"Many compound nouns have stronger stress on the **first** part, as in **COFFEE shop**. This is a common pattern, not a universal rule for every noun combination.\n\nA learner’s dictionary can confirm spelling, plural and pronunciation. When handing work over, explicit owners matter more than an impressive string of nouns.","tip":"Write: Rina approves the advert; Sam sends the shared guide. Avoid leaving both decisions with an unclear they."}],"tasks":[{"id":"b2g11-1","type":"choice","prompt":"One manager owns the folder. Which label is correct?","answer":"the manager’s folder","options":["the manager’s folder","the managers’ folder","the managers folder’s"],"why":"A singular possessor takes ’s.","hint":"Count the managers, not the folders."},{"id":"b2g11-2","type":"choice","prompt":"The notes belong to several colleagues. Choose the plural possessive.","answer":"the colleagues’ notes","options":["the colleagues’ notes","the colleague’s notes","the colleagues note’s"],"why":"A regular plural ending in s takes an apostrophe after that s.","hint":"There is more than one colleague."},{"id":"b2g11-3","type":"gap","prompt":"Write the possessive form of children: “the ___ workshop”.","answer":"children’s","why":"Children is already plural and adds ’s for possession.","hint":"Do not add a second plural s before the apostrophe."},{"id":"b2g11-4","type":"choice","prompt":"Rina and Sam wrote one guide together. Which phrase signals that shared guide?","answer":"Rina and Sam’s guide","options":["Rina and Sam’s guide","Rina’s and Sam’s guides","Rinas and Sams guide"],"why":"A final possessive marking can refer to the pair’s shared item.","hint":"The context specifies one jointly written guide."},{"id":"b2g11-5","type":"choice","prompt":"Rina owns one guide and Sam owns a different guide. Which phrase makes separate possession clear?","answer":"Rina’s and Sam’s guides","options":["Rina’s and Sam’s guides","Rina and Sam’s shared guide","Rina and Sam guide’s"],"why":"Marking each name fits the separate items in the context.","hint":"Each person has a different guide."},{"id":"b2g11-6","type":"edit","prompt":"Correct the pronoun: “She is a colleague of me.”","answer":"She is a colleague of mine.","why":"The double-genitive pattern uses a possessive pronoun after of.","hint":"Use the possessive form meaning one of my colleagues."},{"id":"b2g11-7","type":"choice","prompt":"Which phrase naturally names a room used for meetings?","answer":"a meeting room","options":["a meeting room","a meetings room’s","a meeting of room"],"why":"The modifier meeting identifies the type of room.","hint":"This is a noun compound, not a room that belongs to a meeting."},{"id":"b2g11-8","type":"choice","prompt":"You order a cup containing coffee. What do you order?","answer":"a cup of coffee","options":["a cup of coffee","a coffee of cup","a coffee’s cup"],"why":"Of links the container with its contents.","hint":"Distinguish contents from the name of a type of cup."},{"id":"b2g11-9","type":"order","prompt":"Build a sentence naming the owner of a policy.","answer":"The company’s training policy needs a clear owner.","why":"The possessive identifies the organisation; training identifies the policy type.","hint":"Keep training policy together."},{"id":"b2g11-10","type":"edit","prompt":"Correct the ordinary plural: “There are two job advert’s on the board.”","answer":"There are two job adverts on the board.","why":"An ordinary plural does not take a possessive apostrophe.","hint":"The sentence counts adverts; it does not name something they possess."},{"id":"b2g11-11","type":"choice","prompt":"Which statement about compound-noun stress is accurate?","answer":"Stress often falls on the first part, but a dictionary should confirm a particular compound.","options":["Stress often falls on the first part, but a dictionary should confirm a particular compound.","Every noun compound must stress only its last part.","All noun combinations have identical stress with no exceptions."],"why":"The common first-part pattern is useful, but it is not an absolute rule.","hint":"Avoid converting a frequent pattern into an exceptionless rule."},{"id":"b2g11-12","type":"choice","prompt":"Which handover resolves ownership most clearly?","answer":"Rina approves the advert; Sam sends their shared guide after approval.","options":["Rina approves the advert; Sam sends their shared guide after approval.","They will deal with their things when it is ready.","Someone should probably do the team’s work later."],"why":"The reply names two owners and the dependency between the tasks.","hint":"Identify who decides, who acts next and when."}],"listening":[{"id":"b2l11-1","type":"choice","prompt":"Why does Maya initially defend saying yes to extra work?","answer":"Helping can support teamwork and create career opportunities.","options":["Helping can support teamwork and create career opportunities.","Every extra task is formally part of everyone’s job.","She believes people should never protect their own time."],"why":"Her argument concerns mutual help and opportunities, rather than an unlimited contractual duty.","hint":"Distinguish the value she defends from an absolute rule.","evidence":"I have seen people grow in their careers because they were willing to take on extra tasks."},{"id":"b2l11-2","type":"choice","prompt":"What happens to the person Leo calls reliable?","answer":"Extra help becomes assumed and their effort can become invisible.","options":["Extra help becomes assumed and their effort can become invisible.","They are automatically given a promotion and a bonus.","They are always asked formally whether they have time."],"why":"Repeated help can turn into an unexamined expectation.","hint":"Listen for the change from flattering to taken for granted.","evidence":"They stay late, fix small problems, cover gaps, and somehow everyone else assumes they are fine."},{"id":"b2l11-3","type":"choice","prompt":"When can an extra task be an opportunity rather than automatic overload?","answer":"When it is chosen with attention to learning, role and recognition.","options":["When it is chosen with attention to learning, role and recognition.","Whenever it is accepted instantly without considering other work.","Only when it never requires any effort."],"why":"Leo does not reject extra work; he distinguishes choice from automatic agreement.","hint":"His concern is how the task is selected and what it provides.","evidence":"Extra tasks can help if they are chosen carefully."},{"id":"b2l11-4","type":"choice","prompt":"Why ask which current task should move if a request is urgent?","answer":"It makes the cost and priority decision visible instead of pretending there is unlimited capacity.","options":["It makes the cost and priority decision visible instead of pretending there is unlimited capacity.","It proves the request should always be refused.","It guarantees the extra task will take no time."],"why":"The question supports realistic planning rather than a cold refusal.","hint":"Consider what must change when new work is added.","evidence":"If this is urgent, which of my current tasks should move?"},{"id":"b2l11-5","type":"choice","prompt":"What distinguishes a genuine exception from a system problem in Leo’s argument?","answer":"The same emergency recurring every week suggests reliance on unbounded help.","options":["The same emergency recurring every week suggests reliance on unbounded help.","Any unexpected problem proves the whole team is selfish.","A real emergency must always be planned months ahead."],"why":"Repetition changes how the apparent emergency should be interpreted.","hint":"What pattern matters more than one isolated request?","evidence":"If the same emergency appears every week, it is no longer an emergency."},{"id":"b2l11-6","type":"choice","prompt":"What does Maya’s meeting-notes example show?","answer":"Agreeing to one small task can create a continuing role nobody discusses.","options":["Agreeing to one small task can create a continuing role nobody discusses.","She had explicitly agreed to prepare all future notes permanently.","She had never agreed to prepare notes at all."],"why":"The example connects one yes with an assumed recurring responsibility.","hint":"Separate the original offer from the later expectation.","evidence":"Then I became the person who always prepared them. Nobody asked if I had time."},{"id":"b2l11-7","type":"choice","prompt":"What common position do Maya and Leo reach?","answer":"Agree intentionally, understanding what is accepted and what may need to be delayed.","options":["Agree intentionally, understanding what is accepted and what may need to be delayed.","Say no to every inconvenient request regardless of context.","Accept every request quickly to avoid any awkwardness."],"why":"Their agreement balances support for the team with realistic limits.","hint":"Listen for the alternative to both automatic yes and automatic no.","evidence":"You understand what you are accepting, what you may need to delay, and whether the request fits your priorities."},{"id":"b2l11-8","type":"choice","prompt":"Why can a pause before answering protect trust?","answer":"It can prevent an unrealistic promise that later causes rushed work or resentment.","options":["It can prevent an unrealistic promise that later causes rushed work or resentment.","It removes every cost of the task.","It means no final answer needs to be given."],"why":"A considered answer can be more reliable than an immediate promise.","hint":"Compare the kindness of the moment with the later consequence.","evidence":"Saying yes too quickly can feel kind in the moment, but later it can create resentment, rushed work, and broken trust."}],"readingTitle":"The advert and the shared handover","readingTexts":[{"title":"Monday handover · Cedar Learning Centre","text":"Rina and Sam’s shared recruitment guide is in the team folder. Rina’s checklist and Sam’s checklist are separate: Rina checks the wording and makes the final publication decision; Sam checks contact details and sends the approved notice. Please do not treat a draft in the shared folder as permission to publish it.\nRina is away on Tuesday but can approve the advert by 12.00 on Wednesday. Sam can send it that afternoon, after approval. Applications go to the centre’s administrator, Jo. Jo records them and checks that evidence is complete; Rina decides which equivalent experience meets the advert’s requirement. No member of the team has agreed to take permanent responsibility for all future meeting notes."},{"title":"Draft advert · Part-time office coordinator","text":"We have one job vacancy for a coordinator who can work on Wednesday and Friday mornings. Applicants need an office-administration certificate or equivalent practical experience, plus the ability to write clear meeting notes. Describe your own responsibilities in an internship, apprenticeship or work-experience placement; merely naming a placement does not show which tasks you did.\nRegular pay and the listed employment benefits are separate from the optional perks, such as a gym discount. Any bonus is discretionary and should not be presented as guaranteed pay.\nHugo can work both mornings and has six months of office experience but no certificate. His application names an internship without describing his responsibilities. Jo should request that information before Rina considers equivalence. Please use the approved advert and the shared guide consistently, while keeping each reviewer’s checklist separate."}],"reading":[{"id":"b2r11-1","type":"choice","prompt":"Who should authorise publication, and when can Sam send the notice?","answer":"Rina authorises it by Wednesday noon; Sam sends it afterwards.","options":["Rina authorises it by Wednesday noon; Sam sends it afterwards.","Sam may publish the draft on Tuesday merely because it is in the shared folder.","Jo must publish it before any checks are complete."],"why":"The handover separates the approval decision from sending and gives their order.","hint":"Combine the named roles with the dependency and availability."},{"id":"b2r11-2","type":"choice","prompt":"What should Jo ask Hugo to add?","answer":"The responsibilities he carried out, so Rina can assess whether his practical experience is equivalent.","options":["The responsibilities he carried out, so Rina can assess whether his practical experience is equivalent.","A certificate only, because the advert explicitly rejects all experience.","A promise that he will receive the discretionary bonus."],"why":"The advert allows equivalent experience, but the named placement alone does not establish what he can do.","hint":"Use both the qualification alternative and the missing evidence."},{"id":"b2r11-3","type":"choice","prompt":"Which description matches the document arrangement?","answer":"One shared guide and two separate reviewer checklists.","options":["One shared guide and two separate reviewer checklists.","Two separate guides and only one joint checklist.","Every draft is an approved public advert."],"why":"The text explicitly distinguishes the joint guide from each person’s checklist.","hint":"Do not infer approval from where a document is stored."},{"id":"b2r11-4","type":"choice","prompt":"Can Hugo be ruled out simply because he has no certificate?","answer":"No; experience can qualify, but his evidence still needs checking by the named decision owner.","options":["No; experience can qualify, but his evidence still needs checking by the named decision owner.","Yes; an internship can never count as practical experience.","No; naming any internship guarantees appointment."],"why":"The text allows an alternative without guaranteeing that this particular evidence meets it.","hint":"Avoid both automatic rejection and automatic acceptance."},{"id":"b2r11-5","type":"choice","prompt":"Which statement about the offer is supported?","answer":"A possible bonus is separate from guaranteed regular pay.","options":["A possible bonus is separate from guaranteed regular pay.","The gym discount guarantees a cash payment every month.","Every perk and benefit is defined as identical in all jobs."],"why":"The fictional advert states the distinction for this offer and explicitly makes the bonus discretionary.","hint":"Read this offer rather than impose a universal classification."},{"id":"b2r11-6","type":"choice","prompt":"Which request would need a new agreement rather than following the existing handover?","answer":"Asking Sam to prepare every future meeting’s notes permanently.","options":["Asking Sam to prepare every future meeting’s notes permanently.","Asking Rina to check wording before publication.","Asking Jo to record applications and request missing evidence."],"why":"The handover assigns the latter duties but does not assign an unlimited recurring notes role.","hint":"Separate a named current responsibility fr
